name: Protocol 6.3 F2 qualification once

on:
  push:
    branches: [ssdp-6.3-engineering-memory]
    paths: [.github/workflows/ssdp63-f2-qualification-once.yml]

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ssdp-6.3-engineering-memory
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r source/requirements-validation.txt
          python -m pip install ./orchestrator -r orchestrator/requirements-dev.txt
      - name: Execute fresh F2 regression and refresh static sensors
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE=e6a8c12f065c3d25a41da804c129d6bc0a4f7b50
          BASELINE=b59adc77efe6951912cfd705cc43830c58ca27d0
          OUT=qualification/ssdp6/DIAGNOSTIC-PROTOCOL-6.3-F2-FULL-REGRESSION.txt
          : > "$OUT"
          run() {
            printf '\n===== %s =====\n' "$*" | tee -a "$OUT"
            set +e
            "$@" 2>&1 | tee -a "$OUT"
            rc=${PIPESTATUS[0]}
            set -e
            printf 'EXIT=%s\n' "$rc" | tee -a "$OUT"
            test "$rc" -eq 0
          }
          printf 'semantic_candidate=%s\naccepted_protocol_62_recovery=%s\n' "$CANDIDATE" "$BASELINE" | tee -a "$OUT"
          test "$(git rev-parse HEAD^)" = "$CANDIDATE"
          run python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md --write-summary
          run python -m unittest -v tests.test_protocol_63_reopened_repairs
          run python -m unittest -v tests.test_protocol_63_engineering_memory
          run env SSDP_VALIDATE_PUBLIC_FALLBACK=1 python -m unittest -v tests.test_protocol_63_bootstrap
          run env SSDP_VALIDATE_PUBLIC_FALLBACK=1 python -m unittest discover -s tests -v
          rm -rf /tmp/ssdp63-f2-dist
          run python source/build_skills.py --output /tmp/ssdp63-f2-dist
          run python source/validate_packages.py --dist /tmp/ssdp63-f2-dist
          run python source/check_dist.py --expected /tmp/ssdp63-f2-dist --committed dist
          run python orchestrator/scripts/generate_protocol_snapshot.py --check
          run python orchestrator/scripts/run_core_tests.py
          for version in sdp-protocol-5.16 ssdp-protocol-6.0 ssdp-protocol-6.1 ssdp-protocol-6.2; do
            run git diff --exit-code "$BASELINE" -- "orchestrator/src/sdp_orchestrator/core/resources/protocol/${version}"
          done
          run git diff --check
          run git grep -n 'e12572c021087308570abfa41657a910c6896457' "$CANDIDATE" -- source/shared/references/development-workflow-prompts.md source/shared/references/protocol-versioning-and-compatibility.md README.md PORTABILITY.md tests/test_protocol_63_bootstrap.py
          python - "$CANDIDATE" <<'PY'
          from pathlib import Path
          import re, sys
          candidate = sys.argv[1]
          p = Path('qualification/ssdp6/SSDP-6.3-STATIC-ACTIVATION-SENSORS.md')
          text = p.read_text(encoding='utf-8')
          text = re.sub(r'^semantic_candidate: [0-9a-f]+$', f'semantic_candidate: {candidate}', text, count=1, flags=re.M)
          text = re.sub(r'assembled replacement semantic candidate `[^`]+`', f'assembled replacement semantic candidate `{candidate}`', text, count=1)
          sections = {}
          for m in re.finditer(r'^### (.+?)\n\n- active bytes: [^\n]+\n- active: (.+?)\n(?=\n### |\n## |\Z)', text, re.M | re.S):
              title = m.group(1)
              paths = re.findall(r'`([^`]+)`', m.group(2))
              sections[title] = sum(len(Path(path).read_bytes()) for path in paths)
          if len(sections) != 11:
              raise SystemExit(f'expected 11 static sensor sections, got {len(sections)}')
          for title, total in sections.items():
              pattern = rf'(### {re.escape(title)}\n\n- active bytes: )[0-9,]+'
              text, n = re.subn(pattern, lambda m: m.group(1) + f'{total:,}', text, count=1)
              if n != 1:
                  raise SystemExit(f'failed section byte update: {title}')
              table_pattern = rf'(\| {re.escape(title)} \| [0-9,]+ \| )[0-9,]+( \| [+-][0-9,]+ \|)'
              mt = re.search(table_pattern, text)
              if not mt:
                  raise SystemExit(f'failed table byte lookup: {title}')
              base = int(re.search(r'\| ([0-9,]+) \| [0-9,]+ \|', mt.group(0)).group(1).replace(',', ''))
              delta = total - base
              repl = mt.group(1) + f'{total:,}' + f' | {delta:+,} |'
              text = text[:mt.start()] + repl + text[mt.end():]
          p.write_text(text, encoding='utf-8')
          PY
          printf '\n===== refreshed static sensor identity/bytes =====\n' | tee -a "$OUT"
          grep -E '^(semantic_candidate:|\| Local D4|\| Historical recovery|\| Mature D3)' qualification/ssdp6/SSDP-6.3-STATIC-ACTIVATION-SENSORS.md | tee -a "$OUT"
          git diff --check
      - name: Commit F2 execution evidence
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/ssdp63-f2-qualification-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Record Protocol 6.3 F2 regression evidence'
          git push origin HEAD:ssdp-6.3-engineering-memory
