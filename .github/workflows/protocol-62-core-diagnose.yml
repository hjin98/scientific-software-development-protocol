name: Protocol 6.2 Core Diagnostic

on:
  push:
    branches:
      - ssdp-6.2-lossless-representation
    paths:
      - '.github/workflows/protocol-62-core-diagnose.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ssdp-6.2-lossless-representation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Capture Core result
        shell: bash
        run: |
          python -m pip install ./orchestrator -r orchestrator/requirements-dev.txt
          set +e
          python orchestrator/scripts/run_core_tests.py > qualification/ssdp6/STAGE-G-CORE-DIAGNOSTIC.txt 2>&1
          rc=$?
          set -e
          printf '\nexit_code=%s\n' "$rc" >> qualification/ssdp6/STAGE-G-CORE-DIAGNOSTIC.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qualification/ssdp6/STAGE-G-CORE-DIAGNOSTIC.txt
          git commit -m "Capture Protocol 6.2 Stage G Core diagnostic"
          git push origin HEAD:ssdp-6.2-lossless-representation
