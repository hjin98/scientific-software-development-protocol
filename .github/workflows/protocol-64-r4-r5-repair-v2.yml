name: Protocol 6.4 R4 R5 repair v2

on:
  push:
    branches:
      - ssdp-6.4-axiomatic-definition-traceability
    paths:
      - .github/workflows/protocol-64-r4-r5-repair-v2.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply review repairs
        run: |
          echo '' | base64 -d > /tmp/patch64.py
          python /tmp/patch64.py
      - name: Remove temporary repair workflows
        run: |
          git rm -f .github/workflows/protocol-64-r4-r5-repair.yml
          git rm -f .github/workflows/protocol-64-r4-r5-repair-v2.yml
      - name: Install validation dependencies
        run: python -m pip install -r source/requirements-validation.txt
      - name: Focused Protocol 6.4 qualification
        run: python -m unittest tests.test_protocol_64_axiomatic_traceability -v
      - name: Full inherited protocol regression
        run: python -m unittest discover -s tests -v
      - name: Validate project engineering memory
        run: python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md
      - name: Build and validate canonical packages
        run: |
          python source/build_skills.py --output /tmp/protocol-dist
          python source/validate_packages.py --dist /tmp/protocol-dist
          python source/check_dist.py --expected /tmp/protocol-dist --committed dist
      - name: Install orchestrator Core dependencies
        run: >-
          python -m pip install ./orchestrator
          -r orchestrator/requirements-dev.txt
      - name: Verify protocol snapshot parity
        run: python orchestrator/scripts/generate_protocol_snapshot.py --check
      - name: Run orchestrator Core acceptance
        run: python orchestrator/scripts/run_core_tests.py
      - name: Verify patch integrity
        run: |
          git diff --check
          git add -A
          git diff --cached --check
      - name: Commit repaired assembled tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Repair Protocol 6.4 B64-R4 and B64-R5 blockers"
          git push
