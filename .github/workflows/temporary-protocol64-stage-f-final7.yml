name: Temporary Protocol 6.4 Stage F final 7
on:
  push:
    branches: [ssdp-6.4-axiomatic-definition-traceability]
permissions:
  contents: write
jobs:
  final7:
    if: github.event.head_commit.message == 'Complete Protocol 6.4 Stage F final7'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: ssdp-6.4-axiomatic-definition-traceability, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python -m pip install pyyaml -r source/requirements-validation.txt
          python -m pip install ./orchestrator -r orchestrator/requirements-dev.txt
      - name: Construct final6 tree and close exact remaining unit oracles
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path
          d=yaml.safe_load(Path('.github/workflows/temporary-protocol64-stage-f-final6.yml').read_text())
          Path('/tmp/final6.sh').write_text(next(s['run'] for s in d['jobs']['final6']['steps'] if s.get('name')=='Construct final5 tree and reconcile canonical lifecycle owner'))
          PY
          bash /tmp/final6.sh
          python - <<'PY'
          from pathlib import Path
          R='74bc572ef516cae417437a2027eeff52a2e25c15'; B='e09a9d1480211eea2d16d722182bb5c6de1bee12'
          p=Path('tests/test_protocol_62_closeout.py'); t=p.read_text().replace('| `ssdp-protocol-6.3` | 6.3.0 | 2 | accepted current / frozen predecessor for 6.4 candidate |','| `ssdp-protocol-6.3` | 6.3.0 | 2 | frozen historical rollback |').replace('| `ssdp-protocol-6.3` | 6.3.0 | 2 | accepted current |','| `ssdp-protocol-6.3` | 6.3.0 | 2 | frozen historical rollback |').replace('| `ssdp-protocol-6.4` | 6.4.0 | 2 | candidate under qualification |','| `ssdp-protocol-6.4` | 6.4.0 | 2 | accepted current |').replace('ssdp-protocol-6.3 CONSTRAINED_BY -> accepted-current Protocol 6.3 semantics','ssdp-protocol-6.3 CONSTRAINED_BY -> immutable historical Protocol 6.3 rollback semantics'); p.write_text(t)
          p=Path('tests/test_protocol_64_axiomatic_traceability.py'); t=p.read_text().replace('ROOT / "workplans/active/SSDP-6.4-AXIOMATIC-FORMAL-DEFINITION-AND-SEMANTIC-TRACEABILITY-CONSOLIDATED.md",','ROOT / "workplans/archive/SSDP-6.4-AXIOMATIC-FORMAL-DEFINITION-AND-SEMANTIC-TRACEABILITY-CONSOLIDATED.md",') ; p.write_text(t)
          archived=Path('workplans/archive/SSDP-6.4-AXIOMATIC-FORMAL-DEFINITION-AND-SEMANTIC-TRACEABILITY-CONSOLIDATED.md'); w=archived.read_text();
          if R not in w: w=w.replace('**STAGE F: PASS — PROTOCOL 6.4 LIFECYCLE CLOSED.**',f'**STAGE F: PASS — PROTOCOL 6.4 LIFECYCLE CLOSED.** Accepted recovery `{R}` is distinct from public bootstrap `{B}`.',1)
          archived.write_text(w)
          rev5=Path('workplans/active/SSDP-7.0-DETERMINISTIC-CONTROL-PLANE-AND-MANDATORY-ORCHESTRATOR-MIGRATION-REVISION-5-PROTOCOL-6.4-INHERITANCE-RECONCILIATION.md')
          rev5.write_text(f'''---\nkind: protocol7-inheritance-reconciliation\nprotocol_version: 6.4.0\nstatus: active\nrevision: 5\nd3_architecture_mutation: none\naccepted_pre_cutover_baseline: {R}\n---\n# Protocol 7 Revision 5 — Protocol 6.4 Inheritance Reconciliation\nProtocol 6.4 is accepted-current with recovery `{R}` and distinct public bootstrap `{B}`. This revision advances inheritance/version identity only; Protocol 7 parent/Revisions 1-4 D3 architecture semantics remain unchanged.\n\n```text\nd3_architecture_mutation: none\nPROTOCOL 7 D4 IMPLEMENTATION: NOT AUTHORIZED\n```\n\nThe deliberate Protocol-7 D3 Orchestrator architecture reopen/supersession remains required before D4.\n''')
          for d in Path('qualification/ssdp6').glob('STAGE-F-DIAGNOSTIC*PROTOCOL-6.4.txt'): d.unlink()
          PY
          python source/build_skills.py --output dist
          python orchestrator/scripts/generate_protocol_snapshot.py
      - name: Full Stage-F acceptance
        run: |
          set -euxo pipefail
          python -m unittest discover -s tests -v
          python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md
          rm -rf /tmp/protocol-dist && python source/build_skills.py --output /tmp/protocol-dist
          python source/validate_packages.py --dist /tmp/protocol-dist
          python source/check_dist.py --expected /tmp/protocol-dist --committed dist
          python orchestrator/scripts/generate_protocol_snapshot.py --check
          python orchestrator/scripts/run_core_tests.py
          git diff --check
      - name: Publish final closeout
        run: |
          set -euxo pipefail
          git config user.name 'Protocol 6.4 lifecycle automation'
          git config user.email 'protocol64-lifecycle@users.noreply.github.com'
          find .github/workflows -maxdepth 1 -type f -name 'temporary-protocol64-stage-f-*.yml' -print0 | xargs -0 git rm
          git add -A
          git diff --cached --check
          git commit -m 'Close Protocol 6.4 lifecycle'
          git push origin HEAD:ssdp-6.4-axiomatic-definition-traceability
