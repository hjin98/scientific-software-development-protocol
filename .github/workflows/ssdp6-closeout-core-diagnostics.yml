name: SSDP 6 closeout Core diagnostics

on:
  push:
    branches:
      - impl/ssdp-6

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reuse closeout record reconciliation
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          lines = Path('.github/workflows/ssdp6-transition-closeout-recovery.yml').read_text(encoding='utf-8').splitlines()
          marker = '      - name: Reconcile archived transition records'
          start = lines.index(marker)
          run_line = start + 1
          if lines[run_line] != '        run: |':
              raise SystemExit('unexpected recovery workflow shape')
          body = []
          for line in lines[run_line + 1:]:
              if line.startswith('      - name: '):
                  break
              if line.startswith('          '):
                  body.append(line[10:])
              else:
                  body.append(line)
          script = Path('/tmp/reconcile-closeout.sh')
          script.write_text('\n'.join(body) + '\n', encoding='utf-8')
          subprocess.run(['bash', str(script)], check=True)
          PY
      - name: Install Orchestrator acceptance dependencies
        run: >-
          python -m pip install
          ./orchestrator
          -r orchestrator/requirements-dev.txt
      - name: Capture snapshot and Core output
        run: |
          set +e
          {
            echo '=== SNAPSHOT CHECK ==='
            python orchestrator/scripts/generate_protocol_snapshot.py --check
            echo "snapshot_exit=$?"
            echo '=== CORE TESTS ==='
            python orchestrator/scripts/run_core_tests.py
            echo "core_exit=$?"
          } > .ci-ssdp6-closeout-core-failure.log 2>&1
          exit 0
      - name: Persist exact Core diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci-ssdp6-closeout-core-failure.log
          git commit -m "Record SSDP 6 closeout Core diagnostics"
          git push
