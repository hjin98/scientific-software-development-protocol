name: Apply SSDP 6.3 workplan repair

on:
  push:
    branches:
      - ssdp-6.3-engineering-memory
    paths:
      - .github/workflows/update-ssdp63-workplan-review-repair.yml
      - .github/scripts/update_ssdp63_workplan.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ssdp-6.3-engineering-memory
          fetch-depth: 0
      - name: Apply workplan repair
        run: python .github/scripts/update_ssdp63_workplan.py
      - name: Verify and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/update-ssdp63-workplan-review-repair.yml .github/scripts/update_ssdp63_workplan.py
          git add workplans/active/PROTOCOL-6.3-EVIDENCE-BACKED-PROJECT-ENGINEERING-MEMORY-WORKPLAN.md
          git diff --cached --check
          git commit -m "Reopen Protocol 6.3 workplan after implementation Review"
          git push origin HEAD:ssdp-6.3-engineering-memory
