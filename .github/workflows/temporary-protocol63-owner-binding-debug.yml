name: Temporary Protocol 6.3 owner-binding debug

on:
  push:
    branches: [ssdp-6.3-engineering-memory]

permissions:
  contents: write

jobs:
  debug:
    if: github.event.head_commit.message == 'Debug Protocol 6.3 owner-binding repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ssdp-6.3-engineering-memory
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Capture materializer failure
        run: |
          set +e
          cp qualification/ssdp6/_tmp_protocol63_owner_binding_repair.py /tmp/repair.py
          python -m py_compile /tmp/repair.py > /tmp/protocol63-debug.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            python /tmp/repair.py reopen >> /tmp/protocol63-debug.log 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python /tmp/repair.py implement >> /tmp/protocol63-debug.log 2>&1
            status=$?
          fi
          printf '\nEXIT=%s\n' "$status" >> /tmp/protocol63-debug.log
          git reset --hard HEAD
          cp /tmp/protocol63-debug.log qualification/ssdp6/_tmp_protocol63_owner_binding_debug.log
          git config user.name 'Protocol 6.3 repair automation'
          git config user.email 'protocol63-repair@users.noreply.github.com'
          git add qualification/ssdp6/_tmp_protocol63_owner_binding_debug.log
          git commit -m 'Record Protocol 6.3 owner-binding materializer failure'
          git push origin HEAD:ssdp-6.3-engineering-memory
