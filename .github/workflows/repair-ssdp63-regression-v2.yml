name: Temporary Protocol 6.3 regression repair
on:
  push:
    branches: [ssdp-6.3-engineering-memory]
    paths: [.github/workflows/repair-ssdp63-regression-v2.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ssdp-6.3-engineering-memory
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply repair
        run: python .github/ssdp63_regression_repair.py
      - name: Test repair
        run: |
          python -m pip install -r source/requirements-validation.txt
          python -m unittest discover -s tests -v
          python source/build_skills.py --output /tmp/protocol-dist
          python source/validate_packages.py --dist /tmp/protocol-dist
          python source/check_dist.py --expected /tmp/protocol-dist --committed dist
          git diff --check
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PORTABILITY.md source tests
          git commit -m 'Repair inherited Protocol 6.3 regression semantics'
          git push origin HEAD:ssdp-6.3-engineering-memory
