name: Temporary Protocol 6.3 repair diagnostic

on:
  push:
    branches:
      - ssdp-6.3-engineering-memory

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.head_commit.message == 'Diagnose Protocol 6.3 repair regression'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ssdp-6.3-engineering-memory
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/protocol63_repair.py
      - run: python -m pip install -r source/requirements-validation.txt
      - name: Capture existing PEM regression
        run: |
          set +e
          python -m unittest tests.test_protocol_63_engineering_memory tests.test_protocol_63_reopened_repairs tests.test_protocol_63_independent_review_repairs -v > qualification/ssdp6/DIAGNOSTIC-PROTOCOL-6.3-INDEPENDENT-REVIEW-REPAIR.txt 2>&1
          status=$?
          echo "exit_status=$status" >> qualification/ssdp6/DIAGNOSTIC-PROTOCOL-6.3-INDEPENDENT-REVIEW-REPAIR.txt
          exit 0
      - name: Publish diagnostic only
        run: |
          git config user.name 'Protocol 6.3 repair automation'
          git config user.email 'protocol63-repair@users.noreply.github.com'
          git add qualification/ssdp6/DIAGNOSTIC-PROTOCOL-6.3-INDEPENDENT-REVIEW-REPAIR.txt
          git commit -m 'Record Protocol 6.3 repair regression diagnostic'
          git push origin HEAD:ssdp-6.3-engineering-memory
