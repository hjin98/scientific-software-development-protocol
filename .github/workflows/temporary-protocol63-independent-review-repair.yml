name: Temporary Protocol 6.3 Core diagnostic

on:
  push:
    branches:
      - ssdp-6.3-engineering-memory

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.head_commit.message == 'Diagnose Protocol 6.3 Core validation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ssdp-6.3-engineering-memory
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python .github/protocol63_repair.py
          python .github/protocol63_fixture_patch.py
          python -m pip install -r source/requirements-validation.txt
          python -m pip install ./orchestrator -r orchestrator/requirements-dev.txt
      - name: Capture profile and Core validation
        run: |
          set +e
          {
            echo '=== generate ==='
            python orchestrator/scripts/generate_protocol_snapshot.py
            echo "generate_status=$?"
            echo '=== check ==='
            python orchestrator/scripts/generate_protocol_snapshot.py --check
            echo "check_status=$?"
            echo '=== core ==='
            python orchestrator/scripts/run_core_tests.py
            echo "core_status=$?"
          } > qualification/ssdp6/DIAGNOSTIC-PROTOCOL-6.3-CORE-REPAIR.txt 2>&1
          exit 0
      - name: Publish diagnostic
        run: |
          git config user.name 'Protocol 6.3 repair automation'
          git config user.email 'protocol63-repair@users.noreply.github.com'
          git add qualification/ssdp6/DIAGNOSTIC-PROTOCOL-6.3-CORE-REPAIR.txt
          git commit -m 'Record Protocol 6.3 Core repair diagnostic'
          git push origin HEAD:ssdp-6.3-engineering-memory
