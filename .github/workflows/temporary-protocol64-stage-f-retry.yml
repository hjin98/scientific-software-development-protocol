name: Temporary Protocol 6.4 Stage F closeout retry
on:
  push:
    branches: [ssdp-6.4-axiomatic-definition-traceability]
permissions:
  contents: write
jobs:
  stage-f:
    if: github.event.head_commit.message == 'Retry Protocol 6.4 Stage F closeout'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ssdp-6.4-axiomatic-definition-traceability
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: |
          python -m pip install -r source/requirements-validation.txt
          python -m pip install ./orchestrator -r orchestrator/requirements-dev.txt
      - name: Publish recovery mapping descendant
        env:
          RECOVERY: 74bc572ef516cae417437a2027eeff52a2e25c15
          BOOTSTRAP: e09a9d1480211eea2d16d722182bb5c6de1bee12
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path
          import os,re
          R=os.environ['RECOVERY']; B=os.environ['BOOTSTRAP']
          p=Path('source/shared/references/protocol-versioning-and-compatibility.md'); t=p.read_text()
          if f'6.4.0  -> {R}' not in t:
              t=t.replace('6.3.0  -> 9f353097fab36e325a325f1c2f9d9cec32e86177\n```','6.3.0  -> 9f353097fab36e325a325f1c2f9d9cec32e86177\n6.4.0  -> '+R+'\n```',1)
          t=t.replace('There is deliberately no 6.4 recovery entry while 6.4 remains a proposed candidate. Recovery is published only after qualification, independent assembled-candidate Review, bootstrap/publication sequencing, generated reconciliation, and lifecycle acceptance establish an immutable recovery target.',f'Protocol 6.4 recovery target `{R}` was selected after independent assembled-candidate Review PASS. This later descendant publishes `6.4.0 -> {R}`. Protocol 6.3 remains accepted-current until Stage-F acceptance and lifecycle closeout pass.',1)
          t=t.replace('Protocol 6.4 is **proposed, not accepted-current**.',f'Protocol 6.4 has independent Review PASS and mapped recovery `{R}`, but is **not yet accepted-current** until Stage-F acceptance and lifecycle closeout pass.',1)
          marker=f'6.4.0 public-source bootstrap -> {B}\n```'
          if f'The recovery mapping is:\n\n```text\n6.4.0  -> {R}' not in t:
              t=t.replace(marker,marker+f'\n\nThe recovery mapping is:\n\n```text\n6.4.0  -> {R}\n```',1)
          p.write_text(t)

          # Stage-F transition state is represented without claiming acceptance.
          wp=Path('workplans/active/SSDP-6.4-AXIOMATIC-FORMAL-DEFINITION-AND-SEMANTIC-TRACEABILITY-CONSOLIDATED.md'); t=wp.read_text()
          t=t.replace('independent_review_state: fresh-review-required','independent_review_state: pass',1).replace('implementation_handoff: repair-complete-bound','implementation_handoff: stage-f-recovery-mapped',1).replace('stage_f: blocked','stage_f: recovery-mapped-acceptance-pending',1)
          wp.write_text(t)
          hand=Path('qualification/ssdp6/INDEPENDENT-REVIEW-HANDOFF-PROTOCOL-6.4.md'); t=hand.read_text()
          t=t.replace('independent_review: required_fresh_context','independent_review: pass',1).replace('protocol_64_recovery: unavailable_pending_independent_review','protocol_64_recovery: '+R,1).replace('stage_f: blocked_pending_independent_review','stage_f: recovery_mapping_published_acceptance_pending',1)
          hand.write_text(t)
          Path('qualification/ssdp6/STAGE-F-RECOVERY-MAPPING-PROTOCOL-6.4.md').write_text(f'''---\nkind: ssdp64-stage-f-recovery-mapping\nprotocol_version: 6.4.0\nstatus: recovery-mapping-published-acceptance-pending\nrecovery_target: {R}\npublic_source_bootstrap: {B}\naccepted_current_protocol: 6.3.0\n---\n\n# Protocol 6.4 Stage F Recovery Mapping\n\nRecovery `{R}` is an already-existing immutable descendant of reviewed candidate `f1e0ca95f4d1895e3497e155105468fa73f47827` containing the independent PASS record. This later transaction publishes its mapping. Bootstrap `{B}` remains distinct. Protocol 6.3 remains accepted-current pending Stage-F acceptance and closeout.\n''')
          PY
          git config user.name 'Protocol 6.4 lifecycle automation'
          git config user.email 'protocol64-lifecycle@users.noreply.github.com'
          git add source/shared/references/protocol-versioning-and-compatibility.md workplans/active/SSDP-6.4-AXIOMATIC-FORMAL-DEFINITION-AND-SEMANTIC-TRACEABILITY-CONSOLIDATED.md qualification/ssdp6/INDEPENDENT-REVIEW-HANDOFF-PROTOCOL-6.4.md qualification/ssdp6/STAGE-F-RECOVERY-MAPPING-PROTOCOL-6.4.md
          git diff --cached --check
          git commit -m 'Publish Protocol 6.4 recovery mapping'
          git push origin HEAD:ssdp-6.4-axiomatic-definition-traceability
          echo "MAPPING_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Apply closeout and successor reconciliation
        env:
          RECOVERY: 74bc572ef516cae417437a2027eeff52a2e25c15
          BOOTSTRAP: e09a9d1480211eea2d16d722182bb5c6de1bee12
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path
          import os,re
          R=os.environ['RECOVERY']; B=os.environ['BOOTSTRAP']; M=os.environ['MAPPING_COMMIT']; RUN=os.environ['GITHUB_RUN_ID']
          def rw(path,fn):
              p=Path(path); p.write_text(fn(p.read_text()))

          # Canonical version/current state.
          def vfn(t):
              t=t.replace('| `ssdp-protocol-6.3` | 6.3.0 | 2 | accepted current / frozen predecessor for 6.4 candidate |\n| `ssdp-protocol-6.4` | 6.4.0 | 2 | proposed candidate |','| `ssdp-protocol-6.3` | 6.3.0 | 2 | frozen historical rollback |\n| `ssdp-protocol-6.4` | 6.4.0 | 2 | accepted current |')
              t=t.replace('Protocol 6.4 has independent Review PASS and mapped recovery `'+R+'`, but is **not yet accepted-current** until Stage-F acceptance and lifecycle closeout pass.','Protocol 6.4 is **accepted-current** after independent Review PASS, recovery publication, mapping-bearing acceptance, Protocol-7 inheritance reconciliation, and lifecycle closeout.')
              t=t.replace('## Protocol 6.4 candidate bootstrap/recovery lifecycle','## Protocol 6.4 accepted bootstrap/recovery lifecycle')
              t=t.replace('Protocol 6.3 and candidate 6.4 support PEM schema 1.','Protocol 6.3 and 6.4 support PEM schema 1.')
              t=t.replace('Protocol 6.3 remains accepted-current while 6.4 is being implemented/qualified/reviewed. The 6.3 profile bytes are frozen as the immediate predecessor oracle. Candidate 6.4 intentionally retains schema v2 because the machine stage graph/result-envelope contract is unchanged;','Protocol 6.4 is accepted-current. The 6.3 profile bytes remain frozen as the immediate historical rollback oracle. Protocol 6.4 retains schema v2 because the machine stage graph/result-envelope contract is unchanged;')
              t += f'\n\nProtocol 6.4 accepted recovery is `{R}`; recovery mapping descendant is `{M}`; public bootstrap remains distinct at `{B}`. Stage-F closeout acceptance ran in GitHub Actions run `{RUN}`.\n'
              return t
          rw('source/shared/references/protocol-versioning-and-compatibility.md',vfn)

          def rdfn(t):
              t=re.sub(r'Current accepted document-controlled release: \*\*Protocol 6\.3\*\*\..*?Protocol 7 remains a proposed deterministic-control-plane successor and is not cut over\.',f'Current accepted document-controlled release: **Protocol 6.4**. Accepted recovery is `{R}` and the distinct immutable public-source bootstrap is `{B}`. Protocol 6.3 recovery `9f353097fab36e325a325f1c2f9d9cec32e86177` remains immutable historical rollback for explicitly version-bound 6.3 work. Protocol 7 remains a proposed deterministic-control-plane successor and is not cut over.',t,count=1,flags=re.S)
              t=t.replace('The universal current candidate kernel is','The universal current kernel is')
              t=t.replace('The candidate keeps orchestration profile schema v2 because no machine stage/result-envelope contract changed. `ssdp-protocol-6.4` is a distinct candidate profile/snapshot;','Protocol 6.4 keeps orchestration profile schema v2 because no machine stage/result-envelope contract changed. `ssdp-protocol-6.4` is the accepted-current profile/snapshot;')
              t=t.replace('6.4.0  -> UNAVAILABLE_PENDING_INDEPENDENT_REVIEW','6.4.0  -> '+R)
              t=re.sub(r'Protocol 6\.4 now has immutable public bootstrap \*\*`'+B+r'`\*\*.*?later published\.',f'Protocol 6.4 accepted public bootstrap is **`{B}`** and accepted recovery is **`{R}`**. Bootstrap and recovery are intentionally distinct; recovery mapping descendant `{M}` publishes the already-existing recovery target without self-reference.',t,count=1,flags=re.S)
              return t
          rw('README.md',rdfn)

          def pfn(t):
              t=t.replace('| `ssdp-protocol-6.3` | 6.3.0 | 2 | accepted current |\n| `ssdp-protocol-6.4` | 6.4.0 | 2 | candidate under qualification |','| `ssdp-protocol-6.3` | 6.3.0 | 2 | frozen historical rollback |\n| `ssdp-protocol-6.4` | 6.4.0 | 2 | accepted current |')
              t += f'\n\nProtocol 6.4 accepted public bootstrap -> {B}\nProtocol 6.4 accepted recovery -> {R}\nRecovery mapping descendant -> {M}\n'
              return t
          rw('PORTABILITY.md',pfn)
          rw('AGENTS.md',lambda t: re.sub(r'Protocol 6\.4 is \*\*not\*\* accepted-current;.*?Protocol 6\.2 recovery `b59adc77efe6951912cfd705cc43830c58ca27d0` remains immutable historical rollback for version-bound 6\.2 work\.',f'Protocol 6.4 is accepted-current with public bootstrap `{B}` and distinct recovery `{R}`. Protocol 6.3 recovery `9f353097fab36e325a325f1c2f9d9cec32e86177` remains immutable historical rollback for version-bound 6.3 work; Protocol 6.2 recovery `b59adc77efe6951912cfd705cc43830c58ca27d0` remains immutable historical rollback for version-bound 6.2 work.',t,count=1,flags=re.S).replace('For Protocol 6.4 candidate work','For Protocol 6.4 work'))
          rw('source/README.md',lambda t: t.replace('# Scientific Software Development Protocol 6.4 Candidate Source','# Scientific Software Development Protocol 6.4 Source'))
          def depfn(t):
              t=re.sub(r'^ssdp-protocol-6\.3 CONSTRAINED_BY -> .*$', 'ssdp-protocol-6.3 CONSTRAINED_BY -> immutable historical Protocol 6.3 rollback semantics',t,count=1,flags=re.M)
              if re.search(r'^ssdp-protocol-6\.4 CONSTRAINED_BY -> .*$',t,flags=re.M): t=re.sub(r'^ssdp-protocol-6\.4 CONSTRAINED_BY -> .*$', 'ssdp-protocol-6.4 CONSTRAINED_BY -> accepted-current Protocol 6.4 semantics',t,count=1,flags=re.M)
              else: t+='\nssdp-protocol-6.4 CONSTRAINED_BY -> accepted-current Protocol 6.4 semantics\n'
              return t
          rw('source/SEMANTIC_DEPENDENCIES.md',depfn)

          rev5=Path('workplans/active/SSDP-7.0-DETERMINISTIC-CONTROL-PLANE-AND-MANDATORY-ORCHESTRATOR-MIGRATION-REVISION-5-PROTOCOL-6.4-INHERITANCE-RECONCILIATION.md')
          rev5.write_text(f'''---\nkind: protocol7-inheritance-reconciliation\nprotocol_version: 6.4.0\nstatus: active\nrevision: 5\nd3_architecture_mutation: none\naccepted_pre_cutover_baseline: {R}\n---\n\n# Protocol 7 Revision 5 — Protocol 6.4 Inheritance Reconciliation\n\nProtocol 6.4 is accepted-current with recovery `{R}` and distinct public bootstrap `{B}`. This revision changes version/representation inheritance only. Parent/Revisions 1-4 D3 architecture semantics remain unchanged.\n\n```text\nd3_architecture_mutation: none\nProtocol 6.4 recovery           -> {R}\nProtocol 6.4 public bootstrap   -> {B}\nPROTOCOL 7 D4 IMPLEMENTATION: NOT AUTHORIZED\n```\n\nThe existing deliberate D3 Orchestrator architecture reopen/supersession remains the Protocol-7-specific pre-D4 requirement.\n''')

          # Authority index: completed 6.4 plus Revision 5.
          idx=Path('workplans/active/SSDP-6.1-7.0-WORKPLAN-AUTHORITY-INDEX.md'); t=idx.read_text()
          start=t.index('## Protocol 6.4 current design handoff'); end=t.index('## Protocol 7.0 current design handoff',start); sec=t[start:end]
          sec=sec.replace('## Protocol 6.4 current design handoff','## Protocol 6.4 completed handoff',1).replace('workplans/active/SSDP-6.4-AXIOMATIC-FORMAL-DEFINITION-AND-SEMANTIC-TRACEABILITY-CONSOLIDATED.md','workplans/archive/SSDP-6.4-AXIOMATIC-FORMAL-DEFINITION-AND-SEMANTIC-TRACEABILITY-CONSOLIDATED.md')
          sec=re.sub(r'Current disposition:\n\n```text\n.*?\n```',f'Current disposition:\n\n```text\nSERIOUS CHALLENGE: NONE\nSTAGE E INDEPENDENT REVIEW: PASS\nPUBLIC BOOTSTRAP: {B}\nRECOVERY: {R}\nRECOVERY MAPPING COMMIT: {M}\nSTAGE F: PASS / LIFECYCLE CLOSED\nCURRENT ACCEPTED DOCUMENT-CONTROLLED BASELINE: Protocol 6.4\nPROTOCOL 7 INHERITANCE OF 6.4: RECONCILED / REVISION 5\nLIFECYCLE STATUS: COMPLETED / ARCHIVED\n```',sec,count=1,flags=re.S)
          t=t[:start]+sec+t[end:]
          rev4='workplans/active/SSDP-7.0-DETERMINISTIC-CONTROL-PLANE-AND-MANDATORY-ORCHESTRATOR-MIGRATION-REVISION-4-PROTOCOL-6.3-INHERITANCE-RECONCILIATION.md'; rev5s=str(rev5)
          if rev5s not in t: t=t.replace('5. `'+rev4+'`','5. `'+rev4+'`\n6. `'+rev5s+'`',1)
          t=t.replace('- Protocol 6.4 is not yet accepted and therefore does not amend the Protocol-7 handoff at this time;','- Revision 5 advances only Protocol-7 version/representation inheritance to accepted Protocol 6.4; parent/Revisions 1-4 D3 architecture remains unchanged;')
          t=t.replace('PROTOCOL 6.4 INHERITANCE RECONCILIATION: NOT APPLICABLE UNTIL 6.4 ACCEPTANCE','PROTOCOL 6.4 COMPLETION/REVIEW/RECOVERY PREREQUISITE: SATISFIED\nPROTOCOL 6.4 INHERITANCE RECONCILIATION: SATISFIED')
          t=t.replace('CURRENT PRE-CUTOVER FALLBACK/ROLLBACK BASELINE: Protocol 6.3 recovery 9f353097fab36e325a325f1c2f9d9cec32e86177','CURRENT PRE-CUTOVER FALLBACK/ROLLBACK BASELINE: Protocol 6.4 recovery '+R)
          idx.write_text(t)

          # Archive the now-complete workplan.
          a=Path('workplans/active/SSDP-6.4-AXIOMATIC-FORMAL-DEFINITION-AND-SEMANTIC-TRACEABILITY-CONSOLIDATED.md'); w=a.read_text().replace('status: active','status: archived',1).replace('stage_f: recovery-mapped-acceptance-pending','stage_f: pass',1)
          w=re.sub(r'## Current disposition\n\n.*?\n\n\*\*SIXTH DESIGN REVIEW:',f'## Current disposition\n\n**STAGE F: PASS — PROTOCOL 6.4 LIFECYCLE CLOSED.** Accepted recovery is `{R}` and public bootstrap remains distinct at `{B}`. Recovery mapping descendant `{M}` was followed by mapping-bearing regeneration and Stage-F acceptance in GitHub Actions run `{RUN}`. Protocol 6.4 is accepted-current; Protocol 7 inherits it only through Revision 5 with no D3 architecture mutation and D4 remains unauthorized.\n\n**SIXTH DESIGN REVIEW:',w,count=1,flags=re.S)
          Path('workplans/archive/SSDP-6.4-AXIOMATIC-FORMAL-DEFINITION-AND-SEMANTIC-TRACEABILITY-CONSOLIDATED.md').write_text(w); a.unlink()

          hand=Path('qualification/ssdp6/INDEPENDENT-REVIEW-HANDOFF-PROTOCOL-6.4.md'); t=hand.read_text().replace('accepted_current_protocol: 6.3.0','accepted_current_protocol: 6.4.0',1).replace('stage_f: recovery_mapping_published_acceptance_pending','stage_f: complete',1); hand.write_text(t)
          hist=Path('history/SEMANTIC_EVOLUTION.md'); hist.write_text(hist.read_text()+f'\n\n## 2026-09-16 — Protocol 6.4 accepted-current\n\nProtocol 6.4 completed independent Review, recovery publication, mapping-bearing Stage-F acceptance, and lifecycle closeout. Recovery `{R}` is distinct from bootstrap `{B}`; mapping descendant `{M}` published the recovery. Protocol 7 inherited 6.4 through Revision 5 with `d3_architecture_mutation: none`; D4 remained unauthorized.\n')
          Path('qualification/ssdp6/STAGE-F-CLOSEOUT-PROTOCOL-6.4.md').write_text(f'''---\nkind: ssdp64-stage-f-closeout\nprotocol_version: 6.4.0\nstatus: pass\nrecovery_target: {R}\nrecovery_mapping_commit: {M}\npublic_source_bootstrap: {B}\nstage_f_run: {RUN}\naccepted_current_protocol: 6.4.0\n---\n\n# Protocol 6.4 Stage F Closeout\n\n**STAGE F: PASS.** Recovery `{R}` was published by later descendant `{M}`. Mapping-bearing generated/package/profile/Core state was regenerated and accepted in run `{RUN}`. Bootstrap `{B}` remains distinct. Protocol 6.4 is accepted-current and the workplan is archived.\n\n## PEM closeout-learning assessment\n\nStage F is the publication/closeout continuation of the already-reviewed 6.4 intervention, not a new independent engineering episode. No failure family recurred and no existing PEM family/capability/notice changed identity, evidence admissibility, binding, applicability, maturity, or guidance. No permanent PEM mutation is warranted by Stage F itself.\n''')
          PY
          python source/build_skills.py --output dist
          python orchestrator/scripts/generate_protocol_snapshot.py
          rm -rf /tmp/protocol-dist
          python source/build_skills.py --output /tmp/protocol-dist
      - name: Reconcile lifecycle tests for accepted successor
        env:
          RECOVERY: 74bc572ef516cae417437a2027eeff52a2e25c15
          BOOTSTRAP: e09a9d1480211eea2d16d722182bb5c6de1bee12
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,re
          R=os.environ['RECOVERY']; B=os.environ['BOOTSTRAP']; M=os.environ['MAPPING_COMMIT']
          # 6.3 closeout remains historical under successor.
          Path('tests/test_protocol_63_closeout.py').write_text(f'''import unittest\nfrom pathlib import Path\nROOT=Path(__file__).resolve().parents[1]\nR63="9f353097fab36e325a325f1c2f9d9cec32e86177"\nR64="{R}"\nclass Protocol63CloseoutTests(unittest.TestCase):\n def test_63_is_frozen_historical_after_64(self):\n  v=(ROOT/"source/shared/references/protocol-versioning-and-compatibility.md").read_text(); r=(ROOT/"README.md").read_text()\n  self.assertIn("| `ssdp-protocol-6.3` | 6.3.0 | 2 | frozen historical rollback |",v); self.assertIn(f"6.3.0  -> {{R63}}",v); self.assertIn("Current accepted document-controlled release: **Protocol 6.4**",r)\n def test_protocol7_inheritance_preserves_d3_boundary(self):\n  r4=(ROOT/"workplans/active/SSDP-7.0-DETERMINISTIC-CONTROL-PLANE-AND-MANDATORY-ORCHESTRATOR-MIGRATION-REVISION-4-PROTOCOL-6.3-INHERITANCE-RECONCILIATION.md").read_text(); r5=(ROOT/"workplans/active/SSDP-7.0-DETERMINISTIC-CONTROL-PLANE-AND-MANDATORY-ORCHESTRATOR-MIGRATION-REVISION-5-PROTOCOL-6.4-INHERITANCE-RECONCILIATION.md").read_text()\n  self.assertIn("d3_architecture_mutation: none",r4); self.assertIn("d3_architecture_mutation: none",r5); self.assertIn("PROTOCOL 7 D4 IMPLEMENTATION: NOT AUTHORIZED",r5)\nif __name__=="__main__": unittest.main()\n''')
          # Bootstrap test now expects recovery mapping in current source while exact bootstrap remains self-reference-safe.
          p=Path('tests/test_protocol_64_bootstrap_readiness.py'); t=p.read_text(); t=t.replace('BOOTSTRAP = "'+B+'"\n','BOOTSTRAP = "'+B+'"\nRECOVERY = "'+R+'"\n',1) if 'RECOVERY = ' not in t else t; t=t.replace('self.assertNotIn("6.4.0  -> ", local_versioning)','self.assertIn(f"6.4.0  -> {RECOVERY}", local_versioning)'); p.write_text(t)
          # Stage-E oracle becomes historical; replace only the current-state integration test and proposed assertion.
          p=Path('tests/test_protocol_64_axiomatic_traceability.py'); t=p.read_text().replace('self.assertIn("protocol 6.4 is proposed, not accepted-current", versioning)','self.assertIn("protocol 6.4 is accepted-current", versioning)',1).replace('self.assertNotIn("6.4.0  -> ", self.versioning)','self.assertIn("6.4.0  -> '+R+'", self.versioning)',1)
          pat=r'    def test_qf64_p_one_current_snapshot_complete_handoff\(self\) -> None:\n.*?(?=\n    def |\n\nif __name__)'
          repl=f'''    def test_qf64_p_closeout_archives_snapshot_and_preserves_review_binding(self) -> None:\n        self.assertEqual(sorted((ROOT / "workplans/active").glob("SSDP-6.4*.md")), [])\n        archived = ROOT / "workplans/archive/SSDP-6.4-AXIOMATIC-FORMAL-DEFINITION-AND-SEMANTIC-TRACEABILITY-CONSOLIDATED.md"\n        self.assertTrue(archived.is_file())\n        workplan = archived.read_text(encoding="utf-8")\n        self.assertIn("STAGE F: PASS", workplan)\n        self.assertIn("{R}", workplan)\n        handoff = read("qualification/ssdp6/INDEPENDENT-REVIEW-HANDOFF-PROTOCOL-6.4.md")\n        self.assertIn("stage_f: complete", handoff)\n        self.assertIn("accepted_current_protocol: 6.4.0", handoff)\n        self.assertIn("QF64-A", workplan)\n        self.assertIn("QF64-P", workplan)\n'''
          t,n=re.subn(pat,repl,t,count=1,flags=re.S)
          if n!=1: raise SystemExit('QF64-P integration test anchor missing')
          p.write_text(t)
          Path('tests/test_protocol_64_closeout.py').write_text(f'''import unittest\nfrom pathlib import Path\nROOT=Path(__file__).resolve().parents[1]; R="{R}"; B="{B}"; M="{M}"\nclass Protocol64CloseoutTests(unittest.TestCase):\n def test_identity_and_current_state(self):\n  v=(ROOT/"source/shared/references/protocol-versioning-and-compatibility.md").read_text(); r=(ROOT/"README.md").read_text(); self.assertIn(f"6.4.0  -> {{R}}",v); self.assertIn(f"6.4.0 public-source bootstrap -> {{B}}",v); self.assertNotEqual(R,B); self.assertIn("| `ssdp-protocol-6.4` | 6.4.0 | 2 | accepted current |",v); self.assertIn("Current accepted document-controlled release: **Protocol 6.4**",r)\n def test_archive_and_protocol7(self):\n  self.assertFalse((ROOT/"workplans/active/SSDP-6.4-AXIOMATIC-FORMAL-DEFINITION-AND-SEMANTIC-TRACEABILITY-CONSOLIDATED.md").exists()); self.assertTrue((ROOT/"workplans/archive/SSDP-6.4-AXIOMATIC-FORMAL-DEFINITION-AND-SEMANTIC-TRACEABILITY-CONSOLIDATED.md").is_file()); r5=(ROOT/"workplans/active/SSDP-7.0-DETERMINISTIC-CONTROL-PLANE-AND-MANDATORY-ORCHESTRATOR-MIGRATION-REVISION-5-PROTOCOL-6.4-INHERITANCE-RECONCILIATION.md").read_text(); self.assertIn("d3_architecture_mutation: none",r5); self.assertIn("PROTOCOL 7 D4 IMPLEMENTATION: NOT AUTHORIZED",r5)\n def test_closeout_record(self):\n  c=(ROOT/"qualification/ssdp6/STAGE-F-CLOSEOUT-PROTOCOL-6.4.md").read_text(); self.assertIn("**STAGE F: PASS.**",c); self.assertIn(f"recovery_mapping_commit: {{M}}",c)\nif __name__=="__main__": unittest.main()\n''')
          PY
      - name: Regenerate after oracle reconciliation and validate exact closeout
        run: |
          set -euxo pipefail
          python source/build_skills.py --output dist
          python orchestrator/scripts/generate_protocol_snapshot.py
          rm -rf /tmp/protocol-dist
          python source/build_skills.py --output /tmp/protocol-dist
          python -m unittest discover -s tests -v
          python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md
          python source/validate_packages.py --dist /tmp/protocol-dist
          python source/check_dist.py --expected /tmp/protocol-dist --committed dist
          python orchestrator/scripts/generate_protocol_snapshot.py --check
          python orchestrator/scripts/run_core_tests.py
          git diff --check
      - name: Commit lifecycle closeout and remove temporary machinery
        run: |
          set -euxo pipefail
          git config user.name 'Protocol 6.4 lifecycle automation'
          git config user.email 'protocol64-lifecycle@users.noreply.github.com'
          git rm .github/workflows/temporary-protocol64-stage-f.yml .github/workflows/temporary-protocol64-stage-f-debug.yml .github/workflows/temporary-protocol64-stage-f-retry.yml
          git add -A
          git diff --cached --check
          git commit -m 'Close Protocol 6.4 lifecycle'
          git push origin HEAD:ssdp-6.4-axiomatic-definition-traceability
