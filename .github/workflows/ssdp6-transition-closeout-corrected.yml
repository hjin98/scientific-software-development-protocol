name: SSDP 6 transition closeout corrected

on:
  push:
    branches:
      - impl/ssdp-6

permissions:
  contents: write

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reuse accepted closeout transformation and correct record schema
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          lines = Path('.github/workflows/ssdp6-transition-closeout.yml').read_text(encoding='utf-8').splitlines()
          marker = '      - name: Archive completed transition authority'
          start = lines.index(marker)
          run_line = start + 1
          if lines[run_line] != '        run: |':
              raise SystemExit('unexpected closeout workflow shape')
          body = []
          for line in lines[run_line + 1:]:
              if line.startswith('      - name: '):
                  break
              if line.startswith('          '):
                  body.append(line[10:])
              else:
                  body.append(line)
          script = Path('/tmp/closeout-transform.sh')
          script.write_text('\n'.join(body) + '\n', encoding='utf-8')
          subprocess.run(['bash', str(script)], check=True)

          authority = Path('workplans/archive/SSDP-6-AUTHORITY.md')
          text = authority.read_text(encoding='utf-8')
          old = 'implementation_review: pass\n'
          new = 'implementation_review: pass\nfinal_review: pass\n'
          if text.count(old) != 1 or new in text:
              raise SystemExit('unexpected authority-index closeout schema')
          authority.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Install acceptance dependencies
        run: >-
          python -m pip install
          -r source/requirements-validation.txt
          ./orchestrator
          -r orchestrator/requirements-dev.txt
      - name: Run protocol regression tests
        run: python -m unittest discover -s tests -v
      - name: Build and validate canonical skill packages
        run: |
          python source/build_skills.py --output /tmp/protocol-dist
          python source/validate_packages.py --dist /tmp/protocol-dist
          python source/check_dist.py --expected /tmp/protocol-dist --committed dist
      - name: Verify Protocol snapshot and Orchestrator Core
        run: |
          python orchestrator/scripts/generate_protocol_snapshot.py --check
          python orchestrator/scripts/run_core_tests.py
      - name: Verify closeout structure directly
        run: |
          test -z "$(find workplans/active -maxdepth 1 -type f -name 'SSDP-6-*' -print)"
          test -f workplans/archive/SSDP-6-AUTHORITY.md
          test -f workplans/archive/SSDP-6-RECURSIVE-ABSTRACTION-REALIZATION-SCIENTIFIC-SOFTWARE-PROTOCOL.md
          grep -q '^final_review: pass$' workplans/archive/SSDP-6-AUTHORITY.md
          test "$(cat source/PROTOCOL_VERSION)" = "6.0.0"
          test "$(git hash-object orchestrator/src/sdp_orchestrator/core/resources/protocol/sdp-protocol-5.16/prompts.md)" = "3730b06393843e9c24406a324f981ab4481858da"
          test "$(git hash-object orchestrator/src/sdp_orchestrator/core/resources/protocol/sdp-protocol-5.16/profile.json)" = "b3d4257fcd18af7bdb1799b2db742659bb2403fc"
      - name: Check patch whitespace
        run: git diff --check
      - name: Commit accepted transition closeout and remove diagnostics
        run: |
          git rm .github/workflows/ssdp6-transition-closeout.yml \
                 .github/workflows/ssdp6-transition-closeout-diagnostics.yml \
                 .github/workflows/ssdp6-transition-closeout-corrected.yml \
                 .ci-ssdp6-closeout-failure.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workplans/active workplans/archive tests/test_protocol_516_lifecycle_closeout.py
          git diff --cached --check
          git commit -m "Archive completed SSDP 6 transition authority"
          git push
