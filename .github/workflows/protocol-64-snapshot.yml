name: Protocol 6.4 Snapshot Generation

on:
  push:
    branches:
      - ssdp-6.4-axiomatic-definition-traceability
    paths:
      - .github/workflows/protocol-64-snapshot.yml
      - source/PROTOCOL_VERSION
      - source/shared/references/development-workflow-prompts.md
      - orchestrator/scripts/generate_protocol_snapshot.py
      - orchestrator/src/sdp_orchestrator/core/canonical.py
      - orchestrator/src/sdp_orchestrator/core/profile.py

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ssdp-6.4-axiomatic-definition-traceability
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install orchestrator test dependencies
        run: python -m pip install -r orchestrator/requirements-dev.txt
      - name: Generate and verify snapshot
        run: |
          python orchestrator/scripts/generate_protocol_snapshot.py
          python orchestrator/scripts/generate_protocol_snapshot.py --check
      - name: Commit generated Protocol 6.4 snapshot
        run: |
          git add orchestrator/src/sdp_orchestrator/core/resources/protocol/ssdp-protocol-6.4
          if git diff --cached --quiet; then
            echo 'Protocol 6.4 snapshot already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Generate Protocol 6.4 profile snapshot'
          git push origin HEAD:ssdp-6.4-axiomatic-definition-traceability
