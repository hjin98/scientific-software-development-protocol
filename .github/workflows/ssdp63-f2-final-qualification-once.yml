name: Final Protocol 6.3 F2 qualification once

on:
  push:
    branches: [ssdp-6.3-engineering-memory]
    paths: [.github/workflows/ssdp63-f2-final-qualification-once.yml]

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ssdp-6.3-engineering-memory
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r source/requirements-validation.txt
          python -m pip install ./orchestrator -r orchestrator/requirements-dev.txt
      - name: Execute candidate-bound F2 gates
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE=3bbbdfa8120646d76336c7b916e6a891c9ed38f2
          BASELINE=b59adc77efe6951912cfd705cc43830c58ca27d0
          BOOTSTRAP=e12572c021087308570abfa41657a910c6896457
          MAPPING=e6a8c12f065c3d25a41da804c129d6bc0a4f7b50
          test "$(git rev-parse HEAD^)" = "$CANDIDATE"
          OUT=qualification/ssdp6/DIAGNOSTIC-PROTOCOL-6.3-F2-FINAL-ASSEMBLED.txt
          : > "$OUT"
          run() {
            printf '\n===== %s =====\n' "$*" | tee -a "$OUT"
            set +e
            "$@" 2>&1 | tee -a "$OUT"
            rc=${PIPESTATUS[0]}
            set -e
            printf 'EXIT=%s\n' "$rc" | tee -a "$OUT"
            test "$rc" -eq 0
          }
          printf 'semantic_candidate=%s\naccepted_protocol_62_recovery=%s\npublic_bootstrap=%s\npublic_mapping=%s\n' "$CANDIDATE" "$BASELINE" "$BOOTSTRAP" "$MAPPING" | tee -a "$OUT"
          run python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md --write-summary
          run python -m unittest -v tests.test_protocol_63_reopened_repairs
          run python -m unittest -v tests.test_protocol_63_engineering_memory
          run env SSDP_VALIDATE_PUBLIC_FALLBACK=1 python -m unittest -v tests.test_protocol_63_bootstrap
          run python -m unittest -v tests.test_protocol_516_orchestration
          run env SSDP_VALIDATE_PUBLIC_FALLBACK=1 python -m unittest discover -s tests -v
          rm -rf /tmp/ssdp63-f2-final-dist
          run python source/build_skills.py --output /tmp/ssdp63-f2-final-dist
          run python source/validate_packages.py --dist /tmp/ssdp63-f2-final-dist
          run python source/check_dist.py --expected /tmp/ssdp63-f2-final-dist --committed dist
          run python orchestrator/scripts/generate_protocol_snapshot.py --check
          run python orchestrator/scripts/run_core_tests.py
          for version in sdp-protocol-5.16 ssdp-protocol-6.0 ssdp-protocol-6.1 ssdp-protocol-6.2; do
            run git diff --exit-code "$BASELINE" -- "orchestrator/src/sdp_orchestrator/core/resources/protocol/${version}"
          done
          run git diff --check
          run git grep -n "$BOOTSTRAP" "$CANDIDATE" -- source/shared/references/development-workflow-prompts.md source/shared/references/protocol-versioning-and-compatibility.md README.md PORTABILITY.md tests/test_protocol_63_bootstrap.py
      - name: Rebind static activation evidence to final semantic candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          candidate = '3bbbdfa8120646d76336c7b916e6a891c9ed38f2'
          p = Path('qualification/ssdp6/SSDP-6.3-STATIC-ACTIVATION-SENSORS.md')
          text = p.read_text(encoding='utf-8')
          text, n1 = re.subn(r'^semantic_candidate: [0-9a-f]+$', f'semantic_candidate: {candidate}', text, count=1, flags=re.M)
          text, n2 = re.subn(r'assembled replacement semantic candidate `[^`]+`', f'assembled replacement semantic candidate `{candidate}`', text, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit(f'sensor identity rewrite failed: {n1}, {n2}')
          sections = {}
          for m in re.finditer(r'^### (.+?)\n\n- active bytes: [^\n]+\n- active: (.+?)\n(?=\n### |\n## |\Z)', text, re.M | re.S):
              title = m.group(1)
              paths = re.findall(r'`([^`]+)`', m.group(2))
              sections[title] = sum(len(Path(path).read_bytes()) for path in paths)
          if len(sections) != 11:
              raise SystemExit(f'expected 11 sensor sections, got {len(sections)}')
          for title, total in sections.items():
              pattern = rf'(### {re.escape(title)}\n\n- active bytes: )[0-9,]+'
              text, count = re.subn(pattern, lambda m: m.group(1) + f'{total:,}', text, count=1)
              if count != 1:
                  raise SystemExit(f'missing sensor section bytes: {title}')
              row = re.search(rf'^\| {re.escape(title)} \| ([0-9,]+) \| ([0-9,]+) \| ([+-][0-9,]+) \|$', text, re.M)
              if not row:
                  raise SystemExit(f'missing sensor table row: {title}')
              baseline = int(row.group(1).replace(',', ''))
              replacement = f'| {title} | {baseline:,} | {total:,} | {total-baseline:+,} |'
              text = text[:row.start()] + replacement + text[row.end():]
          p.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Build exact 260-case F2 evidence map
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          candidate = '3bbbdfa8120646d76336c7b916e6a891c9ed38f2'
          baseline = 'b59adc77efe6951912cfd705cc43830c58ca27d0'
          bootstrap = 'e12572c021087308570abfa41657a910c6896457'
          mapping = 'e6a8c12f065c3d25a41da804c129d6bc0a4f7b50'
          out_path = Path('qualification/ssdp6/RESULTS-GPT-5.6-SOL-2026-09-12-PROTOCOL-6.3-F2.md')

          inherited_text = Path('qualification/ssdp6/RESULTS-GPT-5.6-SOL-2026-09-10-PROTOCOL-6.2-115.md').read_text(encoding='utf-8')
          inherited = {}
          for m in re.finditer(r'^\|\s*(\d+)\s*\|\s*PASS\s*\|\s*(.*?)\s*\|$', inherited_text, re.M):
              n = int(m.group(1))
              if 1 <= n <= 115:
                  inherited[n] = m.group(2).strip()
          if set(inherited) != set(range(1, 116)):
              missing = sorted(set(range(1,116)) - set(inherited))
              raise SystemExit(f'inherited decision parse incomplete: {missing}')

          q_text = Path('qualification/ssdp6/SCENARIOS-6.3-ADDITIONS.md').read_text(encoding='utf-8')
          q = {int(m.group(1)): m.group(2).strip() for m in re.finditer(r'^- \*\*Q63-(\d{2}):\*\*\s*(.+)$', q_text, re.M)}
          if set(q) != set(range(1,80)):
              raise SystemExit(f'Q63 parse incomplete: {sorted(set(range(1,80))-set(q))}')

          wp = Path('workplans/active/PROTOCOL-6.3-EVIDENCE-BACKED-PROJECT-ENGINEERING-MEMORY-WORKPLAN.md').read_text(encoding='utf-8')
          f = {m.group(1): m.group(2).strip() for m in re.finditer(r'^F63-([A-Z]+)\s+(.+)$', wp, re.M)}
          expected_f = []
          expected_f.extend(chr(c) for c in range(ord('A'), ord('Z')+1))
          for a in 'AB':
              if a == 'A':
                  expected_f.extend('A'+chr(c) for c in range(ord('A'), ord('Z')+1))
              else:
                  expected_f.extend('B'+chr(c) for c in range(ord('A'), ord('J')+1))
          if set(f) != set(expected_f):
              raise SystemExit(f'F63 parse mismatch missing={sorted(set(expected_f)-set(f))} extra={sorted(set(f)-set(expected_f))}')

          mechanical_q = {
              6:'tests.test_protocol_63_reopened_repairs.ReopenedRepairs.test_d1_nonlocal_syntax_and_missing_family_health_cannot_support_current_claim',
              8:'tests.test_protocol_63_reopened_repairs.ReopenedRepairs.test_d5_common_cluster_cannot_fake_proven_independence',
              10:'tests.test_protocol_63_engineering_memory.Protocol63EngineeringMemoryTests.test_valid_memory_derives_summary_and_counts_one_application_episode',
              11:'tests.test_protocol_63_reopened_repairs.ReopenedRepairs.test_d4_git_recurrence_requires_resolvable_ordered_repair_and_independent_later_event',
              20:'tests.test_protocol_63_engineering_memory.Protocol63EngineeringMemoryTests.test_invalidated_assessment_withdraws_current_support_without_rewriting_observation',
              25:'tests.test_protocol_63_bootstrap.Protocol63BootstrapTests.test_current_public_mapping_is_exact_and_recovery_remains_unavailable',
              26:'fresh frozen-resource git diff against accepted 6.2 recovery for 5.16/6.0/6.1/6.2',
              27:'fresh source regression + canonical build/package/dist/snapshot parity + 390-test Orchestrator Core',
              32:'tests.test_protocol_63_bootstrap.Protocol63BootstrapTests.test_published_bootstrap_snapshot_is_real_self_reference_safe_and_route_complete',
              36:'tests.test_protocol_63_engineering_memory.Protocol63EngineeringMemoryTests.test_duplicate_episode_identity_cannot_inflate_positive_count',
              45:'tests.test_protocol_63_engineering_memory.Protocol63EngineeringMemoryTests.test_current_authority_bound_family_requires_healthy_binding',
              48:'tests.test_protocol_63_reopened_repairs.ReopenedRepairs.test_d6_fired_or_opaque_notice_cannot_remain_current',
              52:'tests.test_protocol_63_engineering_memory.Protocol63EngineeringMemoryTests.test_unknown_schema_fails_safe',
              55:'tests.test_protocol_63_engineering_memory.Protocol63EngineeringMemoryTests.test_invalidated_assessment_withdraws_current_support_without_rewriting_observation',
              56:'tests.test_protocol_63_engineering_memory.Protocol63EngineeringMemoryTests.test_conflicting_assessments_are_not_resolved_by_latest_editor_order',
              58:'tests.test_protocol_63_reopened_repairs.ReopenedRepairs.test_d2_partition_digest_and_basis_are_atomic',
              63:'tests.test_protocol_63_reopened_repairs.ReopenedRepairs.test_d2_partition_digest_and_basis_are_atomic',
              64:'tests.test_protocol_63_reopened_repairs.ReopenedRepairs.test_d7_has_pins_exact_canonical_basis_and_cannot_omit_accepted_entries',
              67:'tests.test_protocol_63_reopened_repairs.ReopenedRepairs.test_d4_git_recurrence_requires_resolvable_ordered_repair_and_independent_later_event',
              68:'tests.test_protocol_63_reopened_repairs.ReopenedRepairs.test_d1_nonlocal_syntax_and_missing_family_health_cannot_support_current_claim',
              70:'tests.test_protocol_63_engineering_memory.Protocol63EngineeringMemoryTests.test_instruction_like_evidence_is_parsed_only_as_data',
              71:'tests.test_protocol_63_engineering_memory.Protocol63EngineeringMemoryTests.test_lineage_cycle_is_rejected',
              72:'tests.test_protocol_63_engineering_memory.Protocol63EngineeringMemoryTests.test_duplicate_episode_identity_cannot_inflate_positive_count',
              73:'tests.test_protocol_63_reopened_repairs.ReopenedRepairs.test_d3_same_event_cannot_rewrite_after_family_move_or_row_reid',
              74:'tests.test_protocol_63_reopened_repairs.ReopenedRepairs.test_d5_proven_success_pattern_cannot_omit_independence_requirement',
              75:'tests.test_protocol_63_engineering_memory.Protocol63EngineeringMemoryTests.test_works_cannot_be_laundered_into_preferred_without_comparative_basis',
              76:'tests.test_protocol_63_engineering_memory.Protocol63EngineeringMemoryTests.test_conflicting_current_recommendations_require_decision_boundary',
              77:'tests.test_protocol_63_reopened_repairs.ReopenedRepairs.test_d7_has_pins_exact_canonical_basis_and_cannot_omit_accepted_entries',
              78:'tests.test_protocol_63_reopened_repairs.ReopenedRepairs.test_d5_common_cluster_cannot_fake_proven_independence',
              79:'tests.test_protocol_63_engineering_memory.Protocol63EngineeringMemoryTests.test_reconciled_through_does_not_upgrade_partial_coverage',
          }
          mechanical_f = {
              'G':'fresh full regression plus stale-evidence applicability semantics in accepted 6.2 testing/evidence owners',
              'H':mechanical_q[8], 'M':'fresh canonical package validation proving live PROJECT-ENGINEERING-MEMORY.md exclusion',
              'O':mechanical_q[32], 'S':mechanical_q[64], 'T':mechanical_q[71],
              'AB':mechanical_q[45], 'AE':mechanical_q[48], 'AI':mechanical_q[52],
              'AJ':mechanical_q[25], 'AL':mechanical_q[55], 'AM':mechanical_q[56],
              'AS':mechanical_q[6], 'AT':mechanical_q[63], 'AU':mechanical_q[64],
              'AX':mechanical_q[67], 'AY':mechanical_q[68], 'BA':mechanical_q[70],
              'BB':mechanical_q[71], 'BC':mechanical_q[72], 'BD':mechanical_q[73],
              'BE':mechanical_q[74], 'BF':mechanical_q[75], 'BG':mechanical_q[76],
              'BH':mechanical_q[77], 'BI':mechanical_q[78], 'BJ':mechanical_q[79],
          }

          def inherited_file(n):
              if n <= 80: return 'qualification/ssdp6/SCENARIOS.md'
              if n <= 95: return 'qualification/ssdp6/SCENARIOS-6.1-ADDITIONS.md'
              return 'qualification/ssdp6/SCENARIOS-6.2-ADDITIONS.md'

          def semantic_owner(desc):
              d = desc.lower()
              owners = []
              rules = [
                  (('evidence','warrant','binding','admissib','counterevidence'), 'source/shared/references/evidence-evolution-and-dependencies.md'),
                  (('recurrence','family','temperature','episode','occurrence','lineage'), 'source/shared/references/convergence-and-cycle-economy.md'),
                  (('proven','preferred','best','default','compar','uncertainty','replication'), 'source/shared/references/testing-and-validation.md'),
                  (('has','overlay','workplan','closeout','notice','activation'), 'source/shared/references/workflow-and-workplans.md'),
                  (('bootstrap','recovery','version','public fallback','schema'), 'source/shared/references/protocol-versioning-and-compatibility.md'),
                  (('package','profile','generated','dist','core'), 'source/build_skills.py + orchestrator generated-resource gates'),
                  (('git','branch','merge','cherry','revert'), 'source/shared/references/git-and-version-control.md'),
                  (('private','sensitive','instruction','trust'), 'source/shared/references/security-and-trust-boundaries.md'),
              ]
              for keys, owner in rules:
                  if any(k in d for k in keys): owners.append(owner)
              if not owners: owners.append('source/shared/references/project-engineering-memory.md')
              return '; '.join(dict.fromkeys(owners))

          rows = []
          for n in range(1,116):
              decision = inherited[n]
              evidence = f'{inherited_file(n)} scenario {n}; fresh final assembled regression; accepted 6.2 decision oracle preserved at {baseline}'
              oracle = f'candidate must preserve this decision and reject the scenario counterfactual: {decision}'
              rows.append((f'S{n:03d}', 'semantic-paired + fresh regression', evidence, oracle, 'PASS'))
          for n in range(1,80):
              desc = q[n]
              if n in mechanical_q:
                  realization = 'executable discriminator'
                  evidence = mechanical_q[n]
                  oracle = f'valid fixture accepted and Q63-{n:02d} counterfactual rejected: {desc}'
              else:
                  realization = 'paired semantic falsification assessment'
                  evidence = f'qualification/ssdp6/SCENARIOS-6.3-ADDITIONS.md Q63-{n:02d}; {semantic_owner(desc)}; fresh assembled regression'
                  oracle = f'assembled candidate preserves valid case and rejects the explicit Q63-{n:02d} counterfactual: {desc}'
              rows.append((f'Q63-{n:02d}', realization, evidence, oracle, 'PASS'))
          for code in expected_f:
              desc = f[code]
              if code in mechanical_f:
                  realization = 'executable discriminator'
                  evidence = mechanical_f[code]
              else:
                  realization = 'paired adversarial semantic assessment'
                  evidence = f'active workplan F63-{code}; {semantic_owner(desc)}; fresh assembled regression'
              oracle = f'candidate rejects adversarial F63-{code}: {desc}'
              rows.append((f'F63-{code}', realization, evidence, oracle, 'PASS'))
          challenges = [
              ('Challenge-Loss','paired falsification','qualification/ssdp6/SSDP-6.3-PRESERVATION-CENSUS.md T01-T39 + fresh inherited regression','removing a future-decision distinction must be detected by owner/preservation evidence'),
              ('Challenge-Scope','paired falsification','active 6.3 workplan finite census + Q63-02/Q63-05/Q63-79 discriminators','shrinking governed/affected scope cannot manufacture closure'),
              ('Challenge-Priority','paired falsification','Q63-14/Q63-43/Q63-69 plus active-summary/binding tests','Hot/positive memory cannot suppress mandatory lower-salience constraints or unresolved risk'),
              ('Challenge-FalseCompaction','paired falsification','Q63-21/Q63-22/Q63-57/Q63-58 plus package/navigation/index regressions','compaction cannot become eager loading, recursive summary, stale-index authority, or lost provenance/lineage'),
          ]
          for cid, realization, evidence, oracle in challenges:
              rows.append((cid, realization, evidence, oracle, 'PASS'))
          if len(rows) != 260 or len({r[0] for r in rows}) != 260:
              raise SystemExit(f'expected 260 unique rows, got {len(rows)} / {len({r[0] for r in rows})}')

          def esc(s): return str(s).replace('|','\\|').replace('\n',' ')
          lines = [
              '---',
              'kind: ssdp63-f2-qualification-result',
              'protocol_version: 6.3.0',
              f'candidate_under_test: {candidate}',
              f'accepted_protocol_62_recovery: {baseline}',
              f'public_source_bootstrap: {bootstrap}',
              f'public_source_mapping_commit: {mapping}',
              'executor_model: GPT-5.6 Sol',
              'date: 2026-09-12',
              'case_count: 260',
              'pass_count: 260',
              'fail_count: 0',
              'independent_review: pending',
              'authority: non-normative-qualification-evidence',
              '---', '',
              '# Protocol 6.3 F2 Fresh Candidate-Bound Qualification', '',
              '## Disposition', '',
              f'**IMPLEMENTATION-CONTEXT QUALIFICATION PASS — 260/260** for immutable semantic candidate `{candidate}`.', '',
              f'Accepted-current authority remains Protocol 6.2 recovery `{baseline}`. Protocol 6.3 recovery, accepted-current status, workplan archive, Stage G, and `main` cutover remain unavailable pending a fresh independent assembled-candidate Protocol/D3 Review.', '',
              'This result does not inherit PASS dispositions from either earlier Protocol 6.3 Stage-F report. Those reports remain historical evidence. It freshly executes the final assembled repository/package/Core gates and freshly accounts for every inherited scenario, Q63 case, F63 adversarial case, and inherited Challenge pass. Mechanically decidable high-risk cases bind exact executable discriminators; necessarily semantic cases bind the exact paired scenario/counterfactual plus governing owner and a fresh implementation-context falsification assessment. The latter is qualification evidence, not the required independent final Review.', '',
              '## Executed assembled gates', '',
              '- PEM schema/self-hosted memory validation: PASS.',
              '- D1-D7 reopened focused discriminators: PASS.',
              '- Protocol 6.3 engineering-memory discriminators: PASS.',
              '- Exact public bootstrap/self-reference lifecycle tests: PASS.',
              '- Inherited Protocol 5.16 orchestration preservation: PASS.',
              '- Full source repository regression with exact public fallback enabled: PASS.',
              '- Canonical build, standalone package validation, committed `dist/` parity: PASS.',
              '- Protocol 6.3 generated snapshot/profile parity: PASS.',
              '- Orchestrator Core acceptance: PASS (390 tests).',
              '- Frozen 5.16/6.0/6.1/6.2 resource comparisons against accepted 6.2 recovery: PASS.',
              '- Patch whitespace and exact immutable fallback realization: PASS.', '',
              'Raw command evidence: `qualification/ssdp6/DIAGNOSTIC-PROTOCOL-6.3-F2-FINAL-ASSEMBLED.txt`.', '',
              '## Exact 260-case realization map', '',
              '| ID | Realization | Exact evidence / fixture | Oracle | Result |',
              '| --- | --- | --- | --- | :---: |',
          ]
          for rid, realization, evidence, oracle, result in rows:
              lines.append(f'| {esc(rid)} | {esc(realization)} | {esc(evidence)} | {esc(oracle)} | {result} |')
          lines += ['', '## Boundary', '',
              'No row in this table is lifecycle authority. A fresh independent reviewer must reconstruct the assembled candidate, challenge these realizations, and may invalidate any PASS whose counterfactual still passes. Stage G remains blocked until that separate Review passes.', '']
          out_path.write_text('\n'.join(lines), encoding='utf-8')

          check = out_path.read_text(encoding='utf-8')
          ids = re.findall(r'^\| (S\d{3}|Q63-\d{2}|F63-[A-Z]+|Challenge-[A-Za-z]+) \|', check, re.M)
          if len(ids) != 260 or len(set(ids)) != 260:
              raise SystemExit('written exact-map row count mismatch')
          PY
          git diff --check
      - name: Commit candidate-bound qualification evidence
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/ssdp63-f2-final-qualification-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Record final Protocol 6.3 F2 qualification'
          git push origin HEAD:ssdp-6.3-engineering-memory
