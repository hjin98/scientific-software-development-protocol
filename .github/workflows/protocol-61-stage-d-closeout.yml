name: Temporary Protocol 6.1 Stage D package regeneration

on:
  push:
    branches:
      - ssdp-6.1-implementation
    paths:
      - .github/workflows/protocol-61-stage-d-closeout.yml

permissions:
  contents: write

jobs:
  regenerate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ssdp-6.1-implementation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure repository writer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Install validation dependencies
        run: python -m pip install -r source/requirements-validation.txt
      - name: Install Orchestrator Core and development dependencies
        run: python -m pip install ./orchestrator -r orchestrator/requirements-dev.txt
      - name: Verify recovery mapping and repository regression
        run: |
          python -m unittest tests.test_protocol_61_evidence_evolution -v
          python -m unittest discover -s tests -v
      - name: Regenerate canonical distributions
        run: |
          rm -rf /tmp/protocol-dist-stage-d
          python source/build_skills.py --output /tmp/protocol-dist-stage-d
          python source/validate_packages.py --dist /tmp/protocol-dist-stage-d
          rm -rf dist
          cp -a /tmp/protocol-dist-stage-d dist
          python source/check_dist.py --expected /tmp/protocol-dist-stage-d --committed dist
          git diff --check
      - name: Verify Protocol snapshot and Orchestrator Core
        run: |
          python orchestrator/scripts/generate_protocol_snapshot.py --check
          python orchestrator/scripts/run_core_tests.py
      - name: Commit generated artifacts and remove temporary workflow
        run: |
          git rm .github/workflows/protocol-61-stage-d-closeout.yml
          git add dist
          python source/check_dist.py --expected /tmp/protocol-dist-stage-d --committed dist
          git diff --check --cached
          git commit -m 'Regenerate Protocol 6.1 recovery-mapped distributions'
          git push origin HEAD:ssdp-6.1-implementation
