name: Diagnose SSDP 6.2 Core modules

on:
  pull_request:
    types: [synchronize, opened, reopened]

permissions:
  contents: read

jobs:
  diagnose-core-modules:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ssdp-6.2-lossless-representation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Core
        run: python -m pip install ./orchestrator -r orchestrator/requirements-dev.txt
      - name: config and projects
        if: always()
        run: python orchestrator/scripts/run_core_tests.py -j 1 tests.test_config_and_projects
      - name: extension composition
        if: always()
        run: python orchestrator/scripts/run_core_tests.py -j 1 tests.test_extension_composition
      - name: git observation
        if: always()
        run: python orchestrator/scripts/run_core_tests.py -j 1 tests.test_git_observation
      - name: input binding
        if: always()
        run: python orchestrator/scripts/run_core_tests.py -j 1 tests.test_input_binding
      - name: installed product
        if: always()
        run: python orchestrator/scripts/run_core_tests.py -j 1 tests.test_installed_product
      - name: layout and fitness
        if: always()
        run: python orchestrator/scripts/run_core_tests.py -j 1 tests.test_layout_and_fitness
      - name: privacy and remote truth
        if: always()
        run: python orchestrator/scripts/run_core_tests.py -j 1 tests.test_privacy_and_remote_truth
      - name: protocol source and profile
        if: always()
        run: python orchestrator/scripts/run_core_tests.py -j 1 tests.test_protocol_source_and_profile
      - name: public API seam
        if: always()
        run: python orchestrator/scripts/run_core_tests.py -j 1 tests.test_public_api_seam
      - name: render and identity
        if: always()
        run: python orchestrator/scripts/run_core_tests.py -j 1 tests.test_render_and_identity
      - name: SSDP6 profiles
        if: always()
        run: python orchestrator/scripts/run_core_tests.py -j 1 tests.test_ssdp6_profiles
      - name: workplan resolution
        if: always()
        run: python orchestrator/scripts/run_core_tests.py -j 1 tests.test_workplan_resolution
