name: Temporary Protocol 6.1 package regeneration

on:
  push:
    branches:
      - ssdp-6.1-implementation
    paths:
      - .github/workflows/protocol-61-package-regeneration.yml

permissions:
  contents: write

jobs:
  regenerate-and-accept:
    if: github.event.head_commit.message == 'Temporary Protocol 6.1 package regeneration transport'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -r source/requirements-validation.txt
      - name: Run protocol regression tests
        run: python -m unittest discover -s tests -v
      - name: Build canonical skill packages once
        run: python source/build_skills.py --output /tmp/protocol-dist
      - name: Validate generated skill packages independently
        run: python source/validate_packages.py --dist /tmp/protocol-dist
      - name: Replace only affected ZIP transports
        run: |
          cp /tmp/protocol-dist/software-design.zip dist/software-design.zip
          cp /tmp/protocol-dist/software-implementation.zip dist/software-implementation.zip
      - name: Verify committed distribution parity
        run: python source/check_dist.py --expected /tmp/protocol-dist --committed dist
      - name: Check patch whitespace
        run: git diff --check
      - name: Install orchestrator Core and its development dependencies
        run: >-
          python -m pip install ./orchestrator
          -r orchestrator/requirements-dev.txt
      - name: Verify the packaged Protocol snapshot matches canonical source
        run: python orchestrator/scripts/generate_protocol_snapshot.py --check
      - name: Run orchestrator Core acceptance suite
        run: python orchestrator/scripts/run_core_tests.py
      - name: Assert exact generated-artifact scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(dist/software-design.zip dist/software-implementation.zip)
          if [[ ${#changed[@]} -ne 2 || "${changed[0]}" != "${expected[0]}" || "${changed[1]}" != "${expected[1]}" ]]; then
            printf 'Unexpected generated diff:\n'
            printf '  %s\n' "${changed[@]}"
            exit 1
          fi
      - name: Commit regenerated ZIP transports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- dist/software-design.zip dist/software-implementation.zip
          mapfile -t staged < <(git diff --cached --name-only | sort)
          expected=(dist/software-design.zip dist/software-implementation.zip)
          if [[ ${#staged[@]} -ne 2 || "${staged[0]}" != "${expected[0]}" || "${staged[1]}" != "${expected[1]}" ]]; then
            printf 'Unexpected staged scope:\n'
            printf '  %s\n' "${staged[@]}"
            exit 1
          fi
          git commit -m 'Regenerate Protocol 6.1 repaired skill packages'
          git push origin HEAD:ssdp-6.1-implementation
