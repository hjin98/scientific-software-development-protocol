name: Diagnose SSDP 6.2 profile classes

on:
  pull_request:
    types: [synchronize, opened, reopened]

permissions:
  contents: read

jobs:
  diagnose-profile-classes:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ssdp-6.2-lossless-representation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reuse bounded profile delta from materializer
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/materialize-ssdp62.yml').read_text(encoding='utf-8')
          start_marker = '      - name: Apply bounded 6.2 profile delta\n'
          next_marker = '      - name: Install generation dependencies\n'
          start = text.index(start_marker)
          block_start = text.index('        run: |\n', start) + len('        run: |\n')
          end = text.index(next_marker, block_start)
          lines = text[block_start:end].splitlines()
          Path('/tmp/apply.sh').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n', encoding='utf-8')
          PY
          bash /tmp/apply.sh
      - name: Install dependencies and generate current snapshot
        run: |
          python -m pip install -r source/requirements-validation.txt
          python -m pip install ./orchestrator -r orchestrator/requirements-dev.txt
          python orchestrator/scripts/generate_protocol_snapshot.py
      - name: Current Protocol 6.2 profile tests
        if: always()
        run: python -m unittest orchestrator.tests.test_ssdp6_profiles.SSDP6CanonicalProfileTests -v
      - name: Frozen Protocol 6.1 profile tests
        if: always()
        run: python -m unittest orchestrator.tests.test_ssdp6_profiles.FrozenProtocol61ProfileTests -v
      - name: Frozen Protocol 6.0 profile tests
        if: always()
        run: python -m unittest orchestrator.tests.test_ssdp6_profiles.FrozenProtocol60ProfileTests -v
      - name: Frozen Protocol 5.16 profile tests
        if: always()
        run: python -m unittest orchestrator.tests.test_ssdp6_profiles.FrozenLegacyProfileTests -v
