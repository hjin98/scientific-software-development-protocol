name: Finalize Protocol 6.3 mapped fallback state once

on:
  push:
    branches: [ssdp-6.3-engineering-memory]
    paths: [.github/workflows/ssdp63-finalize-mapped-fallback-once.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ssdp-6.3-engineering-memory
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r source/requirements-validation.txt
          python -m pip install ./orchestrator -r orchestrator/requirements-dev.txt
      - name: Repair mapped-fallback state and discriminator
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          bootstrap = 'e12572c021087308570abfa41657a910c6896457'

          p = Path('source/shared/references/development-workflow-prompts.md')
          text = p.read_text(encoding='utf-8')
          old = f'''**Protocol 6.3 bootstrap state:** all pre-repair 6.3 bootstrap snapshots are invalidated historical evidence only. `CURRENT_PUBLIC_REF` is `{bootstrap}`, so no current 6.3 public fallback is authorized until an already-existing repaired self-reference-safe source snapshot passes bootstrap readiness and exact-ref realization and a later descendant publishes that exact SHA. Never use repository default/latest, a guessed semantic-version ref, the current candidate branch, an invalidated bootstrap, or the accepted 6.2 bootstrap as a substitute. Version-bound 6.2 work continues to use exactly `5a062ebc472755607b9dc66d33a5ebbc4b7429aa`; historical 5.16/6.0/6.1 resolution remains version-bound to its own immutable mapping.'''
          new = f'''**Protocol 6.3 bootstrap state:** all pre-repair 6.3 bootstrap snapshots are invalidated historical evidence only. The immutable repaired snapshot `{bootstrap}` passed bootstrap readiness and exact-ref realization and was published by a later mapping descendant, so it is the sole current Protocol 6.3 public-source fallback. This mapping does not make Protocol 6.3 accepted-current and does not establish recovery; recovery remains unavailable pending complete qualification and independent Review. Never use repository default/latest, a guessed semantic-version ref, the current candidate branch, an invalidated bootstrap, or the accepted 6.2 bootstrap as a substitute. Version-bound 6.2 work continues to use exactly `5a062ebc472755607b9dc66d33a5ebbc4b7429aa`; historical 5.16/6.0/6.1 resolution remains version-bound to its own immutable mapping.'''
          if old not in text:
              raise SystemExit('workflow-prompts stale transition paragraph not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

          p = Path('source/shared/references/protocol-versioning-and-compatibility.md')
          text = p.read_text(encoding='utf-8')
          old = f'''The pre-repair Protocol 6.3 bootstrap `1484c1d3caa49d87cc15bc52a5e775399c1dae1b` and the second bootstrap `5ee4b3ac3ca1666b0499f7a72f55adcc411bf4bb` are immutable historical evidence only and are both invalidated as current fallback by the reopened semantic repair. The current 6.3 public-source bootstrap mapping is `{bootstrap}`; no 6.3 public fallback is authorized until an already-existing repaired self-reference-safe source snapshot passes bootstrap readiness and exact-ref realization and a later descendant publishes that exact SHA. Recovery is still unavailable: **do not insert placeholders or guessed SHAs into recovery mappings** and do not treat the candidate profile as accepted-current. The accepted 6.2 mappings above remain operative for 6.2.'''
          new = f'''The pre-repair Protocol 6.3 bootstrap `1484c1d3caa49d87cc15bc52a5e775399c1dae1b` and the second bootstrap `5ee4b3ac3ca1666b0499f7a72f55adcc411bf4bb` are immutable historical evidence only and are both invalidated as current fallback by the reopened semantic repair. The immutable repaired snapshot `{bootstrap}` passed bootstrap readiness and exact-ref realization and a later mapping descendant published that exact SHA, so it is now the sole current 6.3 public-source fallback. Recovery is still unavailable: **do not insert placeholders or guessed SHAs into recovery mappings** and do not treat the candidate profile or mapped bootstrap as accepted-current. The accepted 6.2 mappings above remain operative for 6.2.'''
          if old not in text:
              raise SystemExit('versioning stale transition paragraph not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          old = f'''**Protocol 6.3 pre-repair bootstrap `1484c1d3caa49d87cc15bc52a5e775399c1dae1b` and second bootstrap `5ee4b3ac3ca1666b0499f7a72f55adcc411bf4bb` are invalidated; the current public-source bootstrap identity is `{bootstrap}`; Protocol 6.3 recovery remains unavailable.** No replacement public fallback is currently authorized. A later descendant may publish an immutable Git SHA only after the already-existing repaired self-reference-safe source snapshot passes repository/package/profile/Core bootstrap-readiness plus exact-ref remote route realization. A mapped bootstrap is only the version-bound public fallback and does not make 6.3 accepted-current. Recovery remains later, after complete qualification and independent Review.'''
          new = f'''**Protocol 6.3 pre-repair bootstrap `1484c1d3caa49d87cc15bc52a5e775399c1dae1b` and second bootstrap `5ee4b3ac3ca1666b0499f7a72f55adcc411bf4bb` are invalidated; the current public-source bootstrap identity is `{bootstrap}`; Protocol 6.3 recovery remains unavailable.** The repaired immutable snapshot passed repository/package/profile/Core bootstrap readiness plus exact-ref remote route realization and was published by a later mapping descendant, so it is the authorized version-bound 6.3 public fallback. A mapped bootstrap does not make 6.3 accepted-current. Recovery remains later, after complete qualification and independent Review.'''
          if old not in text:
              raise SystemExit('README stale transition paragraph not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

          p = Path('PORTABILITY.md')
          text = p.read_text(encoding='utf-8')
          old = f'''For Protocol 6.3, pre-repair bootstrap `1484c1d3caa49d87cc15bc52a5e775399c1dae1b` and second bootstrap `5ee4b3ac3ca1666b0499f7a72f55adcc411bf4bb` are invalidated historical evidence only. The `6.3.0 public bootstrap` mapping above is `{bootstrap}`, so no replacement fallback is currently authorized; only after an already-existing repaired self-reference-safe source snapshot passes bootstrap-readiness and exact-ref route realization may a later descendant publish its immutable Git SHA as the new mapping. Do **not** substitute the 6.2 bootstrap, current branch, repository default/latest, a guessed `6.3.0` ref, or an invalidated bootstrap. Recovery remains later and requires complete qualification plus independent Review. If neither compatible local source nor mapped compatible immutable public source can be read, report truthful non-closure.'''
          new = f'''For Protocol 6.3, pre-repair bootstrap `1484c1d3caa49d87cc15bc52a5e775399c1dae1b` and second bootstrap `5ee4b3ac3ca1666b0499f7a72f55adcc411bf4bb` are invalidated historical evidence only. The repaired immutable snapshot `{bootstrap}` passed bootstrap readiness and exact-ref route realization and was published by a later mapping descendant, so the `6.3.0 public bootstrap` mapping above is the sole authorized version-bound 6.3 public fallback. Do **not** substitute the 6.2 bootstrap, current branch, repository default/latest, a guessed `6.3.0` ref, or an invalidated bootstrap. This public fallback does not make 6.3 accepted-current; recovery remains unavailable and requires complete qualification plus independent Review. If neither compatible local source nor mapped compatible immutable public source can be read, report truthful non-closure.'''
          if old not in text:
              raise SystemExit('PORTABILITY stale transition paragraph not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

          p = Path('tests/test_protocol_63_bootstrap.py')
          text = p.read_text(encoding='utf-8')
          anchor = "        self.assertNotIn('6.3.0  -> ' + INVALIDATED_SECOND_BOOTSTRAP, versioning)\n"
          addition = '''        stale_transition_fragments = (\n            'no current 6.3 public fallback is authorized',\n            'no 6.3 public fallback is authorized until',\n            'no replacement public fallback is currently authorized',\n            'no replacement fallback is currently authorized',\n        )\n        for document_name, document in ((\"versioning\", versioning), (\"prompts\", prompts), (\"portability\", portability), (\"readme\", readme)):\n            lowered = document.lower()\n            for fragment in stale_transition_fragments:\n                self.assertNotIn(fragment, lowered, f\"{document_name} retains pre-publication fallback state: {fragment}\")\n        self.assertIn(f'The immutable repaired snapshot `{BOOTSTRAP}`', prompts)\n        self.assertIn('sole current Protocol 6.3 public-source fallback', prompts)\n        self.assertIn(f'The immutable repaired snapshot `{BOOTSTRAP}`', versioning)\n        self.assertIn('sole current 6.3 public-source fallback', versioning)\n        self.assertIn('authorized version-bound 6.3 public fallback', readme)\n        self.assertIn('sole authorized version-bound 6.3 public fallback', portability)\n'''
          if anchor not in text:
              raise SystemExit('bootstrap-test insertion anchor not found')
          p.write_text(text.replace(anchor, anchor + addition, 1), encoding='utf-8')
          PY
      - name: Regenerate descendants and validate final mapped state
        shell: bash
        run: |
          set -euo pipefail
          BASELINE=b59adc77efe6951912cfd705cc43830c58ca27d0
          run() { echo "===== $* ====="; "$@"; }
          run env SSDP_VALIDATE_PUBLIC_FALLBACK=1 python -m unittest -v tests.test_protocol_63_bootstrap
          run python -m unittest -v tests.test_protocol_63_reopened_repairs tests.test_protocol_63_engineering_memory
          run python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md --write-summary
          rm -rf /tmp/ssdp63-final-dist
          run python source/build_skills.py --output /tmp/ssdp63-final-dist
          run python source/validate_packages.py --dist /tmp/ssdp63-final-dist
          rm -rf dist
          cp -a /tmp/ssdp63-final-dist dist
          run python orchestrator/scripts/generate_protocol_snapshot.py
          run env SSDP_VALIDATE_PUBLIC_FALLBACK=1 python -m unittest discover -s tests -v
          rm -rf /tmp/ssdp63-final-check
          run python source/build_skills.py --output /tmp/ssdp63-final-check
          run python source/validate_packages.py --dist /tmp/ssdp63-final-check
          run python source/check_dist.py --expected /tmp/ssdp63-final-check --committed dist
          run python orchestrator/scripts/generate_protocol_snapshot.py --check
          run python orchestrator/scripts/run_core_tests.py
          for version in sdp-protocol-5.16 ssdp-protocol-6.0 ssdp-protocol-6.1 ssdp-protocol-6.2; do
            run git diff --exit-code "$BASELINE" -- "orchestrator/src/sdp_orchestrator/core/resources/protocol/${version}"
          done
          run git diff --check
          ! git grep -i -e 'no current 6.3 public fallback is authorized' -e 'no 6.3 public fallback is authorized until' -e 'no replacement public fallback is currently authorized' -e 'no replacement fallback is currently authorized' -- README.md PORTABILITY.md source/shared/references/development-workflow-prompts.md source/shared/references/protocol-versioning-and-compatibility.md
      - name: Commit final semantic candidate
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/ssdp63-finalize-mapped-fallback-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize Protocol 6.3 mapped public fallback state'
          git push origin HEAD:ssdp-6.3-engineering-memory
