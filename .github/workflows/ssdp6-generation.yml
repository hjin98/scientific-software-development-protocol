name: SSDP 6 branch generation and acceptance

on:
  push:
    branches:
      - impl/ssdp-6

permissions:
  contents: write

jobs:
  generate-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/ssdp-6
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation and Core dependencies
        run: |
          python -m pip install -r source/requirements-validation.txt
          python -m pip install ./orchestrator -r orchestrator/requirements-dev.txt
      - name: Generate current Protocol 6 packaged snapshot
        run: python orchestrator/scripts/generate_protocol_snapshot.py
      - name: Build canonical skill packages
        run: python source/build_skills.py --output /tmp/protocol-dist
      - name: Validate generated skill packages independently
        run: python source/validate_packages.py --dist /tmp/protocol-dist
      - name: Replace committed generated distribution from canonical build
        run: |
          rm -rf dist
          cp -a /tmp/protocol-dist dist
      - name: Run protocol regression tests and persist exact failure diagnostics
        run: |
          set +e
          python -m unittest discover -s tests -v > /tmp/ssdp6-protocol-tests.log 2>&1
          status=$?
          set -e
          cat /tmp/ssdp6-protocol-tests.log
          if [ "$status" -ne 0 ]; then
            cp /tmp/ssdp6-protocol-tests.log .ci-ssdp6-failure.log
            git add .ci-ssdp6-failure.log
            if ! git diff --cached --quiet; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "Record SSDP 6 regression diagnostics"
              git push origin HEAD:impl/ssdp-6
            fi
            exit "$status"
          fi
      - name: Verify generated distribution parity
        run: python source/check_dist.py --expected /tmp/protocol-dist --committed dist
      - name: Verify packaged protocol snapshots
        run: python orchestrator/scripts/generate_protocol_snapshot.py --check
      - name: Run orchestrator Core acceptance suite and persist exact failure diagnostics
        run: |
          set +e
          python orchestrator/scripts/run_core_tests.py > /tmp/ssdp6-core-tests.log 2>&1
          status=$?
          set -e
          cat /tmp/ssdp6-core-tests.log
          if [ "$status" -ne 0 ]; then
            cp /tmp/ssdp6-core-tests.log .ci-ssdp6-core-failure.log
            git add .ci-ssdp6-core-failure.log
            if ! git diff --cached --quiet; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "Record SSDP 6 Core diagnostics"
              git push origin HEAD:impl/ssdp-6
            fi
            exit "$status"
          fi
      - name: Check patch whitespace
        run: git diff --check
      - name: Commit generated derivatives after acceptance
        run: |
          git add dist orchestrator/src/sdp_orchestrator/core/resources/protocol/ssdp-protocol-6.0
          if git diff --cached --quiet; then
            echo "Generated derivatives already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate Protocol 6 distribution artifacts"
          git push origin HEAD:impl/ssdp-6
