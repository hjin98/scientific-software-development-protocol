name: SSDP 6 branch generation and acceptance

on:
  push:
    branches:
      - impl/ssdp-6

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation and Orchestrator dependencies
        run: >-
          python -m pip install
          -r source/requirements-validation.txt
          ./orchestrator
          -r orchestrator/requirements-dev.txt
      - name: Run protocol regression tests before generation
        run: |
          set +e
          python -m unittest discover -s tests -v > .ci-ssdp6-failure.log 2>&1
          status=$?
          cat .ci-ssdp6-failure.log
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .ci-ssdp6-failure.log
            git commit -m "Record SSDP 6 regression diagnostics"
            git push
            exit "$status"
          fi
          rm -f .ci-ssdp6-failure.log
      - name: Generate current Protocol 6 packaged snapshot
        run: python orchestrator/scripts/generate_protocol_snapshot.py
      - name: Build canonical skill packages
        run: python source/build_skills.py --output /tmp/protocol-dist
      - name: Validate generated skill packages independently
        run: python source/validate_packages.py --dist /tmp/protocol-dist
      - name: Replace committed distribution from canonical build
        run: |
          rm -rf dist
          cp -a /tmp/protocol-dist dist
      - name: Verify generated distribution parity
        run: python source/check_dist.py --expected /tmp/protocol-dist --committed dist
      - name: Verify generated Protocol snapshot parity
        run: python orchestrator/scripts/generate_protocol_snapshot.py --check
      - name: Run Orchestrator Core acceptance suite
        run: python orchestrator/scripts/run_core_tests.py
      - name: Check patch whitespace
        run: git diff --check
      - name: Commit accepted generated derivatives
        run: |
          if git diff --quiet -- dist orchestrator/src/sdp_orchestrator/core/resources/protocol/ssdp-protocol-6.0; then
            echo "Generated derivatives already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist orchestrator/src/sdp_orchestrator/core/resources/protocol/ssdp-protocol-6.0
          git commit -m "Regenerate Protocol 6 distribution"
          git push
