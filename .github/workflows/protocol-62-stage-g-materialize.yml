name: Protocol 6.2 Stage G materialize

on:
  push:
    branches:
      - ssdp-6.2-lossless-representation
    paths:
      - .github/workflows/protocol-62-stage-g-materialize.yml

permissions:
  contents: write

jobs:
  stage-g:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ssdp-6.2-lossless-representation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Publish recovery mapping in a descendant commit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          recovery = "b59adc77efe6951912cfd705cc43830c58ca27d0"
          bootstrap = "5a062ebc472755607b9dc66d33a5ebbc4b7429aa"

          version_path = Path("source/shared/references/protocol-versioning-and-compatibility.md")
          text = version_path.read_text(encoding="utf-8")
          old_map = """5.16.0 -> e151daaf5c8eebb351a85cfed86170fda80fb5e3
          6.0.0  -> 21d5188f5bd9a0270d7a2ebf93d41a6b7842ccd2
          6.1.0  -> 802e75af261efb4f70d71284d860613a2197b639"""
          new_map = old_map + f"\n6.2.0  -> {recovery}"
          if old_map not in text or f"6.2.0  -> {recovery}" in text:
              raise SystemExit("unexpected Protocol 6.2 recovery-map precondition")
          text = text.replace(old_map, new_map, 1)

          old_stage = """After candidate qualification and independent Review, choose a separate immutable recovery commit containing the accepted semantic candidate and required decision evidence through ancestry. Only a later mapping commit may publish `6.2.0 -> <recovery SHA>`; the public-source bootstrap is not acceptance/recovery identity.

          Until all 6.2 acceptance stages complete, Protocol 6.1 remains accepted-current/rollback authority."""
          new_stage = f"""The accepted Protocol 6.2 recovery target is:

          ```text
          6.2.0 -> {recovery}
          ```

          That immutable commit contains semantic candidate `ebbc4591bdfed039512026b8acb3a6749475c1c5` through ancestry together with its qualification/requalification/generated evidence and independent Review PASS. The public-source bootstrap remains `{bootstrap}` and is intentionally distinct from recovery identity.

          Git commits cannot self-name, so this recovery mapping is published only by a later descendant after the recovery target already exists. Until mapping-bearing generated descendants, targeted recovery/parity checks, semantic-evolution/Protocol-7 reconciliation, and lifecycle closeout pass, Protocol 6.1 remains accepted-current/rollback authority."""
          if old_stage not in text:
              raise SystemExit("unexpected Protocol 6.2 staging-text precondition")
          version_path.write_text(text.replace(old_stage, new_stage, 1), encoding="utf-8")

          portability_path = Path("PORTABILITY.md")
          text = portability_path.read_text(encoding="utf-8")
          old = f"6.2.0 public bootstrap -> {bootstrap}\n"
          new = old + f"6.2.0 recovery -> {recovery}\n"
          if old not in text or f"6.2.0 recovery -> {recovery}" in text:
              raise SystemExit("unexpected PORTABILITY recovery-map precondition")
          text = text.replace(old, new, 1)
          anchor = "If neither a compatible installed source nor the compatible immutable public source can be read, report truthful non-closure rather than executing the protocol from memory."
          note = f"""Protocol 6.2 recovery is separately pinned to `{recovery}` after independent Review PASS. Recovery contains the accepted candidate and decision evidence through ancestry; public fallback continues to use bootstrap `{bootstrap}`, not the recovery snapshot.

          {anchor}"""
          if anchor not in text:
              raise SystemExit("unexpected PORTABILITY note anchor")
          portability_path.write_text(text.replace(anchor, note, 1), encoding="utf-8")
          PY

          git diff --check
          git add PORTABILITY.md source/shared/references/protocol-versioning-and-compatibility.md
          git commit -m "Publish Protocol 6.2 recovery mapping"
      - name: Add recovery oracle and regenerate mapping-bearing distributions
        shell: bash
        run: |
          python -m pip install -r source/requirements-validation.txt
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_protocol_62_representation.py")
          text = path.read_text(encoding="utf-8")
          if "test_accepted_62_recovery_and_bootstrap_remain_distinct" not in text:
              marker = '\n\nif __name__ == "__main__":\n'
              method = '''
    def test_accepted_62_recovery_and_bootstrap_remain_distinct(self):
        recovery = "b59adc77efe6951912cfd705cc43830c58ca27d0"
        bootstrap = "5a062ebc472755607b9dc66d33a5ebbc4b7429aa"
        invalidated = "1181c2031710c5d343194d87d08543290fded0ab"
        versioning = (REFERENCES / "protocol-versioning-and-compatibility.md").read_text()
        portability = (ROOT / "PORTABILITY.md").read_text()
        self.assertIn(f"6.2.0  -> {recovery}", versioning)
        self.assertIn(f"6.2.0 recovery -> {recovery}", portability)
        self.assertIn(f"6.2.0 public-source bootstrap -> {bootstrap}", versioning)
        self.assertIn(f"6.2.0 public bootstrap -> {bootstrap}", portability)
        self.assertNotEqual(recovery, bootstrap)
        self.assertNotEqual(recovery, invalidated)
        self.assertNotIn(f"6.2.0  -> {invalidated}", versioning)
'''
              if marker not in text:
                  raise SystemExit("test insertion anchor not found")
              path.write_text(text.replace(marker, "\n" + method + marker, 1), encoding="utf-8")
          PY

          rm -rf /tmp/protocol-dist
          python source/build_skills.py --output /tmp/protocol-dist
          python source/validate_packages.py --dist /tmp/protocol-dist
          rm -rf dist
          cp -a /tmp/protocol-dist dist
          python source/check_dist.py --expected /tmp/protocol-dist --committed dist
          python -m unittest tests.test_protocol_62_representation -v
          python -m unittest discover -s tests -v
          git diff --check

          python -m pip install ./orchestrator -r orchestrator/requirements-dev.txt
          python orchestrator/scripts/generate_protocol_snapshot.py --check
          python orchestrator/scripts/run_core_tests.py

          git add dist tests/test_protocol_62_representation.py
          git commit -m "Regenerate Protocol 6.2 recovery-mapped distributions"
      - name: Remove one-use materializer and push Stage G commits
        shell: bash
        run: |
          git rm .github/workflows/protocol-62-stage-g-materialize.yml
          git commit -m "Remove Protocol 6.2 Stage G materializer"
          git push origin HEAD:ssdp-6.2-lossless-representation
