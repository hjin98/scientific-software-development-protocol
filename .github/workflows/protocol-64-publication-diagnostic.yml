name: Protocol 6.4 Publication Diagnostic

on:
  push:
    branches:
      - ssdp-6.4-axiomatic-definition-traceability
    paths:
      - .github/workflows/protocol-64-publication-diagnostic.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ssdp-6.4-axiomatic-definition-traceability
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation and Core dependencies
        run: >-
          python -m pip install -r source/requirements-validation.txt
          ./orchestrator -r orchestrator/requirements-dev.txt
      - name: Reproduce publication candidate in working tree
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/protocol-64-publish-bootstrap.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n      - name: Regenerate canonical descendants"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          code = workflow[start:end]
          lines = code.splitlines()
          indent = min(len(line) - len(line.lstrip()) for line in lines if line.strip())
          code = '\n'.join(line[indent:] for line in lines)
          exec(compile(code, '<publication-mutation>', 'exec'), {})
          PY
          python source/build_skills.py
          python orchestrator/scripts/generate_protocol_snapshot.py
      - name: Capture validation transcript
        id: capture
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          : > /tmp/publication-validation.txt
          overall=0
          run_check() {
            printf '\n===== %s =====\n' "$1" >> /tmp/publication-validation.txt
            shift
            "$@" >> /tmp/publication-validation.txt 2>&1
            rc=$?
            printf '\n[exit=%s]\n' "$rc" >> /tmp/publication-validation.txt
            if [ "$rc" -ne 0 ]; then overall=1; fi
          }
          run_check regression python -m unittest discover -s tests -v
          run_check pem python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md
          run_check packages python source/validate_packages.py --dist dist
          run_check build python source/build_skills.py --output /tmp/protocol-dist
          run_check parity python source/check_dist.py --expected /tmp/protocol-dist --committed dist
          run_check snapshot python orchestrator/scripts/generate_protocol_snapshot.py --check
          run_check core python orchestrator/scripts/run_core_tests.py
          run_check whitespace git diff --check
          python - <<'PY' > /tmp/blob-request.json
          import base64, json, pathlib
          data = pathlib.Path('/tmp/publication-validation.txt').read_bytes()
          pathlib.Path('/tmp/blob-request.json').write_text(json.dumps({'content': base64.b64encode(data).decode('ascii'), 'encoding': 'base64'}), encoding='utf-8')
          PY
          sha="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input /tmp/blob-request.json --jq .sha)"
          printf '%s\n' "$sha" > /tmp/publication-validation-blob.txt
          echo "blob_sha=$sha" >> "$GITHUB_OUTPUT"
          echo "overall=$overall" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Expose diagnostic blob identity
        uses: actions/upload-artifact@v4
        with:
          name: ssdp64-publication-${{ steps.capture.outputs.overall }}-${{ steps.capture.outputs.blob_sha }}
          path: /tmp/publication-validation-blob.txt
          retention-days: 1
