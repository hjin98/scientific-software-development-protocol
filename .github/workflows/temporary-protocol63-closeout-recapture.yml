name: Temporary Protocol 6.3 closeout unittest recapture

on:
  push:
    branches: [ssdp-6.3-engineering-memory]

permissions:
  contents: write

jobs:
  capture:
    if: github.event.head_commit.message == 'Recapture Protocol 6.3 closeout unittest evidence'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ssdp-6.3-engineering-memory
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact closeout candidate
        run: |
          python orchestrator/scripts/protocol_63_closeout.py
          python orchestrator/scripts/protocol_63_closeout_oracle_repair.py
      - name: Capture unittest output only
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -v > /tmp/protocol63-closeout-tests-2.log 2>&1
          rc=$?
          set -e
          printf '\nunittest_rc=%s\n' "$rc" >> /tmp/protocol63-closeout-tests-2.log
          git reset --hard HEAD
          cp /tmp/protocol63-closeout-tests-2.log qualification/ssdp6/TEMP-PROTOCOL63-CLOSEOUT-TEST-2.log
      - name: Commit diagnostic only
        run: |
          set -euxo pipefail
          git config user.name 'Protocol 6.3 lifecycle automation'
          git config user.email 'protocol63-lifecycle@users.noreply.github.com'
          git rm .github/workflows/temporary-protocol63-closeout-recapture.yml
          git add qualification/ssdp6/TEMP-PROTOCOL63-CLOSEOUT-TEST-2.log
          git commit -m 'Capture repaired Protocol 6.3 closeout unittest evidence'
          git push origin HEAD:ssdp-6.3-engineering-memory
