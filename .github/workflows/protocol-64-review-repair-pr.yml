name: Protocol 6.4 Stage-E Review Repair PR Trigger

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/protocol-64-review-repair-pr.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'ssdp-6.4-axiomatic-definition-traceability'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ssdp-6.4-axiomatic-definition-traceability
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation and Core dependencies
        run: >-
          python -m pip install -r source/requirements-validation.txt
          ./orchestrator -r orchestrator/requirements-dev.txt
      - name: Apply Stage-E review repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/protocol-64-review-repair.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n      - name: Regenerate canonical descendants"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          code = workflow[start:end]
          lines = code.splitlines()
          indent = min(len(line) - len(line.lstrip()) for line in lines if line.strip())
          code = '\n'.join(line[indent:] for line in lines)
          exec(compile(code, '<stage-e-review-repair>', 'exec'), {})
          PY
      - name: Regenerate canonical descendants
        run: |
          python source/build_skills.py
          python orchestrator/scripts/generate_protocol_snapshot.py
      - name: Validate repaired assembled candidate
        shell: bash
        run: |
          python -m unittest discover -s tests -v
          python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md
          python source/validate_packages.py --dist dist
          python source/build_skills.py --output /tmp/protocol-dist
          python source/check_dist.py --expected /tmp/protocol-dist --committed dist
          python orchestrator/scripts/generate_protocol_snapshot.py --check
          python orchestrator/scripts/run_core_tests.py
          git diff --check
      - name: Commit repair and remove one-shot workflows
        shell: bash
        run: |
          rm -f .github/workflows/protocol-64-review-repair.yml
          rm -f .github/workflows/protocol-64-review-repair-pr.yml
          git config user.name "hjin98"
          git config user.email "86921078+hjin98@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Repair Protocol 6.4 Stage-E review blockers"
          git push origin HEAD:ssdp-6.4-axiomatic-definition-traceability
