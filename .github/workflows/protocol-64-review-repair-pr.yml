name: Protocol 6.4 Stage-E Review Repair PR Trigger

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/protocol-64-review-repair-pr.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'ssdp-6.4-axiomatic-definition-traceability'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ssdp-6.4-axiomatic-definition-traceability
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation and Core dependencies
        run: python -m pip install -r source/requirements-validation.txt ./orchestrator -r orchestrator/requirements-dev.txt
      - name: Validate repair script syntax
        run: python -m py_compile .github/scripts/protocol64_review_repair.py
      - name: Apply Stage-E review repairs
        run: python .github/scripts/protocol64_review_repair.py
      - name: Regenerate canonical descendants
        run: |
          python source/build_skills.py
          python orchestrator/scripts/generate_protocol_snapshot.py
      - name: Remove temporary repair machinery before qualification
        run: |
          git checkout 0377e798fbbb1054badd1193950d9c10f723be75 -- .github/workflows/protocol-check.yml
          git rm -f --ignore-unmatch \
            .github/workflows/protocol-64-review-repair.yml \
            .github/workflows/protocol-64-review-repair-pr.yml \
            .github/workflows/protocol-64-review-repair-exec.yml \
            .github/workflows/protocol-check-repair-trigger.yml \
            .github/workflows/protocol-check-repair-note.yml \
            .github/workflows/protocol-check-patched-source.txt \
            .github/repair.READY \
            .github/scripts/protocol64_review_repair.py \
            qualification/ssdp6/STAGE-E-REPAIR-CORE-DIAGNOSTIC.txt
          rm -f \
            .github/workflows/protocol-64-review-repair.yml \
            .github/workflows/protocol-64-review-repair-pr.yml \
            .github/workflows/protocol-64-review-repair-exec.yml \
            .github/workflows/protocol-check-repair-trigger.yml \
            .github/workflows/protocol-check-repair-note.yml \
            .github/workflows/protocol-check-patched-source.txt \
            .github/repair.READY \
            .github/scripts/protocol64_review_repair.py \
            qualification/ssdp6/STAGE-E-REPAIR-CORE-DIAGNOSTIC.txt
      - name: Run Protocol 6.4 qualification tests
        run: python -m unittest tests.test_protocol_64_axiomatic_traceability -v
      - name: Run inherited repository regression
        run: python -m unittest discover -s tests -v
      - name: Validate Project Engineering Memory
        run: python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md
      - name: Validate committed packages
        run: python source/validate_packages.py --dist dist
      - name: Rebuild independent distribution
        run: python source/build_skills.py --output /tmp/protocol-dist
      - name: Check committed distribution parity
        run: python source/check_dist.py --expected /tmp/protocol-dist --committed dist
      - name: Check Orchestrator snapshot parity
        run: python orchestrator/scripts/generate_protocol_snapshot.py --check
      - name: Run Orchestrator Core acceptance and persist failure
        shell: bash
        run: |
          set +e
          python orchestrator/scripts/run_core_tests.py > /tmp/core-acceptance.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            cp /tmp/core-acceptance.log qualification/ssdp6/STAGE-E-REPAIR-CORE-DIAGNOSTIC.txt
            git config user.name "hjin98"
            git config user.email "86921078+hjin98@users.noreply.github.com"
            git add qualification/ssdp6/STAGE-E-REPAIR-CORE-DIAGNOSTIC.txt
            git commit -m "Capture Protocol 6.4 repair Core failure"
            git push origin HEAD:ssdp-6.4-axiomatic-definition-traceability
            exit "$code"
          fi
      - name: Check whitespace
        run: git diff --check
      - name: Commit repaired assembled candidate
        run: |
          git config user.name "hjin98"
          git config user.email "86921078+hjin98@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Repair Protocol 6.4 Stage-E review blockers"
          git push origin HEAD:ssdp-6.4-axiomatic-definition-traceability
