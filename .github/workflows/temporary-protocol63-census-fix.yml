name: Temporary Protocol 6.3 F5 census fix

on:
  push:
    branches:
      - ssdp-6.3-engineering-memory

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ssdp-6.3-engineering-memory
          fetch-depth: 0
      - name: Correct current-facing census identities
        run: python qualification/ssdp6/temporary_census_fix.py
