name: Temporary Protocol 6.3 replacement bootstrap test split

on:
  push:
    branches: [ssdp-6.3-engineering-memory]

jobs:
  diagnose:
    if: github.event.head_commit.message == 'Split Protocol 6.3 replacement bootstrap regression'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ssdp-6.3-engineering-memory
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r source/requirements-validation.txt
          python -m pip install ./orchestrator -r orchestrator/requirements-dev.txt
      - name: Apply self-reference-safe transition
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          OLD='dc22f09fd38dbbfeaeb0160152da9b284654f66e'; SENT='UNAVAILABLE_PENDING_REPLACEMENT_BOOTSTRAP'
          def rw(path, transforms):
              p=Path(path); t=p.read_text(encoding='utf-8')
              for pattern,repl,flags in transforms:
                  t,n=re.subn(pattern,repl,t,count=1,flags=flags)
                  if n != 1: raise SystemExit(f'{path}: {pattern!r} -> {n}')
              p.write_text(t,encoding='utf-8')
          rw('source/shared/references/protocol-versioning-and-compatibility.md',[(rf'^6\.3\.0 public-source bootstrap -> {OLD}$',f'6.3.0 invalidated D4R3 bootstrap -> {OLD}\n6.3.0 public-source bootstrap -> {SENT}',re.M),(r'The pre-repair Protocol 6\.3 bootstrap `1484c1d3caa49d87cc15bc52a5e775399c1dae1b`.*?The accepted 6\.2 mappings above remain operative for 6\.2\.',f'The pre-repair Protocol 6.3 bootstrap `1484c1d3caa49d87cc15bc52a5e775399c1dae1b`, second bootstrap `5ee4b3ac3ca1666b0499f7a72f55adcc411bf4bb`, owner-binding bootstrap `e12572c021087308570abfa41657a910c6896457`, and D4R3 bootstrap `{OLD}` are immutable historical evidence only. D9 changed canonical validator semantics, so the current 6.3 public-source fallback is unavailable while a new self-reference-safe replacement snapshot is qualified and later published. Recovery remains unavailable; the accepted 6.2 mappings above remain operative for 6.2.',re.S)])
          rw('PORTABILITY.md',[(rf'^6\.3\.0 public bootstrap -> {OLD}$',f'6.3.0 invalidated D4R3 bootstrap -> {OLD}\n6.3.0 public bootstrap -> {SENT}',re.M),(r'For Protocol 6\.3, pre-repair bootstrap .*?If neither compatible local source nor mapped compatible immutable public source can be read, report truthful non-closure\.',f'For Protocol 6.3, pre-repair bootstrap `1484c1d3caa49d87cc15bc52a5e775399c1dae1b`, second bootstrap `5ee4b3ac3ca1666b0499f7a72f55adcc411bf4bb`, owner-binding bootstrap `e12572c021087308570abfa41657a910c6896457`, and D4R3 bootstrap `{OLD}` are historical evidence only. D9 changed canonical validator semantics. No current 6.3 public fallback is authorized while a new self-reference-safe replacement snapshot is qualified; recovery remains unavailable. If neither compatible local source nor mapped compatible immutable public source can be read, report truthful non-closure.',re.S)])
          rw('source/shared/references/development-workflow-prompts.md',[(rf'^CURRENT_PUBLIC_REF = {OLD}$',f'CURRENT_PUBLIC_REF = {SENT}',re.M),(r'^\*\*Protocol 6\.3 bootstrap state:\*\*.*$',f'**Protocol 6.3 bootstrap state:** earlier 6.3 bootstrap snapshots, including owner-binding-invalidated `e12572c021087308570abfa41657a910c6896457` and D4R3 snapshot `{OLD}`, are historical evidence only. D9 changed canonical validator semantics. No current 6.3 public fallback is authorized until a newly qualified self-reference-safe snapshot is published by a later descendant. Recovery remains unavailable pending complete qualification and independent Review. Never use repository default/latest, a guessed semantic-version ref, the current candidate branch, an invalidated bootstrap, or the accepted 6.2 bootstrap as a substitute.',re.M)])
          rw('README.md',[(r'^\*\*Protocol 6\.3 bootstrap attempts .*$',f'**Protocol 6.3 bootstrap attempts `1484c1d3caa49d87cc15bc52a5e775399c1dae1b`, `5ee4b3ac3ca1666b0499f7a72f55adcc411bf4bb`, owner-binding-invalidated `e12572c021087308570abfa41657a910c6896457`, and D4R3 snapshot `{OLD}` are historical only; current 6.3 public-source fallback is unavailable while a new D9 replacement bootstrap is qualified; Protocol 6.3 recovery remains unavailable.**',re.M)])
          p=Path('tests/test_protocol_63_bootstrap.py'); t=p.read_text(encoding='utf-8')
          t,n=re.subn(rf'^BOOTSTRAP = "{OLD}"$',f'BOOTSTRAP = "{SENT}"\nINVALIDATED_D4R3_BOOTSTRAP = "{OLD}"',t,count=1,flags=re.M)
          if n != 1: raise SystemExit('bootstrap constant')
          a="        self.assertIn(f'6.3.0 invalidated owner-binding bootstrap -> {INVALIDATED_OWNER_BINDING_BOOTSTRAP}', versioning)\n"; t=t.replace(a,a+"        self.assertIn(f'6.3.0 invalidated D4R3 bootstrap -> {INVALIDATED_D4R3_BOOTSTRAP}', versioning)\n",1)
          a="        self.assertIn(f'6.3.0 invalidated owner-binding bootstrap -> {INVALIDATED_OWNER_BINDING_BOOTSTRAP}', portability)\n"; t=t.replace(a,a+"        self.assertIn(f'6.3.0 invalidated D4R3 bootstrap -> {INVALIDATED_D4R3_BOOTSTRAP}', portability)\n",1)
          p.write_text(t,encoding='utf-8')
          PY
      - name: Protocol 6.3 bootstrap and independent repair
        continue-on-error: true
        run: python -m unittest -v tests.test_protocol_63_bootstrap tests.test_protocol_63_independent_review_repairs
      - name: Protocol 6.3 engineering-memory suites
        continue-on-error: true
        run: python -m unittest -v tests.test_protocol_63_engineering_memory tests.test_protocol_63_reopened_repairs
      - name: General protocol contracts and portability
        continue-on-error: true
        run: python -m unittest -v tests.test_protocol_contracts tests.test_protocol_portability tests.test_package_reference_closure tests.test_build_index_contract
      - name: Protocol 6.2 suites
        continue-on-error: true
        run: python -m unittest -v tests.test_protocol_62_closeout tests.test_protocol_62_representation
      - name: Protocol 5.16 lifecycle and orchestration suites
        continue-on-error: true
        run: python -m unittest -v tests.test_protocol_516_lifecycle_closeout tests.test_protocol_516_long_horizon_quality tests.test_protocol_516_orchestration
      - name: Protocol 5.13 and 5.15 suites
        continue-on-error: true
        run: python -m unittest -v tests.test_protocol_513_counterfactual_oracles tests.test_protocol_513_live_tool_qualification tests.test_protocol_513_oracle_family_closure tests.test_protocol_513_tool_routing_codeql_compression tests.test_protocol_515_language_profiles
      - name: Remaining protocol suites
        continue-on-error: true
        run: python -m unittest -v tests.test_protocol_511_tool_assistance tests.test_protocol_512_convergence tests.test_protocol_59_review_rework tests.test_protocol_59_route_uri_safety tests.test_protocol_61_evidence_evolution tests.test_protocol_effective_compression tests.test_protocol_engineering_stewardship tests.test_protocol_proxy_proof_acceptance tests.test_protocol_tooling
