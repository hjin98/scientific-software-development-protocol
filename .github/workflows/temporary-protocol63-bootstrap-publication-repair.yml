name: Temporary Protocol 6.3 bootstrap publication repair

on:
  push:
    branches: [ssdp-6.3-engineering-memory]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'Repair Protocol 6.3 bootstrap publication binding'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ssdp-6.3-engineering-memory
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: |
          python -m pip install -r source/requirements-validation.txt
          python -m pip install ./orchestrator -r orchestrator/requirements-dev.txt
      - name: Repair exact bootstrap publication owners
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'Protocol 6.3 lifecycle automation'
          git config user.email 'protocol63-lifecycle@users.noreply.github.com'
          python - <<'PY'
          from pathlib import Path

          OLD = 'dc22f09fd38dbbfeaeb0160152da9b284654f66e'
          NEW = '190c8b4d352c203ef74c94d57c4f18d30eb7186d'

          def rw(path, fn):
              p = Path(path)
              t = p.read_text(encoding='utf-8')
              n = fn(t)
              if n == t:
                  raise SystemExit(f'no repair applied to {path}')
              p.write_text(n, encoding='utf-8')

          def versioning(t):
              old = f'6.3.0 public-source bootstrap -> {OLD}'
              new = f'6.3.0 invalidated D4R3 bootstrap -> {OLD}\n6.3.0 public-source bootstrap -> {NEW}'
              if old not in t: raise SystemExit('versioning mapping anchor missing')
              t = t.replace(old, new, 1)
              oldp = f'The immutable D4R3-repaired snapshot `{OLD}` passed bootstrap readiness and exact-ref realization and a later mapping descendant published that exact SHA, so it is now the sole current 6.3 public-source fallback.'
              newp = f'The immutable D4R3-repaired snapshot `{OLD}` was valid for its candidate but became historical when D9 changed canonical validator semantics. D9 candidate `{NEW}` then passed the assembled acceptance surface before publication, and its later F5 descendant published that already-existing exact SHA; `{NEW}` is therefore the sole current 6.3 public-source fallback.'
              if oldp not in t: raise SystemExit('versioning staging paragraph missing')
              return t.replace(oldp, newp, 1)

          def portability(t):
              old = f'6.3.0 public bootstrap -> {OLD}'
              new = f'6.3.0 invalidated D4R3 bootstrap -> {OLD}\n6.3.0 public bootstrap -> {NEW}'
              if old not in t: raise SystemExit('portability mapping anchor missing')
              t = t.replace(old, new, 1)
              oldp = f'The repaired immutable snapshot `{OLD}` passed bootstrap readiness and exact-ref route realization and was published by a later mapping descendant, so the `6.3.0 public bootstrap` mapping above is the sole authorized version-bound 6.3 public fallback.'
              newp = f'The D4R3 snapshot `{OLD}` is historical after the D9 validator-semantic repair. The already-existing D9 candidate `{NEW}` passed the assembled acceptance surface before its later F5 descendant published that exact SHA, so the `6.3.0 public bootstrap` mapping above is the sole authorized version-bound 6.3 public fallback.'
              if oldp not in t: raise SystemExit('portability paragraph missing')
              return t.replace(oldp, newp, 1)

          def prompts(t):
              if f'CURRENT_PUBLIC_REF = {OLD}' not in t: raise SystemExit('prompt ref missing')
              t = t.replace(f'CURRENT_PUBLIC_REF = {OLD}', f'CURRENT_PUBLIC_REF = {NEW}', 1)
              oldp = f'**Protocol 6.3 bootstrap state:** all earlier 6.3 bootstrap snapshots, including owner-binding-invalidated `e12572c021087308570abfa41657a910c6896457`, are historical evidence only. The immutable D4R3-repaired self-reference-safe source snapshot `{OLD}` passed bootstrap readiness and exact-ref realization and was published by a later mapping descendant, so it is the sole current Protocol 6.3 public-source fallback.'
              newp = f'**Protocol 6.3 bootstrap state:** all earlier 6.3 bootstrap snapshots, including owner-binding-invalidated `e12572c021087308570abfa41657a910c6896457` and D4R3 snapshot `{OLD}`, are historical evidence only. D9 candidate `{NEW}` changed canonical validator semantics, passed the assembled acceptance surface as an already-existing self-reference-safe snapshot, and was published only by its later F5 descendant; it is the sole current Protocol 6.3 public-source fallback.'
              if oldp not in t: raise SystemExit('prompt bootstrap paragraph missing')
              return t.replace(oldp, newp, 1)

          def readme(t):
              oldp = f'**Protocol 6.3 bootstrap attempts `1484c1d3caa49d87cc15bc52a5e775399c1dae1b`, `5ee4b3ac3ca1666b0499f7a72f55adcc411bf4bb`, and owner-binding-invalidated `e12572c021087308570abfa41657a910c6896457` are historical only; the current public-source bootstrap identity is `{OLD}`; Protocol 6.3 recovery remains unavailable.** The D4R3-repaired immutable snapshot passed repository/package/profile/Core bootstrap readiness plus exact-ref remote route realization and was published by a later mapping descendant, so it is the authorized version-bound 6.3 public fallback.'
              newp = f'**Protocol 6.3 bootstrap attempts `1484c1d3caa49d87cc15bc52a5e775399c1dae1b`, `5ee4b3ac3ca1666b0499f7a72f55adcc411bf4bb`, owner-binding-invalidated `e12572c021087308570abfa41657a910c6896457`, and D4R3 snapshot `{OLD}` are historical only; the current public-source bootstrap identity is `{NEW}`; Protocol 6.3 recovery remains unavailable.** D9 changed canonical validator semantics, so the already-existing D9 candidate was requalified before its later F5 descendant published that exact SHA as the authorized version-bound 6.3 public fallback.'
              if oldp not in t: raise SystemExit('README bootstrap paragraph missing')
              return t.replace(oldp, newp, 1)

          def test(t):
              if f'BOOTSTRAP = "{OLD}"' not in t: raise SystemExit('bootstrap test constant missing')
              t = t.replace(f'BOOTSTRAP = "{OLD}"', f'BOOTSTRAP = "{NEW}"\nINVALIDATED_D4R3_BOOTSTRAP = "{OLD}"', 1)
              anchor = "        self.assertIn(f'6.3.0 invalidated owner-binding bootstrap -> {INVALIDATED_OWNER_BINDING_BOOTSTRAP}', versioning)\n"
              add = anchor + "        self.assertIn(f'6.3.0 invalidated D4R3 bootstrap -> {INVALIDATED_D4R3_BOOTSTRAP}', versioning)\n"
              if anchor not in t: raise SystemExit('bootstrap test assertion anchor missing')
              t = t.replace(anchor, add, 1)
              anchor2 = "        self.assertIn(f'6.3.0 invalidated owner-binding bootstrap -> {INVALIDATED_OWNER_BINDING_BOOTSTRAP}', portability)\n"
              add2 = anchor2 + "        self.assertIn(f'6.3.0 invalidated D4R3 bootstrap -> {INVALIDATED_D4R3_BOOTSTRAP}', portability)\n"
              if anchor2 not in t: raise SystemExit('portability test assertion anchor missing')
              return t.replace(anchor2, add2, 1)

          rw('source/shared/references/protocol-versioning-and-compatibility.md', versioning)
          rw('PORTABILITY.md', portability)
          rw('source/shared/references/development-workflow-prompts.md', prompts)
          rw('README.md', readme)
          rw('tests/test_protocol_63_bootstrap.py', test)
          PY
          python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md --write-summary
          python orchestrator/scripts/generate_protocol_snapshot.py
          rm -rf /tmp/protocol-dist
          python source/build_skills.py --output /tmp/protocol-dist
          python source/validate_packages.py --dist /tmp/protocol-dist
          rm -rf dist
          cp -a /tmp/protocol-dist dist
      - name: Validate repaired publication
        shell: bash
        run: |
          set -euxo pipefail
          python -m unittest -v tests.test_protocol_63_bootstrap
          python -m unittest -v tests.test_protocol_63_independent_review_repairs
          python -m unittest discover -s tests -v
          python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md
          rm -rf /tmp/protocol-dist-check
          python source/build_skills.py --output /tmp/protocol-dist-check
          python source/validate_packages.py --dist /tmp/protocol-dist-check
          python source/check_dist.py --expected /tmp/protocol-dist-check --committed dist
          python orchestrator/scripts/generate_protocol_snapshot.py --check
          python orchestrator/scripts/run_core_tests.py
          git diff --check
      - name: Publish repaired owners and remove temporary workflow
        shell: bash
        run: |
          set -euxo pipefail
          git rm .github/workflows/temporary-protocol63-bootstrap-publication-repair.yml
          git add -A
          git diff --cached --check
          git commit -m 'Publish Protocol 6.3 D9 replacement bootstrap mapping'
          git push origin HEAD:ssdp-6.3-engineering-memory
