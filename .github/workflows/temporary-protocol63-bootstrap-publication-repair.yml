name: Temporary Protocol 6.3 replacement bootstrap lifecycle

on:
  push:
    branches: [ssdp-6.3-engineering-memory]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'Repair Protocol 6.3 replacement bootstrap lifecycle'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ssdp-6.3-engineering-memory
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: |
          python -m pip install -r source/requirements-validation.txt
          python -m pip install ./orchestrator -r orchestrator/requirements-dev.txt
      - name: Create and validate self-reference-safe replacement snapshot
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'Protocol 6.3 lifecycle automation'
          git config user.email 'protocol63-lifecycle@users.noreply.github.com'
          python - <<'PY'
          from pathlib import Path

          OLD = 'dc22f09fd38dbbfeaeb0160152da9b284654f66e'
          SENT = 'UNAVAILABLE_PENDING_REPLACEMENT_BOOTSTRAP'

          def replace(path, old, new):
              p = Path(path)
              t = p.read_text(encoding='utf-8')
              if old not in t:
                  raise SystemExit(f'missing anchor in {path}: {old!r}')
              p.write_text(t.replace(old, new, 1), encoding='utf-8')

          replace('source/shared/references/protocol-versioning-and-compatibility.md',
                  f'6.3.0 public-source bootstrap -> {OLD}',
                  f'6.3.0 invalidated D4R3 bootstrap -> {OLD}\n6.3.0 public-source bootstrap -> {SENT}')
          replace('source/shared/references/protocol-versioning-and-compatibility.md',
                  f'The immutable D4R3-repaired snapshot `{OLD}` passed bootstrap readiness and exact-ref realization and a later mapping descendant published that exact SHA, so it is now the sole current 6.3 public-source fallback.',
                  f'The D4R3 snapshot `{OLD}` became historical when D9 changed canonical validator semantics. A replacement self-reference-safe snapshot is being qualified; until its exact immutable SHA is published by a later descendant, current 6.3 public-source fallback is unavailable.')

          replace('PORTABILITY.md',
                  f'6.3.0 public bootstrap -> {OLD}',
                  f'6.3.0 invalidated D4R3 bootstrap -> {OLD}\n6.3.0 public bootstrap -> {SENT}')
          replace('PORTABILITY.md',
                  f'The repaired immutable snapshot `{OLD}` passed bootstrap readiness and exact-ref route realization and was published by a later mapping descendant, so the `6.3.0 public bootstrap` mapping above is the sole authorized version-bound 6.3 public fallback.',
                  f'The D4R3 snapshot `{OLD}` became historical after the D9 validator-semantic repair. A replacement self-reference-safe snapshot is being qualified; until a later descendant publishes its exact immutable SHA, no current 6.3 public fallback is authorized.')

          replace('source/shared/references/development-workflow-prompts.md',
                  f'CURRENT_PUBLIC_REF = {OLD}', f'CURRENT_PUBLIC_REF = {SENT}')
          replace('source/shared/references/development-workflow-prompts.md',
                  f'**Protocol 6.3 bootstrap state:** all earlier 6.3 bootstrap snapshots, including owner-binding-invalidated `e12572c021087308570abfa41657a910c6896457`, are historical evidence only. The immutable D4R3-repaired self-reference-safe source snapshot `{OLD}` passed bootstrap readiness and exact-ref realization and was published by a later mapping descendant, so it is the sole current Protocol 6.3 public-source fallback. This mapping does not make Protocol 6.3 accepted-current and does not establish recovery; recovery remains unavailable pending complete qualification and independent Review.',
                  f'**Protocol 6.3 bootstrap state:** all earlier 6.3 bootstrap snapshots, including owner-binding-invalidated `e12572c021087308570abfa41657a910c6896457` and D4R3 snapshot `{OLD}`, are historical evidence only. D9 changed canonical validator semantics, so no current 6.3 public fallback is authorized until a newly qualified self-reference-safe snapshot is published by a later descendant. Recovery remains unavailable pending complete qualification and independent Review.')

          replace('README.md',
                  f'**Protocol 6.3 bootstrap attempts `1484c1d3caa49d87cc15bc52a5e775399c1dae1b`, `5ee4b3ac3ca1666b0499f7a72f55adcc411bf4bb`, and owner-binding-invalidated `e12572c021087308570abfa41657a910c6896457` are historical only; the current public-source bootstrap identity is `{OLD}`; Protocol 6.3 recovery remains unavailable.** The D4R3-repaired immutable snapshot passed repository/package/profile/Core bootstrap readiness plus exact-ref remote route realization and was published by a later mapping descendant, so it is the authorized version-bound 6.3 public fallback.',
                  f'**Protocol 6.3 bootstrap attempts `1484c1d3caa49d87cc15bc52a5e775399c1dae1b`, `5ee4b3ac3ca1666b0499f7a72f55adcc411bf4bb`, owner-binding-invalidated `e12572c021087308570abfa41657a910c6896457`, and D4R3 snapshot `{OLD}` are historical only; current Protocol 6.3 public-source fallback is temporarily unavailable while the D9 replacement bootstrap is qualified; Protocol 6.3 recovery remains unavailable.**')

          p = Path('tests/test_protocol_63_bootstrap.py')
          t = p.read_text(encoding='utf-8')
          t = t.replace(f'BOOTSTRAP = "{OLD}"', f'BOOTSTRAP = "{SENT}"\nINVALIDATED_D4R3_BOOTSTRAP = "{OLD}"', 1)
          a = "        self.assertIn(f'6.3.0 invalidated owner-binding bootstrap -> {INVALIDATED_OWNER_BINDING_BOOTSTRAP}', versioning)\n"
          if a not in t: raise SystemExit('versioning assertion anchor missing')
          t = t.replace(a, a + "        self.assertIn(f'6.3.0 invalidated D4R3 bootstrap -> {INVALIDATED_D4R3_BOOTSTRAP}', versioning)\n", 1)
          a = "        self.assertIn(f'6.3.0 invalidated owner-binding bootstrap -> {INVALIDATED_OWNER_BINDING_BOOTSTRAP}', portability)\n"
          if a not in t: raise SystemExit('portability assertion anchor missing')
          t = t.replace(a, a + "        self.assertIn(f'6.3.0 invalidated D4R3 bootstrap -> {INVALIDATED_D4R3_BOOTSTRAP}', portability)\n", 1)
          p.write_text(t, encoding='utf-8')
          PY
          python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md --write-summary
          python orchestrator/scripts/generate_protocol_snapshot.py
          rm -rf /tmp/protocol-dist
          python source/build_skills.py --output /tmp/protocol-dist
          python source/validate_packages.py --dist /tmp/protocol-dist
          rm -rf dist && cp -a /tmp/protocol-dist dist
          python -m unittest -v tests.test_protocol_63_bootstrap
          python -m unittest -v tests.test_protocol_63_independent_review_repairs
          python -m unittest discover -s tests -v
          python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md
          python source/check_dist.py --expected /tmp/protocol-dist --committed dist
          python orchestrator/scripts/generate_protocol_snapshot.py --check
          python orchestrator/scripts/run_core_tests.py
          git diff --check
          git rm .github/workflows/temporary-protocol63-bootstrap-publication-repair.yml
          git add -A
          git diff --cached --check
          git commit -m 'Create self-reference-safe Protocol 6.3 D9 bootstrap'
          BOOTSTRAP=$(git rev-parse HEAD)
          git push origin HEAD:ssdp-6.3-engineering-memory
          printf '%s' "$BOOTSTRAP" > /tmp/protocol63-bootstrap-sha
      - name: Publish exact replacement bootstrap and validate exact ref
        shell: bash
        run: |
          set -euxo pipefail
          BOOTSTRAP=$(cat /tmp/protocol63-bootstrap-sha)
          export BOOTSTRAP
          python - <<'PY'
          import os
          from pathlib import Path
          B = os.environ['BOOTSTRAP']
          SENT = 'UNAVAILABLE_PENDING_REPLACEMENT_BOOTSTRAP'

          def replace(path, old, new):
              p = Path(path)
              t = p.read_text(encoding='utf-8')
              if old not in t: raise SystemExit(f'missing publication anchor in {path}: {old!r}')
              p.write_text(t.replace(old, new, 1), encoding='utf-8')

          replace('source/shared/references/protocol-versioning-and-compatibility.md',
                  f'6.3.0 public-source bootstrap -> {SENT}', f'6.3.0 public-source bootstrap -> {B}')
          replace('source/shared/references/protocol-versioning-and-compatibility.md',
                  'A replacement self-reference-safe snapshot is being qualified; until its exact immutable SHA is published by a later descendant, current 6.3 public-source fallback is unavailable.',
                  f'Replacement self-reference-safe snapshot `{B}` passed source regression, package/profile/Core integrity, and bootstrap readiness before publication. This later descendant publishes that exact immutable SHA as the sole current 6.3 public-source fallback.')
          replace('PORTABILITY.md', f'6.3.0 public bootstrap -> {SENT}', f'6.3.0 public bootstrap -> {B}')
          replace('PORTABILITY.md',
                  'A replacement self-reference-safe snapshot is being qualified; until a later descendant publishes its exact immutable SHA, no current 6.3 public fallback is authorized.',
                  f'Replacement self-reference-safe snapshot `{B}` passed bootstrap readiness before publication; this later descendant publishes that exact immutable SHA as the sole authorized version-bound 6.3 public fallback.')
          replace('source/shared/references/development-workflow-prompts.md', f'CURRENT_PUBLIC_REF = {SENT}', f'CURRENT_PUBLIC_REF = {B}')
          replace('source/shared/references/development-workflow-prompts.md',
                  'D9 changed canonical validator semantics, so no current 6.3 public fallback is authorized until a newly qualified self-reference-safe snapshot is published by a later descendant.',
                  f'D9 changed canonical validator semantics; replacement self-reference-safe snapshot `{B}` passed bootstrap readiness before this later descendant published its exact SHA, so it is the sole current Protocol 6.3 public-source fallback.')
          replace('README.md',
                  'current Protocol 6.3 public-source fallback is temporarily unavailable while the D9 replacement bootstrap is qualified; Protocol 6.3 recovery remains unavailable.',
                  f'the current public-source bootstrap identity is `{B}`; Protocol 6.3 recovery remains unavailable.')

          p = Path('tests/test_protocol_63_bootstrap.py')
          t = p.read_text(encoding='utf-8')
          if f'BOOTSTRAP = "{SENT}"' not in t: raise SystemExit('bootstrap sentinel constant missing')
          t = t.replace(f'BOOTSTRAP = "{SENT}"', f'BOOTSTRAP = "{B}"', 1)
          p.write_text(t, encoding='utf-8')
          PY
          python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md --write-summary
          python orchestrator/scripts/generate_protocol_snapshot.py
          rm -rf /tmp/protocol-dist
          python source/build_skills.py --output /tmp/protocol-dist
          python source/validate_packages.py --dist /tmp/protocol-dist
          rm -rf dist && cp -a /tmp/protocol-dist dist
          CI=1 python -m unittest -v tests.test_protocol_63_bootstrap
          python -m unittest -v tests.test_protocol_63_independent_review_repairs
          python -m unittest discover -s tests -v
          python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md
          python source/check_dist.py --expected /tmp/protocol-dist --committed dist
          python orchestrator/scripts/generate_protocol_snapshot.py --check
          python orchestrator/scripts/run_core_tests.py
          git diff --check
          git add -A
          git diff --cached --check
          git commit -m 'Publish Protocol 6.3 D9 replacement bootstrap mapping'
          git push origin HEAD:ssdp-6.3-engineering-memory
