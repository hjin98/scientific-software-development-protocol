name: Temporary Protocol 6.3 replacement bootstrap lifecycle

on:
  push:
    branches: [ssdp-6.3-engineering-memory]

permissions:
  contents: write

jobs:
  lifecycle:
    if: github.event.head_commit.message == 'Execute Protocol 6.3 replacement bootstrap lifecycle'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ssdp-6.3-engineering-memory
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: |
          python -m pip install -r source/requirements-validation.txt
          python -m pip install ./orchestrator -r orchestrator/requirements-dev.txt
      - name: Construct self-reference-safe replacement bootstrap
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'Protocol 6.3 lifecycle automation'
          git config user.email 'protocol63-lifecycle@users.noreply.github.com'
          python - <<'PY'
          import re
          from pathlib import Path
          OLD='dc22f09fd38dbbfeaeb0160152da9b284654f66e'
          SENT='UNAVAILABLE_PENDING_REPLACEMENT_BOOTSTRAP'
          def rw(path, transforms):
              p=Path(path); t=p.read_text(encoding='utf-8')
              for pattern,repl,flags in transforms:
                  t,n=re.subn(pattern,repl,t,count=1,flags=flags)
                  if n != 1: raise SystemExit(f'{path}: {pattern!r} -> {n}')
              p.write_text(t,encoding='utf-8')
          rw('source/shared/references/protocol-versioning-and-compatibility.md',[
              (rf'^6\.3\.0 public-source bootstrap -> {OLD}$',f'6.3.0 invalidated D4R3 bootstrap -> {OLD}\n6.3.0 public-source bootstrap -> {SENT}',re.M),
              (r'The pre-repair Protocol 6\.3 bootstrap `1484c1d3caa49d87cc15bc52a5e775399c1dae1b`.*?The accepted 6\.2 mappings above remain operative for 6\.2\.',f'The pre-repair Protocol 6.3 bootstrap `1484c1d3caa49d87cc15bc52a5e775399c1dae1b`, second bootstrap `5ee4b3ac3ca1666b0499f7a72f55adcc411bf4bb`, owner-binding bootstrap `e12572c021087308570abfa41657a910c6896457`, and D4R3 bootstrap `{OLD}` are immutable historical evidence only. D9 changed canonical validator semantics, so the current 6.3 public-source fallback is unavailable while a new self-reference-safe replacement snapshot is qualified and later published. Recovery remains unavailable; the accepted 6.2 mappings above remain operative for 6.2.',re.S)])
          rw('PORTABILITY.md',[
              (rf'^6\.3\.0 public bootstrap -> {OLD}$',f'6.3.0 invalidated D4R3 bootstrap -> {OLD}\n6.3.0 public bootstrap -> {SENT}',re.M),
              (r'For Protocol 6\.3, pre-repair bootstrap .*?If neither compatible local source nor mapped compatible immutable public source can be read, report truthful non-closure\.',f'For Protocol 6.3, pre-repair bootstrap `1484c1d3caa49d87cc15bc52a5e775399c1dae1b`, second bootstrap `5ee4b3ac3ca1666b0499f7a72f55adcc411bf4bb`, owner-binding bootstrap `e12572c021087308570abfa41657a910c6896457`, and D4R3 bootstrap `{OLD}` are historical evidence only. D9 changed canonical validator semantics. No current 6.3 public fallback is authorized while a new self-reference-safe replacement snapshot is qualified; recovery remains unavailable. If neither compatible local source nor mapped compatible immutable public source can be read, report truthful non-closure.',re.S)])
          rw('source/shared/references/development-workflow-prompts.md',[
              (rf'^CURRENT_PUBLIC_REF = {OLD}$',f'CURRENT_PUBLIC_REF = {SENT}',re.M),
              (r'^\*\*Protocol 6\.3 bootstrap state:\*\*.*$',f'**Protocol 6.3 bootstrap state:** earlier 6.3 bootstrap snapshots, including owner-binding-invalidated `e12572c021087308570abfa41657a910c6896457` and D4R3 snapshot `{OLD}`, are historical evidence only. D9 changed canonical validator semantics. No current 6.3 public fallback is authorized until a newly qualified self-reference-safe snapshot is published by a later descendant. Recovery remains unavailable pending complete qualification and independent Review. Never use repository default/latest, a guessed semantic-version ref, the current candidate branch, an invalidated bootstrap, or the accepted 6.2 bootstrap as a substitute.',re.M)])
          rw('README.md',[(r'^\*\*Protocol 6\.3 bootstrap attempts .*$',f'**Protocol 6.3 bootstrap attempts `1484c1d3caa49d87cc15bc52a5e775399c1dae1b`, `5ee4b3ac3ca1666b0499f7a72f55adcc411bf4bb`, owner-binding-invalidated `e12572c021087308570abfa41657a910c6896457`, and D4R3 snapshot `{OLD}` are historical only; current 6.3 public-source fallback is unavailable while a new D9 replacement bootstrap is qualified; Protocol 6.3 recovery remains unavailable.**',re.M)])
          p=Path('tests/test_protocol_63_bootstrap.py'); t=p.read_text(encoding='utf-8')
          t,n=re.subn(rf'^BOOTSTRAP = "{OLD}"$',f'BOOTSTRAP = "{SENT}"\nINVALIDATED_D4R3_BOOTSTRAP = "{OLD}"',t,count=1,flags=re.M)
          if n != 1: raise SystemExit('bootstrap constant')
          a="        self.assertIn(f'6.3.0 invalidated owner-binding bootstrap -> {INVALIDATED_OWNER_BINDING_BOOTSTRAP}', versioning)\n"
          if a not in t: raise SystemExit('version test anchor')
          t=t.replace(a,a+"        self.assertIn(f'6.3.0 invalidated D4R3 bootstrap -> {INVALIDATED_D4R3_BOOTSTRAP}', versioning)\n",1)
          a="        self.assertIn(f'6.3.0 invalidated owner-binding bootstrap -> {INVALIDATED_OWNER_BINDING_BOOTSTRAP}', portability)\n"
          if a not in t: raise SystemExit('portability test anchor')
          t=t.replace(a,a+"        self.assertIn(f'6.3.0 invalidated D4R3 bootstrap -> {INVALIDATED_D4R3_BOOTSTRAP}', portability)\n",1)
          t=t.replace("self.assertIn(f'The immutable D4R3-repaired self-reference-safe source snapshot `{BOOTSTRAP}`', prompts)","self.assertIn(f'Replacement self-reference-safe source snapshot `{BOOTSTRAP}`', prompts)",1)
          t=t.replace("self.assertIn(f'The immutable D4R3-repaired snapshot `{BOOTSTRAP}`', versioning)","self.assertIn(f'Replacement self-reference-safe snapshot `{BOOTSTRAP}`', versioning)",1)
          p.write_text(t,encoding='utf-8')
          PY
          python orchestrator/scripts/generate_protocol_snapshot.py
          rm -rf /tmp/protocol-dist
          python source/build_skills.py --output /tmp/protocol-dist
          python source/validate_packages.py --dist /tmp/protocol-dist
          rm -rf dist && cp -a /tmp/protocol-dist dist
      - name: Qualify replacement bootstrap before publication
        shell: bash
        run: |
          set -euxo pipefail
          python -m unittest -v tests.test_protocol_63_bootstrap
          python -m unittest -v tests.test_protocol_63_independent_review_repairs
          python -m unittest discover -s tests -v
          python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md
          rm -rf /tmp/protocol-dist-check
          python source/build_skills.py --output /tmp/protocol-dist-check
          python source/validate_packages.py --dist /tmp/protocol-dist-check
          python source/check_dist.py --expected /tmp/protocol-dist-check --committed dist
          python orchestrator/scripts/generate_protocol_snapshot.py --check
          python orchestrator/scripts/run_core_tests.py
          git diff --check
      - name: Commit immutable replacement bootstrap
        shell: bash
        run: |
          set -euxo pipefail
          git rm .github/workflows/temporary-protocol63-bootstrap-publication-repair.yml
          git add -A
          git diff --cached --check
          git commit -m 'Create self-reference-safe Protocol 6.3 D9 bootstrap'
          BOOTSTRAP=$(git rev-parse HEAD)
          printf '%s' "$BOOTSTRAP" > /tmp/protocol63-bootstrap-sha
          git push origin HEAD:ssdp-6.3-engineering-memory
      - name: Publish exact immutable bootstrap
        shell: bash
        run: |
          set -euxo pipefail
          BOOTSTRAP=$(cat /tmp/protocol63-bootstrap-sha)
          export BOOTSTRAP
          python - <<'PY'
          import os, re
          from pathlib import Path
          B=os.environ['BOOTSTRAP']; SENT='UNAVAILABLE_PENDING_REPLACEMENT_BOOTSTRAP'
          def rw(path, transforms):
              p=Path(path); t=p.read_text(encoding='utf-8')
              for pattern,repl,flags in transforms:
                  t,n=re.subn(pattern,repl,t,count=1,flags=flags)
                  if n != 1: raise SystemExit(f'{path}: {pattern!r} -> {n}')
              p.write_text(t,encoding='utf-8')
          rw('source/shared/references/protocol-versioning-and-compatibility.md',[
              (rf'^6\.3\.0 public-source bootstrap -> {SENT}$',f'6.3.0 public-source bootstrap -> {B}',re.M),
              (r'the current 6\.3 public-source fallback is unavailable while a new self-reference-safe replacement snapshot is qualified and later published\.',f'Replacement self-reference-safe snapshot `{B}` passed source regression, package/profile integrity, Orchestrator Core, and bootstrap readiness before this later descendant published its exact SHA as the sole current 6.3 public-source fallback.',0)])
          rw('PORTABILITY.md',[
              (rf'^6\.3\.0 public bootstrap -> {SENT}$',f'6.3.0 public bootstrap -> {B}',re.M),
              (r'No current 6\.3 public fallback is authorized while a new self-reference-safe replacement snapshot is qualified; recovery remains unavailable\.',f'Replacement self-reference-safe snapshot `{B}` passed bootstrap readiness before this later descendant published its exact SHA as the sole authorized version-bound 6.3 public fallback; recovery remains unavailable.',0)])
          rw('source/shared/references/development-workflow-prompts.md',[
              (rf'^CURRENT_PUBLIC_REF = {SENT}$',f'CURRENT_PUBLIC_REF = {B}',re.M),
              (r'^\*\*Protocol 6\.3 bootstrap state:\*\*.*$',f'**Protocol 6.3 bootstrap state:** earlier 6.3 bootstrap snapshots remain historical evidence only. Replacement self-reference-safe source snapshot `{B}` passed bootstrap readiness before this later descendant published its exact SHA, so it is the sole current Protocol 6.3 public-source fallback. Recovery remains unavailable pending Stage G. Never use repository default/latest, a guessed semantic-version ref, the current candidate branch, an invalidated bootstrap, or the accepted 6.2 bootstrap as a substitute.',re.M)])
          rw('README.md',[(r'^\*\*Protocol 6\.3 bootstrap attempts .*$',f'**Earlier Protocol 6.3 bootstrap attempts `1484c1d3caa49d87cc15bc52a5e775399c1dae1b`, `5ee4b3ac3ca1666b0499f7a72f55adcc411bf4bb`, owner-binding-invalidated `e12572c021087308570abfa41657a910c6896457`, and D4R3 snapshot `dc22f09fd38dbbfeaeb0160152da9b284654f66e` are historical only; the current public-source bootstrap identity is `{B}`; Protocol 6.3 recovery remains unavailable pending Stage G.** This exact version-bound fallback was qualified before publication.',re.M)])
          p=Path('tests/test_protocol_63_bootstrap.py'); t=p.read_text(encoding='utf-8')
          t,n=re.subn(rf'^BOOTSTRAP = "{SENT}"$',f'BOOTSTRAP = "{B}"',t,count=1,flags=re.M)
          if n != 1: raise SystemExit('published bootstrap constant')
          p.write_text(t,encoding='utf-8')
          PY
          python orchestrator/scripts/generate_protocol_snapshot.py
          rm -rf /tmp/protocol-dist
          python source/build_skills.py --output /tmp/protocol-dist
          python source/validate_packages.py --dist /tmp/protocol-dist
          rm -rf dist && cp -a /tmp/protocol-dist dist
      - name: Validate publication and exact immutable route
        shell: bash
        run: |
          set -euxo pipefail
          CI=1 python -m unittest -v tests.test_protocol_63_bootstrap
          python -m unittest -v tests.test_protocol_63_independent_review_repairs
          python -m unittest discover -s tests -v
          python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md
          rm -rf /tmp/protocol-dist-check
          python source/build_skills.py --output /tmp/protocol-dist-check
          python source/validate_packages.py --dist /tmp/protocol-dist-check
          python source/check_dist.py --expected /tmp/protocol-dist-check --committed dist
          python orchestrator/scripts/generate_protocol_snapshot.py --check
          python orchestrator/scripts/run_core_tests.py
          git diff --check
      - name: Commit replacement bootstrap publication
        shell: bash
        run: |
          set -euxo pipefail
          git add -A
          git diff --cached --check
          git commit -m 'Publish Protocol 6.3 D9 replacement bootstrap mapping'
          git push origin HEAD:ssdp-6.3-engineering-memory
