name: Temporary Protocol 6.3 bootstrap publication

on:
  push:
    branches:
      - ssdp-6.3-engineering-memory
    paths:
      - .github/workflows/publish-ssdp63-bootstrap.yml

permissions:
  contents: write

jobs:
  publish-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ssdp-6.3-engineering-memory
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply exact descendant bootstrap mapping
        run: python .github/scripts/publish_ssdp63_bootstrap.py
      - name: Qualify exact immutable bootstrap before publication commit
        env:
          SSDP_VALIDATE_PUBLIC_FALLBACK: '1'
        run: |
          python -m pip install -r source/requirements-validation.txt
          python -m unittest tests.test_protocol_62_representation tests.test_protocol_63_bootstrap -v
          python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md
          git diff --check
      - name: Commit publication mapping
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md PORTABILITY.md source/shared/references/protocol-versioning-and-compatibility.md source/shared/references/development-workflow-prompts.md tests/test_protocol_62_representation.py tests/test_protocol_63_bootstrap.py
          git commit -m 'Publish immutable Protocol 6.3 public bootstrap'
      - name: Regenerate mapping-bearing descendants
        run: |
          python source/build_skills.py --output dist
          python -m pip install ./orchestrator -r orchestrator/requirements-dev.txt
          python orchestrator/scripts/generate_protocol_snapshot.py
      - name: Validate regenerated assembled candidate
        env:
          SSDP_VALIDATE_PUBLIC_FALLBACK: '1'
        run: |
          python -m unittest discover -s tests -v
          rm -rf /tmp/protocol-dist
          python source/build_skills.py --output /tmp/protocol-dist
          python source/validate_packages.py --dist /tmp/protocol-dist
          python source/check_dist.py --expected /tmp/protocol-dist --committed dist
          python orchestrator/scripts/generate_protocol_snapshot.py --check
          python orchestrator/scripts/run_core_tests.py -j 2
          git diff --check
      - name: Commit regenerated descendants and push both commits
        run: |
          git add dist orchestrator/src/sdp_orchestrator/core/resources/protocol/ssdp-protocol-6.3
          if ! git diff --cached --quiet; then
            git commit -m 'Regenerate Protocol 6.3 bootstrap-mapping descendants'
          fi
          git push origin HEAD:ssdp-6.3-engineering-memory
