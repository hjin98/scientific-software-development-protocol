name: Temporary Protocol 6.3 bootstrap assembled diagnostic

on:
  push:
    branches:
      - ssdp-6.3-engineering-memory
    paths:
      - .github/workflows/diagnose-ssdp63-bootstrap-assembled.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ssdp-6.3-engineering-memory
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconstruct exact assembled publication candidate
        run: |
          python .github/scripts/publish_ssdp63_bootstrap.py
          python -c "from pathlib import Path; p=Path('source/shared/references/development-workflow-prompts.md'); t=p.read_text(); old='That source snapshot passed bootstrap-readiness'; assert old in t; p.write_text(t.replace(old, 'That self-reference-safe source snapshot passed bootstrap-readiness', 1))"
          python -c "from pathlib import Path; p=Path('tests/test_protocol_516_orchestration.py'); t=p.read_text(); old='self.assertIn(\"current_public_ref = unavailable_pending_6.3_bootstrap_qualification\", self.lower)'; assert old in t; p.write_text(t.replace(old, 'self.assertIn(\"current_public_ref = 1484c1d3caa49d87cc15bc52a5e775399c1dae1b\", self.lower)', 1))"
          python -c "from pathlib import Path; p=Path('tests/test_protocol_61_evidence_evolution.py'); t=p.read_text(); old='self.assertIn(\"CURRENT_PUBLIC_REF = UNAVAILABLE_PENDING_6.3_BOOTSTRAP_QUALIFICATION\", prompts)'; assert old in t; p.write_text(t.replace(old, 'self.assertIn(\"CURRENT_PUBLIC_REF = 1484c1d3caa49d87cc15bc52a5e775399c1dae1b\", prompts)', 1))"
          python -m pip install -r source/requirements-validation.txt
          python source/build_skills.py --output dist
          python -m pip install ./orchestrator -r orchestrator/requirements-dev.txt
          python orchestrator/scripts/generate_protocol_snapshot.py
      - name: Run gates and capture exact statuses
        run: |
          set +e
          SSDP_VALIDATE_PUBLIC_FALLBACK=1 python -m unittest discover -s tests -v > /tmp/repo-tests.txt 2>&1; s1=$?
          rm -rf /tmp/protocol-dist
          python source/build_skills.py --output /tmp/protocol-dist > /tmp/build-dist.txt 2>&1; s2=$?
          python source/validate_packages.py --dist /tmp/protocol-dist > /tmp/validate-packages.txt 2>&1; s3=$?
          python source/check_dist.py --expected /tmp/protocol-dist --committed dist > /tmp/check-dist.txt 2>&1; s4=$?
          python orchestrator/scripts/generate_protocol_snapshot.py --check > /tmp/snapshot-check.txt 2>&1; s5=$?
          python orchestrator/scripts/run_core_tests.py -j 2 > /tmp/core-tests.txt 2>&1; s6=$?
          git diff --check > /tmp/diff-check.txt 2>&1; s7=$?
          set -e
          git reset --hard HEAD
          {
            echo '---'
            echo 'kind: protocol-6.3-bootstrap-assembled-diagnostic'
            echo 'bootstrap: 1484c1d3caa49d87cc15bc52a5e775399c1dae1b'
            echo 'authority: non-normative-observation-evidence'
            echo '---'
            echo
            echo '# Protocol 6.3 bootstrap assembled gate diagnostic'
            echo
            echo "- repository unittest discovery: $s1"
            echo "- temporary dist build: $s2"
            echo "- standalone package validation: $s3"
            echo "- committed dist parity: $s4"
            echo "- generated snapshot parity: $s5"
            echo "- Orchestrator Core: $s6"
            echo "- whitespace diff check: $s7"
            for pair in "repo-tests:$s1" "build-dist:$s2" "validate-packages:$s3" "check-dist:$s4" "snapshot-check:$s5" "core-tests:$s6" "diff-check:$s7"; do
              name=${pair%%:*}; status=${pair##*:}
              if [ "$status" != 0 ]; then
                echo
                echo "## $name failure tail"
                echo
                echo '```text'
                tail -n 220 "/tmp/$name.txt"
                echo '```'
              fi
            done
          } > qualification/ssdp6/DIAGNOSTIC-PROTOCOL-6.3-BOOTSTRAP-ASSEMBLED.md
      - name: Commit diagnostic only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qualification/ssdp6/DIAGNOSTIC-PROTOCOL-6.3-BOOTSTRAP-ASSEMBLED.md
          git commit -m 'Capture Protocol 6.3 bootstrap assembled diagnostic'
          git push origin HEAD:ssdp-6.3-engineering-memory
