name: Temporary Protocol 6.3 corrected qualification capture

on:
  push:
    branches: [ssdp-6.3-engineering-memory]

permissions:
  contents: write

jobs:
  capture:
    if: github.event.head_commit.message == 'Capture corrected Protocol 6.3 qualification failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ssdp-6.3-engineering-memory
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r source/requirements-validation.txt
          python -m pip install ./orchestrator -r orchestrator/requirements-dev.txt
      - name: Apply corrected transition and capture qualification
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'Protocol 6.3 lifecycle diagnostics'
          git config user.email 'protocol63-diagnostics@users.noreply.github.com'
          python - <<'PY'
          import re
          from pathlib import Path
          OLD='dc22f09fd38dbbfeaeb0160152da9b284654f66e'; SENT='UNAVAILABLE_PENDING_REPLACEMENT_BOOTSTRAP'
          def rw(path, transforms):
              p=Path(path); t=p.read_text(encoding='utf-8')
              for pattern,repl,flags in transforms:
                  t,n=re.subn(pattern,repl,t,count=1,flags=flags)
                  if n != 1: raise SystemExit(f'{path}: {pattern!r} -> {n}')
              p.write_text(t,encoding='utf-8')
          rw('source/shared/references/protocol-versioning-and-compatibility.md',[(rf'^6\.3\.0 public-source bootstrap -> {OLD}$',f'6.3.0 invalidated D4R3 bootstrap -> {OLD}\n6.3.0 public-source bootstrap -> {SENT}',re.M),(r'The pre-repair Protocol 6\.3 bootstrap `1484c1d3caa49d87cc15bc52a5e775399c1dae1b`.*?The accepted 6\.2 mappings above remain operative for 6\.2\.',f'The pre-repair Protocol 6.3 bootstrap `1484c1d3caa49d87cc15bc52a5e775399c1dae1b`, second bootstrap `5ee4b3ac3ca1666b0499f7a72f55adcc411bf4bb`, owner-binding bootstrap `e12572c021087308570abfa41657a910c6896457`, and D4R3 bootstrap `{OLD}` are immutable historical evidence only. D9 changed canonical validator semantics, so the current 6.3 public-source fallback is unavailable while a new self-reference-safe source snapshot is qualified and later published. Recovery remains unavailable; the accepted 6.2 mappings above remain operative for 6.2.',re.S)])
          rw('PORTABILITY.md',[(rf'^6\.3\.0 public bootstrap -> {OLD}$',f'6.3.0 invalidated D4R3 bootstrap -> {OLD}\n6.3.0 public bootstrap -> {SENT}',re.M),(r'For Protocol 6\.3, pre-repair bootstrap .*?If neither compatible local source nor mapped compatible immutable public source can be read, report truthful non-closure\.',f'For Protocol 6.3, pre-repair bootstrap `1484c1d3caa49d87cc15bc52a5e775399c1dae1b`, second bootstrap `5ee4b3ac3ca1666b0499f7a72f55adcc411bf4bb`, owner-binding bootstrap `e12572c021087308570abfa41657a910c6896457`, and D4R3 bootstrap `{OLD}` are historical evidence only. D9 changed canonical validator semantics. No current 6.3 public fallback is authorized while a new self-reference-safe source snapshot is qualified; recovery remains unavailable. If neither compatible local source nor mapped compatible immutable public source can be read, report truthful non-closure.',re.S)])
          rw('source/shared/references/development-workflow-prompts.md',[(rf'^CURRENT_PUBLIC_REF = {OLD}$',f'CURRENT_PUBLIC_REF = {SENT}',re.M),(r'^\*\*Protocol 6\.3 bootstrap state:\*\*.*$',f'**Protocol 6.3 bootstrap state:** earlier 6.3 bootstrap snapshots, including owner-binding-invalidated `e12572c021087308570abfa41657a910c6896457` and D4R3 snapshot `{OLD}`, are historical evidence only. D9 changed canonical validator semantics. No current 6.3 public fallback is authorized until a newly qualified self-reference-safe source snapshot is published by a later descendant. Recovery remains unavailable pending complete qualification and independent Review. Never use repository default/latest, a guessed semantic-version ref, the current candidate branch, an invalidated bootstrap, or the accepted 6.2 bootstrap as a substitute.',re.M)])
          rw('README.md',[(r'^\*\*Protocol 6\.3 bootstrap attempts .*$',f'**Protocol 6.3 bootstrap attempts `1484c1d3caa49d87cc15bc52a5e775399c1dae1b`, `5ee4b3ac3ca1666b0499f7a72f55adcc411bf4bb`, owner-binding-invalidated `e12572c021087308570abfa41657a910c6896457`, and D4R3 snapshot `{OLD}` are historical only; current 6.3 public-source fallback is unavailable while a new self-reference-safe source snapshot is qualified; Protocol 6.3 recovery remains unavailable.**',re.M)])
          p=Path('tests/test_protocol_63_bootstrap.py'); t=p.read_text(encoding='utf-8')
          t,n=re.subn(rf'^BOOTSTRAP = "{OLD}"$',f'BOOTSTRAP = "{SENT}"\nINVALIDATED_D4R3_BOOTSTRAP = "{OLD}"',t,count=1,flags=re.M)
          if n != 1: raise SystemExit('bootstrap constant')
          a="        self.assertIn(f'6.3.0 invalidated owner-binding bootstrap -> {INVALIDATED_OWNER_BINDING_BOOTSTRAP}', versioning)\n"; t=t.replace(a,a+"        self.assertIn(f'6.3.0 invalidated D4R3 bootstrap -> {INVALIDATED_D4R3_BOOTSTRAP}', versioning)\n",1)
          a="        self.assertIn(f'6.3.0 invalidated owner-binding bootstrap -> {INVALIDATED_OWNER_BINDING_BOOTSTRAP}', portability)\n"; t=t.replace(a,a+"        self.assertIn(f'6.3.0 invalidated D4R3 bootstrap -> {INVALIDATED_D4R3_BOOTSTRAP}', portability)\n",1)
          p.write_text(t,encoding='utf-8')
          PY
          set +e
          {
            echo '=== bootstrap ==='
            python -m unittest -v tests.test_protocol_63_bootstrap
            echo "bootstrap_rc=$?"
            echo '=== independent ==='
            python -m unittest -v tests.test_protocol_63_independent_review_repairs
            echo "independent_rc=$?"
            echo '=== full ==='
            python -m unittest discover -s tests -v
            echo "full_rc=$?"
          } > /tmp/protocol63-corrected-qualification.log 2>&1
          set -e
          cp /tmp/protocol63-corrected-qualification.log qualification/ssdp6/TEMP-PROTOCOL63-CORRECTED-QUALIFICATION.log
          git rm -f .github/workflows/temporary-protocol63-bootstrap-publication-repair.yml .github/workflows/temporary-protocol63-corrected-qualification-capture.yml
          git rm -f qualification/ssdp6/TEMP-PROTOCOL63-FULL-REGRESSION.log
          git add qualification/ssdp6/TEMP-PROTOCOL63-CORRECTED-QUALIFICATION.log
          git commit -m 'Capture corrected Protocol 6.3 qualification output'
          git push origin HEAD:ssdp-6.3-engineering-memory
