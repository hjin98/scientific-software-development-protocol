name: Protocol 6.4 Distribution Export

on:
  push:
    branches:
      - ssdp-6.4-axiomatic-definition-traceability
    paths:
      - .github/workflows/protocol-64-dist-export.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ssdp-6.4-axiomatic-definition-traceability
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install -r source/requirements-validation.txt
      - name: Build and independently validate distribution
        run: |
          python source/build_skills.py --output /tmp/protocol-dist
          python source/validate_packages.py --dist /tmp/protocol-dist
      - name: Stage generated distribution as unattached Git objects
        id: stage
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/blob-map.tsv
          while IFS= read -r -d '' file; do
            rel="${file#/tmp/protocol-dist/}"
            python - "$file" <<'PY' > /tmp/blob-request.json
          import base64, json, pathlib, sys
          data = pathlib.Path(sys.argv[1]).read_bytes()
          json.dump({"content": base64.b64encode(data).decode("ascii"), "encoding": "base64"}, sys.stdout)
          PY
            sha="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input /tmp/blob-request.json --jq .sha)"
            printf '%s\t%s\n' "$rel" "$sha" >> /tmp/blob-map.tsv
          done < <(find /tmp/protocol-dist -type f -print0 | sort -z)
          python - <<'PY' > /tmp/tree-request.json
          import json
          entries = []
          with open('/tmp/blob-map.tsv', encoding='utf-8') as handle:
              for line in handle:
                  path, sha = line.rstrip('\n').split('\t')
                  entries.append({"path": path, "mode": "100644", "type": "blob", "sha": sha})
          json.dump({"tree": entries}, open('/tmp/tree-request.json', 'w', encoding='utf-8'))
          PY
          tree_sha="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/trees" --input /tmp/tree-request.json --jq .sha)"
          echo "tree_sha=$tree_sha" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$tree_sha" > /tmp/dist-tree-sha.txt
      - name: Expose generated tree identity
        uses: actions/upload-artifact@v4
        with:
          name: ssdp64-dist-tree-${{ steps.stage.outputs.tree_sha }}
          path: /tmp/dist-tree-sha.txt
          retention-days: 1
