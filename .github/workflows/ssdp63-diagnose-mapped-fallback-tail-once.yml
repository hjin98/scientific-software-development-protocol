name: Diagnose Protocol 6.3 mapped fallback tail once

on:
  push:
    branches: [ssdp-6.3-engineering-memory]
    paths: [.github/workflows/ssdp63-diagnose-mapped-fallback-tail-once.yml]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ssdp-6.3-engineering-memory
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r source/requirements-validation.txt
          python -m pip install ./orchestrator -r orchestrator/requirements-dev.txt
      - name: Locate tail failure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import yaml
          from pathlib import Path
          data = yaml.safe_load(Path('.github/workflows/ssdp63-finalize-mapped-fallback-once.yml').read_text())
          steps = data['jobs']['repair']['steps']
          run = next(s['run'] for s in steps if s.get('name') == 'Repair mapped-fallback state and discriminator')
          Path('/tmp/reproduce-patch.sh').write_text(run)
          PY
          bash /tmp/reproduce-patch.sh
          rm -rf /tmp/tail-dist
          python source/build_skills.py --output /tmp/tail-dist >/dev/null
          rm -rf dist && cp -a /tmp/tail-dist dist
          python orchestrator/scripts/generate_protocol_snapshot.py >/dev/null
          OUT=qualification/ssdp6/DIAGNOSTIC-PROTOCOL-6.3-MAPPED-FALLBACK-TAIL.txt
          : > "$OUT"
          check() { label="$1"; shift; printf '\n===== %s =====\n' "$label" >> "$OUT"; set +e; "$@" >> "$OUT" 2>&1; rc=$?; set -e; printf 'EXIT=%s\n' "$rc" >> "$OUT"; if [ "$rc" -ne 0 ]; then printf 'FIRST_FAIL=%s\n' "$label" >> "$OUT"; return 1; fi; }
          failed=0
          check core python orchestrator/scripts/run_core_tests.py || failed=1
          BASELINE=b59adc77efe6951912cfd705cc43830c58ca27d0
          if [ "$failed" -eq 0 ]; then for version in sdp-protocol-5.16 ssdp-protocol-6.0 ssdp-protocol-6.1 ssdp-protocol-6.2; do check "frozen-${version}" git diff --exit-code "$BASELINE" -- "orchestrator/src/sdp_orchestrator/core/resources/protocol/${version}" || { failed=1; break; }; done; fi
          if [ "$failed" -eq 0 ]; then check whitespace git diff --check || failed=1; fi
          if [ "$failed" -eq 0 ]; then
            printf '\n===== stale-prose-grep =====\n' >> "$OUT"
            set +e
            git grep -in -e 'no current 6.3 public fallback is authorized' -e 'no 6.3 public fallback is authorized until' -e 'no replacement public fallback is currently authorized' -e 'no replacement fallback is currently authorized' -- README.md PORTABILITY.md source/shared/references/development-workflow-prompts.md source/shared/references/protocol-versioning-and-compatibility.md >> "$OUT" 2>&1
            rc=$?
            set -e
            printf 'GREP_EXIT=%s (1 means clean)\n' "$rc" >> "$OUT"
            if [ "$rc" -eq 0 ]; then printf 'FIRST_FAIL=stale-prose-grep\n' >> "$OUT"; failed=1; fi
          fi
          git checkout -- . ':!.github/workflows/ssdp63-diagnose-mapped-fallback-tail-once.yml' ':!qualification/ssdp6/DIAGNOSTIC-PROTOCOL-6.3-MAPPED-FALLBACK-TAIL.txt'
          rm .github/workflows/ssdp63-diagnose-mapped-fallback-tail-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Record mapped fallback tail diagnostic'
          git push origin HEAD:ssdp-6.3-engineering-memory
