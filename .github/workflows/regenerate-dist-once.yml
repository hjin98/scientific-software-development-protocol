name: Regenerate distribution once

on:
  push:
    branches:
      - ssdp-6.5-frontier-model-re-evaluation
    paths:
      - ".github/regen-dist-trigger"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate canonical distribution
        run: python source/build_skills.py --output dist
      - name: Check generated patch
        run: git diff --check
      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          if git diff --cached --quiet; then
            echo "distribution already current"
            exit 0
          fi
          git commit -m "build: regenerate canonical distribution"
          git push origin HEAD:ssdp-6.5-frontier-model-re-evaluation
