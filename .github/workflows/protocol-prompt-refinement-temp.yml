name: Protocol prompt refinement transport

on:
  push:
    branches:
      - plan/protocol-5.16-long-horizon-code-health

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refine workflow execution prompts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          prompt_path = Path("source/shared/references/development-workflow-prompts.md")
          test_path = Path("tests/test_protocol_516_orchestration.py")
          quality_test_path = Path("tests/test_protocol_516_long_horizon_quality.py")
          scenarios_path = Path("qualification/long-horizon/SCENARIOS.md")

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          prompt = prompt_path.read_text(encoding="utf-8")

          how_to_anchor = "6. Input variables identify task context; they do not override higher-authority product requirements, Frozen architecture, safety rules, repository/project instructions, or the protocol version governing an accepted workplan.\n"
          how_to_new = how_to_anchor + (
              "7. Leave `EXECUTION_MODE = AUTO_EXECUTE` when the agent should perform every action the selected stage authorizes; use `REPORT_ONLY` only when repository mutation is intentionally forbidden.\n"
              "8. Prefer resolving `AUTO` inputs from the target repository, current branch/worktree, governing artifacts, and available tool context. Ask the user only when missing information is genuinely blocking or choosing among materially different authorized outcomes.\n"
              "9. Select the stage by its required artifact and mutation boundary, not by a keyword alone. Do not silently cross from Review into repair, from Stabilization into refactoring, or from Health Audit into implementation.\n"
          )
          prompt = replace_once(prompt, how_to_anchor, how_to_new, "how-to-use execution guidance")

          execution_section = '''## Execution contract

These are **execution prompts**, not advisory templates. `AUTO_EXECUTE` means: inspect the actual target with available tools, resolve inferable context from repository evidence, perform the selected stage's authorized actions to a coherent closure, and return the concrete artifacts/actions/evidence produced. Do not stop at commands, patch suggestions, sample text, or "next steps" when the same work can be performed with available authorized tools.

`REPORT_ONLY` suppresses repository writes but does not permit superficial analysis: still inspect the real target and establish the strongest evidence available. Explicit user, safety, repository, or harness constraints override either mode.

Respect the selected stage's mutation boundary. A stage may write only the artifacts that stage owns. If evidence shows another stage is required, route explicitly to that stage rather than silently performing its work. For a request spanning multiple stages, preserve the normal sequence and acceptance boundaries instead of collapsing them into one mixed activity.

Prefer action over clarification when ordinary context is discoverable. Infer repository target, current branch, workplan location, affected authorities, and equivalent low-risk details when evidence makes them unambiguous; state a material assumption when useful. Ask only when proceeding would require guessing a genuinely consequential requirement, authority, target, or irreversible action.

'''
          prompt = replace_once(
              prompt,
              "## Portable protocol-skill resolution\n",
              execution_section + "## Portable protocol-skill resolution\n",
              "execution contract section",
          )

          additional_line = "ADDITIONAL_CONSTRAINTS = [optional explicit user constraints; NONE if absent]"
          execution_line = "EXECUTION_MODE = [AUTO_EXECUTE = perform this stage's authorized actions with available tools; REPORT_ONLY = inspect/report without repository writes; or explicit user delivery constraint]"
          if prompt.count(additional_line) != 9:
              raise SystemExit(f"expected 9 stage input blocks, found {prompt.count(additional_line)}")
          prompt = prompt.replace(additional_line, execution_line + "\n" + additional_line)

          insertions = [
              (
                  "Run this intake only when BASELINE_SCOPE is substantial or structurally risky enough that a before/after comparison will materially improve the quality-ratchet judgment.",
                  "Under AUTO_EXECUTE, inspect REPOSITORY_TARGET and capture the baseline evidence now; do not merely tell the user which commands or metrics they could collect. This stage may record task-local baseline evidence but must not modify product implementation.\n\n",
              ),
              (
                  "If TASK is substantial or structurally risky and no useful baseline was supplied, first capture the minimum task-local Baseline/Change-Health evidence needed for later quality-ratchet comparison.",
                  "Under AUTO_EXECUTE, actually create or update the governing workplan at WORKPLAN_DESTINATION after inspecting the real repository and authorities; do not stop at design advice or an outline in chat when the workplan can be written. Design may modify design/workplan/review artifacts, but do not modify product implementation in this stage.\n\n",
              ),
              (
                  "Implement WORKPLAN in full against REPOSITORY_TARGET.",
                  "Under AUTO_EXECUTE, this is the product/repository mutation stage: actually modify REPOSITORY_TARGET and its owned tests/documentation as required. Do not stop at a plan, code snippets, patch suggestions, or commands for the user to run when authorized write/execution tools are available. Follow explicit user/repository delivery and Git policy; otherwise leave a coherent directly inspectable candidate and report its identity.\n\n",
              ),
              (
                  "Review the assembled current implementation, not merely its diff or implementer summary.",
                  "Under AUTO_EXECUTE, perform the review against the actual candidate. Review must not modify production implementation, but Review & Update may update, reopen, or close the governing workplan/review lifecycle record when the verdict requires it and write access is available. Do not stop at findings alone when the requested stage explicitly includes Update.\n\n",
              ),
              (
                  "Verify that IMPLEMENTATION_TARGET faithfully realizes the Frozen scientific, computational, product, and architectural design governing VERIFICATION_SCOPE.",
                  "Under AUTO_EXECUTE, execute the strongest proportionate verification evidence available against the real candidate rather than returning a list of tests that someone else should run. Verification does not modify production implementation; route any required repair through the owning Design/Implementation path.\n\n",
              ),
              (
                  "Run this stage only after STABILIZATION_SCOPE has otherwise passed ordinary implementation review.",
                  "Under AUTO_EXECUTE, actually inspect the accepted realization for simplification opportunities and produce the stabilization verdict/evidence. Stabilization remains non-mutating: do not perform the refactor inside this stage even when the simplification is obvious.\n\n",
              ),
              (
                  "Re-align DOWNSTREAM_WORKPLAN with the accepted current state produced by UPSTREAM_ACCEPTED_WORK while FROZEN_PARENT_AUTHORITY remains binding unless explicitly reopened.",
                  "Under AUTO_EXECUTE, actually update DOWNSTREAM_WORKPLAN to the accepted current starting state; do not merely describe the edits. Alignment may modify the downstream workplan and its directly owned planning metadata, but must not modify production implementation.\n\n",
              ),
              (
                  "This is a periodic long-horizon repository audit, not a feature review or approval gate.",
                  "Under AUTO_EXECUTE, inspect the real repository and available history and produce evidence-backed findings/routing now. Health Audit does not implement the repairs it discovers; route them through the authority rules below rather than silently refactoring the repository.\n\n",
              ),
              (
                  "Run Closeout only after relevant implementation, Review, required Verification, Stabilization, and required qualification have closed.",
                  "Under AUTO_EXECUTE, actually perform the documentation, lifecycle, generated-artifact, and conservative hygiene work that Closeout authorizes when write access exists; do not return a cleanup checklist in place of the authorized actions. Closeout must not change product behavior.\n\n",
              ),
          ]
          for anchor, insertion in insertions:
              prompt = replace_once(prompt, anchor, insertion + anchor, f"stage execution insertion: {anchor[:32]}")

          selection_marker = "## Stage-selection rule of thumb\n"
          selection_pos = prompt.index(selection_marker)
          selection = '''## Stage-selection rule of thumb

Choose the stage by the **artifact and mutation boundary it must produce**, not by superficial wording in the request.

Use **Baseline / Change-Health Intake** to capture a compact before-state when substantial or structurally risky work needs later quality-ratchet comparison; it does not modify product implementation.

Use **Design / Workplan** to diagnose a problem and create or revise the authoritative implementation contract/Frozen architecture. Its primary executable artifact is the workplan, not product code.

Use **Implementation** to change product/repository behavior under an accepted contract and close semantic plus functional acceptance. If the user asks to implement, fix, refactor, or complete an accepted workplan, do not answer with another plan when the required repository actions are authorized and possible.

Use **Review & Update** to ask: *Was this workplan implemented correctly, and what governing workplan/lifecycle update follows from the verdict?* Review may update planning/review state but does not repair production code.

Use **Verification** to ask: *Are the scientific, product, numerical, and architectural claims actually true in the real implementation?* It gathers falsification evidence but does not repair production code.

Use **Stabilization** to ask: *Even if correct, is the accepted realization now unnecessarily complicated?* It is non-mutating and routes any simplification through the normal cycle.

Use **Alignment** to ask: *Does a not-yet-implemented downstream plan still describe the repository state after accepted predecessor work?* Its output is the corrected downstream workplan, not downstream implementation.

Use **Health Audit** to ask: *Across time and multiple changes, is the repository accumulating structural/test/ownership risk faster than it is being resolved?* It emits findings and routing, not broad repairs.

Use **Closeout** to make the accepted present system and repository lifecycle state coherent after engineering work is complete through documentation, generated-artifact, lifecycle, and conservative hygiene actions without changing product behavior.

When one user request spans stages, preserve the authority sequence. For example, `review and fix` means Review determines and records blockers -> Implementation performs the repair -> fresh Review when required; it does not authorize production edits inside Review.
'''
          prompt = prompt[:selection_pos] + selection
          prompt_path.write_text(prompt, encoding="utf-8")

          tests = test_path.read_text(encoding="utf-8")
          helper_anchor = '''    def test_prompt_reference_has_parameterized_stage_entrypoints(self) -> None:\n'''
          helper = '''    def assert_execution_mode_contract(self, block: str) -> None:\n        lower = block.lower()\n        self.assertIn("execution_mode =", lower)\n        self.assertIn("auto_execute", lower)\n        self.assertIn("report_only", lower)\n\n'''
          tests = replace_once(tests, helper_anchor, helper + helper_anchor, "execution helper")

          param_anchor = '''        self.assertIn("PROTOCOL_REF", self.prompt)\n'''
          param_new = param_anchor + '''        self.assertGreaterEqual(self.prompt.count("EXECUTION_MODE"), 9)\n        self.assertIn("AUTO_EXECUTE", self.prompt)\n        self.assertIn("REPORT_ONLY", self.prompt)\n'''
          tests = replace_once(tests, param_anchor, param_new, "parameterized execution mode")

          loop_anchor = '''            self.assert_portable_resolution_contract(self.stage_block(heading))\n'''
          loop_new = loop_anchor + '''            self.assert_execution_mode_contract(self.stage_block(heading))\n'''
          tests = replace_once(tests, loop_anchor, loop_new, "copied-stage execution contract")

          new_tests = '''    def test_execution_contract_prefers_action_and_resolves_inferable_context(self) -> None:\n        self.assertIn("execution prompts", self.lower)\n        self.assertIn("do not stop at commands, patch suggestions, sample text, or \"next steps\"", self.lower)\n        self.assertIn("prefer action over clarification when ordinary context is discoverable", self.lower)\n        self.assertIn("ask only when proceeding would require guessing a genuinely consequential", self.lower)\n\n    def test_stage_execution_and_mutation_boundaries_are_explicit(self) -> None:\n        design = self.stage_block("1. Design / Workplan").lower()\n        implementation = self.stage_block("2. Implementation").lower()\n        review = self.stage_block("3. Review & Update").lower()\n        verify = self.stage_block("4. Verification").lower()\n        stabilize = self.stage_block("5. Stabilization / Architecture GC").lower()\n        align = self.stage_block("6. Alignment of a Downstream Workplan").lower()\n        health = self.stage_block("7. Health Audit").lower()\n        closeout = self.stage_block("8. Closeout").lower()\n\n        self.assertIn("actually create or update the governing workplan", design)\n        self.assertIn("do not modify product implementation", design)\n        self.assertIn("actually modify repository_target", implementation)\n        self.assertIn("do not stop at a plan", implementation)\n        self.assertIn("update, reopen, or close the governing workplan/review lifecycle record", review)\n        self.assertIn("must not modify production implementation", review)\n        self.assertIn("does not modify production implementation", verify)\n        self.assertIn("stabilization remains non-mutating", stabilize)\n        self.assertIn("actually update downstream_workplan", align)\n        self.assertIn("must not modify production implementation", align)\n        self.assertIn("health audit does not implement the repairs", health)\n        self.assertIn("actually perform the documentation, lifecycle, generated-artifact", closeout)\n        self.assertIn("must not change product behavior", closeout)\n\n    def test_stage_selection_covers_design_implementation_and_mixed_stage_routing(self) -> None:\n        selection = self.prompt[self.prompt.index("## Stage-selection rule of thumb"):].lower()\n        self.assertIn("artifact and mutation boundary", selection)\n        self.assertIn("use **design / workplan**", selection)\n        self.assertIn("use **implementation**", selection)\n        self.assertIn("if the user asks to implement, fix, refactor", selection)\n        self.assertIn("review and fix", selection)\n        self.assertIn("review determines and records blockers -> implementation performs the repair", selection)\n\n'''
          no_source_anchor = '''    def test_no_source_means_truthful_nonclosure_in_each_stage(self) -> None:\n'''
          tests = replace_once(tests, no_source_anchor, new_tests + no_source_anchor, "execution behavior tests")
          test_path.write_text(tests, encoding="utf-8")

          scenarios = scenarios_path.read_text(encoding="utf-8")
          stage_counterfactual_anchor = "## Stage-selection counterfactuals\n"
          scenario_insert = '''### Execution stage performs work instead of returning instructions\nA user selects Implementation for an accepted workplan and the agent has authorized repository write and execution tools. A conforming response inspects the actual target, performs the implementation, runs proportionate acceptance, and reports the resulting candidate/evidence. Returning a plan, patch sketch, or commands for the user to run is non-conforming when the same actions are available to the agent.\n\n### Mixed-stage request preserves mutation boundaries\nA user asks to review an implementation and fix any blockers. A conforming orchestration preserves the authority sequence: Review independently determines and records the blocker without modifying production code; Implementation performs the authorized repair; final acceptance and fresh Review follow when required. The convenience of one user request does not collapse Review into implementation.\n\n'''
          scenarios = replace_once(scenarios, stage_counterfactual_anchor, scenario_insert + stage_counterfactual_anchor, "execution scenarios")
          scenarios_path.write_text(scenarios, encoding="utf-8")

          quality = quality_test_path.read_text(encoding="utf-8")
          heading_anchor = '''            "missing repository history",\n'''
          heading_new = heading_anchor + '''            "execution stage performs work instead of returning instructions",\n            "mixed-stage request preserves mutation boundaries",\n'''
          quality = replace_once(quality, heading_anchor, heading_new, "qualification scenario assertions")
          quality_test_path.write_text(quality, encoding="utf-8")

          Path(".github/workflows/protocol-prompt-refinement-temp.yml").unlink()
          PY
          python -m pip install -r source/requirements-validation.txt
          python -m unittest discover -s tests -v
          python source/build_skills.py --output /tmp/protocol-dist
          python source/validate_packages.py --dist /tmp/protocol-dist
          python source/check_dist.py --expected /tmp/protocol-dist --committed dist
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine workflow prompts for direct stage execution"
          git push origin HEAD:plan/protocol-5.16-long-horizon-code-health
