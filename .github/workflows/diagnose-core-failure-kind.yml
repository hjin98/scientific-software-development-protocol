name: Diagnose residual Core failure kind

on:
  pull_request:
    types: [synchronize, opened, reopened]

permissions:
  contents: read

jobs:
  diagnose-core:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ssdp-6.2-lossless-representation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Core
        run: python -m pip install ./orchestrator -r orchestrator/requirements-dev.txt
      - name: Run exact Core wrapper and capture output
        shell: bash
        run: |
          set +e
          python orchestrator/scripts/run_core_tests.py > /tmp/core.log 2>&1
          rc=$?
          echo "$rc" > /tmp/core.rc
          exit 0
      - name: Installed-product module failed
        if: always()
        shell: bash
        run: |
          if grep -q 'FAILED:.*tests.test_installed_product' /tmp/core.log; then exit 1; fi
      - name: Another module failed
        if: always()
        shell: bash
        run: |
          if grep -q 'FAILED:' /tmp/core.log && ! grep -q 'FAILED: tests.test_installed_product$' /tmp/core.log; then exit 1; fi
      - name: Installed subprocess killed
        if: always()
        shell: bash
        run: |
          if grep -Eq 'FAIL\(-9\).*tests\.test_installed_product|Killed|returncode.?-9' /tmp/core.log; then exit 1; fi
      - name: Wheel or sdist build failed
        if: always()
        shell: bash
        run: |
          if grep -q 'wheel/sdist build failed' /tmp/core.log; then exit 1; fi
      - name: Wheel install failed
        if: always()
        shell: bash
        run: |
          if grep -q 'wheel install failed' /tmp/core.log; then exit 1; fi
      - name: Sdist install failed
        if: always()
        shell: bash
        run: |
          if grep -q 'sdist install failed' /tmp/core.log; then exit 1; fi
      - name: Venv creation failed
        if: always()
        shell: bash
        run: |
          if grep -Eq 'venv creation failed|sdist venv creation failed' /tmp/core.log; then exit 1; fi
      - name: Unittest assertion or error present
        if: always()
        shell: bash
        run: |
          if grep -Eq '^FAILED \(|^ERROR: |^FAIL: ' /tmp/core.log; then exit 1; fi
      - name: Core wrapper passed
        if: always()
        shell: bash
        run: test "$(cat /tmp/core.rc)" -eq 0
