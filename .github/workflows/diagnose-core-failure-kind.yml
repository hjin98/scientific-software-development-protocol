name: Diagnose residual Core failing assertion

on:
  pull_request:
    types: [synchronize, opened, reopened]

permissions:
  contents: read

jobs:
  diagnose-core:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ssdp-6.2-lossless-representation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Core
        run: python -m pip install ./orchestrator -r orchestrator/requirements-dev.txt
      - name: Run exact Core wrapper and capture output
        shell: bash
        run: |
          set +e
          python orchestrator/scripts/run_core_tests.py > /tmp/core.log 2>&1
          rc=$?
          echo "$rc" > /tmp/core.rc
          exit 0
      - name: Artifact packaging assertion failed
        if: always()
        shell: bash
        run: |
          if grep -E '^(FAIL|ERROR): test_(wheel|sdist|installed_package|sibling_namespace|installed_build)' /tmp/core.log; then exit 1; fi
      - name: Launcher and prompt assertion failed
        if: always()
        shell: bash
        run: |
          if grep -E '^(FAIL|ERROR): test_(installed_cli|zero_install|stdout|every_stage|profile_alias|errors_are|stage_disallowed|task_outside|execution_mode|prompt_mode|cwd_project)' /tmp/core.log; then exit 1; fi
      - name: Discovery or doctor assertion failed
        if: always()
        shell: bash
        run: |
          if grep -E '^(FAIL|ERROR): test_(projects_command|doctor|capabilities)' /tmp/core.log; then exit 1; fi
      - name: Offline or UX assertion failed
        if: always()
        shell: bash
        run: |
          if grep -E '^(FAIL|ERROR): test_(clipboard|offline|help|pipe)' /tmp/core.log; then exit 1; fi
      - name: Installed-product fixture setup failed
        if: always()
        shell: bash
        run: |
          if grep -Eq 'ERROR: setUpClass.*InstalledProductTests|wheel/sdist build failed|wheel install failed|sdist install failed|venv creation failed' /tmp/core.log; then exit 1; fi
      - name: Any unclassified installed-product assertion failed
        if: always()
        shell: bash
        run: |
          if grep -E '^(FAIL|ERROR): .*InstalledProductTests' /tmp/core.log; then exit 1; fi
      - name: Core wrapper passed
        if: always()
        shell: bash
        run: test "$(cat /tmp/core.rc)" -eq 0
