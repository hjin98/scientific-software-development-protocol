name: Diagnose residual Core failing assertion

on:
  pull_request:
    types: [synchronize, opened, reopened]

permissions:
  contents: read

jobs:
  diagnose-core:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ssdp-6.2-lossless-representation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Core
        run: python -m pip install ./orchestrator -r orchestrator/requirements-dev.txt
      - name: Run exact Core wrapper and capture output
        shell: bash
        run: |
          set +e
          python orchestrator/scripts/run_core_tests.py > /tmp/core.log 2>&1
          rc=$?
          echo "$rc" > /tmp/core.rc
          exit 0
      - name: Offline return-code assertion failed
        if: always()
        shell: bash
        run: |
          if grep -Eq 'AssertionError: [^0][0-9-]* != 0' /tmp/core.log; then exit 1; fi
      - name: Offline required-skill assertion failed
        if: always()
        shell: bash
        run: |
          if grep -q "'REQUIRED_SKILL = software-implementation' not found" /tmp/core.log; then exit 1; fi
      - name: Offline workplan problem surfaced
        if: always()
        shell: bash
        run: |
          if grep -Ei 'workplan.*(required|missing|not found)|required.*workplan' /tmp/core.log; then exit 1; fi
      - name: Offline profile problem surfaced
        if: always()
        shell: bash
        run: |
          if grep -Ei 'profile.*(problem|invalid|not found|unsupported)|protocol_profile.*(invalid|not found)' /tmp/core.log; then exit 1; fi
      - name: Core wrapper passed
        if: always()
        shell: bash
        run: test "$(cat /tmp/core.rc)" -eq 0
