name: Diagnose residual Core failing assertion

on:
  pull_request:
    types: [synchronize, opened, reopened]

permissions:
  contents: read

jobs:
  diagnose-core:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ssdp-6.2-lossless-representation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Core
        run: python -m pip install ./orchestrator -r orchestrator/requirements-dev.txt
      - name: Run exact Core wrapper and capture output
        shell: bash
        run: |
          set +e
          python orchestrator/scripts/run_core_tests.py > /tmp/core.log 2>&1
          rc=$?
          echo "$rc" > /tmp/core.rc
          exit 0
      - name: Clipboard-extra assertion failed
        if: always()
        shell: bash
        run: |
          if grep -E '^(FAIL|ERROR): test_clipboard_extra_is_additive_and_never_blocks_the_prompt' /tmp/core.log; then exit 1; fi
      - name: Offline-snapshot assertion failed
        if: always()
        shell: bash
        run: |
          if grep -E '^(FAIL|ERROR): test_offline_rendering_uses_the_packaged_snapshot' /tmp/core.log; then exit 1; fi
      - name: Help-without-config assertion failed
        if: always()
        shell: bash
        run: |
          if grep -E '^(FAIL|ERROR): test_help_is_available_without_a_configuration' /tmp/core.log; then exit 1; fi
      - name: Pipe-safe-output assertion failed
        if: always()
        shell: bash
        run: |
          if grep -E '^(FAIL|ERROR): test_pipe_safe_output' /tmp/core.log; then exit 1; fi
      - name: Core wrapper passed
        if: always()
        shell: bash
        run: test "$(cat /tmp/core.rc)" -eq 0
