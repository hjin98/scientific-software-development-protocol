name: Temporary Protocol 6.4 Stage F final 8
on:
  push:
    branches: [ssdp-6.4-axiomatic-definition-traceability]
permissions:
  contents: write
jobs:
  final8:
    if: github.event.head_commit.message == 'Complete Protocol 6.4 Stage F final8'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: ssdp-6.4-axiomatic-definition-traceability, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python -m pip install pyyaml -r source/requirements-validation.txt
          python -m pip install ./orchestrator -r orchestrator/requirements-dev.txt
      - name: Construct final7 tree and repair historical Protocol 6.2 oracle ownership
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path
          d=yaml.safe_load(Path('.github/workflows/temporary-protocol64-stage-f-final7.yml').read_text())
          Path('/tmp/final7.sh').write_text(next(s['run'] for s in d['jobs']['final7']['steps'] if s.get('name')=='Construct final6 tree and close exact remaining unit oracles'))
          PY
          bash /tmp/final7.sh
          python - <<'PY'
          from pathlib import Path

          p = Path('tests/test_protocol_62_closeout.py')
          t = p.read_text()

          start = t.index('    def test_current_and_historical_profile_state_is_explicit')
          end = t.index('\n    def test_recovery_bootstrap_and_archive_closeout', start)
          method = '''    def test_protocol62_historical_profile_state_remains_explicit(self):
        versioning = (ROOT / "source/shared/references/protocol-versioning-and-compatibility.md").read_text()
        portability = (ROOT / "PORTABILITY.md").read_text()
        self.assertIn("| `ssdp-protocol-6.1` | 6.1.0 | 2 | frozen historical rollback |", versioning)
        self.assertIn("| `ssdp-protocol-6.2` | 6.2.0 | 2 | frozen historical rollback |", versioning)
        self.assertIn("| `ssdp-protocol-6.1` | 6.1.0 | 2 | frozen historical rollback |", portability)
        self.assertIn("| `ssdp-protocol-6.2` | 6.2.0 | 2 | frozen historical rollback |", portability)
'''
          t = t[:start] + method + t[end:]

          start = t.index('    def test_current_dependency_view_advances_without_losing_62_history')
          end = t.index('\n\n\nif __name__', start)
          method = '''    def test_protocol62_dependency_history_survives_successor_acceptance(self):
        dependencies = (ROOT / "source/SEMANTIC_DEPENDENCIES.md").read_text()
        self.assertIn("ssdp-protocol-6.2 CONSTRAINED_BY -> immutable historical Protocol 6.2 rollback semantics", dependencies)
        self.assertIn("ssdp-protocol-6.1 CONSTRAINED_BY -> immutable historical Protocol 6.1 rollback semantics", dependencies)
'''
          t = t[:start] + method + t[end:]
          p.write_text(t)

          for d in Path('qualification/ssdp6').glob('STAGE-F-DIAGNOSTIC*PROTOCOL-6.4.txt'):
              d.unlink()
          PY
          python source/build_skills.py --output dist
          python orchestrator/scripts/generate_protocol_snapshot.py
      - name: Full Stage-F acceptance
        run: |
          set -euxo pipefail
          python -m unittest discover -s tests -v
          python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md
          rm -rf /tmp/protocol-dist && python source/build_skills.py --output /tmp/protocol-dist
          python source/validate_packages.py --dist /tmp/protocol-dist
          python source/check_dist.py --expected /tmp/protocol-dist --committed dist
          python orchestrator/scripts/generate_protocol_snapshot.py --check
          python orchestrator/scripts/run_core_tests.py
          git diff --check
      - name: Publish final closeout
        run: |
          set -euxo pipefail
          git config user.name 'Protocol 6.4 lifecycle automation'
          git config user.email 'protocol64-lifecycle@users.noreply.github.com'
          find .github/workflows -maxdepth 1 -type f -name 'temporary-protocol64-stage-f-*.yml' -print0 | xargs -0 git rm
          git add -A
          git diff --cached --check
          git commit -m 'Close Protocol 6.4 lifecycle'
          git push origin HEAD:ssdp-6.4-axiomatic-definition-traceability
