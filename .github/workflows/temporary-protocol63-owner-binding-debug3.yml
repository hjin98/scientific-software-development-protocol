name: Temporary Protocol 6.3 owner-binding debug3

on:
  push:
    branches: [ssdp-6.3-engineering-memory]

permissions:
  contents: write

jobs:
  debug:
    if: github.event.head_commit.message == 'Validate narrowed Protocol 6.3 materialization'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ssdp-6.3-engineering-memory
          fetch-depth: 0
      - name: Exercise all canonical transforms without publishing them
        run: |
          set +e
          python - <<'PY' > /tmp/debug3.log 2>&1
          import importlib.util
          from pathlib import Path
          hp = Path('qualification/ssdp6/_tmp_protocol63_owner_binding_repair.py')
          spec = importlib.util.spec_from_file_location('repair', hp)
          repair = importlib.util.module_from_spec(spec); spec.loader.exec_module(repair)
          original = repair.replace_once
          def scoped(text, old, new, label):
              if label != 'valid recurrence accepted base':
                  return original(text, old, new, label)
              marker = '    def test_d4_git_recurrence_requires_resolvable_ordered_repair_and_independent_later_event(self):'
              if marker not in text:
                  raise SystemExit('D4 recurrence test marker missing')
              prefix, suffix = text.split(marker, 1)
              if suffix.count(old) < 1:
                  raise SystemExit('D4 recurrence target missing inside function')
              return prefix + marker + suffix.replace(old, new, 1)
          repair.replace_once = scoped
          repair.reopen_workplan()
          repair.implement_validator(); repair.implement_project_memory(); repair.implement_doctrine_and_template(); repair.implement_tests(); repair.invalidate_bootstrap()
          print('MATERIALIZATION_OK')
          PY
          status=$?
          printf '\nEXIT=%s\n' "$status" >> /tmp/debug3.log
          git reset --hard HEAD
          cp /tmp/debug3.log qualification/ssdp6/_tmp_protocol63_owner_binding_debug3.log
          git config user.name 'Protocol 6.3 repair automation'
          git config user.email 'protocol63-repair@users.noreply.github.com'
          git add qualification/ssdp6/_tmp_protocol63_owner_binding_debug3.log
          git commit -m 'Record narrowed Protocol 6.3 materialization result'
          git push origin HEAD:ssdp-6.3-engineering-memory
