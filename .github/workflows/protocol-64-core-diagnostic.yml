name: Protocol 6.4 Core Diagnostic

on:
  push:
    branches:
      - ssdp-6.4-axiomatic-definition-traceability
    paths:
      - .github/workflows/protocol-64-core-diagnostic.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ssdp-6.4-axiomatic-definition-traceability
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Orchestrator Core and test dependencies
        run: >-
          python -m pip install ./orchestrator
          -r orchestrator/requirements-dev.txt
      - name: Capture Core transcript
        id: capture
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          python orchestrator/scripts/run_core_tests.py > /tmp/core.txt 2>&1
          rc=$?
          set -e
          python - <<'PY' > /tmp/blob-request.json
          import base64, json, pathlib
          data = pathlib.Path('/tmp/core.txt').read_bytes()
          with open('/tmp/blob-request.json','w',encoding='utf-8') as handle:
              json.dump({"content": base64.b64encode(data).decode("ascii"), "encoding": "base64"}, handle)
          PY
          sha="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input /tmp/blob-request.json --jq .sha)"
          echo "blob_sha=$sha" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$sha" > /tmp/core-blob-sha.txt
          echo "core_exit=$rc" >> "$GITHUB_OUTPUT"
      - name: Expose diagnostic blob identity
        uses: actions/upload-artifact@v4
        with:
          name: ssdp64-core-${{ steps.capture.outputs.core_exit }}-${{ steps.capture.outputs.blob_sha }}
          path: /tmp/core-blob-sha.txt
          retention-days: 1
