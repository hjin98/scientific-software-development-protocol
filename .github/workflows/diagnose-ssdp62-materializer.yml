name: Diagnose SSDP 6.2 Stage E materializer

on:
  pull_request:
    types: [synchronize, opened, reopened]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ssdp-6.2-lossless-representation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reuse bounded profile delta from materializer
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/materialize-ssdp62.yml').read_text(encoding='utf-8')
          start_marker = '      - name: Apply bounded 6.2 profile delta\n'
          next_marker = '      - name: Install generation dependencies\n'
          start = text.index(start_marker)
          block_start = text.index('        run: |\n', start) + len('        run: |\n')
          end = text.index(next_marker, block_start)
          lines = text[block_start:end].splitlines()
          Path('/tmp/apply.sh').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n', encoding='utf-8')
          PY
          bash /tmp/apply.sh
      - name: Install generation dependencies
        run: |
          python -m pip install -r source/requirements-validation.txt
          python -m pip install ./orchestrator -r orchestrator/requirements-dev.txt
      - name: Generate candidate outputs
        run: |
          python orchestrator/scripts/generate_protocol_snapshot.py
          python source/build_skills.py
      - name: Snapshot check
        if: always()
        run: python orchestrator/scripts/generate_protocol_snapshot.py --check
      - name: Package validation
        if: always()
        run: python source/validate_packages.py --dist dist
      - name: Focused profile tests
        if: always()
        run: python -m unittest orchestrator.tests.test_ssdp6_profiles -v
      - name: Whitespace check
        if: always()
        run: git diff --check
