name: Temporary Protocol 6.3 generated materialization

on:
  push:
    branches:
      - ssdp-6.3-engineering-memory
    paths:
      - .github/workflows/materialize-ssdp63-generated.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ssdp-6.3-engineering-memory
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Protocol 6.3 PEM source before materialization
        run: |
          python -m pip install -r source/requirements-validation.txt
          python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md
          python -m unittest tests.test_protocol_63_engineering_memory -v
      - name: Build generated protocol artifacts from canonical source
        run: |
          python source/build_skills.py --output dist
          python -m pip install ./orchestrator -r orchestrator/requirements-dev.txt
          python orchestrator/scripts/generate_protocol_snapshot.py
      - name: Commit generated descendants only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist orchestrator/src/sdp_orchestrator/core/resources/protocol/ssdp-protocol-6.3
          if git diff --cached --quiet; then
            echo 'Generated artifacts already current.'
            exit 0
          fi
          git commit -m 'Regenerate Protocol 6.3 derived artifacts'
          git push origin HEAD:ssdp-6.3-engineering-memory
