name: SSDP 6.3 reopened repair transport

on:
  push:
    branches:
      - ssdp-6.3-engineering-memory
    paths:
      - '.ssdp63-repair/**'
      - '.github/workflows/ssdp63-repair-transport.yml'

permissions:
  contents: write

jobs:
  apply-repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply tested owner-layer repair
        shell: bash
        run: |
          set -euo pipefail
          cat .ssdp63-repair/payload-*.b64 | base64 -d > /tmp/ssdp63-repair.tar.gz
          echo 'a8710549f58ceefa53859593cab793feda2027eca7e95a41dba46f544022c9ad  /tmp/ssdp63-repair.tar.gz' | sha256sum -c -
          tar -xzf /tmp/ssdp63-repair.tar.gz -C .

          python - <<'PY'
          from pathlib import Path

          accepted_62 = 'b59adc77efe6951912cfd705cc43830c58ca27d0'
          old_bootstrap_63 = '5ee4b3ac3ca1666b0499f7a72f55adcc411bf4bb'

          # D1: repair self-hosted routes that accidentally used blob IDs as revisions,
          # and make current material family health explicit.
          memory_path = Path('PROJECT-ENGINEERING-MEMORY.md')
          memory = memory_path.read_text()
          replacements = {
              '0a7f7559c771aae00367941e9fe7d0205a5965a1': accepted_62,
              '1a997bbc485c899c4a352a58ab60fb0e7d1eb8fe': accepted_62,
          }
          for old, new in replacements.items():
              if old not in memory:
                  raise SystemExit(f'missing expected stale evidence identity: {old}')
              memory = memory.replace(old, new)
          health_anchor = 'authority_binding: EVIDENCE_ONLY\nguidance_level: OBSERVED'
          if memory.count(health_anchor) != 2:
              raise SystemExit(f'expected two current evidence-only material families, got {memory.count(health_anchor)}')
          memory = memory.replace(
              health_anchor,
              'authority_binding: EVIDENCE_ONLY\nbinding_health: HEALTHY\nguidance_level: OBSERVED',
          )
          memory_path.write_text(memory)

          # D7: publish the same exact executable HAS interface from the workflow owner.
          workflow_path = Path('source/shared/references/workflow-and-workplans.md')
          workflow = workflow_path.read_text()
          anchor = '3. record the exact accepted/base and overlay identities used for the current decision;\n'
          if anchor not in workflow:
              raise SystemExit('workflow HAS insertion anchor missing')
          has_contract = '''\nThe canonical session-local HAS interface is exact and executable:\n\n```yaml\npem_basis:\n  accepted_project_state: <exact accepted project state>\n  accepted_pem: <exact accepted PEM publication or NONE_PROTOCOL_6.2_PRE_PEM>\n  candidate_overlay_semantic_candidate: <exact candidate overlay or NONE>\nhas:\n  - id: <family/capability/notice id>\n    disposition: APPLICABLE | NOT_APPLICABLE | REVIEW_REQUIRED\n    reason: <bounded rationale>\n```\n\nDo not substitute aliases such as `accepted_base` or `candidate_overlay`; the workflow, canonical template, and executable validator use this one shape without translation glue. Keep the HAS session-local unless the governed work explicitly requires a durable handoff/record.\n\n'''
          if 'candidate_overlay_semantic_candidate: <exact candidate overlay or NONE>' not in workflow:
              workflow = workflow.replace(anchor, anchor + has_contract)
          workflow_path.write_text(workflow)

          # E1: once the repaired canonical source exists, the second 6.3 bootstrap is
          # historical only. A replacement may be published only by a later descendant.
          version_path = Path('source/shared/references/protocol-versioning-and-compatibility.md')
          version = version_path.read_text()
          old_mapping = f'6.3.0 public-source bootstrap -> {old_bootstrap_63}'
          if old_mapping not in version:
              raise SystemExit('current 6.3 bootstrap mapping anchor missing')
          version = version.replace(
              old_mapping,
              f'6.3.0 invalidated second bootstrap -> {old_bootstrap_63}\n6.3.0 public-source bootstrap -> UNAVAILABLE_PENDING_REPLACEMENT_BOOTSTRAP',
              1,
          )
          old_status = (
              f'The pre-repair Protocol 6.3 bootstrap `1484c1d3caa49d87cc15bc52a5e775399c1dae1b` is invalidated. '
              f'The current 6.3 public-source bootstrap mapping is `{old_bootstrap_63}`; an unavailable sentinel means no public fallback is currently authorized, while an immutable Git SHA on that mapping is usable only as the version-bound 6.3 public fallback after its readiness and exact-ref realization have passed.'
          )
          new_status = (
              f'The pre-repair Protocol 6.3 bootstrap `1484c1d3caa49d87cc15bc52a5e775399c1dae1b` and the second bootstrap `{old_bootstrap_63}` are immutable historical evidence only and are both invalidated as current fallback by the reopened semantic repair. '
              'The current 6.3 public-source bootstrap mapping is `UNAVAILABLE_PENDING_REPLACEMENT_BOOTSTRAP`; no 6.3 public fallback is authorized until an already-existing repaired snapshot passes bootstrap readiness and exact-ref realization and a later descendant publishes that exact SHA.'
          )
          if old_status not in version:
              raise SystemExit('6.3 candidate/bootstrap staging status anchor missing')
          version = version.replace(old_status, new_status, 1)
          version_path.write_text(version)
          PY

          python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md --write-summary

          # No other canonical source may retain the invalidated second bootstrap as a
          # current mapping. Historical mention is owned by versioning only.
          extra_old_refs="$(git grep -n '5ee4b3ac3ca1666b0499f7a72f55adcc411bf4bb' -- source | grep -v 'source/shared/references/protocol-versioning-and-compatibility.md' || true)"
          if [ -n "$extra_old_refs" ]; then
            echo "$extra_old_refs"
            echo 'unexpected second-bootstrap reference outside versioning owner' >&2
            exit 1
          fi

      - name: Install source validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pyyaml
          if [ -f source/requirements-validation.txt ]; then
            python -m pip install -r source/requirements-validation.txt
          fi

      - name: Regenerate canonical package and 6.3 snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/protocol-dist /tmp/protocol-dist-check
          python source/build_skills.py --output /tmp/protocol-dist
          python source/validate_packages.py --dist /tmp/protocol-dist
          rm -rf dist
          cp -a /tmp/protocol-dist dist
          python orchestrator/scripts/generate_protocol_snapshot.py

      - name: Run repaired Protocol 6.3 discriminators
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_protocol_63_engineering_memory.py' -v
          python -m unittest discover -s tests -p 'test_protocol_63_reopened_repairs.py' -v

      - name: Run full repository regression
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v
          python source/build_skills.py --output /tmp/protocol-dist-check
          python source/validate_packages.py --dist /tmp/protocol-dist-check
          diff -ru dist /tmp/protocol-dist-check
          python orchestrator/scripts/generate_protocol_snapshot.py --check
          git diff --check

      - name: Run Orchestrator Core acceptance
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e orchestrator
          if [ -f orchestrator/requirements-dev.txt ]; then
            python -m pip install -r orchestrator/requirements-dev.txt
          fi
          python -m pip install pytest
          python orchestrator/scripts/run_core_tests.py

      - name: Commit repaired assembled snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ssdp63-repair
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Repair Protocol 6.3 reopened PEM semantics'
          git push origin HEAD:ssdp-6.3-engineering-memory
