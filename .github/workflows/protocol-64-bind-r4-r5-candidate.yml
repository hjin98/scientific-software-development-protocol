name: Protocol 6.4 bind R4 R5 candidate

on:
  push:
    branches:
      - ssdp-6.4-axiomatic-definition-traceability
    paths:
      - .github/workflows/protocol-64-bind-r4-r5-candidate.yml

permissions:
  contents: write

jobs:
  bind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bind immutable Stage-E target and exact-target CI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("qualification/ssdp6/INDEPENDENT-REVIEW-HANDOFF-PROTOCOL-6.4.md")
          text = path.read_text(encoding="utf-8")

          replacements = (
              ("assembled_review_target: PENDING_DESCENDANT_HANDOFF", "assembled_review_target: 05b6d821dcdb885c86db79e38ce1e23a24863b3f"),
              ("review_target_binding_state: pending-descendant-handoff", "review_target_binding_state: bound"),
              ("assembled_review_target_ci: PENDING_EXACT_TARGET_CI", "assembled_review_target_ci: 34994976466"),
          )
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"missing binding anchor: {old}")
              text = text.replace(old, new, 1)

          old = """This handoff is the sole current Stage-E target-binding surface routed from the workplan. Its binding state is **pending-descendant-handoff** after the B64-R4/B64-R5 repair. The repaired assembled candidate cannot self-name, so this handoff **must be finalized by a later descendant** only after an already-existing immutable candidate and its exact-target ordinary PR qualification run exist.

The immediately preceding bound Stage-E target `ced6a352fbe84e8ed5e698d2ab133d4c5bb0f152`, qualified by run `34980323042`, is historical NO-PASS evidence because B64-R4/B64-R5 were found against it. Do not begin the next independent Review while `assembled_review_target` or `assembled_review_target_ci` remains pending. After descendant binding, review the newly named immutable target against accepted Protocol 6.3 repository state `0928accd337a13f864b292ed81c36372828cfb4c` and accepted 6.3 recovery `9f353097fab36e325a325f1c2f9d9cec32e86177`; treat exact-target CI as evidence to challenge, not authority.
"""
          new = """This handoff is the sole current Stage-E target-binding surface routed from the workplan. Its binding state is **bound**: this descendant names already-existing immutable assembled target `05b6d821dcdb885c86db79e38ce1e23a24863b3f` and its exact-target ordinary PR qualification run `34994976466`. The candidate does not and cannot self-name; this later handoff commit is therefore not the Review target.

The immediately preceding bound Stage-E target `ced6a352fbe84e8ed5e698d2ab133d4c5bb0f152`, qualified by run `34980323042`, is historical NO-PASS evidence because B64-R4/B64-R5 were found against it. Review immutable assembled target `05b6d821dcdb885c86db79e38ce1e23a24863b3f` against accepted Protocol 6.3 repository state `0928accd337a13f864b292ed81c36372828cfb4c` and accepted 6.3 recovery `9f353097fab36e325a325f1c2f9d9cec32e86177`; treat exact-target CI `34994976466` as evidence to challenge, not authority. Do **not** inherit implementation/authoring conclusions, green CI, this handoff, or prior Protocol 6.x Review verdicts as authority.
"""
          if old not in text:
              raise SystemExit("missing reviewer-mandate binding paragraph")
          text = text.replace(old, new, 1)

          old = "- most recent failed assembled Stage-E target: `ced6a352fbe84e8ed5e698d2ab133d4c5bb0f152`, qualified by exact-target CI `34980323042`; the repaired successor target is pending descendant binding."
          new = "- most recent failed assembled Stage-E target: `ced6a352fbe84e8ed5e698d2ab133d4c5bb0f152`, qualified by exact-target CI `34980323042`;\n- current repaired assembled Stage-E review target: `05b6d821dcdb885c86db79e38ce1e23a24863b3f`, qualified by exact-target ordinary PR CI `34994976466`."
          if old not in text:
              raise SystemExit("missing identity-list binding anchor")
          text = text.replace(old, new, 1)

          old = "- Most recent failed assembled target `ced6a352fbe84e8ed5e698d2ab133d4c5bb0f152`; exact-target ordinary PR CI `34980323042` passed, but fresh independent Review returned NO-PASS on B64-R4/B64-R5. The repaired successor target and exact-target CI remain pending until a later descendant binds them."
          new = "- Most recent failed assembled target `ced6a352fbe84e8ed5e698d2ab133d4c5bb0f152`; exact-target ordinary PR CI `34980323042` passed, but fresh independent Review returned NO-PASS on B64-R4/B64-R5.\n- Current repaired assembled target `05b6d821dcdb885c86db79e38ce1e23a24863b3f`; exact-target ordinary PR CI `34994976466` passed. This descendant handoff binds that immutable target for the next fresh independent Stage-E Review."
          if old not in text:
              raise SystemExit("missing evidence-list binding anchor")
          text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY
      - name: Remove temporary binding workflow
        run: git rm -f .github/workflows/protocol-64-bind-r4-r5-candidate.yml
      - name: Verify bound QF64-P and patch integrity
        run: |
          python -m unittest tests.test_protocol_64_axiomatic_traceability.Protocol64AxiomaticTraceabilityQualificationTests.test_qf64_p_one_current_snapshot_complete_handoff -v
          git diff --check
          git add -A
          git diff --cached --check
      - name: Commit bound Stage-E handoff
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Bind Protocol 6.4 repaired Stage-E candidate"
          git push origin HEAD:ssdp-6.4-axiomatic-definition-traceability
