name: Protocol regression diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  method:
    name: diag65 (${{ matrix.method }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        method:
          - test_accepted_cutover_allows_exact_previous_candidate_and_history_transfer
          - test_accepted_cutover_rejects_missing_history_transfer
          - test_accepted_cutover_rejects_mutated_history_transfer
          - test_accepted_cutover_rejects_wrong_accepted_recovery
          - test_accepted_cutover_requires_previous_review_pass
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -r source/requirements-validation.txt
      - name: Run method
        run: python -m unittest -v tests.test_protocol_65_release_state.Protocol65ReleaseStateTests.${{ matrix.method }}
