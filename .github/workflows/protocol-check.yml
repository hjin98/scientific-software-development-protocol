name: Protocol build check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -r source/requirements-validation.txt
      - name: Validate repository release state
        run: python source/release_state.py
      - name: Validate project engineering memory
        run: python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md
      - name: Diagnostic contracts
        run: python -m unittest tests.test_protocol_contracts -v
      - name: Diagnostic stewardship
        run: python -m unittest tests.test_protocol_engineering_stewardship -v
      - name: Diagnostic effective compression
        run: python -m unittest tests.test_protocol_effective_compression -v
      - name: Diagnostic convergence
        run: python -m unittest tests.test_protocol_512_convergence -v
      - name: Diagnostic evidence evolution
        run: python -m unittest tests.test_protocol_61_evidence_evolution -v
      - name: Diagnostic representation
        run: python -m unittest tests.test_protocol_62_representation -v
      - name: Diagnostic axiomatic traceability
        run: python -m unittest tests.test_protocol_64_axiomatic_traceability -v
      - name: Diagnostic current state
        run: python -m unittest tests.test_protocol_65_current_state_ownership -v
      - name: Run protocol regression tests
        run: python -m unittest discover -s tests -v
      - name: Build canonical skill packages once
        run: python source/build_skills.py --output /tmp/protocol-dist
      - name: Validate generated skill packages independently
        run: python source/validate_packages.py --dist /tmp/protocol-dist
      - name: Verify committed distribution parity
        run: python source/check_dist.py --expected /tmp/protocol-dist --committed dist
      - name: Check patch whitespace
        run: git diff --check

  orchestrator-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install orchestrator Core and its development dependencies
        run: >-
          python -m pip install ./orchestrator
          -r orchestrator/requirements-dev.txt
      - name: Verify the packaged Protocol snapshot matches canonical source
        run: python orchestrator/scripts/generate_protocol_snapshot.py --check
      - name: Run orchestrator Core acceptance suite
        run: python orchestrator/scripts/run_core_tests.py
