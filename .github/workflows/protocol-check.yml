name: Protocol build check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -r source/requirements-validation.txt
      - name: Validate repository release state
        run: python source/release_state.py
      - name: Validate project engineering memory
        run: python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md
      - name: Diag release-state family review evidence
        if: always()
        run: >-
          python -m unittest discover -s tests
          -p test_protocol_65_release_state.py -k review_evidence -v
      - name: Diag release-state family ratification evidence
        if: always()
        run: >-
          python -m unittest discover -s tests
          -p test_protocol_65_release_state.py -k ratification -v
      - name: Diag release-state family public recovery
        if: always()
        run: >-
          python -m unittest discover -s tests
          -p test_protocol_65_release_state.py -k recovery -v
      - name: Diag release-state family accepted cutover
        if: always()
        run: >-
          python -m unittest discover -s tests
          -p test_protocol_65_release_state.py -k accepted_cutover -v
      - name: Diag release-state family transition
        if: always()
        run: >-
          python -m unittest discover -s tests
          -p test_protocol_65_release_state.py -k transition -v
      - name: Diag release-state family governed topology
        if: always()
        run: >-
          python -m unittest discover -s tests
          -p test_protocol_65_release_state.py -k previous_governed -v
      - name: Diag governed topology first half
        if: always()
        run: >-
          python -m unittest discover -s tests -p test_protocol_65_release_state.py
          -k use_head_for_working_tree_change
          -k use_linear_parent_boundary
          -k cross_evidence_only_descendants
          -k cover_date_reordered_merge_parents
          -k deduplicate_equivalent_merge_lineages
          -k handle_synthetic_pr_merge
          -k reject_deleted_owner_merge_lineage
          -k reject_long_owner_absence
          -k reject_same_lineage_reintroduction
          -k allow_long_genuine_pre_owner_lineage
          -k fail_closed_on_shallow_working_tree_reintroduction
          -v
      - name: Diag governed topology first quarter
        if: always()
        run: >-
          python -m unittest discover -s tests -p test_protocol_65_release_state.py
          -k use_head_for_working_tree_change
          -k use_linear_parent_boundary
          -k cross_evidence_only_descendants
          -k cover_date_reordered_merge_parents
          -k deduplicate_equivalent_merge_lineages
          -k handle_synthetic_pr_merge
          -v
      - name: Diag exact use_head_for_working_tree_change
        if: always()
        run: >-
          python -m unittest discover -s tests -p test_protocol_65_release_state.py
          -k use_head_for_working_tree_change -v
      - name: Diag exact use_linear_parent_boundary
        if: always()
        run: >-
          python -m unittest discover -s tests -p test_protocol_65_release_state.py
          -k use_linear_parent_boundary -v
      - name: Diag exact cross_evidence_only_descendants
        if: always()
        run: >-
          python -m unittest discover -s tests -p test_protocol_65_release_state.py
          -k cross_evidence_only_descendants -v
      - name: Diag exact cover_date_reordered_merge_parents
        if: always()
        run: >-
          python -m unittest discover -s tests -p test_protocol_65_release_state.py
          -k cover_date_reordered_merge_parents -v
      - name: Diag exact deduplicate_equivalent_merge_lineages
        if: always()
        run: >-
          python -m unittest discover -s tests -p test_protocol_65_release_state.py
          -k deduplicate_equivalent_merge_lineages -v
      - name: Diag exact handle_synthetic_pr_merge
        if: always()
        run: >-
          python -m unittest discover -s tests -p test_protocol_65_release_state.py
          -k handle_synthetic_pr_merge -v
      - name: Diag governed topology second quarter
        if: always()
        run: >-
          python -m unittest discover -s tests -p test_protocol_65_release_state.py
          -k reject_deleted_owner_merge_lineage
          -k reject_long_owner_absence
          -k reject_same_lineage_reintroduction
          -k allow_long_genuine_pre_owner_lineage
          -k fail_closed_on_shallow_working_tree_reintroduction
          -v
      - name: Diag governed topology second half
        if: always()
        run: >-
          python -m unittest discover -s tests -p test_protocol_65_release_state.py
          -k fail_closed_on_shallow_missing_merge_parent
          -k allow_working_tree_first_owner_introduction
          -k reject_working_tree_reintroduction
          -k fail_closed_on_unreadable_historical_owner_objects
          -k use_canonical_ancestry_under_replace_ref
          -k use_canonical_ancestry_under_graft
          -k follow_readable_alternate_object_store
          -k reject_laundered_reintroduction_after_later_transition
          -k reject_laundered_owner_present_history_rewrite
          -k reject_laundered_owner_present_accepted_rewrite
          -k allow_multiple_legal_owner_present_transitions
          -v
      - name: Diag release-state family canonical ancestry
        if: always()
        run: >-
          python -m unittest discover -s tests
          -p test_protocol_65_release_state.py -k canonical -v
      - name: Diag release-state family version semantics
        if: always()
        run: >-
          python -m unittest discover -s tests
          -p test_protocol_65_release_state.py -k version -v
      - name: Diag release-state family repository coherence
        if: always()
        run: >-
          python -m unittest discover -s tests
          -p test_protocol_65_release_state.py -k repository_release_state -v
      - name: Diag release-state family load parser
        if: always()
        run: >-
          python -m unittest discover -s tests
          -p test_protocol_65_release_state.py -k release_state_load -v
      - name: Diag exact discovery release-state only
        if: always()
        run: >-
          python -m unittest discover -s tests
          -p test_protocol_65_release_state.py -v
      - name: Run protocol regression tests
        if: always()
        run: python -m unittest discover -s tests -v
      - name: Build canonical skill packages once
        run: python source/build_skills.py --output /tmp/protocol-dist
      - name: Validate generated skill packages independently
        run: python source/validate_packages.py --dist /tmp/protocol-dist
      - name: Verify committed distribution parity
        run: python source/check_dist.py --expected /tmp/protocol-dist --committed dist
      - name: Check patch whitespace
        run: git diff --check

  orchestrator-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install orchestrator Core and its development dependencies
        run: >-
          python -m pip install ./orchestrator
          -r orchestrator/requirements-dev.txt
      - name: Verify the packaged Protocol snapshot matches canonical source
        run: python orchestrator/scripts/generate_protocol_snapshot.py --check
      - name: Run orchestrator Core acceptance suite
        run: python orchestrator/scripts/run_core_tests.py
