name: Protocol build check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -r source/requirements-validation.txt
      - name: Validate repository release state
        run: python source/release_state.py
      - name: Validate project engineering memory
        run: python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md
      - name: Classify resolver working-tree failure
        id: classify_worktree
        shell: bash
        run: |
          python - <<'PY'
          import os
          import subprocess
          import tempfile
          from pathlib import Path
          from tests.test_protocol_65_release_state import Protocol65ReleaseStateTests, release_state

          Protocol65ReleaseStateTests.setUpClass()
          case = Protocol65ReleaseStateTests(
              "test_previous_governed_states_use_head_for_working_tree_change"
          )
          result = "pass"
          try:
              with tempfile.TemporaryDirectory() as tmpdir:
                  root = Path(tmpdir)
                  case._init_topology_repo(root)
                  previous = case._topology_state("a")
                  case._write_topology_state(root, previous)
                  case._commit_topology_repo(root, "previous")
                  current = case._topology_state("b")
                  case._write_topology_state(root, current)
                  errors = []
                  states = release_state._previous_governed_release_states(
                      root,
                      current,
                      errors,
                  )
                  if errors:
                      result = "resolver-errors"
                  elif len(states) != 1:
                      result = "wrong-count"
                  elif states[0] != previous:
                      result = "state-mismatch"
          except subprocess.CalledProcessError:
              result = "git-error"
          except Exception:
              result = "exception"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"result={result}\n")
          PY
      - name: Working-tree classifier PASS
        if: steps.classify_worktree.outputs.result == 'pass'
        run: "true"
      - name: Working-tree classifier GIT ERROR
        if: steps.classify_worktree.outputs.result == 'git-error'
        run: "true"
      - name: Working-tree classifier RESOLVER ERRORS
        if: steps.classify_worktree.outputs.result == 'resolver-errors'
        run: "true"
      - name: Working-tree classifier WRONG COUNT
        if: steps.classify_worktree.outputs.result == 'wrong-count'
        run: "true"
      - name: Working-tree classifier STATE MISMATCH
        if: steps.classify_worktree.outputs.result == 'state-mismatch'
        run: "true"
      - name: Working-tree classifier EXCEPTION
        if: steps.classify_worktree.outputs.result == 'exception'
        run: "true"
      - name: Diagnose full release-state module
        run: python -m unittest tests.test_protocol_65_release_state -v
      - name: Run protocol regression tests
        run: python -m unittest discover -s tests -v
      - name: Build canonical skill packages once
        run: python source/build_skills.py --output /tmp/protocol-dist
      - name: Validate generated skill packages independently
        run: python source/validate_packages.py --dist /tmp/protocol-dist
      - name: Verify committed distribution parity
        run: python source/check_dist.py --expected /tmp/protocol-dist --committed dist
      - name: Check patch whitespace
        run: git diff --check

  orchestrator-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install orchestrator Core and its development dependencies
        run: >-
          python -m pip install ./orchestrator
          -r orchestrator/requirements-dev.txt
      - name: Verify the packaged Protocol snapshot matches canonical source
        run: python orchestrator/scripts/generate_protocol_snapshot.py --check
      - name: Run orchestrator Core acceptance suite
        run: python orchestrator/scripts/run_core_tests.py
