name: Protocol build check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -r source/requirements-validation.txt
      - name: Validate repository release state
        run: python source/release_state.py
      - name: Validate project engineering memory
        run: python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md
      - name: Diag topology basics
        continue-on-error: true
        run: >-
          python -m unittest
          tests.test_protocol_65_release_state.Protocol65ReleaseStateTests.test_previous_governed_states_use_head_for_working_tree_change
          tests.test_protocol_65_release_state.Protocol65ReleaseStateTests.test_previous_governed_states_use_linear_parent_boundary
          tests.test_protocol_65_release_state.Protocol65ReleaseStateTests.test_previous_governed_states_cross_evidence_only_descendants
          tests.test_protocol_65_release_state.Protocol65ReleaseStateTests.test_previous_governed_states_cover_date_reordered_merge_parents
          tests.test_protocol_65_release_state.Protocol65ReleaseStateTests.test_previous_governed_states_deduplicate_equivalent_merge_lineages
          tests.test_protocol_65_release_state.Protocol65ReleaseStateTests.test_previous_governed_states_handle_synthetic_pr_merge
      - name: Diag topology owner continuity
        continue-on-error: true
        run: >-
          python -m unittest
          tests.test_protocol_65_release_state.Protocol65ReleaseStateTests.test_previous_governed_states_reject_deleted_owner_merge_lineage
          tests.test_protocol_65_release_state.Protocol65ReleaseStateTests.test_previous_governed_states_reject_long_owner_absence
          tests.test_protocol_65_release_state.Protocol65ReleaseStateTests.test_previous_governed_states_reject_same_lineage_reintroduction
          tests.test_protocol_65_release_state.Protocol65ReleaseStateTests.test_previous_governed_states_allow_long_genuine_pre_owner_lineage
          tests.test_protocol_65_release_state.Protocol65ReleaseStateTests.test_previous_governed_states_fail_closed_on_shallow_working_tree_reintroduction
          tests.test_protocol_65_release_state.Protocol65ReleaseStateTests.test_previous_governed_states_fail_closed_on_shallow_missing_merge_parent
          tests.test_protocol_65_release_state.Protocol65ReleaseStateTests.test_previous_governed_states_allow_working_tree_first_owner_introduction
          tests.test_protocol_65_release_state.Protocol65ReleaseStateTests.test_previous_governed_states_reject_working_tree_reintroduction
      - name: Diag topology canonical storage
        continue-on-error: true
        run: >-
          python -m unittest
          tests.test_protocol_65_release_state.Protocol65ReleaseStateTests.test_previous_governed_states_fail_closed_on_unreadable_historical_owner_objects
          tests.test_protocol_65_release_state.Protocol65ReleaseStateTests.test_previous_governed_states_use_canonical_ancestry_under_replace_ref
          tests.test_protocol_65_release_state.Protocol65ReleaseStateTests.test_previous_governed_states_use_canonical_ancestry_under_graft
          tests.test_protocol_65_release_state.Protocol65ReleaseStateTests.test_previous_governed_states_follow_readable_alternate_object_store
          tests.test_protocol_65_release_state.Protocol65ReleaseStateTests.test_previous_governed_states_reject_laundered_reintroduction_after_later_transition
      - name: Diag new owner-present holdouts
        continue-on-error: true
        run: >-
          python -m unittest
          tests.test_protocol_65_release_state.Protocol65ReleaseStateTests.test_previous_governed_states_reject_laundered_owner_present_history_rewrite
          tests.test_protocol_65_release_state.Protocol65ReleaseStateTests.test_previous_governed_states_reject_laundered_owner_present_accepted_rewrite
          tests.test_protocol_65_release_state.Protocol65ReleaseStateTests.test_previous_governed_states_allow_multiple_legal_owner_present_transitions
      - name: Diag full release-state module
        continue-on-error: true
        run: python -m unittest tests.test_protocol_65_release_state -v
      - name: Diag other Protocol 6.5 modules
        continue-on-error: true
        run: >-
          python -m unittest
          tests.test_protocol_65_current_state_ownership
          tests.test_protocol_65_pem_canonical_git
          tests.test_protocol_65_pem_parser_strictness
          tests.test_protocol_65_pem_reconciliation
          tests.test_protocol_65_pem_schema_parity
          -v
      - name: Diag pre-6.5 modules
        continue-on-error: true
        run: >-
          python -m unittest
          tests.test_build_index_contract
          tests.test_package_reference_closure
          tests.test_protocol_511_tool_assistance
          tests.test_protocol_512_convergence
          tests.test_protocol_513_counterfactual_oracles
          tests.test_protocol_513_live_tool_qualification
          tests.test_protocol_513_oracle_family_closure
          tests.test_protocol_513_tool_routing_codeql_compression
          tests.test_protocol_515_language_profiles
          tests.test_protocol_516_lifecycle_closeout
          tests.test_protocol_516_long_horizon_quality
          tests.test_protocol_516_orchestration
          tests.test_protocol_59_review_rework
          tests.test_protocol_59_route_uri_safety
          tests.test_protocol_61_evidence_evolution
          tests.test_protocol_62_closeout
          tests.test_protocol_62_representation
          tests.test_protocol_63_bootstrap
          tests.test_protocol_63_closeout
          tests.test_protocol_63_engineering_memory
          tests.test_protocol_63_independent_review_repairs
          tests.test_protocol_63_reopened_repairs
          tests.test_protocol_64_axiomatic_traceability
          tests.test_protocol_64_bootstrap_readiness
          -v
      - name: Diag generic protocol modules
        continue-on-error: true
        run: >-
          python -m unittest
          tests.test_protocol_contracts
          tests.test_protocol_effective_compression
          tests.test_protocol_engineering_stewardship
          tests.test_protocol_portability
          tests.test_protocol_proxy_proof_acceptance
          tests.test_protocol_tooling
          -v
      - name: Diag canonical prefix through release-state
        continue-on-error: true
        run: >-
          python -m unittest tests.test_build_index_contract tests.test_package_reference_closure tests.test_protocol_511_tool_assistance tests.test_protocol_512_convergence tests.test_protocol_513_counterfactual_oracles tests.test_protocol_513_live_tool_qualification tests.test_protocol_513_oracle_family_closure tests.test_protocol_513_tool_routing_codeql_compression tests.test_protocol_515_language_profiles tests.test_protocol_516_lifecycle_closeout tests.test_protocol_516_long_horizon_quality tests.test_protocol_516_orchestration tests.test_protocol_59_review_rework tests.test_protocol_59_route_uri_safety tests.test_protocol_61_evidence_evolution tests.test_protocol_62_closeout tests.test_protocol_62_representation tests.test_protocol_63_bootstrap tests.test_protocol_63_closeout tests.test_protocol_63_engineering_memory tests.test_protocol_63_independent_review_repairs tests.test_protocol_63_reopened_repairs tests.test_protocol_64_axiomatic_traceability tests.test_protocol_64_bootstrap_readiness tests.test_protocol_65_current_state_ownership tests.test_protocol_65_pem_canonical_git tests.test_protocol_65_pem_parser_strictness tests.test_protocol_65_pem_reconciliation tests.test_protocol_65_pem_schema_parity tests.test_protocol_65_release_state -v
      - name: Diag canonical explicit full order
        continue-on-error: true
        run: >-
          python -m unittest tests.test_build_index_contract tests.test_package_reference_closure tests.test_protocol_511_tool_assistance tests.test_protocol_512_convergence tests.test_protocol_513_counterfactual_oracles tests.test_protocol_513_live_tool_qualification tests.test_protocol_513_oracle_family_closure tests.test_protocol_513_tool_routing_codeql_compression tests.test_protocol_515_language_profiles tests.test_protocol_516_lifecycle_closeout tests.test_protocol_516_long_horizon_quality tests.test_protocol_516_orchestration tests.test_protocol_59_review_rework tests.test_protocol_59_route_uri_safety tests.test_protocol_61_evidence_evolution tests.test_protocol_62_closeout tests.test_protocol_62_representation tests.test_protocol_63_bootstrap tests.test_protocol_63_closeout tests.test_protocol_63_engineering_memory tests.test_protocol_63_independent_review_repairs tests.test_protocol_63_reopened_repairs tests.test_protocol_64_axiomatic_traceability tests.test_protocol_64_bootstrap_readiness tests.test_protocol_65_current_state_ownership tests.test_protocol_65_pem_canonical_git tests.test_protocol_65_pem_parser_strictness tests.test_protocol_65_pem_reconciliation tests.test_protocol_65_pem_schema_parity tests.test_protocol_65_release_state tests.test_protocol_contracts tests.test_protocol_effective_compression tests.test_protocol_engineering_stewardship tests.test_protocol_portability tests.test_protocol_proxy_proof_acceptance tests.test_protocol_tooling -v
      - name: Run protocol regression tests
        run: python -m unittest discover -s tests -v
      - name: Build canonical skill packages once
        run: python source/build_skills.py --output /tmp/protocol-dist
      - name: Validate generated skill packages independently
        run: python source/validate_packages.py --dist /tmp/protocol-dist
      - name: Verify committed distribution parity
        run: python source/check_dist.py --expected /tmp/protocol-dist --committed dist
      - name: Check patch whitespace
        run: git diff --check

  orchestrator-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install orchestrator Core and its development dependencies
        run: >-
          python -m pip install ./orchestrator
          -r orchestrator/requirements-dev.txt
      - name: Verify the packaged Protocol snapshot matches canonical source
        run: python orchestrator/scripts/generate_protocol_snapshot.py --check
      - name: Run orchestrator Core acceptance suite
        run: python orchestrator/scripts/run_core_tests.py
