name: Protocol build check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -r source/requirements-validation.txt
      - name: Validate repository release state
        run: python source/release_state.py
      - name: Validate project engineering memory
        run: python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md
      - name: Capture discover regression
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -v > /tmp/discover.log 2>&1
          status=$?
          exit "$status"
      - name: Diag release-state module failure
        if: always()
        run: >-
          grep -Eq '^(FAIL|ERROR): .*test_protocol_65_release_state' /tmp/discover.log
      - name: Diag other Protocol 6.5 module failure
        if: always()
        run: >-
          grep -Eq '^(FAIL|ERROR): .*test_protocol_65_(current_state_ownership|pem_)' /tmp/discover.log
      - name: Diag pre-6.5 module failure
        if: always()
        run: >-
          grep -Eq '^(FAIL|ERROR): .*test_protocol_(511|512|513|515|516|59|61|62|63|64)' /tmp/discover.log
      - name: Diag generic module failure
        if: always()
        run: >-
          grep -Eq '^(FAIL|ERROR): .*test_(build_index_contract|package_reference_closure|protocol_contracts|protocol_effective_compression|protocol_engineering_stewardship|protocol_portability|protocol_proxy_proof_acceptance|protocol_tooling)' /tmp/discover.log
      - name: Diag discovery import failure
        if: always()
        run: >-
          grep -Eq 'Failed to import test module|ImportError|ModuleNotFoundError' /tmp/discover.log
      - name: Run protocol regression tests
        if: always()
        run: python -m unittest discover -s tests -v
      - name: Build canonical skill packages once
        run: python source/build_skills.py --output /tmp/protocol-dist
      - name: Validate generated skill packages independently
        run: python source/validate_packages.py --dist /tmp/protocol-dist
      - name: Verify committed distribution parity
        run: python source/check_dist.py --expected /tmp/protocol-dist --committed dist
      - name: Check patch whitespace
        run: git diff --check

  orchestrator-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install orchestrator Core and its development dependencies
        run: >-
          python -m pip install ./orchestrator
          -r orchestrator/requirements-dev.txt
      - name: Verify the packaged Protocol snapshot matches canonical source
        run: python orchestrator/scripts/generate_protocol_snapshot.py --check
      - name: Run orchestrator Core acceptance suite
        run: python orchestrator/scripts/run_core_tests.py
