name: Protocol build check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -r source/requirements-validation.txt
      - name: Run protocol regression tests
        run: python -m unittest discover -s tests -v
      - name: Build canonical skill packages once
        run: python source/build_skills.py --output /tmp/protocol-dist
      - name: Validate generated skill packages independently
        run: python source/validate_packages.py --dist /tmp/protocol-dist
      - name: Verify committed distribution parity
        run: python source/check_dist.py --expected /tmp/protocol-dist --committed dist
      - name: Check patch whitespace
        run: git diff --check

  validator-diagnostic:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        category:
          - route
          - reachability
          - canonical
          - adapter
          - identity
          - archive
          - frontmatter
          - unsafe
    name: validator-diagnostic (${{ matrix.category }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -r source/requirements-validation.txt
      - name: Classify generated-package validation errors
        env:
          CATEGORY: ${{ matrix.category }}
        run: |
          python source/build_skills.py --output /tmp/validator-dist >/dev/null
          python - <<'PY'
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, "source")
          import validate_packages
          errors = validate_packages.validate(Path("/tmp/validator-dist"))
          categories = {
              "route": ("routed resource is not packaged", "local markdown route is not packaged"),
              "reachability": ("not reachable from skill.md",),
              "canonical": ("differs from canonical", "no canonical source"),
              "adapter": ("openai adapter",),
              "identity": ("protocol version", "manifest", "build_index", "runtime skill set", "top-level"),
              "archive": ("unpacked/zip", "zip member", "duplicate zip", "exceeds 25"),
              "frontmatter": ("frontmatter", "not utf-8"),
              "unsafe": ("unsafe", "encoded"),
          }
          needles = categories[os.environ["CATEGORY"]]
          raise SystemExit(1 if any(any(needle in error.lower() for needle in needles) for error in errors) else 0)
          PY

  orchestrator-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install orchestrator Core and its development dependencies
        run: >-
          python -m pip install ./orchestrator
          -r orchestrator/requirements-dev.txt
      - name: Verify the packaged Protocol snapshot matches canonical source
        run: python orchestrator/scripts/generate_protocol_snapshot.py --check
      - name: Run orchestrator Core acceptance suite
        run: python orchestrator/scripts/run_core_tests.py
