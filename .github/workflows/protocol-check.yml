name: Protocol build check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -r source/requirements-validation.txt
      - name: Validate repository release state
        run: python source/release_state.py
      - name: Validate project engineering memory
        run: python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md
      - name: Classify resolver working-tree exception
        id: classify_worktree
        shell: bash
        run: |
          python - <<'PY'
          import os
          import subprocess
          import tempfile
          from pathlib import Path
          from tests.test_protocol_65_release_state import Protocol65ReleaseStateTests, release_state

          Protocol65ReleaseStateTests.setUpClass()
          case = Protocol65ReleaseStateTests(
              "test_previous_governed_states_use_head_for_working_tree_change"
          )
          result = "pass"
          stage = "start"
          exc_type = "none"
          try:
              with tempfile.TemporaryDirectory() as tmpdir:
                  root = Path(tmpdir)
                  stage = "init"
                  case._init_topology_repo(root)
                  stage = "previous-state"
                  previous = case._topology_state("a")
                  stage = "write-previous"
                  case._write_topology_state(root, previous)
                  stage = "commit-previous"
                  case._commit_topology_repo(root, "previous")
                  stage = "current-state"
                  current = case._topology_state("b")
                  stage = "write-current"
                  case._write_topology_state(root, current)
                  stage = "resolver"
                  errors = []
                  states = release_state._previous_governed_release_states(
                      root,
                      current,
                      errors,
                  )
                  stage = "compare"
                  if errors:
                      result = "resolver-errors"
                  elif len(states) != 1:
                      result = "wrong-count"
                  elif states[0] != previous:
                      result = "state-mismatch"
          except subprocess.CalledProcessError as exc:
              result = "exception"
              exc_type = type(exc).__name__
          except Exception as exc:
              result = "exception"
              exc_type = type(exc).__name__
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"result={result}\n")
              out.write(f"stage={stage}\n")
              out.write(f"exc_type={exc_type}\n")
          PY
      - name: Working-tree RESULT PASS
        if: steps.classify_worktree.outputs.result == 'pass'
        run: "true"
      - name: Working-tree RESULT EXCEPTION
        if: steps.classify_worktree.outputs.result == 'exception'
        run: "true"
      - name: Working-tree STAGE INIT
        if: steps.classify_worktree.outputs.stage == 'init'
        run: "true"
      - name: Working-tree STAGE PREVIOUS STATE
        if: steps.classify_worktree.outputs.stage == 'previous-state'
        run: "true"
      - name: Working-tree STAGE WRITE PREVIOUS
        if: steps.classify_worktree.outputs.stage == 'write-previous'
        run: "true"
      - name: Working-tree STAGE COMMIT PREVIOUS
        if: steps.classify_worktree.outputs.stage == 'commit-previous'
        run: "true"
      - name: Working-tree STAGE CURRENT STATE
        if: steps.classify_worktree.outputs.stage == 'current-state'
        run: "true"
      - name: Working-tree STAGE WRITE CURRENT
        if: steps.classify_worktree.outputs.stage == 'write-current'
        run: "true"
      - name: Working-tree STAGE RESOLVER
        if: steps.classify_worktree.outputs.stage == 'resolver'
        run: "true"
      - name: Working-tree STAGE COMPARE
        if: steps.classify_worktree.outputs.stage == 'compare'
        run: "true"
      - name: Working-tree EXC KeyError
        if: steps.classify_worktree.outputs.exc_type == 'KeyError'
        run: "true"
      - name: Working-tree EXC TypeError
        if: steps.classify_worktree.outputs.exc_type == 'TypeError'
        run: "true"
      - name: Working-tree EXC ValueError
        if: steps.classify_worktree.outputs.exc_type == 'ValueError'
        run: "true"
      - name: Working-tree EXC AttributeError
        if: steps.classify_worktree.outputs.exc_type == 'AttributeError'
        run: "true"
      - name: Working-tree EXC CalledProcessError
        if: steps.classify_worktree.outputs.exc_type == 'CalledProcessError'
        run: "true"
      - name: Working-tree EXC TimeoutExpired
        if: steps.classify_worktree.outputs.exc_type == 'TimeoutExpired'
        run: "true"
      - name: Working-tree EXC OSError
        if: steps.classify_worktree.outputs.exc_type == 'OSError'
        run: "true"
      - name: Working-tree EXC RepresenterError
        if: steps.classify_worktree.outputs.exc_type == 'RepresenterError'
        run: "true"
      - name: Diagnose full release-state module
        run: python -m unittest tests.test_protocol_65_release_state -v
      - name: Run protocol regression tests
        run: python -m unittest discover -s tests -v
      - name: Build canonical skill packages once
        run: python source/build_skills.py --output /tmp/protocol-dist
      - name: Validate generated skill packages independently
        run: python source/validate_packages.py --dist /tmp/protocol-dist
      - name: Verify committed distribution parity
        run: python source/check_dist.py --expected /tmp/protocol-dist --committed dist
      - name: Check patch whitespace
        run: git diff --check

  orchestrator-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install orchestrator Core and its development dependencies
        run: >-
          python -m pip install ./orchestrator
          -r orchestrator/requirements-dev.txt
      - name: Verify the packaged Protocol snapshot matches canonical source
        run: python orchestrator/scripts/generate_protocol_snapshot.py --check
      - name: Run orchestrator Core acceptance suite
        run: python orchestrator/scripts/run_core_tests.py
