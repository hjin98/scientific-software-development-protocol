name: Protocol build check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -r source/requirements-validation.txt
      - name: Run protocol regression tests
        run: python -m unittest discover -s tests -v
      - name: Build canonical skill packages once
        run: python source/build_skills.py --output /tmp/protocol-dist
      - name: Validate generated skill packages independently
        run: python source/validate_packages.py --dist /tmp/protocol-dist
      - name: Verify committed distribution parity
        run: python source/check_dist.py --expected /tmp/protocol-dist --committed dist
      - name: Check patch whitespace
        run: git diff --check

  regression-diagnostic:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test:
          - test_package_reference_closure.py
          - test_protocol_511_tool_assistance.py
          - test_protocol_512_convergence.py
          - test_protocol_513_counterfactual_oracles.py
          - test_protocol_513_live_tool_qualification.py
          - test_protocol_513_oracle_family_closure.py
          - test_protocol_513_tool_routing_codeql_compression.py
          - test_protocol_515_language_profiles.py
          - test_protocol_516_lifecycle_closeout.py
          - test_protocol_516_long_horizon_quality.py
          - test_protocol_516_orchestration.py
          - test_protocol_59_review_rework.py
          - test_protocol_59_route_uri_safety.py
          - test_protocol_61_evidence_evolution.py
          - test_protocol_62_representation.py
          - test_protocol_contracts.py
          - test_protocol_effective_compression.py
          - test_protocol_engineering_stewardship.py
          - test_protocol_portability.py
          - test_protocol_proxy_proof_acceptance.py
          - test_protocol_tooling.py
          - test_build_index_contract.py
    name: diagnostic (${{ matrix.test }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -r source/requirements-validation.txt
      - name: Run ${{ matrix.test }}
        run: python "tests/${{ matrix.test }}"

  orchestrator-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install orchestrator Core and its development dependencies
        run: >-
          python -m pip install ./orchestrator
          -r orchestrator/requirements-dev.txt
      - name: Verify the packaged Protocol snapshot matches canonical source
        run: python orchestrator/scripts/generate_protocol_snapshot.py --check
      - name: Run orchestrator Core acceptance suite
        run: python orchestrator/scripts/run_core_tests.py