name: Protocol build check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -r source/requirements-validation.txt
      - name: Run protocol regression tests
        run: python -m unittest discover -s tests -v
      - name: Build canonical skill packages once
        run: python source/build_skills.py --output /tmp/protocol-dist
      - name: Validate generated skill packages independently
        run: python source/validate_packages.py --dist /tmp/protocol-dist
      - name: Verify committed distribution parity
        run: python source/check_dist.py --expected /tmp/protocol-dist --committed dist
      - name: Check patch whitespace
        run: git diff --check

  orchestrator-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install orchestrator Core and its development dependencies
        run: >-
          python -m pip install ./orchestrator
          -r orchestrator/requirements-dev.txt
      - name: Verify the packaged Protocol snapshot matches canonical source
        run: python orchestrator/scripts/generate_protocol_snapshot.py --check
      - name: Run orchestrator Core acceptance suite
        run: python orchestrator/scripts/run_core_tests.py

  stage-e-repair:
    if: github.event_name == 'pull_request' && github.head_ref == 'ssdp-6.4-axiomatic-definition-traceability'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ssdp-6.4-axiomatic-definition-traceability
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install repair dependencies
        run: python -m pip install -r source/requirements-validation.txt ./orchestrator -r orchestrator/requirements-dev.txt
      - name: Apply Stage-E repairs
        run: python .github/scripts/protocol64_review_repair.py
      - name: Regenerate descendants
        run: |
          python source/build_skills.py
          python orchestrator/scripts/generate_protocol_snapshot.py
      - name: Validate repaired assembled candidate
        run: |
          python -m unittest discover -s tests -v
          python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md
          python source/validate_packages.py --dist dist
          python source/build_skills.py --output /tmp/protocol-dist
          python source/check_dist.py --expected /tmp/protocol-dist --committed dist
          python orchestrator/scripts/generate_protocol_snapshot.py --check
          python orchestrator/scripts/run_core_tests.py
          git diff --check
      - name: Commit repair and restore ordinary workflow surface
        run: |
          git checkout HEAD^ -- .github/workflows/protocol-check.yml
          rm -f .github/workflows/protocol-64-review-repair.yml
          rm -f .github/workflows/protocol-64-review-repair-pr.yml
          rm -f .github/workflows/protocol-64-review-repair-exec.yml
          rm -f .github/workflows/protocol-check-repair-trigger.yml
          rm -f .github/workflows/protocol-check-repair-note.yml
          rm -f .github/workflows/protocol-check-patched-source.txt
          rm -f .github/repair.READY
          rm -f .github/scripts/protocol64_review_repair.py
          git config user.name "hjin98"
          git config user.email "86921078+hjin98@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Repair Protocol 6.4 Stage-E review blockers"
          git push origin HEAD:ssdp-6.4-axiomatic-definition-traceability
