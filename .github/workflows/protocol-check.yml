name: Protocol build check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -r source/requirements-validation.txt
      - name: Validate repository release state
        run: python source/release_state.py
      - name: Validate project engineering memory
        run: python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md
      - name: Classify resolver topology tests
        id: classify_resolvers
        shell: bash
        run: |
          python - <<'PY'
          import os
          import unittest
          from tests.test_protocol_65_release_state import Protocol65ReleaseStateTests

          names = [
              "test_previous_governed_states_use_head_for_working_tree_change",
              "test_previous_governed_states_use_linear_parent_boundary",
              "test_previous_governed_states_cross_evidence_only_descendants",
              "test_previous_governed_states_cover_date_reordered_merge_parents",
              "test_previous_governed_states_deduplicate_equivalent_merge_lineages",
              "test_previous_governed_states_handle_synthetic_pr_merge",
          ]
          suite = unittest.TestSuite(
              Protocol65ReleaseStateTests(name)
              for name in names
          )
          result = unittest.TestResult()
          suite.run(result)
          failing = "pass"
          if result.failures:
              failing = result.failures[0][0]._testMethodName
          elif result.errors:
              failing = result.errors[0][0]._testMethodName
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"first_failure={failing}\n")
          PY
      - name: Resolver topology tests PASS
        if: steps.classify_resolvers.outputs.first_failure == 'pass'
        run: "true"
      - name: Resolver failure WORKING TREE
        if: steps.classify_resolvers.outputs.first_failure == 'test_previous_governed_states_use_head_for_working_tree_change'
        run: "true"
      - name: Resolver failure LINEAR
        if: steps.classify_resolvers.outputs.first_failure == 'test_previous_governed_states_use_linear_parent_boundary'
        run: "true"
      - name: Resolver failure EVIDENCE DESCENDANT
        if: steps.classify_resolvers.outputs.first_failure == 'test_previous_governed_states_cross_evidence_only_descendants'
        run: "true"
      - name: Resolver failure DIVERGENT MERGE
        if: steps.classify_resolvers.outputs.first_failure == 'test_previous_governed_states_cover_date_reordered_merge_parents'
        run: "true"
      - name: Resolver failure EQUIVALENT MERGE
        if: steps.classify_resolvers.outputs.first_failure == 'test_previous_governed_states_deduplicate_equivalent_merge_lineages'
        run: "true"
      - name: Resolver failure SYNTHETIC PR
        if: steps.classify_resolvers.outputs.first_failure == 'test_previous_governed_states_handle_synthetic_pr_merge'
        run: "true"
      - name: Diagnose full release-state module
        run: python -m unittest tests.test_protocol_65_release_state -v
      - name: Run protocol regression tests
        run: python -m unittest discover -s tests -v
      - name: Build canonical skill packages once
        run: python source/build_skills.py --output /tmp/protocol-dist
      - name: Validate generated skill packages independently
        run: python source/validate_packages.py --dist /tmp/protocol-dist
      - name: Verify committed distribution parity
        run: python source/check_dist.py --expected /tmp/protocol-dist --committed dist
      - name: Check patch whitespace
        run: git diff --check

  orchestrator-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install orchestrator Core and its development dependencies
        run: >-
          python -m pip install ./orchestrator
          -r orchestrator/requirements-dev.txt
      - name: Verify the packaged Protocol snapshot matches canonical source
        run: python orchestrator/scripts/generate_protocol_snapshot.py --check
      - name: Run orchestrator Core acceptance suite
        run: python orchestrator/scripts/run_core_tests.py
