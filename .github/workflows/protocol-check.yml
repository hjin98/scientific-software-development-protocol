name: Protocol build check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -r source/requirements-validation.txt
      - name: Validate repository release state
        run: python source/release_state.py
      - name: Validate project engineering memory
        run: python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md
      - name: Diag discovery-path release-state alone
        continue-on-error: true
        run: cd tests && python -m unittest test_protocol_65_release_state -v
      - name: Diag discovery-path prefix through release-state
        continue-on-error: true
        run: >-
          cd tests && python -m unittest test_build_index_contract test_package_reference_closure test_protocol_511_tool_assistance test_protocol_512_convergence test_protocol_513_counterfactual_oracles test_protocol_513_live_tool_qualification test_protocol_513_oracle_family_closure test_protocol_513_tool_routing_codeql_compression test_protocol_515_language_profiles test_protocol_516_lifecycle_closeout test_protocol_516_long_horizon_quality test_protocol_516_orchestration test_protocol_59_review_rework test_protocol_59_route_uri_safety test_protocol_61_evidence_evolution test_protocol_62_closeout test_protocol_62_representation test_protocol_63_bootstrap test_protocol_63_closeout test_protocol_63_engineering_memory test_protocol_63_independent_review_repairs test_protocol_63_reopened_repairs test_protocol_64_axiomatic_traceability test_protocol_64_bootstrap_readiness test_protocol_65_current_state_ownership test_protocol_65_pem_canonical_git test_protocol_65_pem_parser_strictness test_protocol_65_pem_reconciliation test_protocol_65_pem_schema_parity test_protocol_65_release_state -v
      - name: Run protocol regression tests
        run: python -m unittest discover -s tests -v
      - name: Build canonical skill packages once
        run: python source/build_skills.py --output /tmp/protocol-dist
      - name: Validate generated skill packages independently
        run: python source/validate_packages.py --dist /tmp/protocol-dist
      - name: Verify committed distribution parity
        run: python source/check_dist.py --expected /tmp/protocol-dist --committed dist
      - name: Check patch whitespace
        run: git diff --check

  orchestrator-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install orchestrator Core and its development dependencies
        run: >-
          python -m pip install ./orchestrator
          -r orchestrator/requirements-dev.txt
      - name: Verify the packaged Protocol snapshot matches canonical source
        run: python orchestrator/scripts/generate_protocol_snapshot.py --check
      - name: Run orchestrator Core acceptance suite
        run: python orchestrator/scripts/run_core_tests.py
