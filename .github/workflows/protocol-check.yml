name: Protocol build check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -r source/requirements-validation.txt
      - name: Run protocol regression tests
        run: python -m unittest discover -s tests -v
      - name: Build canonical skill packages once
        run: python source/build_skills.py --output /tmp/protocol-dist
      - name: Validate generated skill packages independently
        run: python source/validate_packages.py --dist /tmp/protocol-dist
      - name: Refresh committed Protocol 5.16 distribution
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'plan/protocol-5.16-long-horizon-code-health'
        run: |
          rm -rf dist
          cp -a /tmp/protocol-dist dist
          if git diff --quiet -- dist; then
            echo "Committed distribution is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git commit -m "Regenerate Protocol 5.16 distribution"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
      - name: Verify committed distribution parity
        run: python source/check_dist.py --expected /tmp/protocol-dist --committed dist
      - name: Check patch whitespace
        run: git diff --check
