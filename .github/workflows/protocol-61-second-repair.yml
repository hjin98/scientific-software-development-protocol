name: Temporary Protocol 6.1 second repair implementation

on:
  push:
    branches:
      - ssdp-6.1-implementation

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.event.head_commit.message == 'Run Protocol 6.1 second repair implementation' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ssdp-6.1-implementation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure repository writer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Install validation dependencies
        run: python -m pip install -r source/requirements-validation.txt
      - name: Install Orchestrator Core and development dependencies
        run: python -m pip install ./orchestrator -r orchestrator/requirements-dev.txt
      - name: Execute bounded Protocol 6.1 second repair
        run: python .github/protocol-61-second-repair.py
