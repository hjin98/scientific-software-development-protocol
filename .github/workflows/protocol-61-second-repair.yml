name: Temporary Protocol 6.1 second repair implementation

on:
  push:
    branches:
      - ssdp-6.1-implementation

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.event.head_commit.message == 'Correct Protocol 6.1 repair transport quoting and rerun' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ssdp-6.1-implementation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure repository writer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Install validation dependencies
        run: python -m pip install -r source/requirements-validation.txt
      - name: Install Orchestrator Core and development dependencies
        run: python -m pip install ./orchestrator -r orchestrator/requirements-dev.txt
      - name: Execute corrected Protocol 6.1 second repair
        shell: bash
        run: |
          set +e
          python .github/protocol-61-second-repair-v5.py 2>&1 | tee /tmp/protocol-61-second-repair-v5.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            cp /tmp/protocol-61-second-repair-v5.log workplans/active/.protocol-61-second-repair-diagnostic-v5.txt
            git add workplans/active/.protocol-61-second-repair-diagnostic-v5.txt
            git commit -m 'Record Protocol 6.1 repair diagnostic v5'
            git push origin HEAD:ssdp-6.1-implementation
            exit "$status"
          fi
