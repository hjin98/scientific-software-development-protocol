name: Temporary Protocol 6.1 second repair implementation

on:
  push:
    branches:
      - ssdp-6.1-implementation

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'Reopen Protocol 6.1 second repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ssdp-6.1-implementation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure repository writer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Install validation dependencies
        run: python -m pip install -r source/requirements-validation.txt
      - name: Apply Stage A source, documentation, package-validation, and lifecycle repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          skill_background = '''## Background and terminology\n\nThe **Scientific Software Development Protocol (SSDP)** organizes authority into four semantic domains: **D1** scientific/mathematical formulation, **D2** algorithm/numerical method, **D3** software architecture, and **D4** specification/implementation. A **concretization** is a lower-level expression of governing semantic authority. An **evidence realization** is one concrete execution or instantiation of an evidence specification; it is not a D1-D4 concretization.\n\n'''

          skill_paths = [
              'source/roles/scientific-formulation/SKILL.md',
              'source/roles/numerical-algorithm-design/SKILL.md',
              'source/roles/software-design/SKILL.md',
              'source/roles/software-implementation/SKILL.md',
              'source/specialists/software-documentation/SKILL.md',
              'source/specialists/software-maintenance-audit/SKILL.md',
              'source/specialists/repository-hygiene/SKILL.md',
          ]
          for path in skill_paths:
              text = read(path)
              first_h1 = re.search(r'(?m)^# .+\n\n', text)
              if first_h1 is None:
                  raise SystemExit(f'missing H1 in {path}')
              if '## Background and terminology\n' not in text[:first_h1.end() + 1200]:
                  text = text[:first_h1.end()] + skill_background + text[first_h1.end():]
              if '(references/documentation-and-evidence.md)' in text and '(references/scientific-technical-writing.md)' not in text:
                  lines = text.splitlines()
                  for i, line in enumerate(lines):
                      if '(references/documentation-and-evidence.md)' in line:
                          lines.insert(i + 1, '- Human-facing scientific/technical documentation -> [Scientific and technical writing](references/scientific-technical-writing.md).')
                          break
                  else:
                      raise SystemExit(f'could not place writing route in {path}')
                  text = '\n'.join(lines) + ('\n' if text.endswith('\n') else '')
              write(path, text)

          root = read('README.md')
          anchor = 'Current protocol version: **6.1**.\n\n'
          bg = '''## Background and terminology\n\nThe **Scientific Software Development Protocol (SSDP)** is a document-controlled scientific-software development protocol. It separates four semantic authority domains: **D1** scientific/mathematical formulation, **D2** algorithm/numerical method, **D3** software architecture, and **D4** specification/implementation. An **abstraction** states governing semantics; a **concretization** is a lower-level expression that must preserve them.\n\n'''
          if '## Background and terminology\n' not in root[:1000]:
              if anchor not in root:
                  raise SystemExit('root README background anchor missing')
              root = root.replace(anchor, anchor + bg, 1)
          root = root.replace('multi-parent constraints form a layered DAG.', 'multi-parent constraints form a layered directed acyclic graph (DAG).')
          write('README.md', root)

          src = read('source/README.md')
          bg = '''## Background and terminology\n\nThe **Scientific Software Development Protocol (SSDP)** uses four semantic authority domains: **D1** scientific/mathematical formulation, **D2** algorithm/numerical method, **D3** software architecture, and **D4** specification/implementation. An **abstraction** states governing semantic invariants; a **concretization** is a lower-level expression constrained by those invariants. An **evidence realization** is a concrete execution of an evidence specification.\n\n'''
          marker = '# Scientific Software Development Protocol 6.1\n\n'
          if '## Background and terminology\n' not in src[:1000]:
              if marker not in src:
                  raise SystemExit('source README background anchor missing')
              src = src.replace(marker, marker + bg, 1)
          src = src.replace('multi-parent constraints form a layered DAG.', 'multi-parent constraints form a layered directed acyclic graph (DAG).')
          write('source/README.md', src)

          port = read('PORTABILITY.md')
          bg = '''## Background and terminology\n\nThe **Scientific Software Development Protocol (SSDP)** is distributed as portable **Agent Skills**: self-contained skill directories whose `SKILL.md` entrypoint routes the references needed for a role or specialist. SSDP uses **D1** scientific/mathematical, **D2** algorithm/numerical, **D3** software-architecture, and **D4** specification/implementation authority. An **orchestration profile** is a version-bound machine-readable representation of the human-facing workflow prompts used by the optional Orchestrator Core.\n\n'''
          marker = '# Agent portability and routing qualification\n\n'
          if '## Background and terminology\n' not in port[:1200]:
              if marker not in port:
                  raise SystemExit('PORTABILITY background anchor missing')
              port = port.replace(marker, marker + bg, 1)
          port = port.replace('| 6.1.0 | `0c90fda19bf6ed9cb0c4511beb3da80ace6584ed` |', '| 6.1.0 | pending second-reopen qualification, Review, and replacement recovery |')
          old = 'The earlier Protocol 6.1 closeout snapshot `dec5ff2767e14fd1cda46e073757aa27f40e270c` remains immutable historical evidence but is superseded as the final rollback baseline. The repaired semantic candidate `5f911fecb0de2847f63c0b4859e1dd8c63d3d8ef` passed complete repository/package/orchestrator acceptance, fresh 94/94 behavioral qualification, and fresh independent Review before lifecycle closeout. Replacement recovery commit `0c90fda19bf6ed9cb0c4511beb3da80ace6584ed` contains the qualified Protocol 6.1 source/profile/generated artifacts, fresh evidence/Review records, corrected semantic-history state, and the archived repair handoff without Protocol 7 implementation machinery. Later metadata-only pinning records that identity without changing qualified Protocol semantics or executable behavior.'
          new = 'The earlier Protocol 6.1 closeout snapshots `dec5ff2767e14fd1cda46e073757aa27f40e270c` and `0c90fda19bf6ed9cb0c4511beb3da80ace6584ed` remain immutable historical evidence but are superseded for final release/recovery authority by the active second-reopen repair. The prior semantic candidate `5f911fecb0de2847f63c0b4859e1dd8c63d3d8ef` and its 94/94 qualification remain historical evidence for their evaluated surfaces; package-reference closure, version-correct public fallback, and current human-facing documentation conformance require fresh repair and requalification before Protocol 7 may use a Protocol 6.1 recovery prerequisite.'
          if old not in port:
              raise SystemExit('PORTABILITY recovery paragraph anchor missing')
          port = port.replace(old, new, 1)
          port = port.replace('The fresh current result is `qualification/ssdp6/RESULTS-GPT-5.6-SOL-2026-09-09-PROTOCOL-6.1-REOPENED-94.md`: 94/94 PASS with no Serious Challenge, explicitly bound to semantic candidate `5f911fecb0de2847f63c0b4859e1dd8c63d3d8ef`.', 'The most recent pre-second-reopen result is `qualification/ssdp6/RESULTS-GPT-5.6-SOL-2026-09-09-PROTOCOL-6.1-REOPENED-94.md`: 94/94 PASS for its historical candidate. It is not current closeout evidence for the newly reopened package/public-fallback/documentation surfaces.')
          write('PORTABILITY.md', port)

          vp = Path('source/validate_packages.py')
          text = vp.read_text(encoding='utf-8')
          if 'import posixpath\n' not in text:
              text = text.replace('import json\nimport re\n', 'import json\nimport posixpath\nimport re\n', 1)
          function = r'''

def validate_packaged_markdown_links(files: dict[str, bytes]) -> list[str]:
    """Require every local Markdown-to-Markdown route in a bundle to resolve in-bundle."""
    errors: list[str] = []
    for rel, data in sorted(files.items()):
        if not rel.endswith(".md"):
            continue
        try:
            text = data.decode("utf-8")
        except UnicodeDecodeError as exc:
            errors.append(f"{rel}: not UTF-8: {exc}")
            continue
        for raw_target in MARKDOWN_LINK_RE.findall(text):
            target = raw_target.strip()
            if not target or target.startswith("#"):
                continue
            decoded = urllib.parse.unquote(target)
            if URI_SCHEME_RE.match(decoded) or decoded.startswith("//"):
                continue
            path_part = decoded.split("#", 1)[0].split("?", 1)[0]
            if not path_part or not path_part.lower().endswith(".md"):
                continue
            if decoded != target:
                errors.append(f"{rel}: encoded local Markdown route is not allowed: {target}")
                continue
            if path_part.startswith("/") or WINDOWS_ABSOLUTE_RE.match(path_part):
                errors.append(f"{rel}: unsafe local Markdown route: {target}")
                continue
            normalized = posixpath.normpath(posixpath.join(posixpath.dirname(rel), path_part))
            if normalized == ".." or normalized.startswith("../"):
                errors.append(f"{rel}: local Markdown route escapes bundle: {target}")
                continue
            if normalized not in files:
                errors.append(f"{rel}: local Markdown route is not packaged: {target} -> {normalized}")
    return errors
'''
          if 'def validate_packaged_markdown_links(' not in text:
              marker = '\ndef validate_agent_yaml(text: str) -> list[str]:\n'
              if marker not in text:
                  raise SystemExit('validator insertion anchor missing')
              text = text.replace(marker, function + marker, 1)
          call = '    errors.extend(validate_resource_routes(body, files))\n'
          if 'errors.extend(validate_packaged_markdown_links(files))' not in text:
              if call not in text:
                  raise SystemExit('validator call anchor missing')
              text = text.replace(call, call + '    errors.extend(validate_packaged_markdown_links(files))\n', 1)
          vp.write_text(text, encoding='utf-8')

          Path('tests/test_package_reference_closure.py').write_text(r'''from __future__ import annotations

import sys
import tempfile
import unittest
from pathlib import Path

ROOT = Path(__file__).resolve().parents[1]
SOURCE = ROOT / "source"
sys.path.insert(0, str(SOURCE))
import build_skills  # noqa: E402
import validate_packages  # noqa: E402


class PackageReferenceClosureTests(unittest.TestCase):
    def test_every_built_bundle_has_closed_local_markdown_routes(self) -> None:
        with tempfile.TemporaryDirectory() as td:
            out = Path(td) / "dist"
            build_skills.build(out)
            for skill_name, _, _ in build_skills.all_specs():
                files = validate_packages.directory_files(out / "skills" / skill_name)
                self.assertEqual([], validate_packages.validate_packaged_markdown_links(files), skill_name)

    def test_nested_dangling_markdown_route_is_rejected(self) -> None:
        files = {
            "SKILL.md": b"# Example\n\n[packaged](references/a.md)\n",
            "references/a.md": b"# A\n\n[missing](scientific-technical-writing.md)\n",
        }
        errors = validate_packages.validate_packaged_markdown_links(files)
        self.assertTrue(any("local Markdown route is not packaged" in error for error in errors), errors)

    def test_documentation_route_packages_writing_owner_explicitly(self) -> None:
        for skill_name, spec, _ in build_skills.all_specs():
            refs = set(spec["references"])
            if "documentation-and-evidence.md" in refs:
                self.assertIn("scientific-technical-writing.md", refs, skill_name)


if __name__ == "__main__":
    unittest.main()
''', encoding='utf-8')

          history = read('history/SEMANTIC_EVOLUTION.md')
          if '## Protocol 6.1 second reopened portability/documentation/recovery repair' not in history:
              entry = '''## Protocol 6.1 second reopened portability/documentation/recovery repair\n\nA subsequent Protocol-6.1-self-review reopened release closure again after finding three bounded implementation/acceptance defects: packaged references could contain unresolved nested Markdown routes that the validator did not inspect; current public fallback named the repository but could land on the incompatible Protocol 6.0 default branch; and the accepted human-facing background standard was not consistently applied to current Protocol-owned entrypoints/evidence reports.\n\n- **Authority disposition:** no D1/D2/D3 semantic doctrine is changed and no Serious Challenge is active. Repair is bounded to D4 packaging/validation, documentation concretization, public-source version resolution, and lifecycle/recovery evidence.\n- **Prior closeout disposition:** semantic candidate `5f911fecb0de2847f63c0b4859e1dd8c63d3d8ef` and recovery `0c90fda19bf6ed9cb0c4511beb3da80ace6584ed` remain immutable historical evidence but are superseded for final release/recovery authority.\n- **Current repair authority:** `workplans/active/SSDP-6.1-SECOND-REOPENED-PORTABILITY-DOCUMENTATION-AND-RECOVERY-REPAIR.md`.\n- **Public-source bootstrap:** pending Stage-A repaired immutable commit.\n- **Lifecycle:** ACTIVE / NO-PASS until fresh package/orchestrator acceptance, 95-scenario qualification, independent Review, and replacement recovery closeout.\n\n'''
