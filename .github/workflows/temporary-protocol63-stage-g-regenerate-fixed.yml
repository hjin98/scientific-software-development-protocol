name: Temporary Protocol 6.3 Stage G regeneration fixed

on:
  push:
    branches: [ssdp-6.3-engineering-memory]

permissions:
  contents: write

jobs:
  regenerate:
    if: github.event.head_commit.message == 'Retry Protocol 6.3 Stage G regeneration with runtime dependencies'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ssdp-6.3-engineering-memory
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install protocol and orchestrator validation dependencies
        run: |
          python -m pip install -r source/requirements-validation.txt
          python -m pip install ./orchestrator -r orchestrator/requirements-dev.txt
      - name: Regenerate portable packages
        run: python source/build_skills.py --output dist
      - name: Regenerate current orchestrator snapshot
        run: python orchestrator/scripts/generate_protocol_snapshot.py
      - name: Build independent expected distribution
        run: |
          rm -rf /tmp/protocol-dist
          python source/build_skills.py --output /tmp/protocol-dist
      - name: Validate exact recovery-mapped assembled state
        run: |
          set -euxo pipefail
          python -m unittest discover -s tests -v
          python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md
          python source/validate_packages.py --dist /tmp/protocol-dist
          python source/check_dist.py --expected /tmp/protocol-dist --committed dist
          python orchestrator/scripts/generate_protocol_snapshot.py --check
          python orchestrator/scripts/run_core_tests.py
          git diff --check
      - name: Commit generated reconciliation and remove temporary runners
        run: |
          set -euxo pipefail
          git config user.name 'Protocol 6.3 lifecycle automation'
          git config user.email 'protocol63-lifecycle@users.noreply.github.com'
          git rm .github/workflows/temporary-protocol63-stage-g-recovery.yml
          git rm .github/workflows/temporary-protocol63-stage-g-diagnostic.yml
          git rm .github/workflows/temporary-protocol63-stage-g-regenerate-fixed.yml
          git add -A
          git diff --cached --check
          git commit -m 'Regenerate Protocol 6.3 recovery-mapped distributions'
          git push origin HEAD:ssdp-6.3-engineering-memory
