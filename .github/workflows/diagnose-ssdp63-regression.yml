name: Temporary Protocol 6.3 regression diagnostic

on:
  push:
    branches:
      - ssdp-6.3-engineering-memory
    paths:
      - .github/workflows/diagnose-ssdp63-regression.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ssdp-6.3-engineering-memory
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture exact repository regression failure
        shell: bash
        run: |
          python -m pip install -r source/requirements-validation.txt
          set +e
          python -m unittest discover -s tests -v > /tmp/protocol-tests.log 2>&1
          status=$?
          set -e
          mkdir -p qualification/ssdp6
          {
            echo '---'
            echo 'kind: protocol-6.3-regression-diagnostic'
            echo 'candidate: 610a901945b7ee66d9d1d3d2eb05c32acd1c3370'
            echo "exit_status: $status"
            echo 'authority: non-normative-observation-evidence'
            echo '---'
            echo
            echo '# Protocol 6.3 initial ordinary-regression diagnostic'
            echo
            echo 'Captured from the same `python -m unittest discover -s tests -v` command used by ordinary repository CI. This is failure evidence, not acceptance.'
            echo
            echo '```text'
            tail -n 300 /tmp/protocol-tests.log
            echo '```'
          } > qualification/ssdp6/DIAGNOSTIC-PROTOCOL-6.3-ORDINARY-REGRESSION-INITIAL.md
      - name: Commit diagnostic evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qualification/ssdp6/DIAGNOSTIC-PROTOCOL-6.3-ORDINARY-REGRESSION-INITIAL.md
          git commit -m 'Capture Protocol 6.3 ordinary-regression diagnostic'
          git push origin HEAD:ssdp-6.3-engineering-memory
