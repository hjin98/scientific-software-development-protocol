name: Temporary Protocol 6.3 R2 review recorder

on:
  push:
    branches: [ssdp-6.3-engineering-memory]

permissions:
  contents: write

jobs:
  record-r2:
    if: github.event.head_commit.message == 'Add one-use Protocol 6.3 R2 review recorder'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ssdp-6.3-engineering-memory
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install -r source/requirements-validation.txt
      - name: Record R2 review state
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path

          SEM='190c8b4d352c203ef74c94d57c4f18d30eb7186d'
          BNEW='86c13cab6bdd1991dffa94e277db8eacf87e2e11'
          BPUB='a8dac814cc2813b3bb336e5b6abde5fbcf44949e'
          BASE='b59adc77efe6951912cfd705cc43830c58ca27d0'
          HEAD='ff6f9455127633dd9cf3699ce4ad4f38171aa77d'

          def replace_once(path, old, new):
              p=Path(path); t=p.read_text()
              if t.count(old) != 1:
                  raise SystemExit(f'{path}: expected one anchor, got {t.count(old)}: {old[:100]!r}')
              p.write_text(t.replace(old,new,1))

          review=Path('qualification/ssdp6/FINAL-REVIEW-GPT-5.6-SOL-2026-09-12-PROTOCOL-6.3.md')
          review.write_text(f'''---
kind: ssdp63-independent-protocol-review
protocol_version: 6.3.0
reviewer: GPT-5.6 Sol
date: 2026-09-12
authority: independent-review-evidence
review_round: R2
status: pass
accepted_baseline_protocol: 6.2.0
accepted_baseline_recovery: {BASE}
accepted_baseline_semantic_candidate: ebbc4591bdfed039512026b8acb3a6749475c1c5
accepted_baseline_public_bootstrap: 5a062ebc472755607b9dc66d33a5ebbc4b7429aa
semantic_candidate: {SEM}
public_source_bootstrap: {BNEW}
public_source_mapping_commit: {BPUB}
assembled_evidence_head_reviewed: {HEAD}
blockers: 0
serious_challenges: 0
stage_g_performed: false
recovery_mapping_published: false
---

# Protocol 6.3 Independent D3 / Protocol Review — R2

## Disposition

**INDEPENDENT REVIEW R2: PASS.**

No genuine blocking defect and no Serious Challenge remains in the assembled Protocol 6.3 state reviewed at `{HEAD}`. The semantic subject remains immutable candidate `{SEM}` against accepted Protocol 6.2 recovery `{BASE}`. The corrected public-source lifecycle is separately represented by qualified self-reference-safe bootstrap `{BNEW}` and its later publication descendant `{BPUB}`.

This R2 supersedes the earlier Review-PASS attempt because promotion subsequently falsified that attempt's bootstrap identity. The earlier record remains historical evidence; it is not acceptance authority for Stage G.

## Independent reconstruction

The review reconstructed the candidate from accepted 6.2 doctrine and the active 6.3 workplan rather than inheriting implementation conclusions. It rechecked the repaired D8/D9 counterfactuals, T01-T39 preservation, T40-T120 bounded extension, static activation evidence, frozen 5.16/6.0/6.1/6.2 resources, generated/package/profile integrity, exact-ref public bootstrap realization, and the four inherited Challenge dimensions.

### D9 semantic-identity repair — PASS

The canonical PEM validator rejects same-ID changes to kind, owner class, mechanism family, normalized governing claim, applicability dimensions, applicability broadening, and change of regime. Only mechanically bounded editorial normalization or true applicability narrowing can remain under the same ID, and those continuations require the previous semantic signature, explicit reason, and durable `HEALTHY` reconciliation evidence through the ordinary material-route/binding-health path.

### Overlay/self-ratification and evidence-health repairs — PASS

The candidate overlay is bound to the externally selected accepted PEM publication rather than conflated with project-state identity, including the required `C == M` self-ratification rejection. Stable-locator health, mechanism-specific causal warrant, bounded counterevidence search for positive guidance, unresolved-notice ordering, and temperature-override evidence all retain discriminating executable oracles.

### Bootstrap lifecycle — PASS

F5 incorrectly treated semantic candidate `{SEM}` as a replacement bootstrap even though that immutable candidate still embedded historical D4R3 fallback `dc22f09fd38dbbfeaeb0160152da9b284654f66e`. Promotion review exposed the defect. Snapshot `{BNEW}` was then constructed self-reference-safely with 6.3 fallback deliberately unavailable, qualified before publication, and named only by later descendant `{BPUB}`. Exact-ref remote realization and full assembled acceptance passed after publication. Historical invalidated bootstrap identities were retained instead of compacted away.

## Challenge passes

- **Loss:** PASS — accepted 6.2 obligations remain represented and the 6.3 extension does not erase lower-salience mandatory doctrine.
- **Scope/materiality laundering:** PASS — coverage, HAS basis, overlay identity, semantic-envelope checks, and evidence-health rules prevent missing or claimant-authored scope from becoming silent permission.
- **Priority inversion:** PASS — unresolved/high-impact state and mandatory closure cannot be displaced by optional positive guidance or temperature.
- **False compaction:** PASS — derived summaries remain views over recoverable canonical family/notice state; historical lifecycle identities required for interpretation remain preserved.

## Architecture disposition

PEM remains project-local, evidence-backed, conditionally activated decision support rather than D5 or a competing authority plane. No new registry, daemon, shadow database, acceptance wrapper, or duplicate owner was introduced. Repairs were made at the existing validator, publication, evidence, and routing owners.

## Lifecycle boundary

R2 closes the independent Review gate only. Protocol 6.2 remains accepted-current until Stage G independently publishes an immutable 6.3 recovery mapping from a later descendant, regenerates mapping-bearing artifacts, passes recovery/bootstrap-distinction/package/profile/Core checks, reconciles Protocol 7/history/current-authority surfaces, and closes the workplan. This review record does not self-name a recovery SHA and does not authorize `main` cutover by itself.

**R2 verdict: PASS — blockers 0; Serious Challenges 0.**
''')

          replace_once('qualification/ssdp6/IMPLEMENTATION-STATE-PROTOCOL-6.3.md',
              'status: replacement-bootstrap-repaired-independent-review-r2-pending',
              'status: independent-review-r2-pass-stage-g-authorized')
          replace_once('qualification/ssdp6/IMPLEMENTATION-STATE-PROTOCOL-6.3.md',
              'independent_review: r2_pending_after_bootstrap_repair\nprotocol_63_recovery: unavailable_pending_r2_review',
              'independent_review: r2_pass\nprotocol_63_recovery: unavailable_pending_stage_g')
          p=Path('qualification/ssdp6/IMPLEMENTATION-STATE-PROTOCOL-6.3.md'); t=p.read_text()
          start=t.index('## Remaining gate')
          t=t[:start]+'''## Remaining gate\n\nIndependent assembled-candidate Review R2 passed with zero blockers and zero Serious Challenges. Stage G is now authorized but not yet performed. Protocol 6.2 remains accepted-current; Protocol 6.3 recovery is unavailable until a later descendant publishes the immutable R2 Review commit as recovery and all mapping-bearing regeneration, recovery/parity/package/profile/Core, semantic-history/Protocol-7, and lifecycle-closeout gates pass.\n'''
          p.write_text(t)

          replace_once('qualification/ssdp6/SSDP-6.3-PRESERVATION-CENSUS.md',
              'status: bootstrap-repaired-evidence-reconciled-independent-review-r2-pending',
              'status: independent-review-r2-pass-stage-g-authorized')
          replace_once('qualification/ssdp6/SSDP-6.3-PRESERVATION-CENSUS.md',
              'independent Review R2:                       PENDING\nProtocol 6.3 recovery:                       UNAVAILABLE',
              'independent Review R2:                       PASS (recorded in final review artifact)\nProtocol 6.3 recovery:                       UNAVAILABLE PENDING STAGE G')

          replace_once('qualification/ssdp6/INDEPENDENT-REVIEW-HANDOFF-PROTOCOL-6.3.md',
              'independent_review: required_fresh_r2_context\nprotocol_63_recovery: unavailable_pending_r2_review\naccepted_current_protocol: 6.2.0\nstage_g: blocked',
              'independent_review: r2_pass\nprotocol_63_recovery: unavailable_pending_stage_g\naccepted_current_protocol: 6.2.0\nstage_g: authorized')
          hp=Path('qualification/ssdp6/INDEPENDENT-REVIEW-HANDOFF-PROTOCOL-6.3.md')
          ht=hp.read_text()+'''\n## R2 disposition\n\nFresh independent assembled-candidate Review R2 completed after the bootstrap-publication repair and returned PASS with zero blockers and zero Serious Challenges. This handoff is now historical input/evidence for Stage G; it is not itself the recovery mapping. Stage G must preserve the semantic-candidate/public-bootstrap/recovery distinction and may select only the immutable R2 Review commit as recovery target.\n'''
          hp.write_text(ht)

          replace_once('workplans/active/PROTOCOL-6.3-EVIDENCE-BACKED-PROJECT-ENGINEERING-MEMORY-WORKPLAN.md',
              'implementation_review_state: r2-pending-after-bootstrap-publication-repair',
              'implementation_review_state: r2-pass-stage-g-authorized')
          replace_once('workplans/active/PROTOCOL-6.3-EVIDENCE-BACKED-PROJECT-ENGINEERING-MEMORY-WORKPLAN.md',
              'stage_g_recovery_gate: blocked-pending-fresh-r2-review',
              'stage_g_recovery_gate: authorized-after-r2-pass')
          wp=Path('workplans/active/PROTOCOL-6.3-EVIDENCE-BACKED-PROJECT-ENGINEERING-MEMORY-WORKPLAN.md'); wt=wp.read_text()
          old='Protocol 6.3 remains **NO-PASS** and proposed. Accepted-current authority remains Protocol 6.2 recovery `b59adc77efe6951912cfd705cc43830c58ca27d0`. Stage G, recovery mapping, workplan archive, and `main` cutover remain blocked.'
          new='Protocol 6.3 has **R2 Review PASS** with zero blockers and zero Serious Challenges. Accepted-current authority remains Protocol 6.2 recovery `b59adc77efe6951912cfd705cc43830c58ca27d0` until Stage G completes. Stage G is authorized; recovery mapping, accepted-current promotion, workplan archive, and any `main` cutover have not yet occurred.'
          if old not in wt: raise SystemExit('workplan disposition anchor missing')
          wt=wt.replace(old,new,1)
          old2=f'D9 implementation and F5 qualification are complete for immutable candidate `{SEM}` with publication evidence at `092c784383868081e9dee2081e3895f3d1263630`. Perform a fresh independent assembled-candidate Review of that exact candidate against accepted Protocol 6.2 and this active workplan. Stage G remains blocked until Review PASS.'
          new2=f'D9 implementation, F5 qualification, repaired bootstrap publication, evidence reconciliation, and fresh independent assembled-candidate Review R2 are complete for immutable semantic candidate `{SEM}`. R2 returned PASS with zero blockers and zero Serious Challenges. The next action is Stage G: freeze the immutable R2 Review commit as Protocol 6.3 recovery target, publish `6.3.0 -> <recovery SHA>` only from a later descendant, regenerate mapping-bearing artifacts, rerun recovery/bootstrap-distinction/package/profile/Core acceptance, reconcile semantic history/Protocol 7/current-authority surfaces, and close/archive this workplan only if every gate passes.'
          if old2 not in wt: raise SystemExit('workplan next-action anchor missing')
          wp.write_text(wt.replace(old2,new2,1))
          PY
      - name: Validate exact R2 recording tree
        run: |
          python -m unittest discover -s tests -v
          python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md
          python source/build_skills.py --output /tmp/protocol-dist
          python source/validate_packages.py --dist /tmp/protocol-dist
          python source/check_dist.py --expected /tmp/protocol-dist --committed dist
          python -m pip install ./orchestrator -r orchestrator/requirements-dev.txt
          python orchestrator/scripts/generate_protocol_snapshot.py --check
          python orchestrator/scripts/run_core_tests.py
          git diff --check
      - name: Commit immutable R2 review record
        run: |
          set -euxo pipefail
          git config user.name 'Protocol 6.3 lifecycle automation'
          git config user.email 'protocol63-lifecycle@users.noreply.github.com'
          git rm .github/workflows/temporary-protocol63-r2-record.yml
          git add -A
          git diff --cached --check
          git commit -m 'Record Protocol 6.3 R2 independent review PASS'
          git push origin HEAD:ssdp-6.3-engineering-memory
