name: Temporary Protocol 6.3 bootstrap publication diagnostic

on:
  push:
    branches:
      - ssdp-6.3-engineering-memory
    paths:
      - .github/workflows/diagnose-ssdp63-bootstrap-publication.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ssdp-6.3-engineering-memory
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconstruct publication candidate and capture regression
        run: |
          python .github/scripts/publish_ssdp63_bootstrap.py
          python -m pip install -r source/requirements-validation.txt
          python source/build_skills.py --output dist
          set +e
          SSDP_VALIDATE_PUBLIC_FALLBACK=1 python -m unittest discover -s tests -v > /tmp/ssdp63-bootstrap-regression.txt 2>&1
          code=$?
          set -e
          git reset --hard HEAD
          {
            echo '---'
            echo 'kind: protocol-6.3-bootstrap-publication-diagnostic'
            echo 'bootstrap: 1484c1d3caa49d87cc15bc52a5e775399c1dae1b'
            echo "exit_status: $code"
            echo 'authority: non-normative-observation-evidence'
            echo '---'
            echo
            echo '# Protocol 6.3 bootstrap publication regression'
            echo
            echo 'Reconstructed the exact mapping edits and regenerated dist before running repository unittest discovery. This is diagnostic evidence, not acceptance.'
            echo
            echo '```text'
            tail -n 400 /tmp/ssdp63-bootstrap-regression.txt
            echo '```'
          } > qualification/ssdp6/DIAGNOSTIC-PROTOCOL-6.3-BOOTSTRAP-PUBLICATION.md
      - name: Commit diagnostic only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qualification/ssdp6/DIAGNOSTIC-PROTOCOL-6.3-BOOTSTRAP-PUBLICATION.md
          git commit -m 'Capture Protocol 6.3 bootstrap publication diagnostic'
          git push origin HEAD:ssdp-6.3-engineering-memory
