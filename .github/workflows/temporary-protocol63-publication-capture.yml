name: Temporary Protocol 6.3 publication capture

on:
  push:
    branches: [ssdp-6.3-engineering-memory]

permissions:
  contents: write

jobs:
  capture:
    if: github.event.head_commit.message == 'Capture Protocol 6.3 bootstrap publication failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ssdp-6.3-engineering-memory
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r source/requirements-validation.txt
      - name: Apply publication view and capture exact-ref oracle
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'Protocol 6.3 lifecycle diagnostics'
          git config user.email 'protocol63-diagnostics@users.noreply.github.com'
          BOOTSTRAP=86c13cab6bdd1991dffa94e277db8eacf87e2e11
          export BOOTSTRAP
          python - <<'PY'
          import os,re
          from pathlib import Path
          B=os.environ['BOOTSTRAP']; SENT='UNAVAILABLE_PENDING_REPLACEMENT_BOOTSTRAP'; ACCEPTED='5a062ebc472755607b9dc66d33a5ebbc4b7429aa'
          def rw(path, transforms):
              p=Path(path); t=p.read_text(encoding='utf-8')
              for pattern,repl,flags in transforms:
                  t,n=re.subn(pattern,repl,t,count=1,flags=flags)
                  if n != 1: raise SystemExit(f'{path}: {pattern!r} -> {n}')
              p.write_text(t,encoding='utf-8')
          rw('source/shared/references/protocol-versioning-and-compatibility.md',[(rf'^6\.3\.0 public-source bootstrap -> {SENT}$',f'6.3.0 public-source bootstrap -> {B}',re.M),(r'the current 6\.3 public-source fallback is unavailable while a new self-reference-safe source snapshot is qualified and later published\.',f'Replacement self-reference-safe source snapshot `{B}` passed source regression, package/profile integrity, Orchestrator Core, and bootstrap readiness before this later descendant published its exact SHA as the sole current 6.3 public-source fallback.',0)])
          rw('PORTABILITY.md',[(rf'^6\.3\.0 public bootstrap -> {SENT}$',f'6.3.0 public bootstrap -> {B}',re.M),(r'No current 6\.3 public fallback is authorized while a new self-reference-safe source snapshot is qualified; recovery remains unavailable\.',f'Replacement self-reference-safe source snapshot `{B}` passed bootstrap readiness before this later descendant published its exact SHA as the sole authorized version-bound 6.3 public fallback; recovery remains unavailable.',0)])
          rw('source/shared/references/development-workflow-prompts.md',[(rf'^CURRENT_PUBLIC_REF = {SENT}$',f'CURRENT_PUBLIC_REF = {B}',re.M),(r'^\*\*Protocol 6\.3 bootstrap state:\*\*.*$',f'**Protocol 6.3 bootstrap state:** earlier 6.3 bootstrap snapshots remain historical evidence only. Replacement self-reference-safe source snapshot `{B}` passed bootstrap readiness before this later descendant published its exact SHA, so it is the sole current Protocol 6.3 public-source fallback. Recovery remains unavailable pending Stage G. Never use repository default/latest, a guessed semantic-version ref, the current candidate branch, an invalidated bootstrap, or the accepted 6.2 bootstrap as a substitute. Version-bound 6.2 work continues to use exactly `{ACCEPTED}`; historical 5.16/6.0/6.1 resolution remains version-bound to its own immutable mapping.',re.M)])
          rw('README.md',[(r'^\*\*Protocol 6\.3 bootstrap attempts .*$',f'**Earlier Protocol 6.3 bootstrap attempts, including D4R3 snapshot `dc22f09fd38dbbfeaeb0160152da9b284654f66e`, are historical only; current public-source bootstrap is `{B}`; Protocol 6.3 recovery remains unavailable pending Stage G.** Replacement self-reference-safe source snapshot `{B}` was qualified before this later descendant published the exact mapping.',re.M)])
          p=Path('tests/test_protocol_63_bootstrap.py'); t=p.read_text(encoding='utf-8')
          t,n=re.subn(rf'^BOOTSTRAP = "{SENT}"$',f'BOOTSTRAP = "{B}"',t,count=1,flags=re.M)
          if n != 1: raise SystemExit('published bootstrap constant')
          t=t.replace("self.assertIn(f'The immutable D4R3-repaired self-reference-safe source snapshot `{BOOTSTRAP}`', prompts)","self.assertIn(f'Replacement self-reference-safe source snapshot `{BOOTSTRAP}`', prompts)",1)
          t=t.replace("self.assertIn(f'The immutable D4R3-repaired snapshot `{BOOTSTRAP}`', versioning)","self.assertIn(f'Replacement self-reference-safe source snapshot `{BOOTSTRAP}`', versioning)",1)
          p.write_text(t,encoding='utf-8')
          PY
          set +e
          CI=1 python -m unittest -v tests.test_protocol_63_bootstrap > /tmp/protocol63-publication.log 2>&1
          rc=$?
          echo publication_rc=$rc >> /tmp/protocol63-publication.log
          set -e
          cp /tmp/protocol63-publication.log qualification/ssdp6/TEMP-PROTOCOL63-PUBLICATION.log
          git rm .github/workflows/temporary-protocol63-publication-capture.yml
          git add qualification/ssdp6/TEMP-PROTOCOL63-PUBLICATION.log
          git commit -m 'Capture Protocol 6.3 bootstrap publication output'
          git push origin HEAD:ssdp-6.3-engineering-memory
