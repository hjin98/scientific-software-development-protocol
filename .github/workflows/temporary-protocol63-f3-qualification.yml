name: Temporary Protocol 6.3 F3 qualification

on:
  push:
    branches: [ssdp-6.3-engineering-memory]

permissions:
  contents: write

jobs:
  qualify:
    if: github.event.head_commit.message == 'Qualify Protocol 6.3 D4R3 repaired candidate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ssdp-6.3-engineering-memory
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare
        run: |
          set -euxo pipefail
          git config user.name 'Protocol 6.3 repair automation'
          git config user.email 'protocol63-repair@users.noreply.github.com'
          git config --global gc.auto 0
          git config --global maintenance.auto false
          python -m pip install -r source/requirements-validation.txt
          python -m pip install ./orchestrator -r orchestrator/requirements-dev.txt
      - name: Freshly qualify exact semantic candidate
        run: |
          set -euxo pipefail
          CANDIDATE=026eecf6ce382c3445ed218aeca80dcf2fb9a426
          rm -rf /tmp/ssdp63-f3-candidate /tmp/protocol-dist-f3
          git worktree add --detach /tmp/ssdp63-f3-candidate "$CANDIDATE"
          LOG=/tmp/DIAGNOSTIC-PROTOCOL-6.3-F3-OWNER-BINDING.txt
          : > "$LOG"
          cd /tmp/ssdp63-f3-candidate
          run_logged() {
            printf '\n===== %s =====\n' "$*" | tee -a "$LOG"
            "$@" 2>&1 | tee -a "$LOG"
            status=${PIPESTATUS[0]}
            printf 'EXIT=%s\n' "$status" | tee -a "$LOG"
            return "$status"
          }
          run_logged python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md
          run_logged python -m unittest -v tests.test_protocol_63_reopened_repairs
          run_logged python -m unittest -v tests.test_protocol_63_engineering_memory
          run_logged env SSDP_VALIDATE_PUBLIC_FALLBACK=1 python -m unittest -v tests.test_protocol_63_bootstrap
          run_logged env SSDP_VALIDATE_PUBLIC_FALLBACK=1 python -m unittest discover -s tests -v
          run_logged python source/build_skills.py --output /tmp/protocol-dist-f3
          run_logged python source/validate_packages.py --dist /tmp/protocol-dist-f3
          run_logged python source/check_dist.py --expected /tmp/protocol-dist-f3 --committed dist
          run_logged python orchestrator/scripts/generate_protocol_snapshot.py --check
          run_logged python orchestrator/scripts/run_core_tests.py
          run_logged git diff --check
          test -z "$(git status --porcelain)"
      - name: Materialize F3 qualification and review handoff
        run: |
          set -euxo pipefail
          BOOTSTRAP=dc22f09fd38dbbfeaeb0160152da9b284654f66e
          CANDIDATE=026eecf6ce382c3445ed218aeca80dcf2fb9a426
          git show 4b30d574b1f70cbcd49501b1b63a7685cf993f5d:qualification/ssdp6/_tmp_protocol63_owner_binding_repair.py > /tmp/repair.py
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/repair.py'); text=p.read_text(encoding='utf-8')
          p.write_text(text.replace('ROOT = Path(__file__).resolve().parents[2]', 'ROOT = Path.cwd()', 1), encoding='utf-8')
          PY
          python - "$BOOTSTRAP" "$CANDIDATE" <<'PY'
          import importlib.util, sys
          spec=importlib.util.spec_from_file_location('repair','/tmp/repair.py')
          repair=importlib.util.module_from_spec(spec); spec.loader.exec_module(repair)
          repair.close_workplan(sys.argv[1], sys.argv[2])
          PY
          cp /tmp/DIAGNOSTIC-PROTOCOL-6.3-F3-OWNER-BINDING.txt qualification/ssdp6/DIAGNOSTIC-PROTOCOL-6.3-F3-OWNER-BINDING.txt
          python - "$CANDIDATE" "$BOOTSTRAP" <<'PY'
          from pathlib import Path
          import re, sys
          candidate, bootstrap = sys.argv[1:3]
          old_candidate='3bbbdfa8120646d76336c7b916e6a891c9ed38f2'
          old_bootstrap='e12572c021087308570abfa41657a910c6896457'
          old_mapping='e6a8c12f065c3d25a41da804c129d6bc0a4f7b50'
          old_evidence='6fc26ce374b5346495782871d5d7241de5b90071'

          # Static sensors: preserve fixed predicates, recompute candidate-side byte totals from the declared active sets.
          p=Path('qualification/ssdp6/SSDP-6.3-STATIC-ACTIVATION-SENSORS.md')
          text=p.read_text(encoding='utf-8')
          text=text.replace(f'semantic_candidate: {old_candidate}', f'semantic_candidate: {candidate}', 1)
          text=text.replace(f'Final reopened-candidate refresh: the active-set predicates/topology were rechecked against the assembled replacement semantic candidate `{old_candidate}` and remain unchanged. Every 6.3 byte total below was recomputed from the exact Git blobs named by that fixed active set; no pre-repair byte total is carried forward as current evidence.', f'F3 owner-binding refresh: the active-set predicates/topology were rechecked against repaired semantic candidate `{candidate}` and remain unchanged. Every 6.3 byte total below was recomputed from the exact candidate files named by that fixed active set; no F2 candidate-side byte total is carried forward as current evidence.')
          section_totals={}
          for m in re.finditer(r'^### (.+?)\n\n- active bytes: [^\n]+\n- active: (.+)$', text, flags=re.M):
              paths=re.findall(r'`([^`]+)`', m.group(2))
              section_totals[m.group(1)]=sum(len(Path(path).read_bytes()) for path in paths)
          lines=text.splitlines()
          table_totals={}
          for i,line in enumerate(lines):
              m=re.match(r'^\| (.+?) \| ([0-9,]+) \| ([0-9,]+) \| ([+-][0-9,]+) \| ([0-9]+/[0-9]+) \| (YES|NO) \|$', line)
              if m and m.group(1) in section_totals:
                  b62=int(m.group(2).replace(',','')); b63=section_totals[m.group(1)]; delta=b63-b62
                  lines[i]=f"| {m.group(1)} | {b62:,} | {b63:,} | {'+' if delta >= 0 else '-'}{abs(delta):,} | {m.group(5)} | {m.group(6)} |"
                  table_totals[m.group(1)]=b63
          text='\n'.join(lines)+'\n'
          for task,total in table_totals.items():
              pattern=rf'(### {re.escape(task)}\n\n- active bytes: )([0-9,]+)(;)'
              text,n=re.subn(pattern, rf'\g<1>{total:,}\3', text, count=1)
              if n != 1: raise SystemExit(f'failed sensor refresh for {task}')
          p.write_text(text, encoding='utf-8')

          # Implementation state: bind current candidate without erasing negative historical identities.
          p=Path('qualification/ssdp6/IMPLEMENTATION-STATE-PROTOCOL-6.3.md')
          text=p.read_text(encoding='utf-8')
          text += f'''\n\n## F3 D4R3 owner-binding repair refresh\n\nIndependent Review of prior candidate `{old_candidate}` was NO-PASS on accepted-state governing-owner binding. D4R3/E3/F3 repair that false-pass family. Current semantic candidate is `{candidate}`; replacement public bootstrap is `{bootstrap}`. Fresh executable evidence is `qualification/ssdp6/DIAGNOSTIC-PROTOCOL-6.3-F3-OWNER-BINDING.txt` and `qualification/ssdp6/RESULTS-GPT-5.6-SOL-2026-09-12-PROTOCOL-6.3-F3.md`. Independent assembled-candidate Review remains pending; Stage G, recovery, accepted-current status, archive, and main cutover remain blocked.\n'''
          p.write_text(text, encoding='utf-8')

          p=Path('qualification/ssdp6/SSDP-6.3-PRESERVATION-CENSUS.md')
          text=p.read_text(encoding='utf-8')
          text += f'''\n\n## F3 owner-binding preservation delta\n\nCandidate `{candidate}` preserves the prior census except where D4R3 deliberately strengthens authority/acceptance concretization. T45/T46/T67/T75-class owner-bearing paths now require accepted-state governing-owner binding; this is a monotonic repair of the reviewed false-pass, not a relaxation. Frozen Protocol 5.16/6.0/6.1/6.2 resources were rechecked by the fresh candidate package/profile/Core gates. Prior F2 labels remain historical evidence; affected authority/recurrence cases are rebound to fresh F3 discriminators and full candidate regression. Independent Review remains open.\n'''
          p.write_text(text, encoding='utf-8')

          p=Path('qualification/ssdp6/INDEPENDENT-REVIEW-HANDOFF-PROTOCOL-6.3.md')
          text=p.read_text(encoding='utf-8')
          replacements={
              f'semantic_candidate: {old_candidate}':f'semantic_candidate: {candidate}',
              f'qualification_result_commit: {old_evidence}':'qualification_result_commit: PENDING_F3_EVIDENCE_COMMIT',
              'qualification_result: qualification/ssdp6/RESULTS-GPT-5.6-SOL-2026-09-12-PROTOCOL-6.3-F2.md':'qualification_result: qualification/ssdp6/RESULTS-GPT-5.6-SOL-2026-09-12-PROTOCOL-6.3-F3.md',
              f'static_sensor_evidence_commit: {old_evidence}':'static_sensor_evidence_commit: PENDING_F3_EVIDENCE_COMMIT',
              f'public_source_bootstrap: {old_bootstrap}':f'public_source_bootstrap: {bootstrap}',
              f'public_source_mapping_commit: {old_mapping}':f'public_source_mapping_commit: {candidate}',
          }
          for a,b in replacements.items():
              if a not in text: raise SystemExit(f'handoff field missing: {a}')
              text=text.replace(a,b,1)
          text=text.replace(old_candidate,candidate).replace(old_bootstrap,bootstrap).replace(old_mapping,candidate)
          text=text.replace('### D4R2 — accepted-repair subject binding','### D4R3 — accepted-state governing-owner binding')
          old='Independently attempt all of the following: a real repair followed by an unrelated descendant file presented as acceptance; a typed acceptance artifact naming a different repair; missing/ambiguous acceptance state; missing accepting owner; reversed chronology; and copied/rebased/cherry-picked aliases. None may increment recurrence. A valid recurrence must establish a prior occurrence, exact accepted repair subject, durable accepted state/owner evidence, and materially later independent event.'
          new='Independently attempt branch-only repair acceptance after accepted project state; wrong repair subject; missing/ambiguous acceptance state; free-text or candidate-only accepting owner; accepted owner-content drift; reversed chronology; and copied/rebased/cherry-picked aliases. None may increment recurrence. Also attempt AUTHORITY_BOUND, normative-notice, and comparative-priority laundering with a healthy candidate-only owner or authority-evidence route. Mechanical accepted-state provenance is necessary but does not replace semantic verification that the cited artifact is the real governing owner for the exact claim.'
          if old not in text: raise SystemExit('D4R2 handoff paragraph missing')
          text=text.replace(old,new,1)
          text=text.replace('## F2 evidence to challenge','## F3 evidence to challenge',1)
          old_f2=f'`qualification/ssdp6/RESULTS-GPT-5.6-SOL-2026-09-12-PROTOCOL-6.3-F2.md` at `{old_evidence}` is implementation-context evidence only. It freshly accounts for exactly 260 cases: 115 inherited scenarios, Q63-01..79, F63-A..BJ, and four Challenge passes. Sample the D4R2/D5R2 rows first, then verify complete accounting and that semantic-paired rows actually discriminate the stated counterfactual rather than merely restating doctrine.'
          new_f3=f'`qualification/ssdp6/RESULTS-GPT-5.6-SOL-2026-09-12-PROTOCOL-6.3-F3.md` is implementation-context evidence only. It binds repaired candidate `{candidate}` to fresh D4R3 direct discriminators, exact public-fallback realization, full source regression, package/profile parity, and Core acceptance. Prior F2 conclusions are historical evidence and are carried forward only where applicability is unchanged. Sample D4R3 owner/authority/recurrence paths first, then D5R2 and the inherited four Challenge dimensions.'
          if old_f2 not in text: raise SystemExit('F2 handoff paragraph missing')
          text=text.replace(old_f2,new_f3,1)
          p.write_text(text, encoding='utf-8')
          PY
          python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md --write-summary
          rm -f .github/workflows/temporary-protocol63-*.yml qualification/ssdp6/_tmp_protocol63_*.log 2>/dev/null || true
          git add -A
          git diff --cached --check
          git commit -m 'Qualify Protocol 6.3 D4R3 repaired candidate'
          EVIDENCE=$(git rev-parse HEAD)
          echo "$EVIDENCE" > /tmp/f3-evidence-sha
      - name: Bind immutable F3 evidence identity and push
        run: |
          set -euxo pipefail
          EVIDENCE=$(cat /tmp/f3-evidence-sha)
          python - "$EVIDENCE" <<'PY'
          from pathlib import Path
          import sys
          evidence=sys.argv[1]
          p=Path('qualification/ssdp6/INDEPENDENT-REVIEW-HANDOFF-PROTOCOL-6.3.md')
          text=p.read_text(encoding='utf-8')
          if 'PENDING_F3_EVIDENCE_COMMIT' not in text: raise SystemExit('handoff evidence sentinel missing')
          p.write_text(text.replace('PENDING_F3_EVIDENCE_COMMIT', evidence), encoding='utf-8')
          wp=Path('workplans/active/PROTOCOL-6.3-EVIDENCE-BACKED-PROJECT-ENGINEERING-MEMORY-WORKPLAN.md')
          text=wp.read_text(encoding='utf-8')
          marker='f3_qualification: qualification/ssdp6/RESULTS-GPT-5.6-SOL-2026-09-12-PROTOCOL-6.3-F3.md'
          if marker not in text: raise SystemExit('F3 workplan marker missing')
          wp.write_text(text.replace(marker, f'f3_qualification_commit: {evidence}\n{marker}', 1), encoding='utf-8')
          PY
          git add qualification/ssdp6/INDEPENDENT-REVIEW-HANDOFF-PROTOCOL-6.3.md workplans/active/PROTOCOL-6.3-EVIDENCE-BACKED-PROJECT-ENGINEERING-MEMORY-WORKPLAN.md
          git diff --cached --check
          git commit -m 'Bind Protocol 6.3 F3 review evidence'
          git push origin HEAD:ssdp-6.3-engineering-memory
