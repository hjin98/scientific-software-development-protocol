name: Diagnose Protocol 6.3 lifecycle Core once

on:
  push:
    branches:
      - ssdp-6.3-engineering-memory
    paths:
      - .github/workflows/ssdp63-diagnose-lifecycle-core-once.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ssdp-6.3-engineering-memory
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install -r source/requirements-validation.txt
          python -m pip install ./orchestrator -r orchestrator/requirements-dev.txt
      - name: Reproduce reconciled Core failure
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/reconcile_ssdp63_f2_lifecycle.py
          rm -f .github/workflows/ssdp63-reconcile-f2-lifecycle-once.yml
          rm -f .github/workflows/ssdp63-reconcile-f2-lifecycle-v2-once.yml
          rm -f .github/workflows/ssdp63-reconcile-f2-lifecycle-v3-once.yml
          rm -f .github/workflows/ssdp63-diagnose-lifecycle-core-once.yml
          rm -f .github/scripts/reconcile_ssdp63_f2_lifecycle.py
          set +e
          python orchestrator/scripts/run_core_tests.py > /tmp/ssdp63-core.log 2>&1
          rc=$?
          set -e
          {
            echo "core_exit_status=$rc"
            echo
            echo "failure_markers:"
            grep -nE 'FAIL|ERROR|AssertionError|Traceback|FAILED' /tmp/ssdp63-core.log || true
            echo
            echo "tail:"
            tail -n 240 /tmp/ssdp63-core.log
          } > /tmp/ssdp63-core-diagnostic.txt
          git reset --hard HEAD
          cp /tmp/ssdp63-core-diagnostic.txt qualification/ssdp6/DIAGNOSTIC-PROTOCOL-6.3-LIFECYCLE-CORE.txt
          git rm .github/workflows/ssdp63-diagnose-lifecycle-core-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qualification/ssdp6/DIAGNOSTIC-PROTOCOL-6.3-LIFECYCLE-CORE.txt
          git commit -m "Record Protocol 6.3 lifecycle Core diagnostic"
          git push origin HEAD:ssdp-6.3-engineering-memory
