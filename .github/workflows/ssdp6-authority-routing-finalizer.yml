name: SSDP 6 authority-routing finalizer

on:
  push:
    branches:
      - impl/ssdp-6

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply accepted repair transformation and regression correction
        run: |
          awk '
            /python - <<'"'"'PY'"'"'/ {capture=1; next}
            capture && /^          PY$/ {exit}
            capture {sub(/^          /, ""); print}
          ' .github/workflows/ssdp6-authority-routing-repair.yml > /tmp/apply_repair.py
          python /tmp/apply_repair.py
          python - <<'PY'
          from pathlib import Path
          path = Path("source/shared/references/development-workflow-prompts.md")
          text = path.read_text(encoding="utf-8")
          old = "Create or update the governing D3->D4 implementation workplan at WORKPLAN_DESTINATION when D4 realization is materially affected."
          new = "Actually create or update the governing D3->D4 implementation workplan at WORKPLAN_DESTINATION when D4 realization is materially affected."
          if text.count(old) != 1:
              raise SystemExit(f"unexpected D3 action phrase count: {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - name: Install validation and Orchestrator dependencies
        run: >-
          python -m pip install
          -r source/requirements-validation.txt
          ./orchestrator
          -r orchestrator/requirements-dev.txt
      - name: Run protocol regression tests
        run: python -m unittest discover -s tests -v
      - name: Generate current Protocol 6 packaged snapshot
        run: python orchestrator/scripts/generate_protocol_snapshot.py
      - name: Build canonical skill packages
        run: python source/build_skills.py --output /tmp/protocol-dist
      - name: Validate generated skill packages independently
        run: python source/validate_packages.py --dist /tmp/protocol-dist
      - name: Replace committed distribution from canonical build
        run: |
          rm -rf dist
          cp -a /tmp/protocol-dist dist
      - name: Verify generated distribution parity
        run: python source/check_dist.py --expected /tmp/protocol-dist --committed dist
      - name: Verify generated Protocol snapshot parity
        run: python orchestrator/scripts/generate_protocol_snapshot.py --check
      - name: Run Orchestrator Core acceptance suite
        run: python orchestrator/scripts/run_core_tests.py
      - name: Verify proportional routing, explicit-plan binding, and legacy isolation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from sdp_orchestrator.core import profile as P
          from sdp_orchestrator.core.canonical import parse_document
          from sdp_orchestrator.core.inputs import resolve_inputs
          from sdp_orchestrator.core.records import DigestRef, LifecycleState, WorkplanRef

          root = Path("orchestrator/src/sdp_orchestrator/core/resources/protocol")
          current = json.loads((root / "ssdp-protocol-6.0/profile.json").read_text())
          stages = {item["stage"]["stage_key"]: item for item in current["stages"]}
          assert stages["software-implementation"]["workplan_policy"] == "explicit_only"
          d4_names = {item["name"] for item in stages["software-implementation"]["inputs"]}
          assert "CHANGE_PLAN" in d4_names and "WORKPLAN" not in d4_names

          document = parse_document(
              Path("source/shared/references/development-workflow-prompts.md").read_text(),
              profile_id=P.DEFAULT_PROFILE_ID,
          )
          descriptor = P.build_profile(document, P.DEFAULT_PROFILE_ID).descriptor
          d4 = P.stage_descriptor(descriptor, P.resolve_stage_key(descriptor, "software-implementation"))
          no_plan = {x.name: x.value for x in resolve_inputs(d4, workplan=None, first_task=None, overrides={}, governing_protocol_version="6.0.0")}
          assert no_plan["CHANGE_PLAN"] == "NONE"
          plan = WorkplanRef(
              workplan_id="WP-REDUCED",
              protocol_version="6.0.0",
              path="workplans/active/WP-REDUCED.md",
              artifact_digest=DigestRef(algorithm="sha256", value="a" * 64),
              semantic_digest=DigestRef(algorithm="sha256", value="b" * 64),
              semantic_identity_complete=True,
              lifecycle_state=LifecycleState.ACTIVE,
          )
          with_plan = {x.name: x.value for x in resolve_inputs(d4, workplan=plan, first_task=None, overrides={}, governing_protocol_version="6.0.0")}
          assert with_plan["CHANGE_PLAN"] == plan.path

          def dest(stage, trigger):
              return {
                  item["to_stage"]["stage_key"]
                  for item in current["transitions"]
                  if item["from_stage"]["stage_key"] == stage
                  and item["trigger_key"] == trigger
                  and item["to_stage"] is not None
              }
          assert {"numerical-algorithm-design", "software-design", "software-implementation"}.issubset(dest("review", "pass"))
          assert {"numerical-algorithm-design", "software-design", "software-implementation"}.issubset(dest("scientific-formulation", "risk_override"))
          assert {"software-design", "software-implementation"}.issubset(dest("numerical-algorithm-design", "risk_override"))
          assert {"numerical-algorithm-design", "software-design", "software-implementation"}.issubset(dest("review", "risk_override"))

          prompts = Path("source/shared/references/development-workflow-prompts.md").read_text()
          assert "authority_state = risk_accepted_provisional" in prompts
          assert "Actually create or update the governing D3->D4 implementation workplan" in prompts

          legacy = json.loads((root / "sdp-protocol-5.16/profile.json").read_text())
          legacy_stages = {item["stage"]["stage_key"]: item for item in legacy["stages"]}
          assert legacy_stages["implementation"]["workplan_policy"] == "required"
          assert "WORKPLAN" in {item["name"] for item in legacy_stages["implementation"]["inputs"]}
          assert "CHANGE_PLAN" not in {item["name"] for item in legacy_stages["implementation"]["inputs"]}
          PY
      - name: Check patch whitespace
        run: git diff --check
      - name: Remove temporary diagnostics and commit accepted repair
        run: |
          git rm .github/workflows/ssdp6-authority-routing-repair.yml
          git rm .github/workflows/ssdp6-authority-routing-finalizer.yml
          rm -f .ci-ssdp6-authority-routing-failure.log
          git add -u .ci-ssdp6-authority-routing-failure.log || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/shared/references/abstraction-and-realization.md \
                  source/shared/references/workflow-and-workplans.md \
                  source/shared/references/development-workflow-prompts.md \
                  tests/test_protocol_contracts.py \
                  orchestrator/src/sdp_orchestrator/core/profile.py \
                  orchestrator/src/sdp_orchestrator/core/inputs.py \
                  orchestrator/docs/core-user-guide.md \
                  orchestrator/tests/test_ssdp6_profiles.py \
                  orchestrator/src/sdp_orchestrator/core/resources/protocol/ssdp-protocol-6.0 \
                  dist
          git diff --cached --check
          git commit -m "Close Protocol 6 proportional routing gaps"
          git push
