name: Temporary Protocol 6.4 Stage F diagnose final7b
on:
  push:
    branches: [ssdp-6.4-axiomatic-definition-traceability]
permissions: {contents: write}
jobs:
  diagnose-final7b:
    if: github.event.head_commit.message == 'Diagnose Protocol 6.4 Stage F final7b'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: ssdp-6.4-axiomatic-definition-traceability, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python -m pip install pyyaml -r source/requirements-validation.txt
          python -m pip install ./orchestrator -r orchestrator/requirements-dev.txt
      - name: Reconstruct and capture tests
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path
          d=yaml.safe_load(Path('.github/workflows/temporary-protocol64-stage-f-final7.yml').read_text())
          Path('/tmp/final7.sh').write_text(next(s['run'] for s in d['jobs']['final7']['steps'] if s.get('name')=='Construct final6 tree and close exact remaining unit oracles'))
          PY
          bash /tmp/final7.sh
          set +e
          python -m unittest discover -s tests -v > qualification/ssdp6/STAGE-F-DIAGNOSTIC-FINAL7B-PROTOCOL-6.4.txt 2>&1
          echo "UNITTEST_EXIT=$?" >> qualification/ssdp6/STAGE-F-DIAGNOSTIC-FINAL7B-PROTOCOL-6.4.txt
          git config user.name 'Protocol 6.4 lifecycle automation'; git config user.email 'protocol64-lifecycle@users.noreply.github.com'
          git add qualification/ssdp6/STAGE-F-DIAGNOSTIC-FINAL7B-PROTOCOL-6.4.txt && git commit -m 'Capture Protocol 6.4 Stage F final7b diagnostic' && git push origin HEAD:ssdp-6.4-axiomatic-definition-traceability
