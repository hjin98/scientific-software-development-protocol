name: Protocol 6.2 Stage G Materialize v5

on:
  push:
    branches:
      - ssdp-6.2-lossless-representation
    paths:
      - '.github/workflows/protocol-62-stage-g-materialize-v5.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ssdp-6.2-lossless-representation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Execute Stage G materialization
        run: python orchestrator/scripts/protocol_62_stage_g_push_v5.py
