name: Temporary Protocol 6.4 current-state reconciliation
on:
  push:
    branches: [ssdp-6.4-axiomatic-definition-traceability]
permissions:
  contents: write
jobs:
  reconcile:
    if: github.event.head_commit.message == 'Run final Protocol 6.4 current-state reconciliation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ssdp-6.4-axiomatic-definition-traceability
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install qualification dependencies
        run: |
          python -m pip install pyyaml -r source/requirements-validation.txt
          python -m pip install ./orchestrator -r orchestrator/requirements-dev.txt
      - name: Reconcile accepted-current surfaces and strengthen QF64-P
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path

          R = '74bc572ef516cae417437a2027eeff52a2e25c15'
          M = '6e66478f37de197b6d28707e087c61d687fcfa41'
          B = 'e09a9d1480211eea2d16d722182bb5c6de1bee12'
          REV5 = 'SSDP-7.0-DETERMINISTIC-CONTROL-PLANE-AND-MANDATORY-ORCHESTRATOR-MIGRATION-REVISION-5-PROTOCOL-6.4-INHERITANCE-RECONCILIATION.md'

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual < count:
                  raise SystemExit(f'{path}: expected at least {count} occurrence(s), found {actual}: {old!r}')
              p.write_text(text.replace(old, new, count))

          # README: remove pre-Stage-F current-state claims while preserving version-bound history.
          replace_exact(
              'README.md',
              'Version-bound work is always interpreted under its declared Protocol version; candidate 6.4 source does not silently reinterpret accepted 6.3 or frozen historical work.',
              'Version-bound work is always interpreted under its declared Protocol version; current accepted 6.4 source does not silently reinterpret version-bound 6.3 or other frozen historical work.',
          )
          replace_exact(
              'README.md',
              'The candidate keeps orchestration profile schema v2 because no machine stage/result-envelope contract changed. `ssdp-protocol-6.4` is a distinct candidate profile/snapshot; frozen 6.3 and earlier profile bytes remain immutable test oracles.',
              'Protocol 6.4 keeps orchestration profile schema v2 because no machine stage/result-envelope contract changed. `ssdp-protocol-6.4` is the distinct accepted-current profile/snapshot; frozen 6.3 and earlier profile bytes remain immutable test oracles.',
          )
          replace_exact(
              'README.md',
              "This repository's self-hosted `PROJECT-ENGINEERING-MEMORY.md` is deliberately partial candidate project state backed by immutable evidence and is **not** copied into generic skills, distributions, profiles, or snapshots.",
              "This repository's self-hosted `PROJECT-ENGINEERING-MEMORY.md` is deliberately partial project-local state backed by immutable evidence and is **not** copied into generic skills, distributions, profiles, or snapshots.",
          )
          replace_exact(
              'README.md',
              'Protocol 6.4 now has immutable public bootstrap **`e09a9d1480211eea2d16d722182bb5c6de1bee12`** and still has **no** recovery identity. Candidate/self-hosted work should use readable local version-bound source when available and may otherwise use only that exact public ref. The bootstrap was qualified before this later descendant published its SHA. Independent assembled-candidate Review must still pass before a distinct recovery identity can be established and later published.',
              f'Protocol 6.4 accepted-current publication uses immutable public bootstrap **`{B}`** and distinct accepted recovery **`{R}`**. Recovery mapping descendant `{M}` publishes the recovery identity after the immutable target already existed. Version-bound 6.4 work should use readable local 6.4 source when available and may otherwise use only the exact authorized bootstrap; bootstrap and recovery remain intentionally distinct.',
          )

          # AGENTS: current operational instructions must match accepted-current 6.4.
          replace_exact(
              'AGENTS.md',
              '`source/` is canonical protocol source. On the Protocol 6.4 development branch it represents the **6.4 candidate under qualification**, while accepted-current Protocol 6.3 remains the release/rollback authority until the 6.4 lifecycle completes. Do not hand-edit generated `dist/` or orchestrator protocol snapshots when canonical generation exists. Repository-root `PROJECT-ENGINEERING-MEMORY.md` is project-local candidate state inherited from Protocol 6.3 semantics; it is never copied into generic distributions/profiles.',
              f'`source/` is canonical protocol source. On the Protocol 6.4 branch it represents the **accepted-current Protocol 6.4** source; Protocol 6.3 recovery `9f353097fab36e325a325f1c2f9d9cec32e86177` remains immutable historical rollback for explicitly version-bound 6.3 work. Do not hand-edit generated `dist/` or orchestrator protocol snapshots when canonical generation exists. Repository-root `PROJECT-ENGINEERING-MEMORY.md` is project-local state inherited from Protocol 6.3 semantics and preserved by Protocol 6.4; it is never copied into generic distributions/profiles.',
          )
          replace_exact(
              'AGENTS.md',
              'Never reinterpret version-bound 6.3 or older work under 6.4 merely because the candidate source is present.',
              'Never reinterpret version-bound 6.3 or older work under 6.4 merely because current 6.4 source is present.',
          )
          replace_exact(
              'AGENTS.md',
              'For Protocol 6.4 candidate work run the repository acceptance workflow documented in `README.md`/CI, including inherited regression and PEM checks, QF64-A..QF64-P positive/negative qualification, package build/independent validation, committed-distribution parity, whitespace/presentation checks, frozen-resource integrity, and Orchestrator Core snapshot/tests when affected. A derived `USES_DEFINITION` trace is bounded review/impact evidence only and cannot become authority or prove independence outside its declared complete scope. Protocol 6.4 is **not** accepted-current; its sole authorized version-bound public bootstrap is `e09a9d1480211eea2d16d722182bb5c6de1bee12` and it has no recovery SHA yet. Never guess or self-declare an alternate bootstrap or a recovery identity. Protocol 6.3 remains accepted-current with public bootstrap `86c13cab6bdd1991dffa94e277db8eacf87e2e11` and distinct recovery `9f353097fab36e325a325f1c2f9d9cec32e86177`. Protocol 6.2 recovery `b59adc77efe6951912cfd705cc43830c58ca27d0` remains immutable historical rollback for version-bound 6.2 work.',
              f'For Protocol 6.4 work run the repository acceptance workflow documented in `README.md`/CI when a change affects accepted-current 6.4 semantics or generated descendants, including inherited regression and PEM checks, QF64-A..QF64-P positive/negative qualification, package build/independent validation, committed-distribution parity, whitespace/presentation checks, frozen-resource integrity, and Orchestrator Core snapshot/tests when affected. A derived `USES_DEFINITION` trace is bounded review/impact evidence only and cannot become authority or prove independence outside its declared complete scope. Protocol 6.4 is **accepted-current** with sole authorized version-bound public bootstrap `{B}` and distinct recovery `{R}`. Never guess or self-declare an alternate bootstrap or recovery identity. Protocol 6.3 public bootstrap `86c13cab6bdd1991dffa94e277db8eacf87e2e11` and recovery `9f353097fab36e325a325f1c2f9d9cec32e86177` remain immutable historical resources for version-bound 6.3 work. Protocol 6.2 recovery `b59adc77efe6951912cfd705cc43830c58ca27d0` remains immutable historical rollback for version-bound 6.2 work.',
          )

          # Active lifecycle authority index: make the whole current document agree with its 6.4 closeout block.
          idx = 'workplans/active/SSDP-6.1-7.0-WORKPLAN-AUTHORITY-INDEX.md'
          replace_exact(idx, 'protocol_version: 6.3.0', 'protocol_version: 6.4.0')
          replace_exact(
              idx,
              'Protocol 6.4 remains a proposed backward-compatible minor strengthening. No `main` cutover or reinterpretation of version-bound 6.3 work is implied. Bounded 6.4 adoption follows the consolidated workplan; ambiguous or conflicting predecessor semantics must be reconciled/challenged rather than silently inherited.',
              f'Protocol 6.4 is the accepted-current backward-compatible minor strengthening. Its accepted release identity is recovery `{R}` with distinct public bootstrap `{B}`. The repository default branch is not a protocol-version oracle, so no `main` merge is required to make that version-bound acceptance true; version-bound 6.3 and older work retains its immutable historical semantics.',
          )
          rev4_line = '5. `workplans/active/SSDP-7.0-DETERMINISTIC-CONTROL-PLANE-AND-MANDATORY-ORCHESTRATOR-MIGRATION-REVISION-4-PROTOCOL-6.3-INHERITANCE-RECONCILIATION.md`'
          replace_exact(idx, rev4_line, rev4_line + f'\n6. `workplans/active/{REV5}`')
          replace_exact(
              idx,
              '- Revision 4 changes only project-learning/version inheritance after Protocol 6.3 acceptance: current pre-cutover document-controlled baseline and fallback/rollback become Protocol 6.3, while the parent/Revisions 1-3 D3 architecture semantics remain unchanged;\n- Protocol 6.4 is not yet accepted and therefore does not amend the Protocol-7 handoff at this time;\n- every parent requirement not explicitly changed by a later revision remains binding.',
              f'- Revision 4 changes only project-learning/version inheritance after Protocol 6.3 acceptance: current pre-cutover document-controlled baseline and fallback/rollback become Protocol 6.3, while the parent/Revisions 1-3 D3 architecture semantics remain unchanged;\n- Revision 5 changes only version/representation inheritance after Protocol 6.4 acceptance: the current pre-cutover fallback/rollback baseline becomes Protocol 6.4 recovery `{R}`, while parent/Revisions 1-4 D3 architecture semantics remain unchanged and Protocol 7 D4 remains unauthorized;\n- every parent requirement not explicitly changed by a later revision remains binding.',
          )
          replace_exact(
              idx,
              '- Protocol 6.3 is the accepted-current document-controlled baseline; version-bound 6.2 work may still resolve immutable historical recovery `b59adc77efe6951912cfd705cc43830c58ca27d0` and older declared versions retain their own mappings.\n- Protocol 6.4 is proposed on its dedicated branch. It does not become accepted-current until qualification, independent Review, bootstrap/recovery publication, generated reconciliation, impact closure, and lifecycle cutover all pass.\n- Protocol 7 remains proposed/pre-cutover. Its current fallback/rollback baseline is Protocol 6.3 recovery `9f353097fab36e325a325f1c2f9d9cec32e86177` until a later accepted successor is explicitly reconciled into the Protocol-7 handoff.\n- Under Protocol 7 after qualified cutover, the deterministic orchestrator control plane owns machine lifecycle transitions while workplans/skills/documents remain semantic artifacts.\n- Shadow comparison is permitted only while one side remains explicitly non-authoritative.\n- No `main`, Protocol 6.4, or Protocol 7 cutover is authorized merely by these active design workplans.',
              f'- Protocol 6.4 is the accepted-current document-controlled baseline with recovery `{R}` and distinct public bootstrap `{B}`; version-bound 6.3 and older work retain their own immutable historical mappings.\n- The repository default branch is never a protocol-version oracle; Protocol 6.4 acceptance follows its completed qualification/Review/publication/recovery/reconciliation lifecycle rather than a `main` merge.\n- Protocol 7 remains proposed/pre-cutover. Its current fallback/rollback baseline is Protocol 6.4 recovery `{R}` through Revision 5; Revision 5 changes inheritance identity only and does not mutate Protocol 7 D3 architecture or authorize D4.\n- Under Protocol 7 after qualified cutover, the deterministic orchestrator control plane owns machine lifecycle transitions while workplans/skills/documents remain semantic artifacts.\n- Shadow comparison is permitted only while one side remains explicitly non-authoritative.\n- No `main` merge or Protocol 7 D4 cutover is authorized merely by these active design workplans; Protocol 6.4 acceptance is established by its completed lifecycle, not by this index.',
          )

          # Strengthen the closeout oracle against exactly the stale-current-state failure found post Stage F.
          test = 'tests/test_protocol_64_axiomatic_traceability.py'
          old_test = '''    def test_qf64_p_closeout_archives_snapshot(self) -> None:\n        self.assertEqual(sorted((ROOT / "workplans/active").glob("SSDP-6.4*.md")), [])\n        archived=ROOT/"workplans/archive/SSDP-6.4-AXIOMATIC-FORMAL-DEFINITION-AND-SEMANTIC-TRACEABILITY-CONSOLIDATED.md"\n        self.assertTrue(archived.is_file())\n        self.assertIn("STAGE F: PASS", archived.read_text())\n'''
          new_test = '''    def test_qf64_p_closeout_archives_snapshot(self) -> None:\n        self.assertEqual(sorted((ROOT / "workplans/active").glob("SSDP-6.4*.md")), [])\n        archived = ROOT / "workplans/archive/SSDP-6.4-AXIOMATIC-FORMAL-DEFINITION-AND-SEMANTIC-TRACEABILITY-CONSOLIDATED.md"\n        self.assertTrue(archived.is_file())\n        self.assertIn("STAGE F: PASS", archived.read_text())\n\n        index = norm(self.authority_index)\n        self.assertIn("stage f: pass / lifecycle closed", index)\n        self.assertIn("current accepted document-controlled baseline: protocol 6.4", index)\n        self.assertIn("revision-5-protocol-6.4-inheritance-reconciliation.md", index)\n        self.assertNotIn("protocol 6.4 remains a proposed", index)\n        self.assertNotIn("protocol 6.4 is not yet accepted", index)\n        self.assertNotIn("protocol 6.3 is the accepted-current document-controlled baseline", index)\n\n        readme = norm(self.readme)\n        self.assertIn("accepted recovery is 74bc572ef516cae417437a2027eeff52a2e25c15", readme)\n        self.assertNotIn("still has no recovery identity", readme)\n        self.assertNotIn("independent assembled-candidate review must still pass", readme)\n\n        agents = norm(read("AGENTS.md"))\n        self.assertIn("protocol 6.4 is accepted-current", agents)\n        self.assertIn("74bc572ef516cae417437a2027eeff52a2e25c15", agents)\n        self.assertNotIn("protocol 6.4 is not accepted-current", agents)\n        self.assertNotIn("it has no recovery sha yet", agents)\n\n        self.assertEqual(\n            sorted(p.name for p in (ROOT / ".github/workflows").glob("temporary-protocol64-stage-f*.yml")),\n            [],\n        )\n'''
          replace_exact(test, old_test, new_test)
          PY
          find .github/workflows -maxdepth 1 -type f -name 'temporary-protocol64-stage-f*.yml' -print0 | xargs -0 git rm
      - name: Full terminal qualification
        id: qualify
        continue-on-error: true
        run: |
          set -o pipefail
          {
            set -euxo pipefail
            python -m unittest discover -s tests -v
            python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md
            rm -rf /tmp/protocol-dist && python source/build_skills.py --output /tmp/protocol-dist
            python source/validate_packages.py --dist /tmp/protocol-dist
            python source/check_dist.py --expected /tmp/protocol-dist --committed dist
            python orchestrator/scripts/generate_protocol_snapshot.py --check
            python orchestrator/scripts/run_core_tests.py
            git diff --check
          } 2>&1 | tee /tmp/protocol64-final-reconcile.log
      - name: Publish failure evidence without temporary workflow
        if: steps.qualify.outcome == 'failure'
        run: |
          set -euxo pipefail
          cp /tmp/protocol64-final-reconcile.log /tmp/protocol64-final-reconcile.saved
          git reset --hard HEAD
          git rm .github/workflows/temporary-protocol64-stage-f-current-state-reconcile.yml
          cp /tmp/protocol64-final-reconcile.saved qualification/ssdp6/STAGE-F-CURRENT-STATE-RECONCILIATION-DIAGNOSTIC-PROTOCOL-6.4.txt
          git config user.name 'Protocol 6.4 lifecycle automation'
          git config user.email 'protocol64-lifecycle@users.noreply.github.com'
          git add -A
          git commit -m 'Record Protocol 6.4 current-state reconciliation failure'
          git push origin HEAD:ssdp-6.4-axiomatic-definition-traceability
          exit 1
      - name: Publish reconciled terminal tree
        if: steps.qualify.outcome == 'success'
        run: |
          set -euxo pipefail
          git config user.name 'Protocol 6.4 lifecycle automation'
          git config user.email 'protocol64-lifecycle@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Reconcile Protocol 6.4 accepted-current closeout surfaces'
          git push origin HEAD:ssdp-6.4-axiomatic-definition-traceability
