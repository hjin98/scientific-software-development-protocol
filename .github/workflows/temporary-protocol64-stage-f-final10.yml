name: Temporary Protocol 6.4 Stage F final 10
on:
  push:
    branches:
      - ssdp-6.4-axiomatic-definition-traceability
permissions:
  contents: write
jobs:
  final10:
    if: github.event.head_commit.message == 'Complete Protocol 6.4 Stage F final10'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ssdp-6.4-axiomatic-definition-traceability
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install pyyaml -r source/requirements-validation.txt
          python -m pip install ./orchestrator -r orchestrator/requirements-dev.txt
      - name: Construct Stage F tree
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path
          data = yaml.safe_load(Path('.github/workflows/temporary-protocol64-stage-f-final7.yml').read_text())
          step = next(s for s in data['jobs']['final7']['steps'] if s.get('name') == 'Construct final6 tree and close exact remaining unit oracles')
          Path('/tmp/final7.sh').write_text(step['run'])
          PY
          bash /tmp/final7.sh
          sed -i 's/| `ssdp-protocol-6.4` | 6.4.0 | 2 | proposed candidate |/| `ssdp-protocol-6.4` | 6.4.0 | 2 | accepted current |/' tests/test_protocol_62_closeout.py
          python source/build_skills.py --output dist
          python orchestrator/scripts/generate_protocol_snapshot.py
      - name: Full Stage F acceptance
        run: |
          set -euxo pipefail
          python -m unittest discover -s tests -v
          python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md
          rm -rf /tmp/protocol-dist
          python source/build_skills.py --output /tmp/protocol-dist
          python source/validate_packages.py --dist /tmp/protocol-dist
          python source/check_dist.py --expected /tmp/protocol-dist --committed dist
          python orchestrator/scripts/generate_protocol_snapshot.py --check
          python orchestrator/scripts/run_core_tests.py
          git diff --check
      - name: Publish Stage F closeout
        run: |
          set -euxo pipefail
          git config user.name 'Protocol 6.4 lifecycle automation'
          git config user.email 'protocol64-lifecycle@users.noreply.github.com'
          find .github/workflows -maxdepth 1 -type f -name 'temporary-protocol64-stage-f-*.yml' -print0 | xargs -0 git rm
          git add -A
          git diff --cached --check
          git commit -m 'Close Protocol 6.4 lifecycle'
          git push origin HEAD:ssdp-6.4-axiomatic-definition-traceability
