name: Protocol 6.4 bind Stage-E target

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/protocol-64-bind-stage-e-target.yml

permissions:
  contents: write

jobs:
  bind:
    if: github.head_ref == 'ssdp-6.4-axiomatic-definition-traceability'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ssdp-6.4-axiomatic-definition-traceability
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation and Core dependencies
        run: python -m pip install -r source/requirements-validation.txt ./orchestrator -r orchestrator/requirements-dev.txt
      - name: Bind exact immutable review target and exact-target CI
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('qualification/ssdp6/INDEPENDENT-REVIEW-HANDOFF-PROTOCOL-6.4.md')
          text = path.read_text(encoding='utf-8')
          target = 'ced6a352fbe84e8ed5e698d2ab133d4c5bb0f152'
          ci = '34980323042'

          old_front = '''assembled_review_target: PENDING_DESCENDANT_HANDOFF
          review_target_binding_state: pending-descendant-handoff
          assembled_review_target_ci: PENDING_EXACT_TARGET_CI'''
          new_front = f'''assembled_review_target: {target}
          review_target_binding_state: bound
          assembled_review_target_ci: {ci}'''
          if text.count(old_front) != 1:
              raise SystemExit('unexpected handoff front-matter binding state')
          text = text.replace(old_front, new_front, 1)

          old_pending = '''This handoff is the sole current Stage-E target-binding surface routed from the workplan. In an assembled candidate tree it intentionally carries `review_target_binding_state: pending-descendant-handoff`, `assembled_review_target: PENDING_DESCENDANT_HANDOFF`, and `assembled_review_target_ci: PENDING_EXACT_TARGET_CI`; **do not begin Review in that state**. The candidate cannot self-name. This handoff must be finalized by a later descendant after the candidate exists immutably and exact-target qualification has completed.'''
          new_bound = f'''This handoff is the sole current Stage-E target-binding surface routed from the workplan. Its binding state is **bound**: this descendant names already-existing immutable assembled target `{target}` and its exact-target ordinary PR qualification run `{ci}`. The candidate does not and cannot self-name; this later handoff commit is therefore not the Review target.'''
          if text.count(old_pending) != 1:
              raise SystemExit('unexpected pending-binding mandate paragraph')
          text = text.replace(old_pending, new_bound, 1)

          text = text.replace(
              'When `review_target_binding_state: bound`, Review immutable assembled target `PENDING_DESCENDANT_HANDOFF`',
              f'Review immutable assembled target `{target}`',
              1,
          )
          text = text.replace(
              'Treat `assembled_review_target_ci: PENDING_EXACT_TARGET_CI` as evidence to challenge, not authority.',
              f'Treat `assembled_review_target_ci: {ci}` as evidence to challenge, not authority.',
              1,
          )
          text = text.replace('`PENDING_DESCENDANT_HANDOFF`', f'`{target}`')
          text = text.replace('`PENDING_EXACT_TARGET_CI`', f'`{ci}`')
          text = text.replace('assembled target `PENDING_DESCENDANT_HANDOFF`; exact-target PR CI `PENDING_EXACT_TARGET_CI`.', f'assembled target `{target}`; exact-target PR CI `{ci}`.')

          if 'PENDING_DESCENDANT_HANDOFF' in text or 'PENDING_EXACT_TARGET_CI' in text:
              raise SystemExit('unresolved Stage-E binding sentinel remains')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Materialize clean binding index before qualification
        run: |
          rm -f .github/workflows/protocol-64-bind-stage-e-target.yml
          git add -A
          git diff --cached --check
      - name: Focused Protocol 6.4 qualification
        run: python -m unittest tests.test_protocol_64_axiomatic_traceability -v
      - name: Full repository regression
        run: python -m unittest discover -s tests -v
      - name: Project Engineering Memory validation
        run: python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md
      - name: Independent distribution build
        run: python source/build_skills.py --output /tmp/protocol-dist
      - name: Package validation
        run: python source/validate_packages.py --dist /tmp/protocol-dist
      - name: Committed distribution parity
        run: python source/check_dist.py --expected /tmp/protocol-dist --committed dist
      - name: Orchestrator snapshot parity
        run: python orchestrator/scripts/generate_protocol_snapshot.py --check
      - name: Orchestrator Core acceptance
        run: python orchestrator/scripts/run_core_tests.py
      - name: Final whitespace and index integrity
        run: |
          git diff --check
          git diff --cached --check
      - name: Commit clean binding descendant
        run: |
          git config user.name "hjin98"
          git config user.email "86921078+hjin98@users.noreply.github.com"
          git commit -m "Bind Protocol 6.4 Stage-E review target"
          git push origin HEAD:ssdp-6.4-axiomatic-definition-traceability
