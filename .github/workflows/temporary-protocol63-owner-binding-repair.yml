name: Temporary Protocol 6.3 owner-binding repair

on:
  push:
    branches: [ssdp-6.3-engineering-memory]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'Run Protocol 6.3 owner-binding repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ssdp-6.3-engineering-memory
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare repository execution environment
        run: |
          set -euxo pipefail
          git config user.name 'Protocol 6.3 repair automation'
          git config user.email 'protocol63-repair@users.noreply.github.com'
          cp qualification/ssdp6/_tmp_protocol63_owner_binding_repair.py /tmp/protocol63_owner_binding_repair.py
          python -m py_compile /tmp/protocol63_owner_binding_repair.py
          python -m pip install -r source/requirements-validation.txt
          python -m pip install ./orchestrator -r orchestrator/requirements-dev.txt
      - name: Reopen workplan and implement D4R3
        run: |
          set -euxo pipefail
          python /tmp/protocol63_owner_binding_repair.py reopen
          python /tmp/protocol63_owner_binding_repair.py implement
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/test_protocol_63_bootstrap.py')
          text = p.read_text(encoding='utf-8')
          old = '''        stale_transition_fragments = (\n            'no current 6.3 public fallback is authorized',\n            'no 6.3 public fallback is authorized until',\n            'no replacement public fallback is currently authorized',\n            'no replacement fallback is currently authorized',\n        )\n        for document_name, document in (("versioning", versioning), ("prompts", prompts), ("portability", portability), ("readme", readme)):\n            lowered = document.lower()\n            for fragment in stale_transition_fragments:\n                self.assertNotIn(fragment, lowered, f"{document_name} retains pre-publication fallback state: {fragment}")\n'''
          new = '''        if not BOOTSTRAP.startswith("UNAVAILABLE_"):\n            stale_transition_fragments = (\n                'no current 6.3 public fallback is authorized',\n                'no 6.3 public fallback is authorized until',\n                'no replacement public fallback is currently authorized',\n                'no replacement fallback is currently authorized',\n            )\n            for document_name, document in (("versioning", versioning), ("prompts", prompts), ("portability", portability), ("readme", readme)):\n                lowered = document.lower()\n                for fragment in stale_transition_fragments:\n                    self.assertNotIn(fragment, lowered, f"{document_name} retains pre-publication fallback state: {fragment}")\n'''
          if old not in text:
              raise SystemExit('bootstrap stale-transition block not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md --write-summary
          python orchestrator/scripts/generate_protocol_snapshot.py
          rm -rf /tmp/protocol-dist
          python source/build_skills.py --output /tmp/protocol-dist
          python source/validate_packages.py --dist /tmp/protocol-dist
          rm -rf dist
          cp -a /tmp/protocol-dist dist
      - name: Validate sentinel-state repaired snapshot
        run: |
          set -euxo pipefail
          python -m unittest -v tests.test_protocol_63_reopened_repairs
          python -m unittest -v tests.test_protocol_63_engineering_memory
          python -m unittest -v tests.test_protocol_63_bootstrap
          env SSDP_VALIDATE_PUBLIC_FALLBACK=1 python -m unittest discover -s tests -v
          rm -rf /tmp/protocol-dist-check
          python source/build_skills.py --output /tmp/protocol-dist-check
          python source/validate_packages.py --dist /tmp/protocol-dist-check
          python source/check_dist.py --expected /tmp/protocol-dist-check --committed dist
          python orchestrator/scripts/generate_protocol_snapshot.py --check
          python orchestrator/scripts/run_core_tests.py
          git diff --check
      - name: Commit and publish immutable sentinel bootstrap snapshot
        id: bootstrap
        run: |
          set -euxo pipefail
          git rm qualification/ssdp6/_tmp_protocol63_owner_binding_repair.py .github/workflows/temporary-protocol63-owner-binding-repair.yml
          git add -A
          git commit -m 'Repair Protocol 6.3 accepted-state owner binding'
          BOOTSTRAP=$(git rev-parse HEAD)
          echo "sha=$BOOTSTRAP" >> "$GITHUB_OUTPUT"
          git push origin HEAD:ssdp-6.3-engineering-memory
      - name: Publish replacement bootstrap mapping
        run: |
          set -euxo pipefail
          BOOTSTRAP='${{ steps.bootstrap.outputs.sha }}'
          python /tmp/protocol63_owner_binding_repair.py publish --bootstrap "$BOOTSTRAP"
          python orchestrator/scripts/generate_protocol_snapshot.py
          rm -rf /tmp/protocol-dist
          python source/build_skills.py --output /tmp/protocol-dist
          python source/validate_packages.py --dist /tmp/protocol-dist
          rm -rf dist
          cp -a /tmp/protocol-dist dist
          python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md --write-summary
          env SSDP_VALIDATE_PUBLIC_FALLBACK=1 python -m unittest -v tests.test_protocol_63_bootstrap
          python -m unittest -v tests.test_protocol_63_reopened_repairs tests.test_protocol_63_engineering_memory
          python orchestrator/scripts/generate_protocol_snapshot.py --check
          git diff --check
          git add -A
          git commit -m 'Publish Protocol 6.3 D4R3 replacement bootstrap'
          git push origin HEAD:ssdp-6.3-engineering-memory
      - name: Run final candidate-bound F3 gates
        id: candidate
        run: |
          set -euxo pipefail
          CANDIDATE=$(git rev-parse HEAD)
          echo "sha=$CANDIDATE" >> "$GITHUB_OUTPUT"
          LOG=qualification/ssdp6/DIAGNOSTIC-PROTOCOL-6.3-F3-OWNER-BINDING.txt
          : > "$LOG"
          run_logged() {
            printf '\n===== %s =====\n' "$*" | tee -a "$LOG"
            "$@" 2>&1 | tee -a "$LOG"
            status=${PIPESTATUS[0]}
            printf 'EXIT=%s\n' "$status" | tee -a "$LOG"
            return "$status"
          }
          run_logged python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md
          run_logged python -m unittest -v tests.test_protocol_63_reopened_repairs
          run_logged python -m unittest -v tests.test_protocol_63_engineering_memory
          run_logged env SSDP_VALIDATE_PUBLIC_FALLBACK=1 python -m unittest -v tests.test_protocol_63_bootstrap
          run_logged env SSDP_VALIDATE_PUBLIC_FALLBACK=1 python -m unittest discover -s tests -v
          rm -rf /tmp/protocol-dist-f3
          run_logged python source/build_skills.py --output /tmp/protocol-dist-f3
          run_logged python source/validate_packages.py --dist /tmp/protocol-dist-f3
          run_logged python source/check_dist.py --expected /tmp/protocol-dist-f3 --committed dist
          run_logged python orchestrator/scripts/generate_protocol_snapshot.py --check
          run_logged python orchestrator/scripts/run_core_tests.py
          run_logged git diff --check
      - name: Refresh F3 lifecycle evidence and handoff
        run: |
          set -euxo pipefail
          BOOTSTRAP='${{ steps.bootstrap.outputs.sha }}'
          CANDIDATE='${{ steps.candidate.outputs.sha }}'
          python /tmp/protocol63_owner_binding_repair.py close --bootstrap "$BOOTSTRAP" --candidate "$CANDIDATE"
          python - "$BOOTSTRAP" "$CANDIDATE" <<'PY'
          from __future__ import annotations
          from pathlib import Path
          import re, sys
          bootstrap, candidate = sys.argv[1:3]
          old_candidate = '3bbbdfa8120646d76336c7b916e6a891c9ed38f2'
          old_bootstrap = 'e12572c021087308570abfa41657a910c6896457'
          old_mapping = 'e6a8c12f065c3d25a41da804c129d6bc0a4f7b50'
          f2_commit = '6fc26ce374b5346495782871d5d7241de5b90071'

          # Refresh deterministic static sensor totals from the unchanged declared active sets.
          p = Path('qualification/ssdp6/SSDP-6.3-STATIC-ACTIVATION-SENSORS.md')
          text = p.read_text(encoding='utf-8').replace(f'semantic_candidate: {old_candidate}', f'semantic_candidate: {candidate}', 1)
          text = text.replace(f'Final reopened-candidate refresh: the active-set predicates/topology were rechecked against the assembled replacement semantic candidate `{old_candidate}` and remain unchanged. Every 6.3 byte total below was recomputed from the exact Git blobs named by that fixed active set; no pre-repair byte total is carried forward as current evidence.', f'F3 owner-binding refresh: the active-set predicates/topology were rechecked against repaired semantic candidate `{candidate}` and remain unchanged. Every 6.3 byte total below was recomputed from the exact candidate files named by the fixed active set; no F2 byte total is carried forward as current evidence.')
          sections = {}
          for match in re.finditer(r'^### (.+?)\n\n- active bytes: [^\n]+\n- active: (.+)$', text, flags=re.M):
              task = match.group(1)
              paths = re.findall(r'`([^`]+)`', match.group(2))
              sections[task] = sum(Path(x).read_bytes().__len__() for x in paths)
          lines = text.splitlines()
          table = {}
          for i, line in enumerate(lines):
              m = re.match(r'^\| (.+?) \| ([0-9,]+) \| ([0-9,]+) \| ([+-][0-9,]+) \| ([0-9]+/[0-9]+) \| (YES|NO) \|$', line)
              if m and m.group(1) in sections:
                  b62 = int(m.group(2).replace(',', ''))
                  b63 = sections[m.group(1)]
                  delta = b63 - b62
                  sign = '+' if delta >= 0 else '-'
                  lines[i] = f'| {m.group(1)} | {b62:,} | {b63:,} | {sign}{abs(delta):,} | {m.group(5)} | {m.group(6)} |'
                  table[m.group(1)] = b63
          text = '\n'.join(lines) + ('\n' if text.endswith('\n') else '')
          for task, total in table.items():
              pattern = rf'(### {re.escape(task)}\n\n- active bytes: )([0-9,]+)(;)'
              text, n = re.subn(pattern, rf'\g<1>{total:,}\3', text, count=1)
              if n != 1:
                  raise SystemExit(f'failed refreshing sensor section {task}')
          p.write_text(text, encoding='utf-8')

          # Refresh implementation-state identities and disposition without rewriting historical evidence.
          p = Path('qualification/ssdp6/IMPLEMENTATION-STATE-PROTOCOL-6.3.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace(old_candidate, candidate)
          text = text.replace(old_bootstrap, bootstrap)
          text += f'\n\n## F3 owner-binding repair refresh\n\nThe independent Review of `{old_candidate}` was NO-PASS on accepted-state governing-owner binding. D4R3/E3/F3 repaired that D4 false-pass family. Current semantic candidate is `{candidate}` with replacement public bootstrap `{bootstrap}`. Fresh F3 executable evidence is `qualification/ssdp6/DIAGNOSTIC-PROTOCOL-6.3-F3-OWNER-BINDING.txt` plus `qualification/ssdp6/RESULTS-GPT-5.6-SOL-2026-09-12-PROTOCOL-6.3-F3.md`. Independent assembled-candidate Review remains pending; recovery/Stage G/accepted-current remain blocked.\n'
          p.write_text(text, encoding='utf-8')

          # Preservation census: preserve old rows, bind them to the repaired candidate, and make the owner-binding delta explicit.
          p = Path('qualification/ssdp6/SSDP-6.3-PRESERVATION-CENSUS.md')
          text = p.read_text(encoding='utf-8').replace(old_candidate, candidate)
          text += f'\n\n## F3 owner-binding preservation delta\n\nCandidate `{candidate}` preserves the prior T01-T120 census except where D4R3 deliberately strengthens the authority/acceptance-binding concretization. T45/T46/T67/T75-class owner-bearing paths now require accepted-state governing-owner binding; this is a monotonic repair of the reviewed false-pass, not a relaxation. Frozen Protocol 5.16/6.0/6.1/6.2 resources were rechecked by snapshot/Core/package gates and remain immutable. Prior F2 labels are historical evidence; affected authority/recurrence cases are rebound to fresh F3 discriminators and full candidate regression. Independent Review remains open.\n'
          p.write_text(text, encoding='utf-8')

          # Rewrite the handoff as the new review entrypoint, preserving the old candidate as negative evidence only.
          p = Path('qualification/ssdp6/INDEPENDENT-REVIEW-HANDOFF-PROTOCOL-6.3.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace(f'semantic_candidate: {old_candidate}', f'semantic_candidate: {candidate}', 1)
          text = text.replace(f'qualification_result_commit: {f2_commit}', 'qualification_result_commit: PENDING_CURRENT_F3_EVIDENCE_COMMIT', 1)
          text = text.replace('qualification_result: qualification/ssdp6/RESULTS-GPT-5.6-SOL-2026-09-12-PROTOCOL-6.3-F2.md', 'qualification_result: qualification/ssdp6/RESULTS-GPT-5.6-SOL-2026-09-12-PROTOCOL-6.3-F3.md', 1)
          text = text.replace(f'static_sensor_evidence_commit: {f2_commit}', 'static_sensor_evidence_commit: PENDING_CURRENT_F3_EVIDENCE_COMMIT', 1)
          text = text.replace(f'public_source_bootstrap: {old_bootstrap}', f'public_source_bootstrap: {bootstrap}', 1)
          text = text.replace(f'public_source_mapping_commit: {old_mapping}', f'public_source_mapping_commit: {candidate}', 1)
          text = text.replace(old_candidate, candidate)
          text = text.replace(old_bootstrap, bootstrap)
          text = text.replace(old_mapping, candidate)
          text = text.replace('### D4R2 — accepted-repair subject binding', '### D4R3 — accepted-state governing-owner binding')
          text = text.replace('Independently attempt all of the following: a real repair followed by an unrelated descendant file presented as acceptance; a typed acceptance artifact naming a different repair; missing/ambiguous acceptance state; missing accepting owner; reversed chronology; and copied/rebased/cherry-picked aliases. None may increment recurrence. A valid recurrence must establish a prior occurrence, exact accepted repair subject, durable accepted state/owner evidence, and materially later independent event.', 'Independently attempt all of the following: branch-only repair acceptance after the accepted project state; a typed acceptance artifact naming a different repair; missing/ambiguous acceptance state; free-text/candidate-only accepting owner; accepted owner content drift; reversed chronology; and copied/rebased/cherry-picked aliases. None may increment recurrence. Also attempt AUTHORITY_BOUND, normative notice, and comparative-priority laundering using a healthy candidate-only owner or authority-evidence artifact. Current authority requires accepted-state governing-owner binding plus semantic confirmation that the cited owner is the real owner for the exact claim.')
          text = text.replace('## F2 evidence to challenge', '## F3 evidence to challenge')
          text = text.replace('`qualification/ssdp6/RESULTS-GPT-5.6-SOL-2026-09-12-PROTOCOL-6.3-F2.md` at `6fc26ce374b5346495782871d5d7241de5b90071` is implementation-context evidence only. It freshly accounts for exactly 260 cases: 115 inherited scenarios, Q63-01..79, F63-A..BJ, and four Challenge passes. Sample the D4R2/D5R2 rows first, then verify complete accounting and that semantic-paired rows actually discriminate the stated counterfactual rather than merely restating doctrine.', f'`qualification/ssdp6/RESULTS-GPT-5.6-SOL-2026-09-12-PROTOCOL-6.3-F3.md` is implementation-context evidence only. It binds the repaired candidate `{candidate}` to fresh D4R3 direct discriminators and full candidate regression while carrying forward unaffected F2 semantic conclusions only with explicit applicability. Sample D4R3 owner/authority/recurrence paths first, then D5R2 and the inherited four Challenge dimensions. Do not treat green tests or this handoff as authority.')
          p.write_text(text, encoding='utf-8')
          PY
          python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md --write-summary
          git diff --check
          git add -A
          git commit -m 'Qualify Protocol 6.3 D4R3 repaired candidate'
          EVIDENCE_COMMIT=$(git rev-parse HEAD)
          python - "$EVIDENCE_COMMIT" <<'PY'
          from pathlib import Path
          import sys
          commit = sys.argv[1]
          p = Path('qualification/ssdp6/INDEPENDENT-REVIEW-HANDOFF-PROTOCOL-6.3.md')
          text = p.read_text(encoding='utf-8').replace('PENDING_CURRENT_F3_EVIDENCE_COMMIT', commit)
          p.write_text(text, encoding='utf-8')
          wp = Path('workplans/active/PROTOCOL-6.3-EVIDENCE-BACKED-PROJECT-ENGINEERING-MEMORY-WORKPLAN.md')
          text = wp.read_text(encoding='utf-8').replace('f3_qualification: qualification/ssdp6/RESULTS-GPT-5.6-SOL-2026-09-12-PROTOCOL-6.3-F3.md', f'f3_qualification_commit: {commit}\nf3_qualification: qualification/ssdp6/RESULTS-GPT-5.6-SOL-2026-09-12-PROTOCOL-6.3-F3.md')
          wp.write_text(text, encoding='utf-8')
          PY
          git add qualification/ssdp6/INDEPENDENT-REVIEW-HANDOFF-PROTOCOL-6.3.md workplans/active/PROTOCOL-6.3-EVIDENCE-BACKED-PROJECT-ENGINEERING-MEMORY-WORKPLAN.md
          git commit -m 'Bind Protocol 6.3 F3 review handoff evidence'
          git push origin HEAD:ssdp-6.3-engineering-memory
