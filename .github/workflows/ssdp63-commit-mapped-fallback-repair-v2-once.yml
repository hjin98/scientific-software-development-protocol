name: Commit Protocol 6.3 mapped fallback repair v2 once

on:
  push:
    branches: [ssdp-6.3-engineering-memory]
    paths: [.github/workflows/ssdp63-commit-mapped-fallback-repair-v2-once.yml]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ssdp-6.3-engineering-memory
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r source/requirements-validation.txt
          python -m pip install ./orchestrator -r orchestrator/requirements-dev.txt
      - name: Apply mapped-state repair with inherited self-reference-safe capability preserved
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import yaml
          from pathlib import Path
          data = yaml.safe_load(Path('.github/workflows/ssdp63-finalize-mapped-fallback-once.yml').read_text(encoding='utf-8'))
          steps = data['jobs']['repair']['steps']
          run = next(s['run'] for s in steps if s.get('name') == 'Repair mapped-fallback state and discriminator')
          Path('/tmp/apply-mapped-fallback-repair.sh').write_text(run, encoding='utf-8')
          PY
          bash /tmp/apply-mapped-fallback-repair.sh
          python - <<'PY'
          from pathlib import Path
          p = Path('source/shared/references/development-workflow-prompts.md')
          text = p.read_text(encoding='utf-8')
          old = 'The immutable repaired snapshot `e12572c021087308570abfa41657a910c6896457` passed bootstrap readiness'
          new = 'The immutable repaired self-reference-safe source snapshot `e12572c021087308570abfa41657a910c6896457` passed bootstrap readiness'
          if text.count(old) != 1:
              raise SystemExit(f'expected one prompt transition sentence, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          p = Path('tests/test_protocol_63_bootstrap.py')
          text = p.read_text(encoding='utf-8')
          old = "self.assertIn(f'The immutable repaired snapshot `{BOOTSTRAP}`', prompts)"
          new = "self.assertIn(f'The immutable repaired self-reference-safe source snapshot `{BOOTSTRAP}`', prompts)"
          if text.count(old) != 1:
              raise SystemExit(f'expected one new bootstrap prompt assertion, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Validate final assembled semantic state
        shell: bash
        run: |
          set -euo pipefail
          BASELINE=b59adc77efe6951912cfd705cc43830c58ca27d0
          env SSDP_VALIDATE_PUBLIC_FALLBACK=1 python -m unittest -v tests.test_protocol_63_bootstrap
          python -m unittest -v tests.test_protocol_516_orchestration
          python -m unittest -v tests.test_protocol_63_reopened_repairs tests.test_protocol_63_engineering_memory
          python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md --write-summary
          rm -rf /tmp/ssdp63-v2-dist
          python source/build_skills.py --output /tmp/ssdp63-v2-dist
          python source/validate_packages.py --dist /tmp/ssdp63-v2-dist
          rm -rf dist
          cp -a /tmp/ssdp63-v2-dist dist
          python orchestrator/scripts/generate_protocol_snapshot.py
          env SSDP_VALIDATE_PUBLIC_FALLBACK=1 python -m unittest discover -s tests -v
          rm -rf /tmp/ssdp63-v2-check
          python source/build_skills.py --output /tmp/ssdp63-v2-check
          python source/validate_packages.py --dist /tmp/ssdp63-v2-check
          python source/check_dist.py --expected /tmp/ssdp63-v2-check --committed dist
          python orchestrator/scripts/generate_protocol_snapshot.py --check
          python orchestrator/scripts/run_core_tests.py
          for version in sdp-protocol-5.16 ssdp-protocol-6.0 ssdp-protocol-6.1 ssdp-protocol-6.2; do
            git diff --exit-code "$BASELINE" -- "orchestrator/src/sdp_orchestrator/core/resources/protocol/${version}"
          done
          git diff --check
          grep -F 'self-reference-safe source snapshot' source/shared/references/development-workflow-prompts.md
          ! git grep -i -e 'no current 6.3 public fallback is authorized' -e 'no 6.3 public fallback is authorized until' -e 'no replacement public fallback is currently authorized' -e 'no replacement fallback is currently authorized' -- README.md PORTABILITY.md source/shared/references/development-workflow-prompts.md source/shared/references/protocol-versioning-and-compatibility.md
      - name: Commit final semantic repair
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/ssdp63-commit-mapped-fallback-repair-v2-once.yml
          rm .github/workflows/ssdp63-commit-mapped-fallback-repair-once.yml
          rm .github/workflows/ssdp63-finalize-mapped-fallback-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize Protocol 6.3 mapped public fallback state'
          git push origin HEAD:ssdp-6.3-engineering-memory
