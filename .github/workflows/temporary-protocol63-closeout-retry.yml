name: Temporary Protocol 6.3 lifecycle closeout retry

on:
  push:
    branches: [ssdp-6.3-engineering-memory]

permissions:
  contents: write

jobs:
  closeout:
    if: github.event.head_commit.message == 'Retry Protocol 6.3 closeout with successor-aware oracles'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ssdp-6.3-engineering-memory
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install protocol and orchestrator validation dependencies
        run: |
          python -m pip install -r source/requirements-validation.txt
          python -m pip install ./orchestrator -r orchestrator/requirements-dev.txt
      - name: Apply lifecycle closeout and successor-aware oracle reconciliation
        shell: bash
        run: |
          set -euxo pipefail
          python orchestrator/scripts/protocol_63_closeout.py
          python - <<'PY'
          from pathlib import Path

          versioning = Path('source/shared/references/protocol-versioning-and-compatibility.md')
          text = versioning.read_text()
          old = 'so replacement self-reference-safe source snapshot `86c13cab6bdd1991dffa94e277db8eacf87e2e11`'
          new = 'so Replacement self-reference-safe source snapshot `86c13cab6bdd1991dffa94e277db8eacf87e2e11`'
          if text.count(old) != 1:
              raise SystemExit(f'versioning phrase anchor count={text.count(old)}')
          versioning.write_text(text.replace(old, new, 1))

          test = Path('tests/test_protocol_62_closeout.py')
          text = test.read_text()
          old = '''    def test_current_and_historical_profile_state_is_explicit(self):
        versioning = (ROOT / "source/shared/references/protocol-versioning-and-compatibility.md").read_text()
        portability = (ROOT / "PORTABILITY.md").read_text()
        self.assertIn("| `ssdp-protocol-6.1` | 6.1.0 | 2 | frozen historical rollback |", versioning)
        self.assertIn("| `ssdp-protocol-6.2` | 6.2.0 | 2 | accepted current |", versioning)
        self.assertIn("| `ssdp-protocol-6.1` | 6.1.0 | 2 | frozen historical rollback |", portability)
        self.assertIn("| `ssdp-protocol-6.2` | 6.2.0 | 2 | accepted current |", portability)
'''
          new = '''    def test_current_and_historical_profile_state_is_explicit(self):
        versioning = (ROOT / "source/shared/references/protocol-versioning-and-compatibility.md").read_text()
        portability = (ROOT / "PORTABILITY.md").read_text()
        self.assertIn("| `ssdp-protocol-6.1` | 6.1.0 | 2 | frozen historical rollback |", versioning)
        self.assertIn("| `ssdp-protocol-6.2` | 6.2.0 | 2 | frozen historical rollback |", versioning)
        self.assertIn("| `ssdp-protocol-6.3` | 6.3.0 | 2 | accepted current |", versioning)
        self.assertIn("| `ssdp-protocol-6.1` | 6.1.0 | 2 | frozen historical rollback |", portability)
        self.assertIn("| `ssdp-protocol-6.2` | 6.2.0 | 2 | frozen historical rollback |", portability)
        self.assertIn("| `ssdp-protocol-6.3` | 6.3.0 | 2 | accepted current |", portability)
'''
          if text.count(old) != 1:
              raise SystemExit(f'profile-state oracle anchor count={text.count(old)}')
          text = text.replace(old, new, 1)
          old = '''    def test_current_dependency_view_names_62_as_current(self):
        dependencies = (ROOT / "source/SEMANTIC_DEPENDENCIES.md").read_text()
        self.assertIn("ssdp-protocol-6.2 CONSTRAINED_BY -> accepted-current Protocol 6.2 semantics", dependencies)
        self.assertIn("ssdp-protocol-6.1 CONSTRAINED_BY -> immutable historical Protocol 6.1 rollback semantics", dependencies)
'''
          new = '''    def test_current_dependency_view_advances_without_losing_62_history(self):
        dependencies = (ROOT / "source/SEMANTIC_DEPENDENCIES.md").read_text()
        self.assertIn("ssdp-protocol-6.3 CONSTRAINED_BY -> accepted-current Protocol 6.3 semantics", dependencies)
        self.assertIn("ssdp-protocol-6.2 CONSTRAINED_BY -> immutable historical Protocol 6.2 rollback semantics", dependencies)
        self.assertIn("ssdp-protocol-6.1 CONSTRAINED_BY -> immutable historical Protocol 6.1 rollback semantics", dependencies)
'''
          if text.count(old) != 1:
              raise SystemExit(f'dependency oracle anchor count={text.count(old)}')
          test.write_text(text.replace(old, new, 1))
          PY
      - name: Regenerate portable packages and current snapshot
        run: |
          python source/build_skills.py --output dist
          python orchestrator/scripts/generate_protocol_snapshot.py
          rm -rf /tmp/protocol-dist
          python source/build_skills.py --output /tmp/protocol-dist
      - name: Validate exact closeout tree
        run: |
          set -euxo pipefail
          python -m unittest discover -s tests -v
          python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md
          python source/validate_packages.py --dist /tmp/protocol-dist
          python source/check_dist.py --expected /tmp/protocol-dist --committed dist
          python orchestrator/scripts/generate_protocol_snapshot.py --check
          python orchestrator/scripts/run_core_tests.py
          git diff --check
      - name: Commit lifecycle closeout
        run: |
          set -euxo pipefail
          git config user.name 'Protocol 6.3 lifecycle automation'
          git config user.email 'protocol63-lifecycle@users.noreply.github.com'
          git rm orchestrator/scripts/protocol_63_closeout.py
          git rm .github/workflows/temporary-protocol63-closeout.yml
          git rm .github/workflows/temporary-protocol63-closeout-retry.yml
          git rm qualification/ssdp6/TEMP-PROTOCOL63-CLOSEOUT-TEST.log
          git add -A
          git diff --cached --check
          git commit -m 'Close Protocol 6.3 lifecycle'
          git push origin HEAD:ssdp-6.3-engineering-memory
