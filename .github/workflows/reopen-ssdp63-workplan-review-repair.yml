name: Reopen SSDP 6.3 workplan after independent review

on:
  push:
    branches:
      - ssdp-6.3-engineering-memory
    paths:
      - .github/workflows/reopen-ssdp63-workplan-review-repair.yml

permissions:
  contents: write

jobs:
  update-workplan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reopen workplan with independent-review repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('workplans/active/PROTOCOL-6.3-EVIDENCE-BACKED-PROJECT-ENGINEERING-MEMORY-WORKPLAN.md')
          text = path.read_text(encoding='utf-8')

          meta_anchor = 'implementation_handoff: authorized\n'
          meta_insert = '''implementation_handoff: authorized
implementation_review_status: no-pass-reopened-after-independent-review
reviewed_semantic_candidate: 8d0ad2395ccd126c133d8aad206cfc859f660124
branch_basis_before_review_reopen: 99461782bbac28045304f7234b0a4e85edd91ee3
reopened_implementation_stages: [B, C, D, E, F]
stage_g_status: blocked-pending-repaired-stage-f-and-independent-review-pass
'''
          if 'implementation_review_status: no-pass-reopened-after-independent-review' not in text:
              if meta_anchor not in text:
                  raise SystemExit('front-matter insertion anchor missing')
              text = text.replace(meta_anchor, meta_insert, 1)

          repair_heading = '### 12.1 Independent implementation Review reopening and owning-layer repair contract'
          if repair_heading not in text:
              anchor = '\n## 13. Falsification obligations\n'
              if anchor not in text:
                  raise SystemExit('qualification/falsification anchor missing')
              repair = r'''
### 12.1 Independent implementation Review reopening and owning-layer repair contract

The independent Protocol-6.2-governed implementation Review of semantic candidate `8d0ad2395ccd126c133d8aad206cfc859f660124` is **NO-PASS with no Serious Challenge to the Protocol 6.3 design**. The governing doctrine and workplan remain coherent; the blockers are failures to concretize already-required Protocol 6.3 semantics and false Stage-F closure. Stage A remains valid unless a repair discovers a new affected durable/generative surface. Stages **B, C, D, E, and F are reopened** over the affected surface below. Stage G is blocked until a repaired replacement candidate passes the full Stage-F gate and a new independent assembled-candidate Review.

`qualification/ssdp6/RESULTS-GPT-5.6-SOL-2026-09-11-PROTOCOL-6.3-260.md` remains immutable historical execution evidence but **is not current Stage-F PASS evidence**. At least some of its PASS dispositions were falsified by assembled-candidate review; no later work may inherit its aggregate `260/260` verdict. The existing `qualification/ssdp6/INDEPENDENT-REVIEW-HANDOFF-PROTOCOL-6.3.md` is likewise stale for acceptance after semantic repair and must be regenerated against the replacement candidate.

Repair at the existing owners. Do not add a parallel compliance framework, second memory authority, database, daemon, background indexer, wrapper around the validator, or package-side workaround. Extend the canonical PEM/schema/workflow/evidence/Git owners and the existing `source/project_engineering_memory.py` validator only where needed to make the already-specified semantics discriminating.

#### R63-01 - resolvable durable evidence bindings, not non-empty strings

Material PEM evidence bindings SHALL be structurally typed enough to distinguish repository/project identity, immutable revision/release/incident identity, path/artifact, and stable finding/test/section where applicable. The validator/qualification resolver SHALL reject a path-qualified Git route whose alleged revision is only a blob SHA, floating branch/default/latest, nonexistent object, or revision that does not contain the named path. Cross-repository evidence SHALL require unambiguous source repository/project identity.

Keep ordinary PEM reading network-independent. Perform cheap structural/local-Git resolution when the object is locally available; use bounded CI/qualification remote realization only when a material external/public route must be proven. Failure to resolve a required current binding degrades it to `REVIEW_REQUIRED`/`UNAVAILABLE`; it cannot remain `HEALTHY` merely because the string is non-empty.

Repair the self-hosted `PC-001` route that currently names `a9bfa4c8ade4ead8ab1820dc18d2f64e86ecd098` as though it were a commit containing `qualification/ssdp6/SSDP-6.3-PRESERVATION-CENSUS.md`. Select an already-existing immutable **commit/tree revision that actually contains the intended census revision**, prove the path resolves there, and recompute binding health. Do not substitute the current containing commit or another self-referential identity.

**Required discriminator:** a valid commit+path route passes; the same path with a blob SHA, missing revision, wrong repository, or path absent at that revision fails. Reopen at minimum Q63-06, Q63-45, Q63-68 and their F63 counterparts.

#### R63-02 - coherent root/partition logical publication

A declared cold partition SHALL be cryptographically or equivalently bound to the root's assembled logical publication state rather than accepted solely because schema and `project_id` match. Use the smallest non-recursive representation that proves exact partition content expected by the root; a root-declared digest/content identity per detail file is the preferred solution unless an equally discriminating owner-layer mechanism is simpler. Do not require a file to know the containing commit SHA and do not create a second canonical memory.

The root remains the one discovery/current-summary surface. Unchanged partitions need not be rewritten when another partition changes; therefore avoid a global hand-maintained generation token that forces unrelated partition churn. Root-declared expected identities should allow changed partitions plus root to publish atomically while untouched canonical detail remains byte-identical.

**Required discriminator:** assemble a root with an older same-project partition whose schema/project ID remain valid; validation must fail specifically for publication/content mismatch. Correct root+partition and stale-index-with-canonical-fallback cases must still pass. Reopen Q63-58, Q63-63, F63-AO/F63-AT and package/security atomic-publication checks as applicable.

#### R63-03 - structured accepted-base/candidate-overlay and executable HAS basis validation

`accepted_base` and `candidate_overlay` SHALL not be opaque truthy strings for memory-dependent decisions. Schema/template/validator SHALL preserve enough structured identity to distinguish: exact project/repository; accepted integration/recovery revision; whether accepted PEM exists at that basis; overlay state/identity; and the overlay's exact accepted base. A candidate overlay cannot self-ratify or erase accepted entries by omission.

Add the smallest reusable HAS validator/fixture support to the existing PEM validation module or directly adjacent workflow validation surface; do not create another control plane. It SHALL check exact accepted-base/overlay basis, known family/notice IDs, one disposition per materially relevant item (`APPLICABLE`, `NOT_APPLICABLE`, `REVIEW_REQUIRED`), non-empty bounded reason, and stale-basis reconciliation when the accepted base materially advances. Missing/partial PEM remains uncertainty, never proof of non-applicability.

This repair cycle is itself memory-triggering. Its current decision basis is:

```yaml
pem_basis:
  accepted_base:
    protocol: 6.2.0
    revision: b59adc77efe6951912cfd705cc43830c58ca27d0
    accepted_pem: NONE
  reviewed_semantic_candidate: 8d0ad2395ccd126c133d8aad206cfc859f660124
  branch_basis_before_reopen: 99461782bbac28045304f7234b0a4e85edd91ee3
  candidate_overlay_state: REVIEW_REQUIRED_PENDING_REPAIR
has:
  - id: FF-001
    disposition: APPLICABLE
    reason: The repair changes canonical 6.3 source after publication of an immutable bootstrap; the premature-bootstrap failure family directly constrains replacement-bootstrap sequencing.
  - id: PC-001
    disposition: REVIEW_REQUIRED
    reason: Frozen prior-version resources remain independently owner-required, but one PEM evidence route is currently unresolvable as a path-qualified commit binding and must be repaired before relying on PEM binding health.
  - id: SP-001
    disposition: APPLICABLE
    reason: Repairing the canonical owner and deterministically regenerating descendants is a relevant evidence-only design prior; it is not authority and does not mandate retention of any obsolete mechanism.
```

At implementation start and again before closeout, reconcile this HAS against any branch/accepted-memory advance and record the refreshed exact basis. Reopen Q63-43, Q63-53, Q63-64, Q63-77, F63-Z/F63-AJ/F63-AU/F63-BH.

#### R63-04 - observation must exist independently of assessment

Every evidence-bearing failure occurrence and evaluated positive application episode that can contribute to current counts/maturity/guidance SHALL carry a non-empty immutable observation/realization identity appropriate to the record. An admissible assessment without an observation SHALL not contribute current support/confirmation. Later invalidation/reclassification adds or supersedes assessment/admissibility without rewriting the historical observation. Clerical correction must preserve prior value/correction provenance enough to explain the change.

**Required discriminator:** removing `observation` from an otherwise admissible occurrence/application must fail or make the row non-contributing; adding a superseding invalid assessment must withdraw current support while leaving the original observation byte-for-byte unchanged in the fixture. Reopen Q63-20, Q63-55, Q63-73, F63-BD and related evidence-lifecycle cases.

#### R63-05 - recurrence must resolve accepted-repair lineage, not truthy metadata

Replace the current `prior_accepted_repair` truthiness check with cross-row causal/project lineage validation. A recurrence occurrence SHALL identify the prior family occurrence/repair episode it recurs after; that prior row SHALL contain a durable, resolvable accepted-repair/qualification identity; the later occurrence SHALL have a distinct underlying event identity; copied/cherry-picked/rebased instances of the same event SHALL not manufacture recurrence. Where project lineage is non-local, source project/repository identity remains explicit.

A simple implementation may retain `prior_accepted_repair` for readability but must prove that it matches the accepted repair bound to the referenced earlier occurrence. `prior_accepted_repair: arbitrary-text` is not sufficient evidence.

**Required discriminator:** no prior occurrence, unresolved repair acceptance, same copied event, or arbitrary repair string fails recurrence; a later independently identified event after a resolvable accepted repair increments occurrence and recurrence exactly once. Reopen Q63-11, Q63-67, F63-AX.

#### R63-06 - provenance clusters must constrain independence-sensitive maturity and comparative claims

Continue counting legitimate distinct application episodes even when correlated, but derive and expose provenance-cluster diversity separately from application count. `PROVEN`, independence-sensitive replication, or comparative/preferred/default/best guidance SHALL not treat several applications from one policy/copied implementation/common harness/oracle/dataset cluster as independent corroboration.

Make `maturity_basis` discriminating rather than accepting only `all_obligations_closed: true` plus arbitrary evidence. When the bounded claim requires independence/replication/comparator closure, the basis SHALL declare those obligations and demonstrate them from current admissible rows/clusters/owner state. Missing required independence information, unresolved common-mode dependence, or one shared cluster cannot be papered over by count, temperature, reviewer vote, or a Boolean closure flag.

**Required discriminator:** three supporting episodes in one provenance cluster may remain three applications but cannot satisfy a two-independent-route/cluster PROVEN obligation; two appropriately independent clusters can satisfy it when all other bounded obligations close. Reopen Q63-08, Q63-74, Q63-78, F63-H/F63-BE/F63-BI and comparative-guidance cases that depend on independence.

#### R63-07 - current notice expiry must be machine-discriminating where the trigger is machine-decidable

Replace free-text-only `review_or_expiry` as the operative state with a structured expiry/review predicate plus optional human-readable explanation. Support the smallest useful trigger set required by current doctrine, including at least explicit date/time and accepted-base change; owner/evidence-binding change may reuse existing current binding/context data when available. A triggered predicate SHALL prevent unqualified `CURRENT` guidance and require reconciliation to current owner/family/`REVIEW_REQUIRED`/`RETIRED` as appropriate. An unknown/unsupported predicate for a memory-dependent decision fails safe to review-required rather than silently remaining current.

Do not add a scheduler/background service. Expiry is evaluated when PEM is validated/read for a memory-dependent decision.

**Required discriminator:** a past date or mismatched accepted-base trigger cannot remain `CURRENT/HEALTHY`; a future/not-yet-triggered predicate may remain current if all other requirements pass. Reopen Q63-48, F63-AE.

#### R63-08 - self-hosted PEM correction and evidence-backed learning closeout

After R63-01 through R63-07 are implemented, revalidate the repository's own `PROJECT-ENGINEERING-MEMORY.md` with real evidence resolution. Correct `PC-001` before calling its binding `HEALTHY` again. Independently reconstruct all derived counts, temperatures, maturity, guidance, coverage and active-summary ordering; do not preserve the old summary merely because it matched the old validator.

The independent Review has exposed the same failure mechanism represented by `FF-001`: an immutable Protocol 6.3 bootstrap was published before later review found source-level validation defects that must change the final 6.3 source. Once the replacement repair/qualification evidence is immutable, reconcile this as **one candidate recurrence episode** only if the durable evidence confirms the same semantic family and accepted-prior-repair lineage; do not increment merely from this workplan statement. If confirmed, record it exactly once, bind the accepted 6.2 prior repair, and recompute recurrence/temperature from evidence. Perform the analogous closeout assessment for `SP-001` only after the owner-layer repair actually succeeds; do not pre-credit a positive application.

#### R63-09 - invalidate stale 6.3 bootstrap and bind a replacement bootstrap/candidate

The currently published Protocol 6.3 public-source bootstrap `1484c1d3caa49d87cc15bc52a5e775399c1dae1b` predates required semantic repairs to canonical 6.3 source/validator behavior. It therefore becomes a **historical invalidated pre-repair bootstrap attempt**, not the final/current 6.3 public fallback. Preserve it as evidence; do not rewrite or delete it.

After R63-01 through R63-08 and affected source regression pass, choose a new already-existing immutable, self-reference-safe source bootstrap. Its snapshot must contain the repaired schema/template/validator/routes and pass source regression, canonical package build, independent package/link validation, profile/snapshot/Core integrity as affected, and exact-ref remote/public fallback realization. Publish the exact replacement bootstrap only from a later descendant mapping commit. The bootstrap must not self-name. Default/latest/branch/semantic-version substitution remains forbidden.

Because the repaired canonical source changes, `8d0ad2395ccd126c133d8aad206cfc859f660124` is permanently the **reviewed rejected semantic candidate**, not the replacement candidate. Bind one new immutable semantic candidate only after the repaired source, self-hosted PEM, generated descendants and replacement-bootstrap mapping are coherent. Preserve all frozen 5.16/6.0/6.1/6.2 resources byte-identically.

Reopen Q63-25, Q63-26, Q63-27, Q63-30 and bootstrap/frozen/generated Challenge cases. The old bootstrap PASS report remains historical evidence for what that snapshot satisfied; it cannot prove the repaired source exists at that snapshot.

#### R63-10 - fresh Stage-F qualification; no doctrine-only or aggregate false PASS

Create executable/discriminating qualification for every mechanically testable Q63/F63 obligation. A prose statement that canonical doctrine forbids a behavior is not a counterfactual oracle when the assembled D4 representation still accepts that behavior. For obligations requiring human/semantic judgment, record the concrete mutated/synthetic counterexample and the bounded owner/reviewer decision that rejects it; do not mark a case PASS merely by quoting the rule.

At minimum add explicit negative fixtures for every repair above, then audit all other Q63-01 through Q63-79 and F63-A through F63-BJ rows for the same oracle defect. Every required case must actually execute or have a concrete review realization bound to the replacement candidate. Rerun:

- complete affected source/test regression;
- all 115 inherited Protocol 6.2 semantic scenarios;
- affected 6.1/6.2 requalifications;
- all Q63-01 through Q63-79;
- all F63-A through F63-BJ;
- all four inherited Protocol 6.2 Challenge passes;
- static activation/context sensors with structural claim scope only;
- self-hosted PEM independent reconstruction and counterevidence search;
- source -> generated dist -> 6.3 profile/snapshot -> package -> Orchestrator Core acceptance on the exact repaired candidate.

Write a **new** qualification result bound to the replacement semantic candidate and replacement bootstrap. Preserve `RESULTS-GPT-5.6-SOL-2026-09-11-PROTOCOL-6.3-260.md` unchanged as superseded/invalidated Stage-F evidence rather than editing its historical PASS rows.

#### R63-11 - replacement independent Review handoff and recovery gate

Regenerate `qualification/ssdp6/INDEPENDENT-REVIEW-HANDOFF-PROTOCOL-6.3.md` only after the repaired Stage-F result is complete. The handoff SHALL explicitly name the rejected candidate `8d0ad239...`, invalidated bootstrap `1484c1d3...`, replacement bootstrap, replacement semantic candidate, repair commits/range, refreshed preservation census state, repaired self-hosted PEM/HAS basis, all red/unavailable/contested evidence, and why each prior false-pass path now fails under a discriminator.

The next reviewer must again inspect the assembled replacement candidate independently under accepted Protocol 6.2 Review discipline. No author-context repair activity, green CI, replacement `260/260` aggregate, or updated handoff can self-supply independent Review PASS. Stage G/recovery remains blocked until that independent Review returns PASS with no genuine blocker.

#### Repair completion gate

This reopening closes only when all of the following are true:

1. every R63-01 through R63-11 obligation is implemented at its existing owner or explicitly shown non-applicable with discriminating evidence;
2. self-hosted PEM validates under real binding-resolution/publication/HAS semantics and its derived summary is independently reconstructed;
3. the old 6.3 bootstrap and old semantic candidate are represented as historical rejected/invalidated lifecycle identities, never current fallback/candidate;
4. replacement bootstrap, replacement semantic candidate, generated/profile/package/Core state and full fresh qualification are mutually coherent;
5. frozen 5.16/6.0/6.1/6.2 resources remain byte-identical;
6. refreshed HAS is bound to the actual closeout accepted-base/overlay state;
7. a new independent assembled-candidate Review returns PASS.

Only then may Stage G choose and later publish an immutable 6.3 recovery target. No `main` cutover is authorized by this repair reopening.
'''
              text = text.replace(anchor, '\n' + repair.strip() + '\n\n## 13. Falsification obligations\n', 1)

          stages_anchor = '## 14. Implementation stages\n'
          stages_note = '''## 14. Implementation stages

> **Independent-Review reopening:** Stage A remains preserved subject to newly discovered affected surface. Stages B, C, D, E, and F are reopened over Section 12.1. Stage G is blocked until repaired Stage-F qualification and a new independent Review PASS.
'''
          if '> **Independent-Review reopening:**' not in text:
              if stages_anchor not in text:
                  raise SystemExit('implementation stages anchor missing')
              text = text.replace(stages_anchor, stages_note, 1)

          handoff_anchor = '## 15. Independent-review handoff\n'
          stale_note = '''## 15. Independent-review handoff

> **Current status:** the pre-repair 6.3 handoff is stale for acceptance because candidate `8d0ad2395ccd126c133d8aad206cfc859f660124` is NO-PASS. Rebuild this handoff only after Section 12.1 repair and fresh Stage-F qualification; do not patch the old candidate identity into a nominal PASS handoff.
'''
          if '> **Current status:** the pre-repair 6.3 handoff is stale' not in text:
              if handoff_anchor not in text:
                  raise SystemExit('handoff anchor missing')
              text = text.replace(handoff_anchor, stale_note, 1)

          path.write_text(text, encoding='utf-8')
          PY

          git rm .github/workflows/reopen-ssdp63-workplan-review-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workplans/active/PROTOCOL-6.3-EVIDENCE-BACKED-PROJECT-ENGINEERING-MEMORY-WORKPLAN.md
          git diff --cached --check
          git commit -m "Reopen Protocol 6.3 workplan after independent review"
          git push
