# repaired lifecycle: preserve the established unavailable sentinel until exact immutable mapping
name: Finalize Protocol 6.3 replacement bootstrap

on:
  push:
    branches: [ssdp-6.3-engineering-memory]
    paths: [.github/workflows/ssdp63-bootstrap-finalize.yml]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}

      - name: Install validation and Orchestrator dependencies
        run: |
          python -m pip install -r source/requirements-validation.txt
          python -m pip install ./orchestrator -r orchestrator/requirements-dev.txt

      - name: Regenerate and qualify immutable candidate
        shell: bash
        run: |
          set -euo pipefail
          python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md --write-summary
          rm -rf /tmp/protocol-dist
          python source/build_skills.py --output /tmp/protocol-dist
          python source/validate_packages.py --dist /tmp/protocol-dist
          rm -rf dist && cp -a /tmp/protocol-dist dist
          python orchestrator/scripts/generate_protocol_snapshot.py
          python -m unittest discover -s tests -v
          rm -rf /tmp/protocol-dist-check
          python source/build_skills.py --output /tmp/protocol-dist-check
          python source/validate_packages.py --dist /tmp/protocol-dist-check
          python source/check_dist.py --expected /tmp/protocol-dist-check --committed dist
          python orchestrator/scripts/generate_protocol_snapshot.py --check
          python orchestrator/scripts/run_core_tests.py
          git diff --check

      - name: Commit self-reference-safe repaired candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/ssdp63-bootstrap-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Preserve Protocol 6.3 bootstrap-unavailable compatibility contract'
          git push origin HEAD:ssdp-6.3-engineering-memory
          git rev-parse HEAD > /tmp/candidate_sha

      - name: Qualify exact immutable candidate remotely
        shell: bash
        env:
          SSDP_VALIDATE_PUBLIC_FALLBACK: '1'
        run: |
          set -euo pipefail
          candidate="$(cat /tmp/candidate_sha)"
          python - "$candidate" <<'PY'
          from pathlib import Path
          import sys
          candidate = sys.argv[1]
          p = Path('tests/test_protocol_63_bootstrap.py')
          t = p.read_text(encoding='utf-8')
          sentinel = 'UNAVAILABLE_PENDING_REPLACEMENT_BOOTSTRAP'
          needle = f'BOOTSTRAP = "{sentinel}"'
          if needle not in t:
              raise SystemExit('bootstrap test sentinel missing')
          p.write_text(t.replace(needle, f'BOOTSTRAP = "{candidate}"', 1), encoding='utf-8')
          PY
          python -m unittest -v tests.test_protocol_63_bootstrap.Protocol63BootstrapTests.test_published_bootstrap_snapshot_is_real_self_reference_safe_and_route_complete
          git checkout -- tests/test_protocol_63_bootstrap.py

      - name: Publish exact replacement mapping from descendant
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(cat /tmp/candidate_sha)"
          python - "$candidate" <<'PY'
          from pathlib import Path
          import sys
          candidate = sys.argv[1]
          sentinel = 'UNAVAILABLE_PENDING_REPLACEMENT_BOOTSTRAP'
          paths = [
              'source/shared/references/protocol-versioning-and-compatibility.md',
              'source/shared/references/development-workflow-prompts.md',
              'PORTABILITY.md',
              'README.md',
              'tests/test_protocol_63_bootstrap.py',
          ]
          for raw in paths:
              p = Path(raw)
              t = p.read_text(encoding='utf-8')
              if sentinel not in t:
                  raise SystemExit(f'expected bootstrap sentinel missing: {raw}')
              p.write_text(t.replace(sentinel, candidate), encoding='utf-8')
          PY
          python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md --write-summary
          rm -rf /tmp/protocol-dist-final
          python source/build_skills.py --output /tmp/protocol-dist-final
          python source/validate_packages.py --dist /tmp/protocol-dist-final
          rm -rf dist && cp -a /tmp/protocol-dist-final dist
          python orchestrator/scripts/generate_protocol_snapshot.py

      - name: Final mapped-candidate acceptance
        shell: bash
        env:
          SSDP_VALIDATE_PUBLIC_FALLBACK: '1'
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v
          rm -rf /tmp/protocol-dist-final-check
          python source/build_skills.py --output /tmp/protocol-dist-final-check
          python source/validate_packages.py --dist /tmp/protocol-dist-final-check
          python source/check_dist.py --expected /tmp/protocol-dist-final-check --committed dist
          python orchestrator/scripts/generate_protocol_snapshot.py --check
          python orchestrator/scripts/run_core_tests.py
          git diff --check

      - name: Commit replacement bootstrap mapping
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(cat /tmp/candidate_sha)"
          git add -A
          git diff --cached --check
          git commit -m "Publish qualified Protocol 6.3 replacement bootstrap ${candidate}"
          git push origin HEAD:ssdp-6.3-engineering-memory
