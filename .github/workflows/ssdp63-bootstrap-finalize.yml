name: Protocol 6.3 replacement bootstrap finalize

on:
  push:
    branches:
      - ssdp-6.3-engineering-memory

permissions:
  contents: write

concurrency:
  group: ssdp63-replacement-bootstrap-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: |
          python -m pip install -r source/requirements-validation.txt
          python -m pip install ./orchestrator -r orchestrator/requirements-dev.txt
      - name: Configure publication identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "START_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Assemble exact pending replacement candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          path = Path('.github/workflows/ssdp63-bootstrap-reconcile.yml')
          text = path.read_text(encoding='utf-8')
          start = '      - name: Assemble self-reference-safe replacement bootstrap candidate\n'
          end = '      - name: Qualify replacement bootstrap candidate before publication\n'
          if start not in text or end not in text:
              raise SystemExit('cannot locate canonical assembly step')
          block = text.split(start, 1)[1].split(end, 1)[0]
          marker = '        run: |\n'
          script = textwrap.dedent(block.split(marker, 1)[1])
          Path('/tmp/ssdp63-assemble.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/ssdp63-assemble.sh
      - name: Repair inherited bootstrap discriminators and remove transient machinery
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          OLD = "1484c1d3caa49d87cc15bc52a5e775399c1dae1b"
          PENDING = "UNAVAILABLE_PENDING_6.3_BOOTSTRAP_QUALIFICATION"

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected stale discriminator not found in {path}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "tests/test_protocol_516_orchestration.py",
              f'''            self.assertIn("current_public_ref = {OLD}", self.lower)\n            self.assertIn("accepted_6_2_public_ref = 5a062ebc472755607b9dc66d33a5ebbc4b7429aa", self.lower)\n            self.assertIn("self-reference-safe source snapshot", self.lower)\n''',
              f'''            current = re.search(r"current_public_ref = ([^\\s]+)", self.lower)\n            self.assertIsNotNone(current)\n            current_ref = current.group(1)\n            self.assertNotEqual(current_ref, "{OLD}")\n            self.assertTrue(\n                current_ref == "{PENDING.lower()}"\n                or re.fullmatch(r"[0-9a-f]{{40}}", current_ref)\n            )\n            self.assertIn("accepted_6_2_public_ref = 5a062ebc472755607b9dc66d33a5ebbc4b7429aa", self.lower)\n            self.assertIn("self-reference-safe source snapshot", self.lower)\n''',
          )

          replace_once(
              "tests/test_protocol_61_evidence_evolution.py",
              f'''                self.assertIn(f"ACCEPTED_6_2_PUBLIC_REF = {{bootstrap}}", prompts)\n                self.assertIn("CURRENT_PUBLIC_REF = {OLD}", prompts)\n                self.assertIn("version-bound 6.2 work continues to use exactly", lower)\n''',
              f'''                self.assertIn(f"ACCEPTED_6_2_PUBLIC_REF = {{bootstrap}}", prompts)\n                current = re.search(r"^CURRENT_PUBLIC_REF = (\\S+)$", prompts, re.MULTILINE)\n                self.assertIsNotNone(current)\n                current_ref = current.group(1)\n                self.assertNotEqual(current_ref, "{OLD}")\n                self.assertTrue(\n                    current_ref == "{PENDING}"\n                    or re.fullmatch(r"[0-9a-f]{{40}}", current_ref)\n                )\n                self.assertIn("version-bound 6.2 work continues to use exactly", lower)\n''',
          )

          replace_once(
              "tests/test_protocol_62_representation.py",
              f'''                self.assertIn(f"accepted_6_2_public_ref = {{bootstrap}}", prompt)\n                self.assertIn("current_public_ref = {OLD}", prompt)\n''',
              f'''                self.assertIn(f"accepted_6_2_public_ref = {{bootstrap}}", prompt)\n                current = re.search(r"current_public_ref = ([^\\s]+)", prompt)\n                self.assertIsNotNone(current)\n                current_ref = current.group(1)\n                self.assertNotEqual(current_ref, "{OLD}")\n                self.assertTrue(\n                    current_ref == "{PENDING.lower()}"\n                    or re.fullmatch(r"[0-9a-f]{{40}}", current_ref)\n                )\n''',
          )
          PY
          rm -f .github/workflows/ssdp63-bootstrap-finalize.yml
          rm -f .github/workflows/ssdp63-bootstrap-diagnostic.yml
          rm -f qualification/ssdp6/TEMP-PROTOCOL-6.3-BOOTSTRAP-TEST-DIAGNOSTIC.txt
      - name: Qualify self-reference-safe replacement snapshot before publication
        shell: bash
        run: |
          set -euo pipefail
          CI=1 python -m unittest discover -s tests -v
          python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md
          rm -rf /tmp/protocol-dist
          python source/build_skills.py --output /tmp/protocol-dist
          python source/validate_packages.py --dist /tmp/protocol-dist
          python source/check_dist.py --expected /tmp/protocol-dist --committed dist
          python orchestrator/scripts/generate_protocol_snapshot.py --check
          python orchestrator/scripts/run_core_tests.py
          git diff --check
          git diff --exit-code "$START_SHA" -- \
            orchestrator/src/sdp_orchestrator/core/resources/protocol/sdp-protocol-5.16 \
            orchestrator/src/sdp_orchestrator/core/resources/protocol/ssdp-protocol-6.0 \
            orchestrator/src/sdp_orchestrator/core/resources/protocol/ssdp-protocol-6.1 \
            orchestrator/src/sdp_orchestrator/core/resources/protocol/ssdp-protocol-6.2
      - name: Commit and publish self-reference-safe replacement snapshot
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m "Assemble Protocol 6.3 replacement bootstrap candidate"
          BOOTSTRAP_SHA=$(git rev-parse HEAD)
          echo "BOOTSTRAP_SHA=$BOOTSTRAP_SHA" >> "$GITHUB_ENV"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Realize replacement snapshot from exact public ref
        shell: bash
        run: |
          set -euo pipefail
          CI=1 BOOTSTRAP_SHA="$BOOTSTRAP_SHA" python - <<'PY'
          import importlib.util
          import os
          import unittest
          from pathlib import Path

          path = Path("tests/test_protocol_63_bootstrap.py")
          spec = importlib.util.spec_from_file_location("bootstrap_test", path)
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)
          module.BOOTSTRAP = os.environ["BOOTSTRAP_SHA"]
          suite = unittest.TestSuite([
              module.Protocol63BootstrapTests(
                  "test_published_bootstrap_snapshot_is_real_self_reference_safe_and_route_complete"
              )
          ])
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful():
              raise SystemExit(1)
          PY
      - name: Publish exact replacement mapping from a later descendant
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          pending = "UNAVAILABLE_PENDING_6.3_BOOTSTRAP_QUALIFICATION"
          replacement = os.environ["BOOTSTRAP_SHA"]
          paths = [
              "source/shared/references/protocol-versioning-and-compatibility.md",
              "source/shared/references/development-workflow-prompts.md",
              "PORTABILITY.md",
              "README.md",
              "tests/test_protocol_63_bootstrap.py",
          ]
          for raw in paths:
              path = Path(raw)
              text = path.read_text(encoding="utf-8")
              if pending not in text:
                  raise SystemExit(f"replacement sentinel missing from {raw}")
              path.write_text(text.replace(pending, replacement), encoding="utf-8")
          PY
          git add source/shared/references/protocol-versioning-and-compatibility.md \
            source/shared/references/development-workflow-prompts.md \
            PORTABILITY.md README.md tests/test_protocol_63_bootstrap.py
          git commit -m "Publish Protocol 6.3 replacement bootstrap mapping"
          echo "MAPPING_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Regenerate mapping-bearing descendants and final qualification
        shell: bash
        run: |
          set -euo pipefail
          python source/build_skills.py --output dist
          python orchestrator/scripts/generate_protocol_snapshot.py
          git add dist orchestrator/src/sdp_orchestrator/core/resources/protocol/ssdp-protocol-6.3
          git commit -m "Regenerate Protocol 6.3 mapped descendants"
          GENERATED_SHA=$(git rev-parse HEAD)
          echo "GENERATED_SHA=$GENERATED_SHA" >> "$GITHUB_ENV"

          CI=1 python -m unittest discover -s tests -v
          python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md
          rm -rf /tmp/protocol-dist
          python source/build_skills.py --output /tmp/protocol-dist
          python source/validate_packages.py --dist /tmp/protocol-dist
          python source/check_dist.py --expected /tmp/protocol-dist --committed dist
          python orchestrator/scripts/generate_protocol_snapshot.py --check
          python orchestrator/scripts/run_core_tests.py
          git diff --check
          git diff --exit-code "$START_SHA" -- \
            orchestrator/src/sdp_orchestrator/core/resources/protocol/sdp-protocol-5.16 \
            orchestrator/src/sdp_orchestrator/core/resources/protocol/ssdp-protocol-6.0 \
            orchestrator/src/sdp_orchestrator/core/resources/protocol/ssdp-protocol-6.1 \
            orchestrator/src/sdp_orchestrator/core/resources/protocol/ssdp-protocol-6.2
          test -z "$(git status --porcelain)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Record publication identities
        run: |
          echo "replacement_bootstrap=$BOOTSTRAP_SHA"
          echo "mapping_commit=$MAPPING_SHA"
          echo "generated_reconciliation=$GENERATED_SHA"
