name: SSDP 6.5 implementation qualification

on:
  push:
    branches:
      - ssdp-6.5-frontier-model-re-evaluation

permissions:
  contents: write

concurrency:
  group: ssdp65-implementation
  cancel-in-progress: true

jobs:
  implement-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation and orchestrator dependencies
        run: |
          python -m pip install -r source/requirements-validation.txt
          python -m pip install ./orchestrator -r orchestrator/requirements-dev.txt
      - name: Validate release state
        run: python source/release_state.py
      - name: Validate project engineering memory
        run: python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md
      - name: Regenerate canonical skill distributions
        run: python source/build_skills.py --output dist
      - name: Regenerate current orchestrator protocol snapshot
        run: python orchestrator/scripts/generate_protocol_snapshot.py
      - name: Run protocol regression
        run: python -m unittest discover -s tests -v
      - name: Validate generated packages
        run: python source/validate_packages.py --dist dist
      - name: Verify fresh distribution parity
        run: |
          python source/build_skills.py --output /tmp/protocol-dist
          python source/check_dist.py --expected /tmp/protocol-dist --committed dist
      - name: Verify orchestrator snapshot and Core
        run: |
          python orchestrator/scripts/generate_protocol_snapshot.py --check
          python orchestrator/scripts/run_core_tests.py
      - name: Check whitespace
        run: git diff --check
      - name: Commit generated descendants when qualification passes
        run: |
          git add dist orchestrator/src/sdp_orchestrator/core/resources/protocol/ssdp-protocol-6.5
          if git diff --cached --quiet; then
            echo "Generated descendants already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate Protocol 6.5 packaged descendants"
          git push origin HEAD:ssdp-6.5-frontier-model-re-evaluation
