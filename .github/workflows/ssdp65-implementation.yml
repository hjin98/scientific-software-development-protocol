name: SSDP 6.5 implementation qualification

on:
  push:
    branches:
      - ssdp-6.5-frontier-model-re-evaluation

permissions:
  contents: write

concurrency:
  group: ssdp65-implementation
  cancel-in-progress: true

jobs:
  implement-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation and orchestrator dependencies
        run: |
          python -m pip install -r source/requirements-validation.txt
          python -m pip install ./orchestrator -r orchestrator/requirements-dev.txt
      - name: Validate release state
        run: python source/release_state.py
      - name: Validate project engineering memory
        run: python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md
      - name: Regenerate canonical skill distributions
        run: python source/build_skills.py --output dist
      - name: Regenerate current orchestrator protocol snapshot
        run: python orchestrator/scripts/generate_protocol_snapshot.py
      - name: Run protocol regression
        id: regression
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -v > /tmp/protocol-regression.log 2>&1
          code=$?
          cat /tmp/protocol-regression.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist failing regression evidence
        if: steps.regression.outputs.exit_code != '0'
        shell: bash
        run: |
          mkdir -p qualification/ssdp65/evidence
          cp /tmp/protocol-regression.log qualification/ssdp65/evidence/LATEST-IMPLEMENTATION-REGRESSION.txt
          git add qualification/ssdp65/evidence/LATEST-IMPLEMENTATION-REGRESSION.txt
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Record Protocol 6.5 implementation regression evidence"
            git push origin HEAD:ssdp-6.5-frontier-model-re-evaluation
          fi
          exit 1
      - name: Validate generated packages
        run: python source/validate_packages.py --dist dist
      - name: Verify fresh distribution parity
        run: |
          python source/build_skills.py --output /tmp/protocol-dist
          python source/check_dist.py --expected /tmp/protocol-dist --committed dist
      - name: Verify orchestrator snapshot and Core
        id: core
        shell: bash
        run: |
          set +e
          {
            python orchestrator/scripts/generate_protocol_snapshot.py --check
            snapshot_code=$?
            if [ "$snapshot_code" -ne 0 ]; then
              exit "$snapshot_code"
            fi
            python orchestrator/scripts/run_core_tests.py
          } > /tmp/orchestrator-core.log 2>&1
          code=$?
          cat /tmp/orchestrator-core.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist failing Core evidence
        if: steps.core.outputs.exit_code != '0'
        shell: bash
        run: |
          mkdir -p qualification/ssdp65/evidence
          cp /tmp/orchestrator-core.log qualification/ssdp65/evidence/LATEST-ORCHESTRATOR-CORE-REGRESSION.txt
          git add qualification/ssdp65/evidence/LATEST-ORCHESTRATOR-CORE-REGRESSION.txt
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Record Protocol 6.5 Orchestrator Core regression evidence"
            git push origin HEAD:ssdp-6.5-frontier-model-re-evaluation
          fi
          exit 1
      - name: Check whitespace
        run: git diff --check
      - name: Commit generated descendants when qualification passes
        run: |
          git add dist orchestrator/src/sdp_orchestrator/core/resources/protocol/ssdp-protocol-6.5
          if git diff --cached --quiet; then
            echo "Generated descendants already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate Protocol 6.5 packaged descendants"
          git push origin HEAD:ssdp-6.5-frontier-model-re-evaluation
