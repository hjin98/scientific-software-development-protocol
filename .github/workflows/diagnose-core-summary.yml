name: Diagnose post-repair Core summary

on:
  pull_request:
    types: [synchronize, opened, reopened]

permissions:
  contents: read

jobs:
  diagnose-core-summary:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ssdp-6.2-lossless-representation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Core
        run: python -m pip install ./orchestrator -r orchestrator/requirements-dev.txt
      - name: Run exact full acceptance wrapper
        shell: bash
        run: |
          set +e
          python orchestrator/scripts/run_core_tests.py 2>&1 | tee /tmp/core.out
          exit 0
      - name: config and projects result
        if: always()
        run: "if grep -q 'FAILED:.*tests.test_config_and_projects' /tmp/core.out; then exit 1; fi"
      - name: extension composition result
        if: always()
        run: "if grep -q 'FAILED:.*tests.test_extension_composition' /tmp/core.out; then exit 1; fi"
      - name: git observation result
        if: always()
        run: "if grep -q 'FAILED:.*tests.test_git_observation' /tmp/core.out; then exit 1; fi"
      - name: input binding result
        if: always()
        run: "if grep -q 'FAILED:.*tests.test_input_binding' /tmp/core.out; then exit 1; fi"
      - name: installed product result
        if: always()
        run: "if grep -q 'FAILED:.*tests.test_installed_product' /tmp/core.out; then exit 1; fi"
      - name: layout and fitness result
        if: always()
        run: "if grep -q 'FAILED:.*tests.test_layout_and_fitness' /tmp/core.out; then exit 1; fi"
      - name: privacy and remote truth result
        if: always()
        run: "if grep -q 'FAILED:.*tests.test_privacy_and_remote_truth' /tmp/core.out; then exit 1; fi"
      - name: protocol source and profile result
        if: always()
        run: "if grep -q 'FAILED:.*tests.test_protocol_source_and_profile' /tmp/core.out; then exit 1; fi"
      - name: public API seam result
        if: always()
        run: "if grep -q 'FAILED:.*tests.test_public_api_seam' /tmp/core.out; then exit 1; fi"
      - name: render and identity result
        if: always()
        run: "if grep -q 'FAILED:.*tests.test_render_and_identity' /tmp/core.out; then exit 1; fi"
      - name: SSDP6 profiles result
        if: always()
        run: "if grep -q 'FAILED:.*tests.test_ssdp6_profiles' /tmp/core.out; then exit 1; fi"
      - name: workplan resolution result
        if: always()
        run: "if grep -q 'FAILED:.*tests.test_workplan_resolution' /tmp/core.out; then exit 1; fi"
