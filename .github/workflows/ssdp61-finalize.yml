name: Temporary SSDP 6.1 generation

on:
  push:
    branches:
      - ssdp-6.1-implementation

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ssdp-6.1-implementation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Materialize reviewed Protocol 6.1 source edits
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/ssdp61_finalize.py
      - name: Install validation dependencies
        run: |
          python -m pip install -r source/requirements-validation.txt
          python -m pip install ./orchestrator -r orchestrator/requirements-dev.txt
      - name: Compile changed orchestrator sources
        run: python -m py_compile orchestrator/src/sdp_orchestrator/core/canonical.py orchestrator/src/sdp_orchestrator/core/profile.py orchestrator/src/sdp_orchestrator/core/protocol_source.py orchestrator/scripts/generate_protocol_snapshot.py
      - name: Generate skill distribution and current Protocol snapshot
        run: |
          python source/build_skills.py --output dist
          python orchestrator/scripts/generate_protocol_snapshot.py
      - name: Run repository acceptance before publishing generated results
        run: |
          python -m unittest discover -s tests -v
          python source/validate_packages.py --dist dist
          python source/check_dist.py --expected dist --committed dist
          python orchestrator/scripts/generate_protocol_snapshot.py --check
          python orchestrator/scripts/run_core_tests.py
          git diff --check
      - name: Commit deterministic Protocol 6.1 migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md PORTABILITY.md source qualification tests orchestrator dist history
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "Complete Protocol 6.1 source, profile, and generated artifacts"
          git push origin HEAD:ssdp-6.1-implementation
