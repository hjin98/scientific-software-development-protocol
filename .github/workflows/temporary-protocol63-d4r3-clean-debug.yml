name: Temporary Protocol 6.3 D4R3 clean debug

on:
  push:
    branches: [ssdp-6.3-engineering-memory]

permissions:
  contents: write

jobs:
  debug:
    if: github.event.head_commit.message == 'Diagnose clean Protocol 6.3 D4R3 gate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ssdp-6.3-engineering-memory
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reproduce clean gate command-by-command
        shell: bash
        run: |
          set +e
          git config user.name 'Protocol 6.3 repair automation'
          git config user.email 'protocol63-repair@users.noreply.github.com'
          git config --global gc.auto 0
          git config --global maintenance.auto false
          LOG=/tmp/d4r3-clean-debug.log
          : > "$LOG"
          python -m pip install -q -r source/requirements-validation.txt >> "$LOG" 2>&1
          python -m pip install -q ./orchestrator -r orchestrator/requirements-dev.txt >> "$LOG" 2>&1
          python - <<'PY' >> "$LOG" 2>&1
          import importlib.util
          from pathlib import Path
          hp=Path('qualification/ssdp6/_tmp_protocol63_owner_binding_repair.py')
          spec=importlib.util.spec_from_file_location('repair',hp)
          repair=importlib.util.module_from_spec(spec); spec.loader.exec_module(repair)
          original=repair.replace_once
          def scoped(text, old, new, label):
              if label!='valid recurrence accepted base': return original(text,old,new,label)
              marker='    def test_d4_git_recurrence_requires_resolvable_ordered_repair_and_independent_later_event(self):'
              prefix,suffix=text.split(marker,1)
              return prefix+marker+suffix.replace(old,new,1)
          repair.replace_once=scoped
          repair.reopen_workplan(); repair.implement_validator(); repair.implement_project_memory(); repair.implement_doctrine_and_template(); repair.implement_tests(); repair.invalidate_bootstrap()
          PY
          status=$?
          python - <<'PY' >> "$LOG" 2>&1
          from pathlib import Path
          p=Path('tests/test_protocol_63_bootstrap.py'); text=p.read_text()
          old='''        stale_transition_fragments = (\n            'no current 6.3 public fallback is authorized',\n            'no 6.3 public fallback is authorized until',\n            'no replacement public fallback is currently authorized',\n            'no replacement fallback is currently authorized',\n        )\n        for document_name, document in (("versioning", versioning), ("prompts", prompts), ("portability", portability), ("readme", readme)):\n            lowered = document.lower()\n            for fragment in stale_transition_fragments:\n                self.assertNotIn(fragment, lowered, f"{document_name} retains pre-publication fallback state: {fragment}")\n'''
          new='''        if not BOOTSTRAP.startswith("UNAVAILABLE_"):\n            stale_transition_fragments = (\n                'no current 6.3 public fallback is authorized',\n                'no 6.3 public fallback is authorized until',\n                'no replacement public fallback is currently authorized',\n                'no replacement fallback is currently authorized',\n            )\n            for document_name, document in (("versioning", versioning), ("prompts", prompts), ("portability", portability), ("readme", readme)):\n                lowered = document.lower()\n                for fragment in stale_transition_fragments:\n                    self.assertNotIn(fragment, lowered, f"{document_name} retains pre-publication fallback state: {fragment}")\n'''
          if old not in text: raise SystemExit('bootstrap assertion patch missing')
          p.write_text(text.replace(old,new,1))
          PY
          if [ "$status" -eq 0 ]; then python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md --write-summary >> "$LOG" 2>&1; status=$?; fi
          if [ "$status" -eq 0 ]; then python orchestrator/scripts/generate_protocol_snapshot.py >> "$LOG" 2>&1; status=$?; fi
          if [ "$status" -eq 0 ]; then rm -rf /tmp/protocol-dist; python source/build_skills.py --output /tmp/protocol-dist >> "$LOG" 2>&1; status=$?; fi
          if [ "$status" -eq 0 ]; then python source/validate_packages.py --dist /tmp/protocol-dist >> "$LOG" 2>&1; status=$?; fi
          if [ "$status" -eq 0 ]; then rm -rf dist; cp -a /tmp/protocol-dist dist; fi
          rm -f qualification/ssdp6/_tmp_protocol63_owner_binding_repair.py qualification/ssdp6/_tmp_protocol63_owner_binding_debug.log qualification/ssdp6/_tmp_protocol63_owner_binding_debug2.log qualification/ssdp6/_tmp_protocol63_owner_binding_debug3.log qualification/ssdp6/_tmp_protocol63_d4r3_validation_debug.log
          rm -f .github/workflows/temporary-protocol63-*.yml
          run_check() {
            name="$1"; shift
            if [ "$status" -ne 0 ]; then return; fi
            printf '\n===== %s =====\n' "$name" >> "$LOG"
            "$@" >> "$LOG" 2>&1
            status=$?
            printf 'EXIT=%s\n' "$status" >> "$LOG"
          }
          run_check pem python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md
          run_check focused_reopened python -m unittest -v tests.test_protocol_63_reopened_repairs
          run_check focused_memory python -m unittest -v tests.test_protocol_63_engineering_memory
          run_check focused_bootstrap python -m unittest -v tests.test_protocol_63_bootstrap
          run_check full_tests python -m unittest discover -s tests -v
          if [ "$status" -eq 0 ]; then rm -rf /tmp/protocol-dist-check; fi
          run_check rebuild python source/build_skills.py --output /tmp/protocol-dist-check
          run_check revalidate python source/validate_packages.py --dist /tmp/protocol-dist-check
          run_check dist_parity python source/check_dist.py --expected /tmp/protocol-dist-check --committed dist
          run_check snapshot_check python orchestrator/scripts/generate_protocol_snapshot.py --check
          run_check core python orchestrator/scripts/run_core_tests.py
          run_check whitespace git diff --check
          printf '\nFINAL_EXIT=%s\n' "$status" >> "$LOG"
          git reset --hard HEAD
          cp "$LOG" qualification/ssdp6/_tmp_protocol63_d4r3_clean_debug.log
          git add qualification/ssdp6/_tmp_protocol63_d4r3_clean_debug.log
          git commit -m 'Record clean Protocol 6.3 D4R3 gate failure'
          git push origin HEAD:ssdp-6.3-engineering-memory
