name: Temporary Protocol 6.3 handoff evidence cleanup

on:
  push:
    branches: [ssdp-6.3-engineering-memory]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Clean Protocol 6.3 F3 handoff evidence labels'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ssdp-6.3-engineering-memory
          fetch-depth: 0
      - name: Correct stale F2 labels and commit clean descendant
        run: |
          set -euxo pipefail
          git config user.name 'Protocol 6.3 repair automation'
          git config user.email 'protocol63-repair@users.noreply.github.com'
          python - <<'PY'
          from pathlib import Path
          p=Path('qualification/ssdp6/INDEPENDENT-REVIEW-HANDOFF-PROTOCOL-6.3.md')
          text=p.read_text(encoding='utf-8')
          old='fresh F2/static-sensor evidence commit:     6fc26ce374b5346495782871d5d7241de5b90071'
          new='fresh F3/static-sensor evidence commit:     5362f39107aa3f5760f501c02c66e3d25434cac7'
          if text.count(old)!=1: raise SystemExit('stale immutable identity label not found exactly once')
          text=text.replace(old,new,1)
          old='`qualification/ssdp6/RESULTS-GPT-5.6-SOL-2026-09-12-PROTOCOL-6.3-F2.md`; static activation sensors;'
          new='`qualification/ssdp6/RESULTS-GPT-5.6-SOL-2026-09-12-PROTOCOL-6.3-F3.md`; static activation sensors;'
          if text.count(old)!=1: raise SystemExit('stale governing-surface F2 reference not found exactly once')
          text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8')
          PY
          rm -f .github/workflows/temporary-protocol63-*.yml
          git add -A
          git diff --cached --check
          git commit -m 'Clean Protocol 6.3 F3 review handoff'
          git push origin HEAD:ssdp-6.3-engineering-memory
