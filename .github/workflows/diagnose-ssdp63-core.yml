name: Temporary Protocol 6.3 Core diagnostic
on:
  push:
    branches: [ssdp-6.3-engineering-memory]
    paths: [.github/workflows/diagnose-ssdp63-core.yml]
permissions:
  contents: write
jobs:
  diagnose-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ssdp-6.3-engineering-memory
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture exact Core failure
        shell: bash
        run: |
          python -m pip install ./orchestrator -r orchestrator/requirements-dev.txt
          set +e
          python orchestrator/scripts/run_core_tests.py -j 2 > /tmp/core.log 2>&1
          status=$?
          set -e
          {
            echo '---'
            echo 'kind: protocol-6.3-orchestrator-core-diagnostic'
            echo 'candidate: 2bfcd14f339e4a58d307cfd5fc5a12770c37c65e'
            echo "exit_status: $status"
            echo 'authority: non-normative-observation-evidence'
            echo '---'
            echo
            echo '# Protocol 6.3 Orchestrator Core diagnostic'
            echo
            echo 'Captured from the same Core acceptance runner used by ordinary CI. This is failure evidence, not acceptance.'
            echo
            echo '```text'
            tail -n 600 /tmp/core.log
            echo '```'
          } > qualification/ssdp6/DIAGNOSTIC-PROTOCOL-6.3-ORCHESTRATOR-CORE.md
      - name: Commit diagnostic evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qualification/ssdp6/DIAGNOSTIC-PROTOCOL-6.3-ORCHESTRATOR-CORE.md
          git commit -m 'Capture Protocol 6.3 Orchestrator Core diagnostic'
          git push origin HEAD:ssdp-6.3-engineering-memory
