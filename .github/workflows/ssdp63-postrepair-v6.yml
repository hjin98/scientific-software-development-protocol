name: SSDP 6.3 post-repair assembly v6

on:
  push:
    branches: [ssdp-6.3-engineering-memory]
    paths: [.github/workflows/ssdp63-postrepair-v6.yml]

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}

      - name: Reconcile D7 HAS and 6.3 fallback owners
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          old = '5ee4b3ac3ca1666b0499f7a72f55adcc411bf4bb'
          sentinel = 'UNAVAILABLE_PENDING_REPLACEMENT_BOOTSTRAP'

          p = Path('source/shared/references/workflow-and-workplans.md')
          t = p.read_text()
          marker = 'candidate_overlay_semantic_candidate: <exact candidate overlay or NONE>'
          if marker not in t:
              anchor = '3. record the exact accepted/base and overlay identities used for the current decision;\n'
              block = '''\nThe canonical session-local HAS interface is exact and executable:\n\n```yaml\npem_basis:\n  accepted_project_state: <exact accepted project state>\n  accepted_pem: <exact accepted PEM publication or NONE_PROTOCOL_6.2_PRE_PEM>\n  candidate_overlay_semantic_candidate: <exact candidate overlay or NONE>\nhas:\n  - id: <family/capability/notice id>\n    disposition: APPLICABLE | NOT_APPLICABLE | REVIEW_REQUIRED\n    reason: <bounded rationale>\n```\n\nDo not substitute aliases such as `accepted_base` or `candidate_overlay`; the workflow, canonical template, and executable validator use this one shape without translation glue. Keep the HAS session-local unless the governed work explicitly requires a durable handoff/record.\n\n'''
              if t.count(anchor) != 1: raise SystemExit('workflow HAS anchor mismatch')
              t = t.replace(anchor, anchor + block, 1)
          p.write_text(t)

          p = Path('source/shared/references/protocol-versioning-and-compatibility.md')
          t = p.read_text()
          current = f'6.3.0 public-source bootstrap -> {old}'
          target = f'6.3.0 invalidated second bootstrap -> {old}\n6.3.0 public-source bootstrap -> {sentinel}'
          if f'6.3.0 public-source bootstrap -> {sentinel}' not in t:
              if t.count(current) != 1: raise SystemExit('versioning mapping mismatch')
              t = t.replace(current, target, 1)
          lines = t.splitlines()
          if not any('both invalidated as current fallback by the reopened semantic repair' in x for x in lines):
              for i, line in enumerate(lines):
                  if line.startswith('The pre-repair Protocol 6.3 bootstrap `1484c1d3caa49d87cc15bc52a5e775399c1dae1b`') and 'Recovery is still unavailable:' in line:
                      suffix = line.split('Recovery is still unavailable:', 1)[1]
                      lines[i] = f'The pre-repair Protocol 6.3 bootstrap `1484c1d3caa49d87cc15bc52a5e775399c1dae1b` and the second bootstrap `{old}` are immutable historical evidence only and are both invalidated as current fallback by the reopened semantic repair. The current 6.3 public-source bootstrap mapping is `{sentinel}`; no 6.3 public fallback is authorized until an already-existing repaired snapshot passes bootstrap readiness and exact-ref realization and a later descendant publishes that exact SHA. Recovery is still unavailable:' + suffix
                      break
              else: raise SystemExit('versioning status paragraph missing')
          p.write_text('\n'.join(lines) + '\n')

          p = Path('source/shared/references/development-workflow-prompts.md')
          t = p.read_text()
          t = t.replace(f'CURRENT_PUBLIC_REF = {old}', f'CURRENT_PUBLIC_REF = {sentinel}', 1)
          start = t.find('**Protocol 6.3 bootstrap state:** ')
          end = t.find('\n\n`AUTO_EXECUTE` means', start)
          if start < 0 or end < 0: raise SystemExit('workflow prompt bootstrap paragraph missing')
          paragraph = f'**Protocol 6.3 bootstrap state:** all pre-repair 6.3 bootstrap snapshots are invalidated historical evidence only. `CURRENT_PUBLIC_REF` is `{sentinel}`, so no current 6.3 public fallback is authorized until a repaired immutable snapshot passes bootstrap readiness and exact-ref realization and a later descendant publishes that exact SHA. Never use repository default/latest, a guessed semantic-version ref, the current candidate branch, an invalidated bootstrap, or the accepted 6.2 bootstrap as a substitute. Version-bound 6.2 work continues to use exactly `5a062ebc472755607b9dc66d33a5ebbc4b7429aa`; historical 5.16/6.0/6.1 resolution remains version-bound to its own immutable mapping.'
          p.write_text(t[:start] + paragraph + t[end:])
          PY
          test -z "$(git grep -n '5ee4b3ac3ca1666b0499f7a72f55adcc411bf4bb' -- source | grep -v 'source/shared/references/protocol-versioning-and-compatibility.md' || true)"

      - name: Install validation and Orchestrator dependencies
        run: |
          python -m pip install -r source/requirements-validation.txt
          python -m pip install ./orchestrator -r orchestrator/requirements-dev.txt

      - name: Validate and render self-hosted PEM
        run: python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md --write-summary

      - name: Build and validate canonical skill packages
        run: |
          rm -rf /tmp/protocol-dist /tmp/protocol-dist-check
          python source/build_skills.py --output /tmp/protocol-dist
          python source/validate_packages.py --dist /tmp/protocol-dist
          rm -rf dist
          cp -a /tmp/protocol-dist dist

      - name: Regenerate Orchestrator protocol snapshot
        run: python orchestrator/scripts/generate_protocol_snapshot.py

      - name: Reopened Protocol 6.3 discriminators
        run: |
          python -m unittest discover -s tests -p 'test_protocol_63_engineering_memory.py' -v
          python -m unittest discover -s tests -p 'test_protocol_63_reopened_repairs.py' -v

      - name: Full repository acceptance
        run: python -m unittest discover -s tests -v

      - name: Generated parity and whitespace
        run: |
          python source/build_skills.py --output /tmp/protocol-dist-check
          python source/validate_packages.py --dist /tmp/protocol-dist-check
          diff -ru dist /tmp/protocol-dist-check
          python orchestrator/scripts/generate_protocol_snapshot.py --check
          git diff --check

      - name: Orchestrator Core acceptance
        run: |
          python orchestrator/scripts/generate_protocol_snapshot.py --check
          python orchestrator/scripts/run_core_tests.py

      - name: Remove temporary repair transport and commit assembled candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f .ssdp63-stale-ref.txt .ssdp63-snapshot-error.txt
          rm -f .github/workflows/ssdp63-repair-transport.yml .github/workflows/ssdp63-materialize.yml .github/workflows/ssdp63-postrepair.yml .github/workflows/ssdp63-postrepair-v2.yml .github/workflows/ssdp63-locate-stale-ref.yml .github/workflows/ssdp63-postrepair-v3.yml .github/workflows/ssdp63-postrepair-v4.yml .github/workflows/ssdp63-postrepair-v5.yml .github/workflows/ssdp63-snapshot-diagnostic.yml .github/workflows/ssdp63-postrepair-v6.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Assemble repaired Protocol 6.3 candidate'
          git push origin HEAD:ssdp-6.3-engineering-memory
