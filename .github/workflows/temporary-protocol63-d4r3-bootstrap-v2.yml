name: Temporary Protocol 6.3 D4R3 repaired bootstrap v2

on:
  push:
    branches: [ssdp-6.3-engineering-memory]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'Execute Protocol 6.3 D4R3 repaired bootstrap'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ssdp-6.3-engineering-memory
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare execution environment
        run: |
          set -euxo pipefail
          git config user.name 'Protocol 6.3 repair automation'
          git config user.email 'protocol63-repair@users.noreply.github.com'
          python -m pip install -r source/requirements-validation.txt
          python -m pip install ./orchestrator -r orchestrator/requirements-dev.txt
      - name: Materialize reopened D4R3 E3 F3 repair
        run: |
          set -euxo pipefail
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          hp = Path('qualification/ssdp6/_tmp_protocol63_owner_binding_repair.py')
          spec = importlib.util.spec_from_file_location('repair', hp)
          repair = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(repair)
          original = repair.replace_once

          def scoped(text, old, new, label):
              if label != 'valid recurrence accepted base':
                  return original(text, old, new, label)
              marker = '    def test_d4_git_recurrence_requires_resolvable_ordered_repair_and_independent_later_event(self):'
              if marker not in text:
                  raise SystemExit('D4 recurrence test marker missing')
              prefix, suffix = text.split(marker, 1)
              if old not in suffix:
                  raise SystemExit('D4 recurrence target missing inside function')
              return prefix + marker + suffix.replace(old, new, 1)

          repair.replace_once = scoped
          repair.reopen_workplan()
          repair.implement_validator()
          repair.implement_project_memory()
          repair.implement_doctrine_and_template()
          repair.implement_tests()
          repair.invalidate_bootstrap()
          PY
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/test_protocol_63_bootstrap.py')
          text = p.read_text(encoding='utf-8')
          old = '''        stale_transition_fragments = (\n            'no current 6.3 public fallback is authorized',\n            'no 6.3 public fallback is authorized until',\n            'no replacement public fallback is currently authorized',\n            'no replacement fallback is currently authorized',\n        )\n        for document_name, document in (("versioning", versioning), ("prompts", prompts), ("portability", portability), ("readme", readme)):\n            lowered = document.lower()\n            for fragment in stale_transition_fragments:\n                self.assertNotIn(fragment, lowered, f"{document_name} retains pre-publication fallback state: {fragment}")\n'''
          new = '''        if not BOOTSTRAP.startswith("UNAVAILABLE_"):\n            stale_transition_fragments = (\n                'no current 6.3 public fallback is authorized',\n                'no 6.3 public fallback is authorized until',\n                'no replacement public fallback is currently authorized',\n                'no replacement fallback is currently authorized',\n            )\n            for document_name, document in (("versioning", versioning), ("prompts", prompts), ("portability", portability), ("readme", readme)):\n                lowered = document.lower()\n                for fragment in stale_transition_fragments:\n                    self.assertNotIn(fragment, lowered, f"{document_name} retains pre-publication fallback state: {fragment}")\n'''
          if old not in text:
              raise SystemExit('bootstrap stale-transition block not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md --write-summary
          python orchestrator/scripts/generate_protocol_snapshot.py
          rm -rf /tmp/protocol-dist
          python source/build_skills.py --output /tmp/protocol-dist
          python source/validate_packages.py --dist /tmp/protocol-dist
          rm -rf dist
          cp -a /tmp/protocol-dist dist
      - name: Validate repaired sentinel snapshot
        run: |
          set -euxo pipefail
          python -m unittest -v tests.test_protocol_63_reopened_repairs
          python -m unittest -v tests.test_protocol_63_engineering_memory
          python -m unittest -v tests.test_protocol_63_bootstrap
          python -m unittest discover -s tests -v
          rm -rf /tmp/protocol-dist-check
          python source/build_skills.py --output /tmp/protocol-dist-check
          python source/validate_packages.py --dist /tmp/protocol-dist-check
          python source/check_dist.py --expected /tmp/protocol-dist-check --committed dist
          python orchestrator/scripts/generate_protocol_snapshot.py --check
          python orchestrator/scripts/run_core_tests.py
          git diff --check
      - name: Commit clean self-reference-safe replacement bootstrap
        run: |
          set -euxo pipefail
          git rm -f qualification/ssdp6/_tmp_protocol63_owner_binding_repair.py || true
          git rm -f qualification/ssdp6/_tmp_protocol63_owner_binding_debug.log || true
          git rm -f qualification/ssdp6/_tmp_protocol63_owner_binding_debug2.log || true
          git rm -f qualification/ssdp6/_tmp_protocol63_owner_binding_debug3.log || true
          git rm -f .github/workflows/temporary-protocol63-owner-binding-repair.yml || true
          git rm -f .github/workflows/temporary-protocol63-owner-binding-debug.yml || true
          git rm -f .github/workflows/temporary-protocol63-owner-binding-debug2.yml || true
          git rm -f .github/workflows/temporary-protocol63-owner-binding-debug3.yml || true
          git rm -f .github/workflows/temporary-protocol63-d4r3-bootstrap.yml || true
          git rm -f .github/workflows/temporary-protocol63-d4r3-bootstrap-v2.yml || true
          git add -A
          git diff --cached --check
          git commit -m 'Repair Protocol 6.3 accepted-state owner binding'
          git push origin HEAD:ssdp-6.3-engineering-memory
