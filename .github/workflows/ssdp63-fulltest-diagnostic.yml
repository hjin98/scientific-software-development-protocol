name: Diagnose Protocol 6.3 full regression

on:
  push:
    branches: [ssdp-6.3-engineering-memory]
    paths: [.github/workflows/ssdp63-fulltest-diagnostic.yml]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Recreate assembled source state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          old='5ee4b3ac3ca1666b0499f7a72f55adcc411bf4bb'; sentinel='UNAVAILABLE_PENDING_REPLACEMENT_BOOTSTRAP'
          p=Path('source/shared/references/workflow-and-workplans.md'); t=p.read_text(); marker='candidate_overlay_semantic_candidate: <exact candidate overlay or NONE>'
          if marker not in t:
              a='3. record the exact accepted/base and overlay identities used for the current decision;\n'; b='''\nThe canonical session-local HAS interface is exact and executable:\n\n```yaml\npem_basis:\n  accepted_project_state: <exact accepted project state>\n  accepted_pem: <exact accepted PEM publication or NONE_PROTOCOL_6.2_PRE_PEM>\n  candidate_overlay_semantic_candidate: <exact candidate overlay or NONE>\nhas:\n  - id: <family/capability/notice id>\n    disposition: APPLICABLE | NOT_APPLICABLE | REVIEW_REQUIRED\n    reason: <bounded rationale>\n```\n\nDo not substitute aliases such as `accepted_base` or `candidate_overlay`; the workflow, canonical template, and executable validator use this one shape without translation glue. Keep the HAS session-local unless the governed work explicitly requires a durable handoff/record.\n\n'''; t=t.replace(a,a+b,1)
          p.write_text(t)
          p=Path('source/shared/references/protocol-versioning-and-compatibility.md'); t=p.read_text(); cur=f'6.3.0 public-source bootstrap -> {old}'; tar=f'6.3.0 invalidated second bootstrap -> {old}\n6.3.0 public-source bootstrap -> {sentinel}'
          if f'6.3.0 public-source bootstrap -> {sentinel}' not in t: t=t.replace(cur,tar,1)
          lines=t.splitlines()
          if not any('both invalidated as current fallback by the reopened semantic repair' in x for x in lines):
              for i,line in enumerate(lines):
                  if line.startswith('The pre-repair Protocol 6.3 bootstrap `1484c1d3caa49d87cc15bc52a5e775399c1dae1b`') and 'Recovery is still unavailable:' in line:
                      suffix=line.split('Recovery is still unavailable:',1)[1]; lines[i]=f'The pre-repair Protocol 6.3 bootstrap `1484c1d3caa49d87cc15bc52a5e775399c1dae1b` and the second bootstrap `{old}` are immutable historical evidence only and are both invalidated as current fallback by the reopened semantic repair. The current 6.3 public-source bootstrap mapping is `{sentinel}`; no 6.3 public fallback is authorized until an already-existing repaired snapshot passes bootstrap readiness and exact-ref realization and a later descendant publishes that exact SHA. Recovery is still unavailable:'+suffix; break
          p.write_text('\n'.join(lines)+'\n')
          p=Path('source/shared/references/development-workflow-prompts.md'); t=p.read_text(); t=t.replace(f'CURRENT_PUBLIC_REF = {old}',f'CURRENT_PUBLIC_REF = {sentinel}',1); a=t.find('**Protocol 6.3 bootstrap state:** '); b=t.find('\n\n`AUTO_EXECUTE` means',a); para=f'**Protocol 6.3 bootstrap state:** all pre-repair 6.3 bootstrap snapshots are invalidated historical evidence only. `CURRENT_PUBLIC_REF` is `{sentinel}`, so no current 6.3 public fallback is authorized until a repaired immutable snapshot passes bootstrap readiness and exact-ref realization and a later descendant publishes that exact SHA. Never use repository default/latest, a guessed semantic-version ref, the current candidate branch, an invalidated bootstrap, or the accepted 6.2 bootstrap as a substitute. Version-bound 6.2 work continues to use exactly `5a062ebc472755607b9dc66d33a5ebbc4b7429aa`; historical 5.16/6.0/6.1 resolution remains version-bound to its own immutable mapping.'; p.write_text(t[:a]+para+t[b:])
          PY
      - name: Install dependencies and regenerate assembled descendants
        run: |
          python -m pip install -r source/requirements-validation.txt
          python -m pip install ./orchestrator -r orchestrator/requirements-dev.txt
          python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md --write-summary
          rm -rf /tmp/protocol-dist
          python source/build_skills.py --output /tmp/protocol-dist
          rm -rf dist && cp -a /tmp/protocol-dist dist
          python orchestrator/scripts/generate_protocol_snapshot.py
      - name: Capture full regression tail
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -v > /tmp/fulltest.txt 2>&1
          rc=$?
          tail -n 300 /tmp/fulltest.txt > .ssdp63-fulltest-tail.txt
          printf '\nEXIT_CODE=%s\n' "$rc" >> .ssdp63-fulltest-tail.txt
          exit 0
      - name: Commit diagnostic
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ssdp63-fulltest-tail.txt
          git commit -m 'Record Protocol 6.3 full regression diagnostic'
          git push origin HEAD:ssdp-6.3-engineering-memory
