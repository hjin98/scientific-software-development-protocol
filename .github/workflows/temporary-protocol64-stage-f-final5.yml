name: Temporary Protocol 6.4 Stage F final 5
on:
  push:
    branches: [ssdp-6.4-axiomatic-definition-traceability]
permissions:
  contents: write
jobs:
  final5:
    if: github.event.head_commit.message == 'Complete Protocol 6.4 Stage F final5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: ssdp-6.4-axiomatic-definition-traceability, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python -m pip install pyyaml -r source/requirements-validation.txt
          python -m pip install ./orchestrator -r orchestrator/requirements-dev.txt
      - name: Construct final4 tree and close remaining successor oracles
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path
          d=yaml.safe_load(Path('.github/workflows/temporary-protocol64-stage-f-final4.yml').read_text())
          Path('/tmp/final4.sh').write_text(next(s['run'] for s in d['jobs']['final4']['steps'] if s.get('name')=='Construct accepted-current tree and reconcile successor representations'))
          PY
          bash /tmp/final4.sh
          python - <<'PY'
          from pathlib import Path
          import re
          R='74bc572ef516cae417437a2027eeff52a2e25c15'; B='e09a9d1480211eea2d16d722182bb5c6de1bee12'
          # Canonical README current-state owner: finalizer's historical regex was too narrow.
          p=Path('README.md'); t=p.read_text()
          t=re.sub(r'^Current accepted document-controlled release:.*?$', f'Current accepted document-controlled release: **Protocol 6.4**. Accepted recovery is `{R}` and the distinct immutable public-source bootstrap is `{B}`. Protocol 6.3 recovery `9f353097fab36e325a325f1c2f9d9cec32e86177` remains immutable historical rollback for explicitly version-bound 6.3 work. Protocol 7 remains proposed and is not cut over.', t, count=1, flags=re.M)
          t=t.replace('Protocol 6.4 candidate acceptance additionally requires','Protocol 6.4 acceptance required')
          t=t.replace('Only after that Review may recovery publication and accepted-current cutover proceed.','After that Review, Stage-F recovery publication, mapping-bearing acceptance, successor reconciliation, and accepted-current cutover completed.')
          p.write_text(t)

          # Protocol 6.3 oracle now verifies immutable history plus successor advancement.
          p=Path('tests/test_protocol_63_closeout.py'); t=p.read_text()
          start=t.index('    def test_accepted_current_and_identity_distinction')
          end=t.index('\n    def test_workplan_archived_and_protocol7_inheritance_reconciled', start)
          method=f'''    def test_historical_identity_survives_protocol64_acceptance(self) -> None:\n        versioning = (ROOT / "source/shared/references/protocol-versioning-and-compatibility.md").read_text()\n        portability = (ROOT / "PORTABILITY.md").read_text()\n        readme = (ROOT / "README.md").read_text()\n        self.assertIn("| `ssdp-protocol-6.3` | 6.3.0 | 2 | frozen historical rollback |", versioning)\n        self.assertIn("| `ssdp-protocol-6.4` | 6.4.0 | 2 | accepted current |", versioning)\n        self.assertIn("| `ssdp-protocol-6.3` | 6.3.0 | 2 | frozen historical rollback |", portability)\n        self.assertIn("| `ssdp-protocol-6.4` | 6.4.0 | 2 | accepted current |", portability)\n        self.assertIn(f"6.3.0  -> {{RECOVERY}}", versioning)\n        self.assertIn(f"6.3.0 public bootstrap -> {{BOOTSTRAP}}", portability)\n        self.assertIn("Current accepted document-controlled release: **Protocol 6.4**", readme)\n        self.assertIn("{R}", readme)\n        self.assertNotEqual(RECOVERY, BOOTSTRAP)\n'''
          p.write_text(t[:start]+method+t[end:])

          # QF64-O/P evolve from candidate readiness to accepted closeout semantics.
          p=Path('tests/test_protocol_64_axiomatic_traceability.py'); t=p.read_text()
          start=t.index('    def test_qf64_o_candidate_lifecycle_preserves_bootstrap_recovery_separation')
          end=t.index('\n    def test_qf64_p_one_current_snapshot_complete_handoff', start)
          o=f'''    def test_qf64_o_accepted_lifecycle_preserves_bootstrap_recovery_separation(self) -> None:\n        versioning = norm(self.versioning)\n        self.assertIn("protocol 6.4 is accepted-current", versioning)\n        self.assertIn("6.4.0 public-source bootstrap -> {B}", versioning)\n        self.assertIn("6.4.0  -> {R}", self.versioning)\n        self.assertNotEqual("{B}", "{R}")\n        rev5 = read("workplans/active/SSDP-7.0-DETERMINISTIC-CONTROL-PLANE-AND-MANDATORY-ORCHESTRATOR-MIGRATION-REVISION-5-PROTOCOL-6.4-INHERITANCE-RECONCILIATION.md")\n        self.assertIn("d3_architecture_mutation: none", rev5)\n        self.assertIn("PROTOCOL 7 D4 IMPLEMENTATION: NOT AUTHORIZED", rev5)\n'''
          t=t[:start]+o+t[end:]
          start=t.index('    def test_qf64_p_one_current_snapshot_complete_handoff')
          # Replace through next method or module end.
          m=re.search(r'\n    def ', t[start+5:])
          end=(start+5+m.start()) if m else t.find('\n\nif __name__',start)
          pmethod=f'''    def test_qf64_p_closeout_has_one_archived_snapshot_complete_handoff(self) -> None:\n        active = sorted((ROOT / "workplans/active").glob("SSDP-6.4*.md"))\n        self.assertEqual(active, [])\n        archived = ROOT / "workplans/archive/SSDP-6.4-AXIOMATIC-FORMAL-DEFINITION-AND-SEMANTIC-TRACEABILITY-CONSOLIDATED.md"\n        self.assertTrue(archived.is_file())\n        workplan = archived.read_text(encoding="utf-8")\n        self.assertIn("STAGE F: PASS", workplan)\n        self.assertIn("{R}", workplan)\n        handoff = read("qualification/ssdp6/INDEPENDENT-REVIEW-HANDOFF-PROTOCOL-6.4.md")\n        self.assertIn("stage_f: complete", handoff)\n        self.assertIn("accepted_current_protocol: 6.4.0", handoff)\n'''
          t=t[:start]+pmethod+t[end:]
          p.write_text(t)

          # Exact immutable bootstrap remains self-reference-safe; local accepted source now legitimately maps recovery.
          p=Path('tests/test_protocol_64_bootstrap_readiness.py'); t=p.read_text()
          if 'RECOVERY = ' not in t:
              t=t.replace(f'BOOTSTRAP = "{B}"', f'BOOTSTRAP = "{B}"\nRECOVERY = "{R}"',1)
          t=t.replace('self.assertNotIn("6.4.0  -> ", local_versioning)','self.assertIn(f"6.4.0  -> {RECOVERY}", local_versioning)')
          p.write_text(t)
          for d in [Path('qualification/ssdp6/STAGE-F-DIAGNOSTIC-PROTOCOL-6.4.txt'),Path('qualification/ssdp6/STAGE-F-DIAGNOSTIC-FINAL4-PROTOCOL-6.4.txt')]:
              if d.exists(): d.unlink()
          PY
          python source/build_skills.py --output dist
          python orchestrator/scripts/generate_protocol_snapshot.py
      - name: Full Stage-F acceptance
        run: |
          set -euxo pipefail
          python -m unittest discover -s tests -v
          python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md
          rm -rf /tmp/protocol-dist && python source/build_skills.py --output /tmp/protocol-dist
          python source/validate_packages.py --dist /tmp/protocol-dist
          python source/check_dist.py --expected /tmp/protocol-dist --committed dist
          python orchestrator/scripts/generate_protocol_snapshot.py --check
          python orchestrator/scripts/run_core_tests.py
          git diff --check
      - name: Publish final closeout
        run: |
          set -euxo pipefail
          git config user.name 'Protocol 6.4 lifecycle automation'
          git config user.email 'protocol64-lifecycle@users.noreply.github.com'
          find .github/workflows -maxdepth 1 -type f -name 'temporary-protocol64-stage-f-*.yml' -print0 | xargs -0 git rm
          git add -A
          git diff --cached --check
          git commit -m 'Close Protocol 6.4 lifecycle'
          git push origin HEAD:ssdp-6.4-axiomatic-definition-traceability
