name: Temporary Protocol 6.3 D4R3 publication debug

on:
  push:
    branches: [ssdp-6.3-engineering-memory]

permissions:
  contents: write

jobs:
  debug:
    if: github.event.head_commit.message == 'Diagnose Protocol 6.3 D4R3 bootstrap publication'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ssdp-6.3-engineering-memory
          fetch-depth: 0
      - name: Capture exact publication mismatch
        run: |
          set +e
          git show 4b30d574b1f70cbcd49501b1b63a7685cf993f5d:qualification/ssdp6/_tmp_protocol63_owner_binding_repair.py > /tmp/repair.py
          python - <<'PY' > /tmp/publish-debug.log 2>&1
          import importlib.util
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('repair','/tmp/repair.py')
          repair=importlib.util.module_from_spec(spec); spec.loader.exec_module(repair)
          repair.ROOT=Path.cwd()
          repair.publish_bootstrap('dc22f09fd38dbbfeaeb0160152da9b284654f66e')
          PY
          status=$?
          printf '\nEXIT=%s\n' "$status" >> /tmp/publish-debug.log
          git reset --hard HEAD
          cp /tmp/publish-debug.log qualification/ssdp6/_tmp_protocol63_d4r3_publish_debug.log
          git config user.name 'Protocol 6.3 repair automation'
          git config user.email 'protocol63-repair@users.noreply.github.com'
          git add qualification/ssdp6/_tmp_protocol63_d4r3_publish_debug.log
          git commit -m 'Record Protocol 6.3 bootstrap publication mismatch'
          git push origin HEAD:ssdp-6.3-engineering-memory
