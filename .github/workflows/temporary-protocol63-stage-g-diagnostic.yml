name: Temporary Protocol 6.3 Stage G regeneration diagnostic

on:
  push:
    branches: [ssdp-6.3-engineering-memory]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.head_commit.message == 'Diagnose Protocol 6.3 Stage G regeneration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ssdp-6.3-engineering-memory
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build packages from mapped source
        run: python source/build_skills.py --output /tmp/protocol-dist
      - name: Generate current orchestrator snapshot
        run: python orchestrator/scripts/generate_protocol_snapshot.py
      - name: Rebuild packages after snapshot generation
        run: python source/build_skills.py --output /tmp/protocol-dist-2
