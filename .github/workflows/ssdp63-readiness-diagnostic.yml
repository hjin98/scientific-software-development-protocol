name: Protocol 6.3 replacement readiness diagnostic

on:
  push:
    branches:
      - ssdp-6.3-engineering-memory

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install -r source/requirements-validation.txt
          python -m pip install ./orchestrator -r orchestrator/requirements-dev.txt
      - name: Reproduce candidate and capture every readiness gate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          START_SHA=$(git rev-parse HEAD)

          # Restore the prior one-shot workflow only as a local source for the exact assembly script.
          git show "$GITHUB_SHA^:.github/workflows/ssdp63-bootstrap-reconcile.yml" > .github/workflows/ssdp63-bootstrap-reconcile.yml
          python - <<'PY'
          from pathlib import Path
          import textwrap
          text = Path('.github/workflows/ssdp63-bootstrap-reconcile.yml').read_text(encoding='utf-8')
          start = '      - name: Assemble self-reference-safe replacement bootstrap candidate\n'
          end = '      - name: Qualify replacement bootstrap candidate before publication\n'
          block = text.split(start, 1)[1].split(end, 1)[0]
          script = textwrap.dedent(block.split('        run: |\n', 1)[1])
          Path('/tmp/ssdp63-assemble.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/ssdp63-assemble.sh

          python - <<'PY'
          from pathlib import Path
          OLD = '1484c1d3caa49d87cc15bc52a5e775399c1dae1b'
          PENDING = 'UNAVAILABLE_PENDING_6.3_BOOTSTRAP_QUALIFICATION'

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected stale discriminator not found in {path}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'tests/test_protocol_516_orchestration.py',
              f'''            self.assertIn("current_public_ref = {OLD}", self.lower)\n            self.assertIn("accepted_6_2_public_ref = 5a062ebc472755607b9dc66d33a5ebbc4b7429aa", self.lower)\n            self.assertIn("self-reference-safe source snapshot", self.lower)\n''',
              f'''            current = re.search(r"current_public_ref = ([^\\s]+)", self.lower)\n            self.assertIsNotNone(current)\n            current_ref = current.group(1)\n            self.assertNotEqual(current_ref, "{OLD}")\n            self.assertTrue(current_ref == "{PENDING.lower()}" or re.fullmatch(r"[0-9a-f]{{40}}", current_ref))\n            self.assertIn("accepted_6_2_public_ref = 5a062ebc472755607b9dc66d33a5ebbc4b7429aa", self.lower)\n            self.assertIn("self-reference-safe source snapshot", self.lower)\n''')
          replace_once(
              'tests/test_protocol_61_evidence_evolution.py',
              f'''                self.assertIn(f"ACCEPTED_6_2_PUBLIC_REF = {{bootstrap}}", prompts)\n                self.assertIn("CURRENT_PUBLIC_REF = {OLD}", prompts)\n                self.assertIn("version-bound 6.2 work continues to use exactly", lower)\n''',
              f'''                self.assertIn(f"ACCEPTED_6_2_PUBLIC_REF = {{bootstrap}}", prompts)\n                current = re.search(r"^CURRENT_PUBLIC_REF = (\\S+)$", prompts, re.MULTILINE)\n                self.assertIsNotNone(current)\n                current_ref = current.group(1)\n                self.assertNotEqual(current_ref, "{OLD}")\n                self.assertTrue(current_ref == "{PENDING}" or re.fullmatch(r"[0-9a-f]{{40}}", current_ref))\n                self.assertIn("version-bound 6.2 work continues to use exactly", lower)\n''')
          replace_once(
              'tests/test_protocol_62_representation.py',
              f'''                self.assertIn(f"accepted_6_2_public_ref = {{bootstrap}}", prompt)\n                self.assertIn("current_public_ref = {OLD}", prompt)\n''',
              f'''                self.assertIn(f"accepted_6_2_public_ref = {{bootstrap}}", prompt)\n                current = re.search(r"current_public_ref = ([^\\s]+)", prompt)\n                self.assertIsNotNone(current)\n                current_ref = current.group(1)\n                self.assertNotEqual(current_ref, "{OLD}")\n                self.assertTrue(current_ref == "{PENDING.lower()}" or re.fullmatch(r"[0-9a-f]{{40}}", current_ref))\n''')
          PY

          rm -f .github/workflows/ssdp63-readiness-diagnostic.yml
          LOG=/tmp/ssdp63-readiness.log
          : > "$LOG"
          run_gate() {
            name="$1"; shift
            echo "===== $name =====" >> "$LOG"
            set +e
            "$@" >> "$LOG" 2>&1
            status=$?
            set -e
            echo "EXIT=$status" >> "$LOG"
            echo >> "$LOG"
          }

          run_gate UNITTEST env CI=1 python -m unittest discover -s tests -v
          run_gate PEM python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md
          rm -rf /tmp/protocol-dist
          run_gate BUILD python source/build_skills.py --output /tmp/protocol-dist
          run_gate PACKAGES python source/validate_packages.py --dist /tmp/protocol-dist
          run_gate DIST python source/check_dist.py --expected /tmp/protocol-dist --committed dist
          run_gate SNAPSHOT python orchestrator/scripts/generate_protocol_snapshot.py --check
          run_gate CORE python orchestrator/scripts/run_core_tests.py
          run_gate WHITESPACE git diff --check
          run_gate FROZEN git diff --exit-code "$START_SHA" -- \
            orchestrator/src/sdp_orchestrator/core/resources/protocol/sdp-protocol-5.16 \
            orchestrator/src/sdp_orchestrator/core/resources/protocol/ssdp-protocol-6.0 \
            orchestrator/src/sdp_orchestrator/core/resources/protocol/ssdp-protocol-6.1 \
            orchestrator/src/sdp_orchestrator/core/resources/protocol/ssdp-protocol-6.2

          git reset --hard "$GITHUB_SHA"
          git clean -fd
          rm -f .github/workflows/ssdp63-readiness-diagnostic.yml
          out=qualification/ssdp6/TEMP-PROTOCOL-6.3-READINESS-DIAGNOSTIC.txt
          {
            echo "Protocol 6.3 replacement bootstrap readiness diagnostic"
            echo "trigger=$GITHUB_SHA"
            echo
            cat "$LOG"
          } > "$out"
          git add -A
          git commit -m "Record temporary Protocol 6.3 readiness diagnostic"
          git push origin "HEAD:${GITHUB_REF_NAME}"
