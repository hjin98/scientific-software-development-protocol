name: Diagnose Protocol 6.3 mapped fallback regression once

on:
  push:
    branches: [ssdp-6.3-engineering-memory]
    paths: [.github/workflows/ssdp63-diagnose-mapped-fallback-once.yml]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ssdp-6.3-engineering-memory
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r source/requirements-validation.txt
          python -m pip install ./orchestrator -r orchestrator/requirements-dev.txt
      - name: Reproduce patch and locate failing gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import yaml
          from pathlib import Path
          data = yaml.safe_load(Path('.github/workflows/ssdp63-finalize-mapped-fallback-once.yml').read_text())
          steps = data['jobs']['repair']['steps']
          run = next(s['run'] for s in steps if s.get('name') == 'Repair mapped-fallback state and discriminator')
          Path('/tmp/reproduce-patch.sh').write_text(run)
          PY
          bash /tmp/reproduce-patch.sh
          OUT=qualification/ssdp6/DIAGNOSTIC-PROTOCOL-6.3-MAPPED-FALLBACK-STATE-REPAIR.txt
          : > "$OUT"
          check() {
            label="$1"; shift
            printf '\n===== %s =====\n' "$label" >> "$OUT"
            set +e
            "$@" >> "$OUT" 2>&1
            rc=$?
            set -e
            printf 'EXIT=%s\n' "$rc" >> "$OUT"
            if [ "$rc" -ne 0 ]; then
              printf 'FIRST_FAIL=%s\n' "$label" >> "$OUT"
              return 1
            fi
          }
          failed=0
          check bootstrap env SSDP_VALIDATE_PUBLIC_FALLBACK=1 python -m unittest -v tests.test_protocol_63_bootstrap || failed=1
          if [ "$failed" -eq 0 ]; then check focused python -m unittest -v tests.test_protocol_63_reopened_repairs tests.test_protocol_63_engineering_memory || failed=1; fi
          if [ "$failed" -eq 0 ]; then check pem python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md --write-summary || failed=1; fi
          if [ "$failed" -eq 0 ]; then rm -rf /tmp/diag-dist; check build python source/build_skills.py --output /tmp/diag-dist || failed=1; fi
          if [ "$failed" -eq 0 ]; then check packages python source/validate_packages.py --dist /tmp/diag-dist || failed=1; fi
          if [ "$failed" -eq 0 ]; then rm -rf dist; cp -a /tmp/diag-dist dist; check snapshot-generate python orchestrator/scripts/generate_protocol_snapshot.py || failed=1; fi
          if [ "$failed" -eq 0 ]; then check full-tests env SSDP_VALIDATE_PUBLIC_FALLBACK=1 python -m unittest discover -s tests -v || failed=1; fi
          if [ "$failed" -eq 0 ]; then rm -rf /tmp/diag-check; check rebuild python source/build_skills.py --output /tmp/diag-check || failed=1; fi
          if [ "$failed" -eq 0 ]; then check revalidate python source/validate_packages.py --dist /tmp/diag-check || failed=1; fi
          if [ "$failed" -eq 0 ]; then check dist-parity python source/check_dist.py --expected /tmp/diag-check --committed dist || failed=1; fi
          if [ "$failed" -eq 0 ]; then check snapshot-check python orchestrator/scripts/generate_protocol_snapshot.py --check || failed=1; fi
          git checkout -- . ':!.github/workflows/ssdp63-diagnose-mapped-fallback-once.yml' ':!qualification/ssdp6/DIAGNOSTIC-PROTOCOL-6.3-MAPPED-FALLBACK-STATE-REPAIR.txt'
          rm .github/workflows/ssdp63-diagnose-mapped-fallback-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Record mapped fallback repair diagnostic'
          git push origin HEAD:ssdp-6.3-engineering-memory
