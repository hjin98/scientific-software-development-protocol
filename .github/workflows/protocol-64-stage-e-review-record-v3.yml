name: Protocol 6.4 Stage-E review record v3

on:
  push:
    branches:
      - ssdp-6.4-axiomatic-definition-traceability
    paths:
      - .github/workflows/protocol-64-stage-e-review-record-v3.yml

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewer-state patch
        run: python .github/scripts/protocol64_stage_e_review_record.py
      - name: Remove temporary reviewer scaffolding
        run: |
          rm -f .github/scripts/protocol64_stage_e_review_record.py
          rm -f .github/workflows/protocol-64-stage-e-review-record.yml
          rm -f .github/workflows/protocol-64-stage-e-review-record-v2.yml
          rm -f .github/workflows/protocol-64-stage-e-review-record-v3.yml
      - name: Commit reviewer state
        run: |
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Reopen Protocol 6.4 Stage-E on R6 R7'
          git push
