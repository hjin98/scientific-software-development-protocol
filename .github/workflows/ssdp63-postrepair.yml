name: SSDP 6.3 post-repair assembly

on:
  push:
    branches:
      - ssdp-6.3-engineering-memory
    paths:
      - .github/workflows/ssdp63-postrepair.yml

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Close D7 workflow contract and E1 bootstrap invalidation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          old_bootstrap = '5ee4b3ac3ca1666b0499f7a72f55adcc411bf4bb'

          workflow_path = Path('source/shared/references/workflow-and-workplans.md')
          workflow = workflow_path.read_text(encoding='utf-8')
          anchor = '3. record the exact accepted/base and overlay identities used for the current decision;\n'
          if anchor not in workflow:
              raise SystemExit('workflow HAS insertion anchor missing')
          has_contract = '''\nThe canonical session-local HAS interface is exact and executable:\n\n```yaml\npem_basis:\n  accepted_project_state: <exact accepted project state>\n  accepted_pem: <exact accepted PEM publication or NONE_PROTOCOL_6.2_PRE_PEM>\n  candidate_overlay_semantic_candidate: <exact candidate overlay or NONE>\nhas:\n  - id: <family/capability/notice id>\n    disposition: APPLICABLE | NOT_APPLICABLE | REVIEW_REQUIRED\n    reason: <bounded rationale>\n```\n\nDo not substitute aliases such as `accepted_base` or `candidate_overlay`; the workflow, canonical template, and executable validator use this one shape without translation glue. Keep the HAS session-local unless the governed work explicitly requires a durable handoff/record.\n\n'''
          marker = 'candidate_overlay_semantic_candidate: <exact candidate overlay or NONE>'
          if marker not in workflow:
              workflow = workflow.replace(anchor, anchor + has_contract, 1)
          workflow_path.write_text(workflow, encoding='utf-8')

          version_path = Path('source/shared/references/protocol-versioning-and-compatibility.md')
          version = version_path.read_text(encoding='utf-8')
          old_mapping = f'6.3.0 public-source bootstrap -> {old_bootstrap}'
          sentinel = '6.3.0 public-source bootstrap -> UNAVAILABLE_PENDING_REPLACEMENT_BOOTSTRAP'
          if sentinel not in version:
              if old_mapping not in version:
                  raise SystemExit('current 6.3 bootstrap mapping anchor missing')
              version = version.replace(
                  old_mapping,
                  f'6.3.0 invalidated second bootstrap -> {old_bootstrap}\n{sentinel}',
                  1,
              )
          old_status = (
              f'The pre-repair Protocol 6.3 bootstrap `1484c1d3caa49d87cc15bc52a5e775399c1dae1b` is invalidated. '
              f'The current 6.3 public-source bootstrap mapping is `{old_bootstrap}`; an unavailable sentinel means no public fallback is currently authorized, while an immutable Git SHA on that mapping is usable only as the version-bound 6.3 public fallback after its readiness and exact-ref realization have passed.'
          )
          new_status = (
              f'The pre-repair Protocol 6.3 bootstrap `1484c1d3caa49d87cc15bc52a5e775399c1dae1b` and the second bootstrap `{old_bootstrap}` are immutable historical evidence only and are both invalidated as current fallback by the reopened semantic repair. '
              'The current 6.3 public-source bootstrap mapping is `UNAVAILABLE_PENDING_REPLACEMENT_BOOTSTRAP`; no 6.3 public fallback is authorized until an already-existing repaired snapshot passes bootstrap readiness and exact-ref realization and a later descendant publishes that exact SHA.'
          )
          if new_status not in version:
              if old_status not in version:
                  raise SystemExit('6.3 candidate/bootstrap staging status anchor missing')
              version = version.replace(old_status, new_status, 1)
          version_path.write_text(version, encoding='utf-8')
          PY

          extra_old_refs="$(git grep -n '5ee4b3ac3ca1666b0499f7a72f55adcc411bf4bb' -- source | grep -v 'source/shared/references/protocol-versioning-and-compatibility.md' || true)"
          if [ -n "$extra_old_refs" ]; then
            echo "$extra_old_refs"
            echo 'unexpected invalidated bootstrap reference outside versioning owner' >&2
            exit 1
          fi

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r source/requirements-validation.txt

      - name: Validate repaired PEM and regenerate canonical descendants
        shell: bash
        run: |
          set -euo pipefail
          python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md --write-summary
          rm -rf /tmp/protocol-dist /tmp/protocol-dist-check
          python source/build_skills.py --output /tmp/protocol-dist
          python source/validate_packages.py --dist /tmp/protocol-dist
          rm -rf dist
          cp -a /tmp/protocol-dist dist
          python orchestrator/scripts/generate_protocol_snapshot.py

      - name: Run reopened Protocol 6.3 discriminators
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_protocol_63_engineering_memory.py' -v
          python -m unittest discover -s tests -p 'test_protocol_63_reopened_repairs.py' -v

      - name: Run full repository and generated-package acceptance
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v
          python source/build_skills.py --output /tmp/protocol-dist-check
          python source/validate_packages.py --dist /tmp/protocol-dist-check
          diff -ru dist /tmp/protocol-dist-check
          python orchestrator/scripts/generate_protocol_snapshot.py --check
          git diff --check

      - name: Run Orchestrator Core acceptance
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install ./orchestrator -r orchestrator/requirements-dev.txt
          python orchestrator/scripts/generate_protocol_snapshot.py --check
          python orchestrator/scripts/run_core_tests.py

      - name: Commit assembled repaired snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/shared/references/workflow-and-workplans.md \
                  source/shared/references/protocol-versioning-and-compatibility.md \
                  PROJECT-ENGINEERING-MEMORY.md \
                  dist \
                  orchestrator/src/ssdp_orchestrator/protocol_snapshot
          git diff --cached --check
          git commit -m 'Assemble repaired Protocol 6.3 candidate'
          git push origin HEAD:ssdp-6.3-engineering-memory
