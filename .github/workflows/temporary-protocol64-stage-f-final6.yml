name: Temporary Protocol 6.4 Stage F final 6
on:
  push:
    branches: [ssdp-6.4-axiomatic-definition-traceability]
permissions:
  contents: write
jobs:
  final6:
    if: github.event.head_commit.message == 'Complete Protocol 6.4 Stage F final6'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: ssdp-6.4-axiomatic-definition-traceability, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python -m pip install pyyaml -r source/requirements-validation.txt
          python -m pip install ./orchestrator -r orchestrator/requirements-dev.txt
      - name: Construct final5 tree and reconcile canonical lifecycle owner
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path
          d=yaml.safe_load(Path('.github/workflows/temporary-protocol64-stage-f-final5.yml').read_text())
          Path('/tmp/final5.sh').write_text(next(s['run'] for s in d['jobs']['final5']['steps'] if s.get('name')=='Construct final4 tree and close remaining successor oracles'))
          PY
          bash /tmp/final5.sh
          python - <<'PY'
          from pathlib import Path
          R='74bc572ef516cae417437a2027eeff52a2e25c15'
          p=Path('source/shared/references/protocol-versioning-and-compatibility.md'); t=p.read_text()
          t=t.replace('Protocol 6.3 and candidate 6.4 support PEM schema 1.','Protocol 6.3 and 6.4 support PEM schema 1.')
          t=t.replace('Protocol 6.3 remains accepted-current until Stage-F acceptance and lifecycle closeout pass.','Protocol 6.4 is accepted-current after Stage-F acceptance and lifecycle closeout; Protocol 6.3 remains immutable historical rollback.')
          t=t.replace('Candidate Protocol 6.4 must not mutate any frozen 5.16/6.0/6.1/6.2/6.3 profile resource;','Accepted Protocol 6.4 did not mutate any frozen 5.16/6.0/6.1/6.2/6.3 profile resource;')
          t=t.replace('| `ssdp-protocol-6.3` | 6.3.0 | 2 | accepted current / frozen predecessor for 6.4 candidate |','| `ssdp-protocol-6.3` | 6.3.0 | 2 | frozen historical rollback |')
          t=t.replace('| `ssdp-protocol-6.4` | 6.4.0 | 2 | proposed candidate |','| `ssdp-protocol-6.4` | 6.4.0 | 2 | accepted current |')
          t=t.replace('Protocol 6.3 remains accepted-current while 6.4 is being implemented/qualified/reviewed. The 6.3 profile bytes are frozen as the immediate predecessor oracle. Candidate 6.4 intentionally retains schema v2 because the machine stage graph/result-envelope contract is unchanged;','Protocol 6.4 is accepted-current. The 6.3 profile bytes remain frozen as the immediate historical rollback oracle. Protocol 6.4 retains schema v2 because the machine stage graph/result-envelope contract is unchanged;')
          t=t.replace('## Protocol 6.4 candidate bootstrap/recovery lifecycle','## Protocol 6.4 accepted bootstrap/recovery lifecycle')
          t=t.replace(f'Protocol 6.4 has independent Review PASS and mapped recovery `{R}`, but is **not yet accepted-current** until Stage-F acceptance and lifecycle closeout pass.',f'Protocol 6.4 is **accepted-current** after independent Review PASS, recovery publication, mapping-bearing acceptance, Protocol-7 inheritance reconciliation, and lifecycle closeout. Accepted recovery is `{R}`.')
          p.write_text(t)

          active=Path('workplans/active/SSDP-6.4-AXIOMATIC-FORMAL-DEFINITION-AND-SEMANTIC-TRACEABILITY-CONSOLIDATED.md')
          archived=Path('workplans/archive/SSDP-6.4-AXIOMATIC-FORMAL-DEFINITION-AND-SEMANTIC-TRACEABILITY-CONSOLIDATED.md')
          if active.exists():
              w=active.read_text().replace('status: active','status: archived',1).replace('stage_f: recovery-mapped-acceptance-pending','stage_f: pass',1)
              if 'STAGE F: PASS' not in w:
                  w=w.replace('## Current disposition','## Current disposition\n\n**STAGE F: PASS — PROTOCOL 6.4 LIFECYCLE CLOSED.**',1)
              archived.write_text(w); active.unlink()
          for d in Path('qualification/ssdp6').glob('STAGE-F-DIAGNOSTIC*PROTOCOL-6.4.txt'): d.unlink()
          PY
          python source/build_skills.py --output dist
          python orchestrator/scripts/generate_protocol_snapshot.py
      - name: Full Stage-F acceptance
        run: |
          set -euxo pipefail
          python -m unittest discover -s tests -v
          python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md
          rm -rf /tmp/protocol-dist && python source/build_skills.py --output /tmp/protocol-dist
          python source/validate_packages.py --dist /tmp/protocol-dist
          python source/check_dist.py --expected /tmp/protocol-dist --committed dist
          python orchestrator/scripts/generate_protocol_snapshot.py --check
          python orchestrator/scripts/run_core_tests.py
          git diff --check
      - name: Publish final closeout
        run: |
          set -euxo pipefail
          git config user.name 'Protocol 6.4 lifecycle automation'
          git config user.email 'protocol64-lifecycle@users.noreply.github.com'
          find .github/workflows -maxdepth 1 -type f -name 'temporary-protocol64-stage-f-*.yml' -print0 | xargs -0 git rm
          git add -A
          git diff --cached --check
          git commit -m 'Close Protocol 6.4 lifecycle'
          git push origin HEAD:ssdp-6.4-axiomatic-definition-traceability
