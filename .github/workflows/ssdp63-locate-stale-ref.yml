name: Locate Protocol 6.3 stale bootstrap reference

on:
  push:
    branches:
      - ssdp-6.3-engineering-memory
    paths:
      - .github/workflows/ssdp63-locate-stale-ref.yml

permissions:
  contents: write

jobs:
  locate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture exact source match
        shell: bash
        run: |
          set -euo pipefail
          git grep -n '5ee4b3ac3ca1666b0499f7a72f55adcc411bf4bb' -- source > .ssdp63-stale-ref.txt || true
          test -s .ssdp63-stale-ref.txt
      - name: Commit diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ssdp63-stale-ref.txt
          git commit -m 'Record stale 6.3 bootstrap source match'
          git push origin HEAD:ssdp-6.3-engineering-memory
