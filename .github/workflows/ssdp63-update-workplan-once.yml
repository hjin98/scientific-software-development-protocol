name: SSDP 6.3 repair execution

on:
  push:
    branches:
      - ssdp-6.3-engineering-memory
    paths:
      - .github/workflows/ssdp63-update-workplan-once.yml
      - .github/ssdp63-repair-runner

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ssdp-6.3-engineering-memory
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply owner-layer repairs
        run: python .github/ssdp63-repair-runner
      - name: Install validation and Core dependencies
        run: |
          python -m pip install -r source/requirements-validation.txt
          python -m pip install ./orchestrator -r orchestrator/requirements-dev.txt
      - name: Focused D4 D5 repair tests
        run: python -m unittest -v tests.test_protocol_63_reopened_repairs
      - name: Validate self-hosted PEM and regenerate descendants
        run: |
          python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md --write-summary
          rm -rf /tmp/protocol-dist
          python source/build_skills.py --output /tmp/protocol-dist
          python source/validate_packages.py --dist /tmp/protocol-dist
          rm -rf dist
          cp -a /tmp/protocol-dist dist
          python orchestrator/scripts/generate_protocol_snapshot.py
      - name: Full affected repository regression
        run: python -m unittest discover -s tests -v
      - name: Final assembled package and Core checks
        run: |
          rm -rf /tmp/protocol-dist-check
          python source/build_skills.py --output /tmp/protocol-dist-check
          python source/validate_packages.py --dist /tmp/protocol-dist-check
          python source/check_dist.py --expected /tmp/protocol-dist-check --committed dist
          python orchestrator/scripts/generate_protocol_snapshot.py --check
          python orchestrator/scripts/run_core_tests.py
          git diff --check
      - name: Commit repaired semantic source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Repair Protocol 6.3 recurrence and maturity discriminators'
          git push origin HEAD:ssdp-6.3-engineering-memory
