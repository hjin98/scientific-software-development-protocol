name: Publish Protocol 6.3 repaired bootstrap once

on:
  push:
    branches: [ssdp-6.3-engineering-memory]
    paths: [.github/workflows/ssdp63-publish-repaired-bootstrap-once.yml]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ssdp-6.3-engineering-memory
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r source/requirements-validation.txt
          python -m pip install ./orchestrator -r orchestrator/requirements-dev.txt
      - name: Verify unmapped repaired snapshot readiness
        shell: bash
        run: |
          set -euo pipefail
          bootstrap=e12572c021087308570abfa41657a910c6896457
          sentinel=UNAVAILABLE_PENDING_REPLACEMENT_BOOTSTRAP
          test "$(git show ${bootstrap}:source/PROTOCOL_VERSION)" = "6.3.0"
          git show "${bootstrap}:source/shared/references/development-workflow-prompts.md" | grep -F "CURRENT_PUBLIC_REF = ${sentinel}"
          git show "${bootstrap}:tests/test_protocol_63_bootstrap.py" | grep -F "BOOTSTRAP = \"${sentinel}\""
          python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md --write-summary
          rm -rf /tmp/pdist-ready
          python source/build_skills.py --output /tmp/pdist-ready
          python source/validate_packages.py --dist /tmp/pdist-ready
          python -m unittest -v tests.test_protocol_63_reopened_repairs tests.test_protocol_63_engineering_memory tests.test_protocol_63_bootstrap
          python orchestrator/scripts/run_core_tests.py
          git diff --check
      - name: Publish exact immutable bootstrap mapping
        shell: bash
        run: |
          set -euo pipefail
          bootstrap=e12572c021087308570abfa41657a910c6896457
          sentinel=UNAVAILABLE_PENDING_REPLACEMENT_BOOTSTRAP
          python - "$bootstrap" <<'PY'
          from pathlib import Path
          import sys
          bootstrap = sys.argv[1]
          sentinel = "UNAVAILABLE_PENDING_REPLACEMENT_BOOTSTRAP"
          paths = [
              Path("source/shared/references/protocol-versioning-and-compatibility.md"),
              Path("source/shared/references/development-workflow-prompts.md"),
              Path("PORTABILITY.md"),
              Path("README.md"),
          ]
          for p in paths:
              text = p.read_text(encoding="utf-8")
              if sentinel not in text:
                  raise SystemExit(f"expected mapping sentinel missing from {p}")
              p.write_text(text.replace(sentinel, bootstrap), encoding="utf-8")
          p = Path("tests/test_protocol_63_bootstrap.py")
          text = p.read_text(encoding="utf-8")
          old = f'BOOTSTRAP = "{sentinel}"'
          new = f'BOOTSTRAP = "{bootstrap}"'
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one BOOTSTRAP constant sentinel, found {text.count(old)}")
          text = text.replace(old, new, 1)
          if 'self.assertIn("UNAVAILABLE_PENDING_REPLACEMENT_BOOTSTRAP", prompts)' not in text:
              raise SystemExit("self-reference-safety oracle was altered")
          p.write_text(text, encoding="utf-8")
          PY
          python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md --write-summary
          rm -rf /tmp/pdist-map
          python source/build_skills.py --output /tmp/pdist-map
          python source/validate_packages.py --dist /tmp/pdist-map
          rm -rf dist
          cp -a /tmp/pdist-map dist
          python orchestrator/scripts/generate_protocol_snapshot.py
          SSDP_VALIDATE_PUBLIC_FALLBACK=1 python -m unittest discover -s tests -v
          rm -rf /tmp/pdist-check
          python source/build_skills.py --output /tmp/pdist-check
          python source/validate_packages.py --dist /tmp/pdist-check
          python source/check_dist.py --expected /tmp/pdist-check --committed dist
          python orchestrator/scripts/generate_protocol_snapshot.py --check
          python orchestrator/scripts/run_core_tests.py
          for version in sdp-protocol-5.16 ssdp-protocol-6.0 ssdp-protocol-6.1 ssdp-protocol-6.2; do
            git diff --exit-code b59adc77efe6951912cfd705cc43830c58ca27d0 -- "orchestrator/src/sdp_orchestrator/core/resources/protocol/${version}"
          done
          git diff --check
          grep -F "CURRENT_PUBLIC_REF = ${bootstrap}" source/shared/references/development-workflow-prompts.md
          grep -F 'self.assertIn("UNAVAILABLE_PENDING_REPLACEMENT_BOOTSTRAP", prompts)' tests/test_protocol_63_bootstrap.py
      - name: Commit mapping descendant
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/ssdp63-publish-repaired-bootstrap-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish Protocol 6.3 repaired bootstrap mapping'
          git push origin HEAD:ssdp-6.3-engineering-memory
