name: Temporary Protocol 6.3 closeout gate capture

on:
  push:
    branches: [ssdp-6.3-engineering-memory]

permissions:
  contents: write

jobs:
  capture:
    if: github.event.head_commit.message == 'Capture Protocol 6.3 closeout gate results'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ssdp-6.3-engineering-memory
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: |
          python -m pip install -r source/requirements-validation.txt
          python -m pip install ./orchestrator -r orchestrator/requirements-dev.txt
      - name: Capture exact closeout gates
        shell: bash
        run: |
          set -euo pipefail
          python orchestrator/scripts/protocol_63_closeout.py
          python orchestrator/scripts/protocol_63_closeout_oracle_repair.py
          python source/build_skills.py --output dist
          python orchestrator/scripts/generate_protocol_snapshot.py
          rm -rf /tmp/protocol-dist
          python source/build_skills.py --output /tmp/protocol-dist
          : > /tmp/protocol63-closeout-gates.log
          set +e
          python -m unittest discover -s tests -v >> /tmp/protocol63-closeout-gates.log 2>&1; echo "unittest_rc=$?" >> /tmp/protocol63-closeout-gates.log
          python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md >> /tmp/protocol63-closeout-gates.log 2>&1; echo "pem_rc=$?" >> /tmp/protocol63-closeout-gates.log
          python source/validate_packages.py --dist /tmp/protocol-dist >> /tmp/protocol63-closeout-gates.log 2>&1; echo "package_rc=$?" >> /tmp/protocol63-closeout-gates.log
          python source/check_dist.py --expected /tmp/protocol-dist --committed dist >> /tmp/protocol63-closeout-gates.log 2>&1; echo "dist_rc=$?" >> /tmp/protocol63-closeout-gates.log
          python orchestrator/scripts/generate_protocol_snapshot.py --check >> /tmp/protocol63-closeout-gates.log 2>&1; echo "snapshot_rc=$?" >> /tmp/protocol63-closeout-gates.log
          python orchestrator/scripts/run_core_tests.py >> /tmp/protocol63-closeout-gates.log 2>&1; echo "core_rc=$?" >> /tmp/protocol63-closeout-gates.log
          git diff --check >> /tmp/protocol63-closeout-gates.log 2>&1; echo "diffcheck_rc=$?" >> /tmp/protocol63-closeout-gates.log
          set -e
          git reset --hard HEAD
          cp /tmp/protocol63-closeout-gates.log qualification/ssdp6/TEMP-PROTOCOL63-CLOSEOUT-GATES.log
      - name: Commit diagnostic only
        run: |
          set -euxo pipefail
          git config user.name 'Protocol 6.3 lifecycle automation'
          git config user.email 'protocol63-lifecycle@users.noreply.github.com'
          git rm .github/workflows/temporary-protocol63-closeout-gate-capture.yml
          git add qualification/ssdp6/TEMP-PROTOCOL63-CLOSEOUT-GATES.log
          git commit -m 'Capture Protocol 6.3 closeout gate evidence'
          git push origin HEAD:ssdp-6.3-engineering-memory
