STAGE D PUBLIC BOOTSTRAP: PUBLISHED / AUTHORIZED - e09a9d1480211eea2d16d722182bb5c6de1bee12
STAGE E INDEPENDENT REVIEW: NO-PASS - B64-R4/B64-R5 REPAIRED; FRESH REVIEW REQUIRED
PROTOCOL 6.4 RECOVERY: UNAVAILABLE PENDING INDEPENDENT REVIEW PASS
CURRENT ACCEPTED DOCUMENT-CONTROLLED BASELINE: Protocol 6.3
STAGE F: BLOCKED
PROTOCOL 7 INHERITANCE OF 6.4: DEFERRED UNTIL 6.4 ACCEPTANCE"""
          if old not in text:
              raise SystemExit("Protocol 6.4 authority-index stale disposition anchor missing")
          index.write_text(text.replace(old, new, 1), encoding="utf-8")

          test = Path("tests/test_protocol_64_axiomatic_traceability.py")
          text = test.read_text(encoding="utf-8")
          anchor = """    return result


def markdown_fences_well_formed(text: str) -> bool:
"""
          helper = """    return result


def protocol64_authority_index_state(text: str) -> dict[str, str]:
    start_marker = "## Protocol 6.4 current design handoff"
    end_marker = "## Protocol 7.0 current design handoff"
    start = text.find(start_marker)
    end = text.find(end_marker, start + len(start_marker)) if start >= 0 else -1
    if start < 0 or end < 0:
        return {}
    section = text[start:end]
    match = re.search(r"Current disposition:\\s*```text\\n(.*?)\\n```", section, re.DOTALL)
    if not match:
        return {}
    state: dict[str, str] = {}
    for line in match.group(1).splitlines():
        if ":" not in line:
            continue
        key, value = line.split(":", 1)
        state[key.strip()] = value.strip()
    return state


def protocol64_lifecycle_state_ok(state: dict[str, str]) -> bool:
    return bool(
        state.get("IMPLEMENTATION / STAGE C QUALIFICATION") == "COMPLETE / QUALIFIED"
        and state.get("STAGE D PUBLIC BOOTSTRAP")
        == "PUBLISHED / AUTHORIZED - e09a9d1480211eea2d16d722182bb5c6de1bee12"
        and state.get("STAGE E INDEPENDENT REVIEW")
        == "NO-PASS - B64-R4/B64-R5 REPAIRED; FRESH REVIEW REQUIRED"
        and state.get("PROTOCOL 6.4 RECOVERY") == "UNAVAILABLE PENDING INDEPENDENT REVIEW PASS"
        and state.get("CURRENT ACCEPTED DOCUMENT-CONTROLLED BASELINE") == "Protocol 6.3"
        and state.get("STAGE F") == "BLOCKED"
    )


def markdown_fences_well_formed(text: str) -> bool:
"""
          if anchor not in text:
              raise SystemExit("test helper insertion anchor missing")
          text = text.replace(anchor, helper, 1)

          old_qfp = """def qf_p(c):
    return bool(
        c.get("snapshot_complete")
