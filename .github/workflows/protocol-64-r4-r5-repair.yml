name: Protocol 6.4 R4 R5 repair

on:
  push:
    branches:
      - ssdp-6.4-axiomatic-definition-traceability
    paths:
      - .github/workflows/protocol-64-r4-r5-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply B64-R4 and B64-R5 repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def require_replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected repair anchor missing in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          index = Path("workplans/active/SSDP-6.1-7.0-WORKPLAN-AUTHORITY-INDEX.md")
          text = index.read_text(encoding="utf-8")
          old = """SERIOUS CHALLENGE: NONE
SIXTH DESIGN REVIEW: PASS AFTER GAP CLOSURE
IMPLEMENTATION HANDOFF: AUTHORIZED — CONSOLIDATED
IMPLEMENTATION STATUS: PROPOSED / NOT YET QUALIFIED
ACCEPTED PARENT: Protocol 6.3 recovery 9f353097fab36e325a325f1c2f9d9cec32e86177
PROTOCOL 6.4 PUBLIC BOOTSTRAP: NOT YET PUBLISHED
PROTOCOL 6.4 RECOVERY: NOT YET ESTABLISHED
CURRENT ACCEPTED DOCUMENT-CONTROLLED BASELINE: Protocol 6.3
PROTOCOL 7 INHERITANCE OF 6.4: DEFERRED UNTIL 6.4 ACCEPTANCE"""
          new = """SERIOUS CHALLENGE: NONE
