          old_disp = """**FRESH STAGE-E REVIEW: NO-PASS — REOPENED.** A fresh independent Review of immutable assembled target `ced6a352fbe84e8ed5e698d2ab133d4c5bb0f152`, bound by the later handoff and exact-target CI, found two blocking lifecycle/qualification defects: B64-R4 and B64-R5 in Section 28. No Serious Challenge is active. Protocol 6.3 remains accepted-current; Protocol 6.4 recovery remains unavailable; Stage F remains blocked. Repair the earliest owning current-state and qualification surfaces, freeze a new immutable assembled target, bind exact-target qualification from a later descendant, and perform another fresh full Stage-E Review before Stage F."""
          new_disp = """**B64-R4/B64-R5 REPAIR COMPLETE; FRESH STAGE-E REVIEW REQUIRED.** The active lifecycle index now reflects completed Stage C qualification and the authorized Protocol 6.4 public bootstrap, and QF64-P now validates that real current index with discriminating stale-state counterfactuals. No Serious Challenge is active. The repair does not change the published public-source semantics or bootstrap identity. Protocol 6.3 remains accepted-current; Protocol 6.4 recovery remains unavailable; Stage F remains blocked. The next immutable assembled target is bound only from the descendant Stage-E handoff after exact-target ordinary PR CI; a fresh independent full Stage-E Review is still required before Stage F."""
