          if old_base not in text:
              raise SystemExit("BASE P anchor missing")
          text = text.replace(old_base, new_base, 1)
          old_neg = '    "P": ({"amendment_replay": True}, {"snapshot_complete": False}, {"current_handoff": False}, {"baseline_consistent": False}, {"target_binding": False}, {"qualification_binding": False}),\n'
          new_neg = '    "P": ({"amendment_replay": True}, {"snapshot_complete": False}, {"current_handoff": False}, {"baseline_consistent": False}, {"target_binding": False}, {"qualification_binding": False}, {"lifecycle_index_current": False}, {"stale_lifecycle_state": True}),\n'
