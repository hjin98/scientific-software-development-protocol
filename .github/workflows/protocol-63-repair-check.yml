name: Protocol 6.3 repair validation

on:
  push:
    branches:
      - ssdp-6.3-engineering-memory

permissions:
  contents: read

jobs:
  protocol-repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -r source/requirements-validation.txt
      - name: Run focused independent-review repairs
        run: python -m unittest tests.test_protocol_63_independent_review_repairs -v
      - name: Run complete repository regression
        run: python -m unittest discover -s tests -v
      - name: Validate self-hosted project engineering memory
        run: python source/project_engineering_memory.py validate PROJECT-ENGINEERING-MEMORY.md
      - name: Build canonical skill packages once
        run: python source/build_skills.py --output /tmp/protocol-dist
      - name: Validate generated skill packages independently
        run: python source/validate_packages.py --dist /tmp/protocol-dist
      - name: Verify committed distribution parity
        run: python source/check_dist.py --expected /tmp/protocol-dist --committed dist
      - name: Verify Protocol snapshot parity
        run: python orchestrator/scripts/generate_protocol_snapshot.py --check
      - name: Install orchestrator Core dependencies
        run: python -m pip install ./orchestrator -r orchestrator/requirements-dev.txt
      - name: Run orchestrator Core acceptance suite
        run: python orchestrator/scripts/run_core_tests.py
      - name: Check patch whitespace
        run: git diff --check f02d57eddc33440dc63c31c51d91f6331e2e8485..HEAD
