name: Protocol 6.2 Stage G Diagnose v4

on:
  push:
    branches:
      - ssdp-6.2-lossless-representation
    paths:
      - '.github/workflows/protocol-62-stage-g-diagnose-v4.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ssdp-6.2-lossless-representation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Capture Stage G output
        shell: bash
        run: |
          set +e
          python orchestrator/scripts/protocol_62_stage_g_push.py > /tmp/stage-g-v4.log 2>&1
          rc=$?
          set -e
          git fetch origin ssdp-6.2-lossless-representation
          git reset --hard origin/ssdp-6.2-lossless-representation
          cp /tmp/stage-g-v4.log qualification/ssdp6/STAGE-G-V4-DIAGNOSTIC.txt
          printf '\nexit_code=%s\n' "$rc" >> qualification/ssdp6/STAGE-G-V4-DIAGNOSTIC.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qualification/ssdp6/STAGE-G-V4-DIAGNOSTIC.txt
          git commit -m "Capture exact Protocol 6.2 Stage G v4 failure"
          git push origin HEAD:ssdp-6.2-lossless-representation
