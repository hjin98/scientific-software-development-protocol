name: Temporary Protocol 6.4 Stage F diagnose final6
on:
  push:
    branches: [ssdp-6.4-axiomatic-definition-traceability]
permissions:
  contents: write
jobs:
  diagnose-final6:
    if: github.event.head_commit.message == 'Diagnose Protocol 6.4 Stage F final6'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: ssdp-6.4-axiomatic-definition-traceability, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python -m pip install pyyaml -r source/requirements-validation.txt
          python -m pip install ./orchestrator -r orchestrator/requirements-dev.txt
      - name: Reconstruct exact final6 candidate
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path
          d=yaml.safe_load(Path('.github/workflows/temporary-protocol64-stage-f-final6.yml').read_text())
          Path('/tmp/final6.sh').write_text(next(s['run'] for s in d['jobs']['final6']['steps'] if s.get('name')=='Construct final5 tree and reconcile canonical lifecycle owner'))
          PY
          bash /tmp/final6.sh
      - name: Capture full acceptance evidence
        run: |
          set +e
          out=qualification/ssdp6/STAGE-F-DIAGNOSTIC-FINAL6-PROTOCOL-6.4.txt
          : > "$out"
          run(){ echo "===== $1 =====" >> "$out"; shift; "$@" >> "$out" 2>&1; echo "EXIT=$?" >> "$out"; }
          run unittest python -m unittest discover -s tests -v
          run pem python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md
          rm -rf /tmp/protocol-dist
          run build python source/build_skills.py --output /tmp/protocol-dist
          run validate python source/validate_packages.py --dist /tmp/protocol-dist
          run dist python source/check_dist.py --expected /tmp/protocol-dist --committed dist
          run snapshot python orchestrator/scripts/generate_protocol_snapshot.py --check
          run core python orchestrator/scripts/run_core_tests.py
          run diff git diff --check
          git config user.name 'Protocol 6.4 lifecycle automation'
          git config user.email 'protocol64-lifecycle@users.noreply.github.com'
          git add "$out" && git commit -m 'Capture Protocol 6.4 Stage F final6 diagnostic'
          git push origin HEAD:ssdp-6.4-axiomatic-definition-traceability
