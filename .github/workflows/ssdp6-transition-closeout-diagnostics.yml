name: SSDP 6 transition closeout diagnostics

on:
  push:
    branches:
      - impl/ssdp-6

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reuse closeout transformation
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          lines = Path('.github/workflows/ssdp6-transition-closeout.yml').read_text(encoding='utf-8').splitlines()
          marker = '      - name: Archive completed transition authority'
          start = lines.index(marker)
          run_line = start + 1
          if lines[run_line] != '        run: |':
              raise SystemExit('unexpected closeout workflow shape')
          body = []
          for line in lines[run_line + 1:]:
              if line.startswith('      - name: '):
                  break
              if line.startswith('          '):
                  body.append(line[10:])
              else:
                  body.append(line)
          script = Path('/tmp/closeout-transform.sh')
          script.write_text('\n'.join(body) + '\n', encoding='utf-8')
          subprocess.run(['bash', str(script)], check=True)
          PY
      - name: Install validation dependencies
        run: python -m pip install -r source/requirements-validation.txt
      - name: Capture root regression output
        run: |
          set +e
          python -m unittest discover -s tests -v > .ci-ssdp6-closeout-failure.log 2>&1
          code=$?
          echo "$code" > .ci-ssdp6-closeout-exit-code
          exit 0
      - name: Persist exact diagnostics
        run: |
          code="$(cat .ci-ssdp6-closeout-exit-code)"
          if [ "$code" = "0" ]; then
            echo "Closeout root tests unexpectedly passed; refusing diagnostic commit."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci-ssdp6-closeout-failure.log
          git commit -m "Record SSDP 6 closeout regression diagnostics"
          git push
