name: Materialize SSDP 6.2 cold-route repair

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ssdp-6.2-lossless-representation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install -r source/requirements-validation.txt
      - name: Regenerate canonical skill distributions
        run: python source/build_skills.py
      - name: Validate repaired route and packages
        run: |
          python -m unittest discover -s tests -p 'test_protocol_62_representation.py' -v
          python source/validate_packages.py --dist dist
          git diff --check
      - name: Commit generated descendants and remove materializer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/materialize-ssdp62-cold-route.yml
          git add dist
          git diff --cached --exit-code && exit 0 || true
          git commit -m 'Restore documentation cold-route package reachability'
          git push origin HEAD:${{ github.head_ref }}
