name: Refine SSDP 6.3 review reopen

on:
  push:
    branches:
      - ssdp-6.3-engineering-memory
    paths:
      - .github/workflows/refine-ssdp63-review-reopen.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refine reopened stages and publication coherence repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('workplans/active/PROTOCOL-6.3-EVIDENCE-BACKED-PROJECT-ENGINEERING-MEMORY-WORKPLAN.md')
          s = p.read_text(encoding='utf-8')
          replacements = {
            'reopened_stages: D,E,F': 'reopened_stages: B,C,D,E,F',
            "The architectural design remains implementation-authorized; Stages D, E, and F are reopened because the candidate's D4 Project Engineering Memory (PEM) validation/representation and Stage-F qualification can accept invalid states.": "The architectural design remains coherent and implementation-authorized; Stages B, C, D, E, and F are reopened over the affected surfaces because the candidate's schema/representation, workflow/HAS concretization, D4 Project Engineering Memory (PEM) validation, bootstrap/candidate state, and Stage-F qualification can accept invalid states. Stage A remains preserved unless repair discovers a newly affected durable/generative surface.",
            'Implementation remains authorized on the dedicated 6.3 branch only for the current repair contract: Stages D, E, and F are reopened,': 'Implementation remains authorized on the dedicated 6.3 branch only for the current repair contract: Stages B, C, D, E, and F are reopened over the affected surfaces,',
            'Introduce the minimum non-self-referential publication-coherence metadata needed to prove that root and declared canonical partitions belong to the same semantic update, for example a root-issued logical publication token carried by every partition and replaced for each semantic publication spanning the unit. The token is representation metadata, not semantic authority and not a Git self-SHA.': 'Introduce the minimum non-self-referential publication-coherence metadata needed to prove that each declared canonical partition is exactly the content expected by the root. Prefer a root-declared immutable content identity/digest per partition so unchanged partitions do not churn when an unrelated partition changes; an equally discriminating scheme is acceptable if it preserves that property. Publication metadata is representation integrity, not semantic authority and not a Git self-SHA.',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing refinement anchor: {old[:80]}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git rm .github/workflows/refine-ssdp63-review-reopen.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workplans/active/PROTOCOL-6.3-EVIDENCE-BACKED-PROJECT-ENGINEERING-MEMORY-WORKPLAN.md
          git diff --cached --check
          git commit -m "Refine Protocol 6.3 review repair ownership"
          git push
