name: Capture Protocol 6.3 mapped candidate failure
on:
  push:
    branches: [ssdp-6.3-engineering-memory]
    paths: [.github/workflows/ssdp63-mapped-candidate-diagnostic.yml]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python -m pip install -r source/requirements-validation.txt
          python -m pip install ./orchestrator -r orchestrator/requirements-dev.txt
      - shell: bash
        run: |
          set +e
          candidate=07e71c7c4ef73e07e0e9ddc35bd8ac84d6bc09ad
          out=qualification/ssdp6/DIAGNOSTIC-PROTOCOL-6.3-MAPPED-CANDIDATE-ACCEPTANCE.txt
          tmp=/tmp/mapped-diagnostic.txt
          : > "$tmp"
          python - "$candidate" <<'PY'
          from pathlib import Path
          import sys
          candidate=sys.argv[1]; sentinel='UNAVAILABLE_PENDING_REPLACEMENT_BOOTSTRAP'
          for raw in ['source/shared/references/protocol-versioning-and-compatibility.md','source/shared/references/development-workflow-prompts.md','PORTABILITY.md','README.md','tests/test_protocol_63_bootstrap.py']:
              p=Path(raw); t=p.read_text(encoding='utf-8')
              if sentinel not in t: raise SystemExit(f'missing sentinel: {raw}')
              p.write_text(t.replace(sentinel,candidate),encoding='utf-8')
          PY
          python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md --write-summary >> "$tmp" 2>&1
          rm -rf /tmp/pdist && python source/build_skills.py --output /tmp/pdist >> "$tmp" 2>&1; echo BUILD=$? >> "$tmp"
          python source/validate_packages.py --dist /tmp/pdist >> "$tmp" 2>&1; echo PACKAGE=$? >> "$tmp"
          rm -rf dist && cp -a /tmp/pdist dist
          python orchestrator/scripts/generate_protocol_snapshot.py >> "$tmp" 2>&1; echo SNAPWRITE=$? >> "$tmp"
          SSDP_VALIDATE_PUBLIC_FALLBACK=1 python -m unittest discover -s tests -v >> "$tmp" 2>&1; rc=$?; echo FULL_TEST=$rc >> "$tmp"
          python orchestrator/scripts/run_core_tests.py >> "$tmp" 2>&1; echo CORE=$? >> "$tmp"
          git reset --hard HEAD
          git clean -fd
          mkdir -p qualification/ssdp6
          cp "$tmp" "$out"
          rm -f .github/workflows/ssdp63-mapped-candidate-diagnostic.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Record Protocol 6.3 mapped-candidate failure evidence'
          git push origin HEAD:ssdp-6.3-engineering-memory
          exit "$rc"
