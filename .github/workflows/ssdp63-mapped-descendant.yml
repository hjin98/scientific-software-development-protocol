name: Protocol 6.3 replacement bootstrap mapped descendant

on:
  push:
    branches:
      - ssdp-6.3-engineering-memory

permissions:
  contents: write

concurrency:
  group: ssdp63-replacement-bootstrap-mapped-descendant
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: |
          python -m pip install -r source/requirements-validation.txt
          python -m pip install ./orchestrator -r orchestrator/requirements-dev.txt
      - name: Configure publication identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "START_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Publish exact replacement mapping without rewriting self-safe assertion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          pending = 'UNAVAILABLE_PENDING_6.3_BOOTSTRAP_QUALIFICATION'
          replacement = '5ee4b3ac3ca1666b0499f7a72f55adcc411bf4bb'

          for raw in [
              'source/shared/references/protocol-versioning-and-compatibility.md',
              'source/shared/references/development-workflow-prompts.md',
              'PORTABILITY.md',
              'README.md',
          ]:
              path = Path(raw)
              text = path.read_text(encoding='utf-8')
              if pending not in text:
                  raise SystemExit(f'pending mapping sentinel missing from {raw}')
              path.write_text(text.replace(pending, replacement), encoding='utf-8')

          test = Path('tests/test_protocol_63_bootstrap.py')
          text = test.read_text(encoding='utf-8')
          old = f'BOOTSTRAP = "{pending}"'
          new = f'BOOTSTRAP = "{replacement}"'
          if text.count(old) != 1:
              raise SystemExit('bootstrap assignment is not uniquely replaceable')
          text = text.replace(old, new, 1)
          # The immutable bootstrap itself must retain the pending sentinel and must not self-name.
          if 'self.assertIn("UNAVAILABLE_PENDING_6.3_BOOTSTRAP_QUALIFICATION", prompts)' not in text:
              raise SystemExit('self-reference-safe remote assertion was lost')
          test.write_text(text, encoding='utf-8')
          PY
          rm -f qualification/ssdp6/TEMP-PROTOCOL-6.3-POST-MAPPING-DIAGNOSTIC.txt
          rm -f .github/workflows/ssdp63-mapped-descendant.yml
          git add -A
          git commit -m "Publish Protocol 6.3 replacement bootstrap mapping"
          echo "MAPPING_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Regenerate mapping-bearing descendants
        shell: bash
        run: |
          set -euo pipefail
          python source/build_skills.py --output dist
          python orchestrator/scripts/generate_protocol_snapshot.py
          git add dist orchestrator/src/sdp_orchestrator/core/resources/protocol/ssdp-protocol-6.3
          git commit -m "Regenerate Protocol 6.3 mapped descendants"
          echo "GENERATED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Qualify final mapped descendant
        shell: bash
        run: |
          set -euo pipefail
          CI=1 python -m unittest discover -s tests -v
          python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md
          rm -rf /tmp/protocol-dist
          python source/build_skills.py --output /tmp/protocol-dist
          python source/validate_packages.py --dist /tmp/protocol-dist
          python source/check_dist.py --expected /tmp/protocol-dist --committed dist
          python orchestrator/scripts/generate_protocol_snapshot.py --check
          python orchestrator/scripts/run_core_tests.py
          git diff --check
          git diff --exit-code "$START_SHA" -- \
            orchestrator/src/sdp_orchestrator/core/resources/protocol/sdp-protocol-5.16 \
            orchestrator/src/sdp_orchestrator/core/resources/protocol/ssdp-protocol-6.0 \
            orchestrator/src/sdp_orchestrator/core/resources/protocol/ssdp-protocol-6.1 \
            orchestrator/src/sdp_orchestrator/core/resources/protocol/ssdp-protocol-6.2
          test -z "$(git status --porcelain)"
      - name: Push qualified mapping-bearing descendant
        run: |
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "replacement_bootstrap=5ee4b3ac3ca1666b0499f7a72f55adcc411bf4bb"
          echo "mapping_commit=$MAPPING_SHA"
          echo "generated_reconciliation=$GENERATED_SHA"
