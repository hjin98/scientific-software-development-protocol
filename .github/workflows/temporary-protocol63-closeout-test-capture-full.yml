name: Temporary Protocol 6.3 closeout dependency-complete test capture

on:
  push:
    branches: [ssdp-6.3-engineering-memory]

permissions:
  contents: write

jobs:
  capture:
    if: github.event.head_commit.message == 'Capture dependency-complete Protocol 6.3 closeout test failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ssdp-6.3-engineering-memory
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: |
          python -m pip install -r source/requirements-validation.txt
          python -m pip install ./orchestrator -r orchestrator/requirements-dev.txt
      - name: Capture exact closeout unittest output
        shell: bash
        run: |
          set -euo pipefail
          python orchestrator/scripts/protocol_63_closeout.py
          python orchestrator/scripts/protocol_63_closeout_oracle_repair.py
          set +e
          python -m unittest discover -s tests -v > /tmp/protocol63-closeout-tests-full.log 2>&1
          rc=$?
          set -e
          printf '\nunittest_rc=%s\n' "$rc" >> /tmp/protocol63-closeout-tests-full.log
          git reset --hard HEAD
          cp /tmp/protocol63-closeout-tests-full.log qualification/ssdp6/TEMP-PROTOCOL63-CLOSEOUT-TEST-FULL.log
      - name: Commit diagnostic only
        run: |
          set -euxo pipefail
          git config user.name 'Protocol 6.3 lifecycle automation'
          git config user.email 'protocol63-lifecycle@users.noreply.github.com'
          git rm .github/workflows/temporary-protocol63-closeout-gate-diagnostic.yml
          git rm .github/workflows/temporary-protocol63-closeout-test-capture-full.yml
          git add qualification/ssdp6/TEMP-PROTOCOL63-CLOSEOUT-TEST-FULL.log
          git commit -m 'Capture dependency-complete Protocol 6.3 closeout unittest evidence'
          git push origin HEAD:ssdp-6.3-engineering-memory
