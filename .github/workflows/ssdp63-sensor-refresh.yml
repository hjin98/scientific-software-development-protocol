name: Protocol 6.3 final static sensor refresh

on:
  push:
    branches:
      - ssdp-6.3-engineering-memory

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recompute exact candidate active-set bytes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          CANDIDATE = "7f6774156e8595ac9a04227e1c0be30783525a67"
          path = Path("qualification/ssdp6/SSDP-6.3-STATIC-ACTIVATION-SENSORS.md")
          text = path.read_text(encoding="utf-8")
          text = re.sub(r"^semantic_candidate: [0-9a-f]{40}$", f"semantic_candidate: {CANDIDATE}", text, count=1, flags=re.MULTILINE)

          section_re = re.compile(
              r"(^### (?P<name>[^\n]+)\n\n- active bytes: )(?P<bytes>[0-9,]+)(?P<tail>;[^\n]*\n- active: `(?P<paths>[^\n]+)`\n)",
              re.MULTILINE,
          )
          totals = {}
          def repl(match):
              raw_paths = [p.strip('` ') for p in match.group('paths').split('`, `')]
              total = 0
              for raw in raw_paths:
                  proc = subprocess.run(["git", "show", f"{CANDIDATE}:{raw}"], check=True, stdout=subprocess.PIPE)
                  total += len(proc.stdout)
              totals[match.group('name')] = total
              return f"{match.group(1)}{total:,}{match.group('tail')}"
          text, count = section_re.subn(repl, text)
          if count != 11:
              raise SystemExit(f"expected 11 fixed sensor sections, refreshed {count}")

          lines = text.splitlines()
          table_start = next(i for i, line in enumerate(lines) if line.startswith("| Representative task |"))
          for i in range(table_start + 2, table_start + 13):
              cells = [c.strip() for c in lines[i].strip().strip('|').split('|')]
              name = cells[0]
              if name not in totals:
                  raise SystemExit(f"table/section mismatch: {name}")
              baseline = int(cells[1].replace(',', ''))
              current = totals[name]
              delta = current - baseline
              cells[2] = f"{current:,}"
              cells[3] = f"{delta:+,}"
              lines[i] = "| " + " | ".join(cells) + " |"
          text = "\n".join(lines) + "\n"

          marker = "## Fixed-predicate sensor table\n"
          refresh = (
              "Final reopened-candidate refresh: the active-set predicates/topology were rechecked against the assembled "
              f"replacement semantic candidate `{CANDIDATE}` and remain unchanged. Every 6.3 byte total below was recomputed "
              "from the exact Git blobs named by that fixed active set; no pre-repair byte total is carried forward as current evidence.\n\n"
          )
          if "Final reopened-candidate refresh:" not in text:
              text = text.replace(marker, refresh + marker, 1)
          path.write_text(text, encoding="utf-8")
          PY
          rm .github/workflows/ssdp63-sensor-refresh.yml
          git diff --check
          git add -A
          git commit -m "Refresh Protocol 6.3 static activation sensors"
          git push origin "HEAD:${GITHUB_REF_NAME}"
