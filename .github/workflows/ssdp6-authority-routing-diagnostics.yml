name: SSDP 6 authority-routing diagnostics

on:
  push:
    branches:
      - impl/ssdp-6

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reuse the repair transformation
        run: |
          awk '
            /python - <<'"'"'PY'"'"'/ {capture=1; next}
            capture && /^          PY$/ {exit}
            capture {sub(/^          /, ""); print}
          ' .github/workflows/ssdp6-authority-routing-repair.yml > /tmp/apply_repair.py
          python /tmp/apply_repair.py
      - name: Install validation dependencies
        run: python -m pip install -r source/requirements-validation.txt
      - name: Capture root regression output
        id: tests
        continue-on-error: true
        run: python -m unittest discover -s tests -v > .ci-ssdp6-authority-routing-failure.log 2>&1
      - name: Persist exact failure diagnostics
        if: steps.tests.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci-ssdp6-authority-routing-failure.log
          git commit -m "Record Protocol 6 authority-routing regression diagnostics"
          git push
          exit 1
      - name: Refuse a diagnostic commit when tests unexpectedly pass
        if: steps.tests.outcome == 'success'
        run: |
          cat .ci-ssdp6-authority-routing-failure.log
          echo "Root tests passed under diagnostic replay; no failure artifact committed."
