name: SSDP 6 authority-routing corrected finalizer

on:
  push:
    branches:
      - impl/ssdp-6

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply repaired Protocol 6 authority-routing candidate
        run: |
          awk '
            /python - <<'"'"'PY'"'"'/ {capture=1; next}
            capture && /^          PY$/ {exit}
            capture {sub(/^          /, ""); print}
          ' .github/workflows/ssdp6-authority-routing-repair.yml > /tmp/apply_repair.py
          python /tmp/apply_repair.py
          python - <<'PY'
          from pathlib import Path
          path = Path("source/shared/references/development-workflow-prompts.md")
          text = path.read_text(encoding="utf-8")
          old = "Create or update the governing D3->D4 implementation workplan at WORKPLAN_DESTINATION when D4 realization is materially affected."
          new = "Actually create or update the governing D3->D4 workplan at WORKPLAN_DESTINATION when D4 realization is materially affected."
          if text.count(old) != 1:
              raise SystemExit(f"unexpected D3 action phrase count: {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - name: Install acceptance dependencies
        run: >-
          python -m pip install
          -r source/requirements-validation.txt
          ./orchestrator
          -r orchestrator/requirements-dev.txt
      - name: Run complete protocol and generated-artifact acceptance
        run: |
          python -m unittest discover -s tests -v
          python orchestrator/scripts/generate_protocol_snapshot.py
          python source/build_skills.py --output /tmp/protocol-dist
          python source/validate_packages.py --dist /tmp/protocol-dist
          rm -rf dist
          cp -a /tmp/protocol-dist dist
          python source/check_dist.py --expected /tmp/protocol-dist --committed dist
          python orchestrator/scripts/generate_protocol_snapshot.py --check
          python orchestrator/scripts/run_core_tests.py
          git diff --check
      - name: Verify current/legacy profile semantics directly
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from sdp_orchestrator.core import profile as P
          from sdp_orchestrator.core.canonical import parse_document
          from sdp_orchestrator.core.inputs import resolve_inputs
          from sdp_orchestrator.core.records import DigestRef, LifecycleState, WorkplanRef

          resources = Path("orchestrator/src/sdp_orchestrator/core/resources/protocol")
          current = json.loads((resources / "ssdp-protocol-6.0/profile.json").read_text())
          stages = {item["stage"]["stage_key"]: item for item in current["stages"]}
          assert stages["software-implementation"]["workplan_policy"] == "explicit_only"
          assert stages["review"]["workplan_policy"] == "required"
          d4_names = {item["name"] for item in stages["software-implementation"]["inputs"]}
          assert "CHANGE_PLAN" in d4_names and "WORKPLAN" not in d4_names

          doc = parse_document(Path("source/shared/references/development-workflow-prompts.md").read_text(), profile_id=P.DEFAULT_PROFILE_ID)
          descriptor = P.build_profile(doc, P.DEFAULT_PROFILE_ID).descriptor
          d4 = P.stage_descriptor(descriptor, P.resolve_stage_key(descriptor, "software-implementation"))
          values = {item.name: item.value for item in resolve_inputs(d4, workplan=None, first_task=None, overrides={}, governing_protocol_version="6.0.0")}
          assert values["CHANGE_PLAN"] == "NONE"
          plan = WorkplanRef(
              workplan_id="WP-REDUCED",
              protocol_version="6.0.0",
              path="workplans/active/WP-REDUCED.md",
              artifact_digest=DigestRef(algorithm="sha256", value="a" * 64),
              semantic_digest=DigestRef(algorithm="sha256", value="b" * 64),
              semantic_identity_complete=True,
              lifecycle_state=LifecycleState.ACTIVE,
          )
          values = {item.name: item.value for item in resolve_inputs(d4, workplan=plan, first_task=None, overrides={}, governing_protocol_version="6.0.0")}
          assert values["CHANGE_PLAN"] == plan.path

          def destinations(stage, trigger):
              return {
                  item["to_stage"]["stage_key"]
                  for item in current["transitions"]
                  if item["from_stage"]["stage_key"] == stage
                  and item["trigger_key"] == trigger
                  and item["to_stage"] is not None
              }
          assert {"numerical-algorithm-design", "software-design", "software-implementation"}.issubset(destinations("review", "pass"))
          assert {"numerical-algorithm-design", "software-design", "software-implementation"}.issubset(destinations("scientific-formulation", "risk_override"))
          assert {"software-design", "software-implementation"}.issubset(destinations("numerical-algorithm-design", "risk_override"))
          assert {"numerical-algorithm-design", "software-design", "software-implementation"}.issubset(destinations("review", "risk_override"))

          prompts = doc.text
          assert "authority_state = risk_accepted_provisional" in prompts
          assert "Actually create or update the governing D3->D4 workplan" in prompts

          legacy = json.loads((resources / "sdp-protocol-5.16/profile.json").read_text())
          legacy_stages = {item["stage"]["stage_key"]: item for item in legacy["stages"]}
          assert legacy_stages["implementation"]["workplan_policy"] == "required"
          legacy_inputs = {item["name"] for item in legacy_stages["implementation"]["inputs"]}
          assert "WORKPLAN" in legacy_inputs and "CHANGE_PLAN" not in legacy_inputs
          PY
      - name: Commit accepted repair and remove temporary workflows
        run: |
          git rm .github/workflows/ssdp6-authority-routing-repair.yml
          git rm .github/workflows/ssdp6-authority-routing-finalizer.yml
          git rm .github/workflows/ssdp6-authority-routing-corrected-finalizer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/shared/references/abstraction-and-realization.md \
                  source/shared/references/workflow-and-workplans.md \
                  source/shared/references/development-workflow-prompts.md \
                  tests/test_protocol_contracts.py \
                  orchestrator/src/sdp_orchestrator/core/profile.py \
                  orchestrator/src/sdp_orchestrator/core/inputs.py \
                  orchestrator/docs/core-user-guide.md \
                  orchestrator/tests/test_ssdp6_profiles.py \
                  orchestrator/src/sdp_orchestrator/core/resources/protocol/ssdp-protocol-6.0 \
                  dist
          git diff --cached --check
          git commit -m "Close Protocol 6 proportional routing gaps"
          git push
