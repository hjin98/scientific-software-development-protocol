name: Temporary Protocol 6.3 D4R3 bootstrap publication v2

on:
  push:
    branches: [ssdp-6.3-engineering-memory]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.head_commit.message == 'Publish corrected Protocol 6.3 D4R3 replacement bootstrap'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ssdp-6.3-engineering-memory
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare
        run: |
          set -euxo pipefail
          git config user.name 'Protocol 6.3 repair automation'
          git config user.email 'protocol63-repair@users.noreply.github.com'
          git config --global gc.auto 0
          git config --global maintenance.auto false
          python -m pip install -r source/requirements-validation.txt
          python -m pip install ./orchestrator -r orchestrator/requirements-dev.txt
      - name: Publish exact replacement bootstrap into canonical mappings
        run: |
          set -euxo pipefail
          BOOTSTRAP=dc22f09fd38dbbfeaeb0160152da9b284654f66e
          git show 4b30d574b1f70cbcd49501b1b63a7685cf993f5d:qualification/ssdp6/_tmp_protocol63_owner_binding_repair.py > /tmp/repair.py
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/repair.py')
          text=p.read_text(encoding='utf-8')
          old='ROOT = Path(__file__).resolve().parents[2]'
          if old not in text:
              raise SystemExit('historical helper ROOT assignment missing')
          p.write_text(text.replace(old, 'ROOT = Path.cwd()', 1), encoding='utf-8')
          PY
          python - "$BOOTSTRAP" <<'PY'
          import importlib.util
          import sys
          bootstrap=sys.argv[1]
          spec=importlib.util.spec_from_file_location('repair','/tmp/repair.py')
          repair=importlib.util.module_from_spec(spec); spec.loader.exec_module(repair)
          repair.publish_bootstrap(bootstrap)
          PY
          python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md --write-summary
          python orchestrator/scripts/generate_protocol_snapshot.py
          rm -rf /tmp/protocol-dist
          python source/build_skills.py --output /tmp/protocol-dist
          python source/validate_packages.py --dist /tmp/protocol-dist
          rm -rf dist
          cp -a /tmp/protocol-dist dist
      - name: Create clean mapping descendant locally
        id: candidate
        run: |
          set -euxo pipefail
          git rm -f .github/workflows/temporary-protocol63-*.yml 2>/dev/null || true
          git rm -f qualification/ssdp6/_tmp_protocol63_*.log 2>/dev/null || true
          git add -A
          git diff --cached --check
          git commit -m 'Publish Protocol 6.3 D4R3 replacement bootstrap'
          CANDIDATE=$(git rev-parse HEAD)
          echo "sha=$CANDIDATE" >> "$GITHUB_OUTPUT"
          test -z "$(git status --porcelain)"
          test -z "$(git ls-files '.github/workflows/temporary-protocol63-*')"
          test -z "$(git ls-files 'qualification/ssdp6/_tmp_protocol63_*')"
      - name: Qualify mapping descendant and exact public fallback
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = '${{ steps.candidate.outputs.sha }}'
          python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md
          python -m unittest -v tests.test_protocol_63_reopened_repairs
          python -m unittest -v tests.test_protocol_63_engineering_memory
          env SSDP_VALIDATE_PUBLIC_FALLBACK=1 python -m unittest -v tests.test_protocol_63_bootstrap
          env SSDP_VALIDATE_PUBLIC_FALLBACK=1 python -m unittest discover -s tests -v
          rm -rf /tmp/protocol-dist-check
          python source/build_skills.py --output /tmp/protocol-dist-check
          python source/validate_packages.py --dist /tmp/protocol-dist-check
          python source/check_dist.py --expected /tmp/protocol-dist-check --committed dist
          python orchestrator/scripts/generate_protocol_snapshot.py --check
          python orchestrator/scripts/run_core_tests.py
          git diff --check
          test -z "$(git status --porcelain)"
      - name: Push only after mapping qualification passes
        run: |
          set -euxo pipefail
          git push origin HEAD:ssdp-6.3-engineering-memory
