name: Temporary Protocol 6.3 Stage G recovery publisher

on:
  push:
    branches: [ssdp-6.3-engineering-memory]

permissions:
  contents: write

jobs:
  stage-g-recovery:
    if: github.event.head_commit.message == 'Add one-use Protocol 6.3 Stage G recovery publisher'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ssdp-6.3-engineering-memory
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install -r source/requirements-validation.txt
      - name: Publish exact recovery mapping
        shell: bash
        run: |
          set -euxo pipefail
          RECOVERY=9f353097fab36e325a325f1c2f9d9cec32e86177
          BOOTSTRAP=86c13cab6bdd1991dffa94e277db8eacf87e2e11
          python -c 'from pathlib import Path; p=Path("source/shared/references/protocol-versioning-and-compatibility.md"); t=p.read_text(); old="6.2.0  -> b59adc77efe6951912cfd705cc43830c58ca27d0\n```"; new="6.2.0  -> b59adc77efe6951912cfd705cc43830c58ca27d0\n6.3.0  -> 9f353097fab36e325a325f1c2f9d9cec32e86177\n```"; assert t.count(old)==1; p.write_text(t.replace(old,new,1))'
          python -c 'from pathlib import Path; p=Path("source/shared/references/protocol-versioning-and-compatibility.md"); t=p.read_text(); old="Protocol 6.3 recovery remains unavailable until complete qualification and independent Review close."; new="Protocol 6.3 recovery is separately mapped to `9f353097fab36e325a325f1c2f9d9cec32e86177` after independent Review R2 PASS. Bootstrap and recovery identities are distinct. Protocol 6.2 remains accepted-current until mapping-bearing generated descendants and Stage G lifecycle closeout pass."; assert t.count(old)==1; p.write_text(t.replace(old,new,1))'
          python -c 'from pathlib import Path; p=Path("source/shared/references/protocol-versioning-and-compatibility.md"); t=p.read_text(); old="Recovery remains unavailable; the accepted 6.2 mappings above remain operative for 6.2."; new="Protocol 6.3 recovery is separately pinned to `9f353097fab36e325a325f1c2f9d9cec32e86177` after R2 Review PASS; the accepted 6.2 mappings remain operative while Protocol 6.2 is accepted-current until mapping-bearing generated descendants and Stage G lifecycle closeout pass. The Protocol 6.3 public bootstrap remains `86c13cab6bdd1991dffa94e277db8eacf87e2e11` and is not recovery."; assert t.count(old)==1; p.write_text(t.replace(old,new,1))'
          python -c 'from pathlib import Path; p=Path("PORTABILITY.md"); t=p.read_text(); old="6.3.0 recovery -> UNAVAILABLE_PENDING_6.3_ACCEPTANCE"; new="6.3.0 recovery -> 9f353097fab36e325a325f1c2f9d9cec32e86177"; assert t.count(old)==1; p.write_text(t.replace(old,new,1))'
          python -c 'from pathlib import Path; p=Path("PORTABILITY.md"); t=p.read_text(); old="Replacement self-reference-safe source snapshot `86c13cab6bdd1991dffa94e277db8eacf87e2e11` passed bootstrap readiness before this later descendant published its exact SHA as the sole authorized version-bound 6.3 public fallback; recovery remains unavailable."; new="Replacement self-reference-safe source snapshot `86c13cab6bdd1991dffa94e277db8eacf87e2e11` passed bootstrap readiness before a later descendant published its exact SHA as the sole authorized version-bound 6.3 public fallback. Recovery is separately mapped to `9f353097fab36e325a325f1c2f9d9cec32e86177` after R2 Review PASS; Protocol 6.2 remains accepted-current until Stage G generated reconciliation and lifecycle closeout pass."; assert t.count(old)==1; p.write_text(t.replace(old,new,1))'
          python -c 'from pathlib import Path; p=Path("PORTABILITY.md"); t=p.read_text(); old="Protocol 6.3 cannot displace the 6.2 baseline until complete qualification, independent Review, recovery mapping, regenerated parity, and lifecycle gates close."; new="Protocol 6.3 recovery is now mapped to `9f353097fab36e325a325f1c2f9d9cec32e86177`, distinct from public bootstrap `86c13cab6bdd1991dffa94e277db8eacf87e2e11`, but Protocol 6.3 cannot displace the 6.2 baseline until regenerated parity and the remaining Stage G lifecycle gates close."; assert t.count(old)==1; p.write_text(t.replace(old,new,1))'
          python -c 'from pathlib import Path; p=Path("source/shared/references/development-workflow-prompts.md"); t=p.read_text(); old="Recovery remains unavailable pending Stage G."; new="Recovery is separately mapped to `9f353097fab36e325a325f1c2f9d9cec32e86177` after R2 Review PASS, but Protocol 6.2 remains accepted-current until Stage G generated reconciliation and lifecycle closeout pass."; assert t.count(old)==1; p.write_text(t.replace(old,new,1))'
          python -c 'from pathlib import Path; p=Path("README.md"); t=p.read_text(); old="Protocol 6.3 recovery remains unavailable pending Stage G."; new="Protocol 6.3 recovery is mapped to `9f353097fab36e325a325f1c2f9d9cec32e86177` after R2 Review PASS; Protocol 6.2 remains accepted-current until the remaining Stage G generated-reconciliation and lifecycle gates close."; assert t.count(old)==1; p.write_text(t.replace(old,new,1))'
          python -c 'from pathlib import Path; p=Path("source/README.md"); t=p.read_text(); old="Current 6.3 public fallback remains intentionally unavailable until an already validated immutable 6.3 bootstrap is created and named by a later descendant."; new="Current Protocol 6.3 public fallback is exact bootstrap `86c13cab6bdd1991dffa94e277db8eacf87e2e11`. Stage-G recovery is separately mapped to `9f353097fab36e325a325f1c2f9d9cec32e86177` after R2 Review PASS; Protocol 6.2 remains accepted-current until mapping-bearing generated artifacts and lifecycle closeout pass."; assert t.count(old)==1; p.write_text(t.replace(old,new,1))'
          python -c 'from pathlib import Path; p=Path("tests/test_protocol_63_bootstrap.py"); t=p.read_text(); old="BOOTSTRAP = \"86c13cab6bdd1991dffa94e277db8eacf87e2e11\""; new=old+"\nRECOVERY = \"9f353097fab36e325a325f1c2f9d9cec32e86177\""; assert t.count(old)==1; p.write_text(t.replace(old,new,1))'
          python -c 'from pathlib import Path; p=Path("tests/test_protocol_63_bootstrap.py"); t=p.read_text(); old="def test_current_public_mapping_is_exact_and_recovery_remains_unavailable(self) -> None:"; new="def test_current_public_and_recovery_mappings_are_exact_and_distinct(self) -> None:"; assert t.count(old)==1; p.write_text(t.replace(old,new,1))'
          python -c 'from pathlib import Path; p=Path("tests/test_protocol_63_bootstrap.py"); t=p.read_text(); old="        self.assertIn(\x276.3.0 recovery -> UNAVAILABLE_PENDING_6.3_ACCEPTANCE\x27, portability)"; new="        self.assertIn(f\x276.3.0 recovery -> {RECOVERY}\x27, portability)\n        self.assertIn(f\x276.3.0  -> {RECOVERY}\x27, versioning)\n        self.assertNotEqual(RECOVERY, BOOTSTRAP)"; assert t.count(old)==1; p.write_text(t.replace(old,new,1))'
          git diff --check
          git add source/shared/references/protocol-versioning-and-compatibility.md source/shared/references/development-workflow-prompts.md source/README.md PORTABILITY.md README.md tests/test_protocol_63_bootstrap.py
          git config user.name 'Protocol 6.3 lifecycle automation'
          git config user.email 'protocol63-lifecycle@users.noreply.github.com'
          git commit -m 'Publish Protocol 6.3 recovery mapping'
          git push origin HEAD:ssdp-6.3-engineering-memory
      - name: Regenerate mapping-bearing artifacts
        run: |
          set -euxo pipefail
          python source/build_skills.py --output dist
          python orchestrator/scripts/generate_protocol_snapshot.py
          rm -rf /tmp/protocol-dist
          python source/build_skills.py --output /tmp/protocol-dist
      - name: Validate Stage G recovery state
        run: |
          set -euxo pipefail
          python -m unittest discover -s tests -v
          python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md
          python source/validate_packages.py --dist /tmp/protocol-dist
          python source/check_dist.py --expected /tmp/protocol-dist --committed dist
          python -m pip install ./orchestrator -r orchestrator/requirements-dev.txt
          python orchestrator/scripts/generate_protocol_snapshot.py --check
          python orchestrator/scripts/run_core_tests.py
          git diff --check
      - name: Commit generated reconciliation
        run: |
          set -euxo pipefail
          git rm .github/workflows/temporary-protocol63-stage-g-recovery.yml
          git add -A
          git diff --cached --check
          git commit -m 'Regenerate Protocol 6.3 recovery-mapped distributions'
          git push origin HEAD:ssdp-6.3-engineering-memory
