name: SSDP 6 reduced-route repair

on:
  push:
    branches:
      - impl/ssdp-6

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply bounded profile-routing repair and semantic regressions
        run: |
          python - <<'PY'
          from pathlib import Path

          profile = Path("orchestrator/src/sdp_orchestrator/core/profile.py")
          text = profile.read_text(encoding="utf-8")

          d1_anchor = '''    ("scientific-formulation", "accepted", "numerical-algorithm-design", "realize accepted D1 changes downward when D2 is affected"),\n    ("scientific-formulation", "accepted", "review", "review a D1-only authority change when no lower realization is affected"),\n'''
          d1_replacement = '''    ("scientific-formulation", "accepted", "numerical-algorithm-design", "realize accepted D1 changes downward when D2 is affected"),\n    ("scientific-formulation", "accepted", "software-design", "realize accepted D1 changes through affected architecture when D2 authority remains unchanged"),\n    ("scientific-formulation", "accepted", "software-implementation", "realize accepted D1 changes directly in D4 when D2 and D3 authority remain unchanged"),\n    ("scientific-formulation", "accepted", "review", "review a D1-only authority change when no lower realization is affected"),\n'''
          if text.count(d1_anchor) != 1:
              raise SystemExit("unexpected D1 transition shape")
          text = text.replace(d1_anchor, d1_replacement)

          d2_anchor = '''    ("numerical-algorithm-design", "accepted", "software-design", "realize accepted D2 changes through affected architecture"),\n    ("numerical-algorithm-design", "accepted", "review", "review a D2-only authority change when no architecture realization is affected"),\n'''
          d2_replacement = '''    ("numerical-algorithm-design", "accepted", "software-design", "realize accepted D2 changes through affected architecture"),\n    ("numerical-algorithm-design", "accepted", "software-implementation", "realize accepted D2 changes directly in D4 when D3 authority remains unchanged"),\n    ("numerical-algorithm-design", "accepted", "review", "review a D2-only authority change when no architecture realization is affected"),\n'''
          if text.count(d2_anchor) != 1:
              raise SystemExit("unexpected D2 transition shape")
          text = text.replace(d2_anchor, d2_replacement)

          alignment_anchor = '''    ("alignment", "pass", "software-implementation", "a realigned downstream D3->D4 plan is ready for implementation"),\n'''
          alignment_replacement = '''    ("alignment", "pass", "numerical-algorithm-design", "an aligned downstream D2 plan is ready for numerical-method realization"),\n    ("alignment", "pass", "software-design", "an aligned downstream D3 plan is ready for architecture/workplan realization"),\n    ("alignment", "pass", "software-implementation", "an aligned downstream D3->D4 plan is ready for implementation"),\n'''
          if text.count(alignment_anchor) != 1:
              raise SystemExit("unexpected alignment transition shape")
          profile.write_text(text.replace(alignment_anchor, alignment_replacement), encoding="utf-8")

          tests = Path("orchestrator/tests/test_ssdp6_profiles.py")
          text = tests.read_text(encoding="utf-8")
          anchor = '''    def test_serious_challenge_stops_automatic_routing(self) -> None:\n'''
          methods = '''    def test_reduced_routes_skip_unaffected_intermediate_domains(self) -> None:\n        def destinations(stage_key: str, trigger: str) -> set[str]:\n            return {\n                t.to_stage.stage_key\n                for t in self.descriptor.transitions\n                if t.from_stage.stage_key == stage_key\n                and t.trigger_key == trigger\n                and t.to_stage is not None\n            }\n\n        self.assertIn("software-implementation", destinations("numerical-algorithm-design", "accepted"))\n        self.assertIn("software-design", destinations("scientific-formulation", "accepted"))\n        self.assertIn("software-implementation", destinations("scientific-formulation", "accepted"))\n\n    def test_alignment_pass_routes_by_downstream_domain_owner(self) -> None:\n        destinations = {\n            t.to_stage.stage_key\n            for t in self.descriptor.transitions\n            if t.from_stage.stage_key == "alignment"\n            and t.trigger_key == "pass"\n            and t.to_stage is not None\n        }\n        self.assertEqual(\n            destinations,\n            {"numerical-algorithm-design", "software-design", "software-implementation"},\n        )\n\n'''
          if text.count(anchor) != 1 or "test_reduced_routes_skip_unaffected_intermediate_domains" in text:
              raise SystemExit("unexpected SSDP6 routing-test shape")
          tests.write_text(text.replace(anchor, methods + anchor), encoding="utf-8")
          PY
      - name: Install validation and Orchestrator dependencies
        run: >-
          python -m pip install
          -r source/requirements-validation.txt
          ./orchestrator
          -r orchestrator/requirements-dev.txt
      - name: Run protocol regression tests
        run: python -m unittest discover -s tests -v
      - name: Generate current Protocol 6 packaged snapshot
        run: python orchestrator/scripts/generate_protocol_snapshot.py
      - name: Build canonical skill packages
        run: python source/build_skills.py --output /tmp/protocol-dist
      - name: Validate generated skill packages independently
        run: python source/validate_packages.py --dist /tmp/protocol-dist
      - name: Replace committed distribution from canonical build
        run: |
          rm -rf dist
          cp -a /tmp/protocol-dist dist
      - name: Verify generated distribution parity
        run: python source/check_dist.py --expected /tmp/protocol-dist --committed dist
      - name: Verify generated Protocol snapshot parity
        run: python orchestrator/scripts/generate_protocol_snapshot.py --check
      - name: Run Orchestrator Core acceptance suite
        run: python orchestrator/scripts/run_core_tests.py
      - name: Verify reduced transition graph directly
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          profile = json.loads(Path("orchestrator/src/sdp_orchestrator/core/resources/protocol/ssdp-protocol-6.0/profile.json").read_text())
          transitions = profile["transitions"]
          def destinations(stage, trigger):
              return {
                  item["to_stage"]["stage_key"]
                  for item in transitions
                  if item["from_stage"]["stage_key"] == stage
                  and item["trigger_key"] == trigger
                  and item["to_stage"] is not None
              }
          assert "software-implementation" in destinations("numerical-algorithm-design", "accepted")
          assert {"software-design", "software-implementation"} <= destinations("scientific-formulation", "accepted")
          assert destinations("alignment", "pass") == {"numerical-algorithm-design", "software-design", "software-implementation"}
          PY
      - name: Check patch whitespace
        run: git diff --check
      - name: Remove temporary repair workflow and commit accepted repair
        run: |
          git rm .github/workflows/ssdp6-reduced-route-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add orchestrator/src/sdp_orchestrator/core/profile.py \
                  orchestrator/tests/test_ssdp6_profiles.py \
                  orchestrator/src/sdp_orchestrator/core/resources/protocol/ssdp-protocol-6.0 \
                  dist
          git diff --cached --check
          git commit -m "Allow Protocol 6 reduced-domain routing"
          git push
