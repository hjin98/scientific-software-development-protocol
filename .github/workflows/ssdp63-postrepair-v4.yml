name: SSDP 6.3 post-repair assembly v4

on:
  push:
    branches:
      - ssdp-6.3-engineering-memory
    paths:
      - .github/workflows/ssdp63-postrepair-v4.yml

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconcile D7 HAS and 6.3 fallback owners
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          old = '5ee4b3ac3ca1666b0499f7a72f55adcc411bf4bb'
          sentinel = 'UNAVAILABLE_PENDING_REPLACEMENT_BOOTSTRAP'

          workflow_path = Path('source/shared/references/workflow-and-workplans.md')
          workflow = workflow_path.read_text(encoding='utf-8')
          marker = 'candidate_overlay_semantic_candidate: <exact candidate overlay or NONE>'
          if marker not in workflow:
              anchor = '3. record the exact accepted/base and overlay identities used for the current decision;\n'
              if workflow.count(anchor) != 1:
                  raise SystemExit(f'expected one workflow HAS anchor, found {workflow.count(anchor)}')
              block = '''\nThe canonical session-local HAS interface is exact and executable:\n\n```yaml\npem_basis:\n  accepted_project_state: <exact accepted project state>\n  accepted_pem: <exact accepted PEM publication or NONE_PROTOCOL_6.2_PRE_PEM>\n  candidate_overlay_semantic_candidate: <exact candidate overlay or NONE>\nhas:\n  - id: <family/capability/notice id>\n    disposition: APPLICABLE | NOT_APPLICABLE | REVIEW_REQUIRED\n    reason: <bounded rationale>\n```\n\nDo not substitute aliases such as `accepted_base` or `candidate_overlay`; the workflow, canonical template, and executable validator use this one shape without translation glue. Keep the HAS session-local unless the governed work explicitly requires a durable handoff/record.\n\n'''
              workflow = workflow.replace(anchor, anchor + block, 1)
          workflow_path.write_text(workflow, encoding='utf-8')

          version_path = Path('source/shared/references/protocol-versioning-and-compatibility.md')
          version = version_path.read_text(encoding='utf-8')
          current = f'6.3.0 public-source bootstrap -> {old}'
          target = f'6.3.0 invalidated second bootstrap -> {old}\n6.3.0 public-source bootstrap -> {sentinel}'
          if f'6.3.0 public-source bootstrap -> {sentinel}' not in version:
              if version.count(current) != 1:
                  raise SystemExit(f'expected one current 6.3 mapping, found {version.count(current)}')
              version = version.replace(current, target, 1)
          lines = version.splitlines()
          if not any('both invalidated as current fallback by the reopened semantic repair' in line for line in lines):
              for i, line in enumerate(lines):
                  if line.startswith('The pre-repair Protocol 6.3 bootstrap `1484c1d3caa49d87cc15bc52a5e775399c1dae1b`') and 'Recovery is still unavailable:' in line:
                      suffix = line.split('Recovery is still unavailable:', 1)[1]
                      lines[i] = (
                          f'The pre-repair Protocol 6.3 bootstrap `1484c1d3caa49d87cc15bc52a5e775399c1dae1b` and the second bootstrap `{old}` are immutable historical evidence only and are both invalidated as current fallback by the reopened semantic repair. '
                          f'The current 6.3 public-source bootstrap mapping is `{sentinel}`; no 6.3 public fallback is authorized until an already-existing repaired snapshot passes bootstrap readiness and exact-ref realization and a later descendant publishes that exact SHA. '
                          'Recovery is still unavailable:' + suffix
                      )
                      break
              else:
                  raise SystemExit('6.3 candidate/bootstrap staging status line not found')
          version_path.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          prompt_path = Path('source/shared/references/development-workflow-prompts.md')
          prompt = prompt_path.read_text(encoding='utf-8')
          current_ref = f'CURRENT_PUBLIC_REF = {old}'
          target_ref = f'CURRENT_PUBLIC_REF = {sentinel}'
          if target_ref not in prompt:
              if prompt.count(current_ref) != 1:
                  raise SystemExit(f'expected one CURRENT_PUBLIC_REF mapping, found {prompt.count(current_ref)}')
              prompt = prompt.replace(current_ref, target_ref, 1)
          start = '**Protocol 6.3 bootstrap state:** '
          end = '\n\n`AUTO_EXECUTE` means'
          start_i = prompt.find(start)
          end_i = prompt.find(end, start_i)
          if start_i < 0 or end_i < 0:
              raise SystemExit('development workflow bootstrap-state paragraph not found')
          replacement = (
              '**Protocol 6.3 bootstrap state:** all pre-repair 6.3 bootstrap snapshots are invalidated historical evidence only. '
              f'`CURRENT_PUBLIC_REF` is `{sentinel}`, so no current 6.3 public fallback is authorized until a repaired immutable snapshot passes bootstrap readiness and exact-ref realization and a later descendant publishes that exact SHA. '
              'Never use repository default/latest, a guessed semantic-version ref, the current candidate branch, an invalidated bootstrap, or the accepted 6.2 bootstrap as a substitute. '
              'Version-bound 6.2 work continues to use exactly `5a062ebc472755607b9dc66d33a5ebbc4b7429aa`; historical 5.16/6.0/6.1 resolution remains version-bound to its own immutable mapping.'
          )
          prompt = prompt[:start_i] + replacement + prompt[end_i:]
          prompt_path.write_text(prompt, encoding='utf-8')
          PY

          grep -F 'candidate_overlay_semantic_candidate: <exact candidate overlay or NONE>' source/shared/references/workflow-and-workplans.md
          grep -F '6.3.0 public-source bootstrap -> UNAVAILABLE_PENDING_REPLACEMENT_BOOTSTRAP' source/shared/references/protocol-versioning-and-compatibility.md
          grep -F 'CURRENT_PUBLIC_REF = UNAVAILABLE_PENDING_REPLACEMENT_BOOTSTRAP' source/shared/references/development-workflow-prompts.md
          extra="$(git grep -n '5ee4b3ac3ca1666b0499f7a72f55adcc411bf4bb' -- source | grep -v 'source/shared/references/protocol-versioning-and-compatibility.md' || true)"
          if [ -n "$extra" ]; then
            echo "$extra"
            echo 'invalidated 6.3 bootstrap remains on a non-owner source route' >&2
            exit 1
          fi

      - name: Install validation dependencies
        run: python -m pip install -r source/requirements-validation.txt

      - name: Validate PEM and regenerate descendants
        shell: bash
        run: |
          set -euo pipefail
          python source/project_engineering_memory.py PROJECT-ENGINEERING-MEMORY.md --write-summary
          rm -rf /tmp/protocol-dist /tmp/protocol-dist-check
          python source/build_skills.py --output /tmp/protocol-dist
          python source/validate_packages.py --dist /tmp/protocol-dist
          rm -rf dist
          cp -a /tmp/protocol-dist dist
          python orchestrator/scripts/generate_protocol_snapshot.py

      - name: Reopened Protocol 6.3 discriminators
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_protocol_63_engineering_memory.py' -v
          python -m unittest discover -s tests -p 'test_protocol_63_reopened_repairs.py' -v

      - name: Full repository and package acceptance
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v
          python source/build_skills.py --output /tmp/protocol-dist-check
          python source/validate_packages.py --dist /tmp/protocol-dist-check
          diff -ru dist /tmp/protocol-dist-check
          python orchestrator/scripts/generate_protocol_snapshot.py --check
          git diff --check

      - name: Orchestrator Core acceptance
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install ./orchestrator -r orchestrator/requirements-dev.txt
          python orchestrator/scripts/generate_protocol_snapshot.py --check
          python orchestrator/scripts/run_core_tests.py

      - name: Remove temporary repair transport and commit assembled candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f .ssdp63-stale-ref.txt
          rm -f .github/workflows/ssdp63-repair-transport.yml \
                .github/workflows/ssdp63-materialize.yml \
                .github/workflows/ssdp63-postrepair.yml \
                .github/workflows/ssdp63-postrepair-v2.yml \
                .github/workflows/ssdp63-locate-stale-ref.yml \
                .github/workflows/ssdp63-postrepair-v3.yml \
                .github/workflows/ssdp63-postrepair-v4.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Assemble repaired Protocol 6.3 candidate'
          git push origin HEAD:ssdp-6.3-engineering-memory
