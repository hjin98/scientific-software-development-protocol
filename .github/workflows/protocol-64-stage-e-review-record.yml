name: Protocol 6.4 Stage-E review record

on:
  push:
    branches:
      - ssdp-6.4-axiomatic-definition-traceability
    paths:
      - .github/workflows/protocol-64-stage-e-review-record.yml

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record independent Stage-E no-pass
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/review_patch.py
          python /tmp/review_patch.py
          rm -f .github/workflows/protocol-64-stage-e-review-record.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record Protocol 6.4 Stage-E no-pass R6 R7'
          git push
