          p.write_text(text)
          PY
          git diff --check
          git add workplans/active/PROTOCOL-6.3-EVIDENCE-BACKED-PROJECT-ENGINEERING-MEMORY-WORKPLAN.md
          git commit -m "Reopen Protocol 6.3 for D9 reconciliation repair"

