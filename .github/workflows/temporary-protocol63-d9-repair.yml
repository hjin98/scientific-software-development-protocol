name: Temporary Protocol 6.3 D9 repair

on:
  push:
    branches:
      - ssdp-6.3-engineering-memory

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'Record Protocol 6.3 D9 execution failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ssdp-6.3-engineering-memory
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -r source/requirements-validation.txt
      - name: Run D9 implementation and qualification
        shell: bash
        run: |
          set +e
          python qualification/ssdp6/temporary_d9_repair.py 2>&1 | tee /tmp/protocol63-d9.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            git reset --hard origin/ssdp-6.3-engineering-memory
            git config user.name "Protocol 6.3 D9 diagnostic automation"
            git config user.email "protocol63-d9-diagnostic@users.noreply.github.com"
            cp /tmp/protocol63-d9.log qualification/ssdp6/DIAGNOSTIC-PROTOCOL-6.3-D9-EXECUTION.txt
            git add qualification/ssdp6/DIAGNOSTIC-PROTOCOL-6.3-D9-EXECUTION.txt
            git commit -m "Record Protocol 6.3 D9 execution failure"
            git push origin HEAD:ssdp-6.3-engineering-memory
            exit "$status"
          fi
