name: Temporary Protocol 6.3 D9 repair

on:
  push:
    branches:
      - ssdp-6.3-engineering-memory

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ssdp-6.3-engineering-memory
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -r source/requirements-validation.txt
      - name: Configure Git
        run: |
          git config user.name "Protocol 6.3 D9 repair automation"
          git config user.email "protocol63-d9-repair@users.noreply.github.com"

      - name: Reopen workplan for D9 repair
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("workplans/active/PROTOCOL-6.3-EVIDENCE-BACKED-PROJECT-ENGINEERING-MEMORY-WORKPLAN.md")
          text = p.read_text()
          replacements = {
              "implementation_review_state: reopened-after-independent-no-pass\n": "implementation_review_state: reopened-after-independent-no-pass-4\n",
              "reviewed_candidate_no_pass_3: 026eecf6ce382c3445ed218aeca80dcf2fb9a426\n": "reviewed_candidate_no_pass_3: 026eecf6ce382c3445ed218aeca80dcf2fb9a426\nreviewed_candidate_no_pass_4: 42eb89388dc96879157ba92db9e7f3c59f2c0b36\n",
