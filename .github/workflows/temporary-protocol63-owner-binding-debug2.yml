name: Temporary Protocol 6.3 owner-binding debug2

on:
  push:
    branches: [ssdp-6.3-engineering-memory]

permissions:
  contents: write

jobs:
  debug:
    if: github.event.head_commit.message == 'Debug Protocol 6.3 owner-binding materialization'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ssdp-6.3-engineering-memory
          fetch-depth: 0
      - name: Capture exact materializer failure
        run: |
          set +e
          python qualification/ssdp6/_tmp_protocol63_owner_binding_repair.py reopen > /tmp/debug2.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            python qualification/ssdp6/_tmp_protocol63_owner_binding_repair.py implement >> /tmp/debug2.log 2>&1
            status=$?
          fi
          printf '\nEXIT=%s\n' "$status" >> /tmp/debug2.log
          git reset --hard HEAD
          cp /tmp/debug2.log qualification/ssdp6/_tmp_protocol63_owner_binding_debug2.log
          git config user.name 'Protocol 6.3 repair automation'
          git config user.email 'protocol63-repair@users.noreply.github.com'
          git add qualification/ssdp6/_tmp_protocol63_owner_binding_debug2.log
          git commit -m 'Record Protocol 6.3 materializer assertion'
          git push origin HEAD:ssdp-6.3-engineering-memory
