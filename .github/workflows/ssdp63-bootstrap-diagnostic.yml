name: Protocol 6.3 bootstrap diagnostic

on:
  push:
    branches:
      - ssdp-6.3-engineering-memory

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: |
          python -m pip install -r source/requirements-validation.txt
          python -m pip install ./orchestrator -r orchestrator/requirements-dev.txt
      - name: Configure diagnostic identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Reproduce exact bootstrap candidate assembly
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          path = Path('.github/workflows/ssdp63-bootstrap-reconcile.yml')
          text = path.read_text(encoding='utf-8')
          start = '      - name: Assemble self-reference-safe replacement bootstrap candidate\n'
          end = '      - name: Qualify replacement bootstrap candidate before publication\n'
          if start not in text or end not in text:
              raise SystemExit('cannot locate canonical assembly step')
          block = text.split(start, 1)[1].split(end, 1)[0]
          marker = '        run: |\n'
          if marker not in block:
              raise SystemExit('cannot locate assembly run block')
          script = textwrap.dedent(block.split(marker, 1)[1])
          Path('/tmp/ssdp63-assemble.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/ssdp63-assemble.sh
      - name: Capture full unittest transcript
        id: tests
        shell: bash
        run: |
          set +e
          CI=1 python -m unittest discover -s tests -v > /tmp/ssdp63-bootstrap-tests.log 2>&1
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat /tmp/ssdp63-bootstrap-tests.log
      - name: Publish diagnostic transcript only
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          status="${{ steps.tests.outputs.status }}"
          git reset --hard "$GITHUB_SHA"
          git clean -fd
          out="qualification/ssdp6/TEMP-PROTOCOL-6.3-BOOTSTRAP-TEST-DIAGNOSTIC.txt"
          {
            echo "Protocol 6.3 replacement bootstrap candidate unittest diagnostic"
            echo "source_trigger=$GITHUB_SHA"
            echo "unittest_exit_status=$status"
            echo
            cat /tmp/ssdp63-bootstrap-tests.log
          } > "$out"
          git add "$out"
          git commit -m "Record temporary Protocol 6.3 bootstrap diagnostic"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          test "$status" -eq 0
