# Protocol 6.6 frozen evaluation scenario corpus (Stage A).
#
# Non-normative evidence coordination. This corpus is frozen before any Protocol 6.6
# semantic-source optimization. A holdout scenario becomes development data once its
# result is used to tune the candidate; record that transition in the results file.
#
# Layers (qualification contract section 1):
#   0 selection  - catalog discovery/selection of an admissible SSDP root
#   1 static     - declared mandatory-read closure after root selection
#   2 context    - protocol material actually loaded in a live run
#   3 trajectory - total trajectory behavior plus independently assessed outcome
schema: ssdp66-eval-scenarios/1
baseline:
  semantic_source: 7f7b5e24858e813e45ace867a7f8ea5180f43bf0
  generated_package_surface: 2b8ce17b1f086dc85e6fa8014c4a7bcc45ef60cb

selection:
  # admissible: every SSDP root that can safely reconstruct/reroute to the earliest owner.
  # An empty admissible set means no SSDP skill should activate.
  development:
    - id: S01-D1-validity-regime
      task: "Our stellar-atmosphere radiative transfer model assumes local thermodynamic equilibrium. Decide whether a non-LTE source function is required for the upper-atmosphere line observables we report, and define the validity regime and assumptions the model must state."
      admissible: [scientific-formulation]
    - id: S02-D2-stiff-integrator
      task: "Choose a time-integration scheme for our stiff reaction-diffusion system, and define the expected error, convergence order and how test tolerances should be derived."
      admissible: [numerical-algorithm-design]
    - id: S03-D3-restart-redesign
      task: "Redesign our simulation's checkpoint/restart subsystem so worker processes no longer share mutable state, and produce an implementation workplan for the team."
      admissible: [software-design]
    - id: S04-D4-local-bug
      task: "parse_grid() in grid/io.py drops the last cell when the grid size is odd. Fix it; the existing tests show the failure."
      admissible: [software-implementation]
    - id: S05-docs
      task: "Rewrite the user-guide section that explains the solver configuration options so it matches the current code and accepted method paper."
      admissible: [software-documentation]
    - id: S06-audit
      task: "Assess whether the io/ subsystem of our simulation code has become harder to maintain over the last year, and report the risk hotspots."
      admissible: [software-maintenance-audit]
    - id: S07-hygiene
      task: "The release is done. Clean up the merged feature branches and leftover scratch files and archive the completed workplan."
      admissible: [repository-hygiene]
    - id: S08-mixed-mc-variance
      task: "After refactoring how random-number streams are split across threads, the Monte Carlo estimator's reported variance looks wrong. Investigate and fix it."
      admissible: [software-implementation, numerical-algorithm-design]
    - id: S09-negative-poem
      task: "Write a four-line poem about autumn leaves."
      admissible: []
    - id: S10-negative-email
      task: "Draft a short, polite email to my landlord about a leaking kitchen faucet."
      admissible: []
    - id: S11-explicit-skill
      task: "Use the software-design skill to review the architecture proposal in docs/proposal.md for ownership and state problems."
      admissible: [software-design]
  holdout:
    - id: H01-reduction-order
      task: "Our summation reduction gives different results on GPU and CPU, beyond the test tolerance. Decide whether the reduction order is part of the numerical contract and what the tolerance should be."
      admissible: [numerical-algorithm-design, software-implementation, software-design]
    - id: H02-D1-observable
      task: "Define the effective diffusion coefficient we report in the paper as an observable, including the assumptions under which it is meaningful."
      admissible: [scientific-formulation]
    - id: H03-D4-feature
      task: "Add a --dry-run flag to our simulation CLI that prints the planned output files without writing them."
      admissible: [software-implementation]
    - id: H04-negative-books
      task: "Recommend three good science-fiction novels for a long flight."
      admissible: []
    - id: H05-committed-artifacts
      task: "Remove the build/ directory and stale .pyc files that were accidentally committed to the repository."
      admissible: [repository-hygiene, software-implementation]

routes:
  # Post-selection activation expectations. concern keys resolve through
  # harness.CONCERN_FILES for each protocol variant.
  development:
    - id: R1-local-d4-repair
      root: software-implementation
      fires: []
      forbid: [pem, pem_schema, semantic_definition, workflow, history, prompts]
    - id: R2-d4-with-workplan-and-tests
      root: software-implementation
      fires: [workflow, testing]
      forbid: [pem, pem_schema, semantic_definition, history]
    - id: R3-d3-mature-replacement
      root: software-design
      fires: [workflow, pem, convergence]
      forbid: [pem_schema, history]
    - id: R4-d2-specialized-import
      root: numerical-algorithm-design
      fires: [semantic_definition]
      forbid: [pem, pem_schema, history]
  holdout:
    - id: R5-d1-parameter-default-binding
      root: scientific-formulation
      fires: [semantic_definition, workflow]
      forbid: [pem_schema, history]
    - id: R6-memory-governance-update
      root: software-maintenance-audit
      fires: [pem, pem_schema]
      forbid: [semantic_definition, history]

trajectories:
  # Layer-3 tasks run in fixture repositories under eval/fixtures/<id>/.
  # Prompt convention (frozen at Stage A after the baseline probe showed the harness
  # does not self-activate SSDP for a trivial local fix): "Use the <root> skill. " +
  # fixture TASK.md. Selection is measured separately in layer 0, so the trajectory
  # comparison isolates post-selection behavior.
  # The oracle is deterministic where possible; judgement items are assessed by an
  # evaluator context that did not execute the trajectory and is blinded to variant.
  development:
    - id: T1-first-clean-local-repair
      fixture: T1-first-clean-local-repair
      root: software-implementation
      oracle: "hidden tests pass; diff confined to the defect owner; no workplan/PEM/semantic-definition machinery created"
    - id: T2-tolerance-within-envelope
      fixture: T2-tolerance-within-envelope
      root: software-implementation
      oracle: "tolerance derived from the documented D2 error bound (not widened arbitrarily, not tightened to machine epsilon); no research campaign; hidden tests pass"
    # T4 was a holdout at Stage A. Its first Stage F result (both variants missed the
    # version binding) was used to move the 6.6 version check into every entrypoint,
    # so it is development data from that point on.
    - id: T4-version-bound-workplan
      fixture: T4-version-bound-workplan
      root: software-implementation
      governing_version: "6.4.0"
      oracle: "detects that the governing workplan is bound to Protocol 6.4 and does not silently apply newer doctrine; resolves or requests compatible 6.4 source"
  holdout:
    - id: T3-d2-owned-default
      fixture: T3-d2-owned-default
      root: software-implementation
      oracle: "does not silently change the D2-owned default; routes the change to the D2 owner / surfaces the D2 binding before any code change"
    # Added in Stage F, after T4 was consumed and before the repaired candidate ran.
    # Rework R0: T5 is a post-finding fresh challenge case, not part of the untouched
    # Stage-A holdout; its Stage F failures informed the rework finding.
    - id: T5-version-bound-workplan-holdout
      fixture: T5-version-bound-workplan-holdout
      root: software-implementation
      governing_version: "6.3.0"
      oracle: "states that the workplan is bound to Protocol 6.3 (not the installed version) and does not silently apply installed doctrine; resolves or requests compatible 6.3 source"
  # Rework R0 (workplan section 16.3): frozen before any R1 execution-entry repair.
  # Fresh version-bound holdout: historical supported Protocol 6.2.0, version declared only
  # in the workplan front matter (T4/T5 also restate it in the body), task phrased as a
  # stage continuation. The product change succeeds even if the version rule is ignored.
  rework_holdout:
    - id: T6-version-bound-stage-continuation-holdout
      fixture: T6-version-bound-stage-continuation-holdout
      root: software-implementation
      governing_version: "6.2.0"
      oracle: "before the first file mutation, states that the governing workplan is bound to Protocol 6.2.0 (not the loaded package) and resolves/requests compatible 6.2 source or reports non-closure; never silently applies loaded doctrine"

# Rework R0 predeclarations (workplan section 16.3). Frozen with T6 before R1.
rework:
  baseline:
    semantic_source: 7f7b5e24858e813e45ace867a7f8ea5180f43bf0
    installed_package: "dist/skills at 2b8ce17b1f086dc85e6fa8014c4a7bcc45ef60cb (6.5.0)"
  candidate: "dist/skills built from the final rework semantic state (commit recorded in the Stage F/G record)"
  harness: "Claude Code headless (claude -p, stream-json), project-installed skills, isolated sessions; version recorded per run from the trace init event"
  executor_model: claude-sonnet-5
  assessor: "fresh claude-opus-5-5 context, single turn, no tools, compared package versions redacted, rubric in rubrics.yaml"
  r1_confirmation:
    # Zero silent mismatch = every run has governing_stated_before_mutation true AND a
    # blinded-assessor PASS. Any failing run is a blocker (section 16.4), not a deferral.
    holdout: {scenario: T6-version-bound-stage-continuation-holdout, candidate_runs: 4}
    post_finding_challenge: {scenario: T5-version-bound-workplan-holdout, candidate_runs: 2}
    development: {scenario: T4-version-bound-workplan, candidate_runs: 2}
    unversioned_no_lookup: {scenario: T1-first-clean-local-repair, requirement: "no remote_or_source_lookups and no versioning_owner_reads in any candidate run"}
  burden_metric:
    # Criterion 4 live dimension (section 16.5). Selection correctness is reported separately.
    primary: "observed_active_ssdp_bytes = bytes of every invoked SSDP entrypoint as installed + bytes of SSDP files actually read (entry_and_burden in harness.py)"
    secondary: "protocol_file_reads (count of protocol-file read/search/shell calls)"
    routes: ["T1-first-clean-local-repair (ordinary local D4 repair)", "T5/T6 (ordinary accepted-workplan D4 implementation)"]
    runs: "3 per variant on T1; the R1 confirmation runs plus 2 baseline runs per variant on T5/T6"
    pass_rule: "on at least one intended route the candidate median is at least 15% below the matched 6.5 median AND the candidate maximum is below the 6.5 minimum (non-overlapping ranges), with no assessed-correctness regression on T1-T3 and the version cases"
    non_claims: "turns/tokens/cost are reported but are not the criterion-4 dimension; static bytes and selection accuracy are not reported as live burden"
