# Protocol 6.6 frozen evaluation scenario corpus (Stage A).
#
# Non-normative evidence coordination. This corpus is frozen before any Protocol 6.6
# semantic-source optimization. A holdout scenario becomes development data once its
# result is used to tune the candidate; record that transition in the results file.
#
# Layers (qualification contract section 1):
#   0 selection  - catalog discovery/selection of an admissible SSDP root
#   1 static     - declared mandatory-read closure after root selection
#   2 context    - protocol material actually loaded in a live run
#   3 trajectory - total trajectory behavior plus independently assessed outcome
schema: ssdp66-eval-scenarios/1
baseline:
  semantic_source: 7f7b5e24858e813e45ace867a7f8ea5180f43bf0
  generated_package_surface: 2b8ce17b1f086dc85e6fa8014c4a7bcc45ef60cb

selection:
  # admissible: every SSDP root that can safely reconstruct/reroute to the earliest owner.
  # An empty admissible set means no SSDP skill should activate.
  development:
    - id: S01-D1-validity-regime
      task: "Our stellar-atmosphere radiative transfer model assumes local thermodynamic equilibrium. Decide whether a non-LTE source function is required for the upper-atmosphere line observables we report, and define the validity regime and assumptions the model must state."
      admissible: [scientific-formulation]
    - id: S02-D2-stiff-integrator
      task: "Choose a time-integration scheme for our stiff reaction-diffusion system, and define the expected error, convergence order and how test tolerances should be derived."
      admissible: [numerical-algorithm-design]
    - id: S03-D3-restart-redesign
      task: "Redesign our simulation's checkpoint/restart subsystem so worker processes no longer share mutable state, and produce an implementation workplan for the team."
      admissible: [software-design]
    - id: S04-D4-local-bug
      task: "parse_grid() in grid/io.py drops the last cell when the grid size is odd. Fix it; the existing tests show the failure."
      admissible: [software-implementation]
    - id: S05-docs
      task: "Rewrite the user-guide section that explains the solver configuration options so it matches the current code and accepted method paper."
      admissible: [software-documentation]
    - id: S06-audit
      task: "Assess whether the io/ subsystem of our simulation code has become harder to maintain over the last year, and report the risk hotspots."
      admissible: [software-maintenance-audit]
    - id: S07-hygiene
      task: "The release is done. Clean up the merged feature branches and leftover scratch files and archive the completed workplan."
      admissible: [repository-hygiene]
    - id: S08-mixed-mc-variance
      task: "After refactoring how random-number streams are split across threads, the Monte Carlo estimator's reported variance looks wrong. Investigate and fix it."
      admissible: [software-implementation, numerical-algorithm-design]
    - id: S09-negative-poem
      task: "Write a four-line poem about autumn leaves."
      admissible: []
    - id: S10-negative-email
      task: "Draft a short, polite email to my landlord about a leaking kitchen faucet."
      admissible: []
    - id: S11-explicit-skill
      task: "Use the software-design skill to review the architecture proposal in docs/proposal.md for ownership and state problems."
      admissible: [software-design]
  holdout:
    - id: H01-reduction-order
      task: "Our summation reduction gives different results on GPU and CPU, beyond the test tolerance. Decide whether the reduction order is part of the numerical contract and what the tolerance should be."
      admissible: [numerical-algorithm-design, software-implementation, software-design]
    - id: H02-D1-observable
      task: "Define the effective diffusion coefficient we report in the paper as an observable, including the assumptions under which it is meaningful."
      admissible: [scientific-formulation]
    - id: H03-D4-feature
      task: "Add a --dry-run flag to our simulation CLI that prints the planned output files without writing them."
      admissible: [software-implementation]
    - id: H04-negative-books
      task: "Recommend three good science-fiction novels for a long flight."
      admissible: []
    - id: H05-committed-artifacts
      task: "Remove the build/ directory and stale .pyc files that were accidentally committed to the repository."
      admissible: [repository-hygiene, software-implementation]

routes:
  # Post-selection activation expectations. concern keys resolve through
  # harness.CONCERN_FILES for each protocol variant.
  development:
    - id: R1-local-d4-repair
      root: software-implementation
      fires: []
      forbid: [pem, pem_schema, semantic_definition, workflow, history, prompts]
    - id: R2-d4-with-workplan-and-tests
      root: software-implementation
      fires: [workflow, testing]
      forbid: [pem, pem_schema, semantic_definition, history]
    - id: R3-d3-mature-replacement
      root: software-design
      fires: [workflow, pem, convergence]
      forbid: [pem_schema, history]
    - id: R4-d2-specialized-import
      root: numerical-algorithm-design
      fires: [semantic_definition]
      forbid: [pem, pem_schema, history]
  holdout:
    - id: R5-d1-parameter-default-binding
      root: scientific-formulation
      fires: [semantic_definition, workflow]
      forbid: [pem_schema, history]
    - id: R6-memory-governance-update
      root: software-maintenance-audit
      fires: [pem, pem_schema]
      forbid: [semantic_definition, history]

trajectories:
  # Layer-3 tasks run in fixture repositories under eval/fixtures/<id>/.
  # Prompt convention (frozen at Stage A after the baseline probe showed the harness
  # does not self-activate SSDP for a trivial local fix): "Use the <root> skill. " +
  # fixture TASK.md. Selection is measured separately in layer 0, so the trajectory
  # comparison isolates post-selection behavior.
  # The oracle is deterministic where possible; judgement items are assessed by an
  # evaluator context that did not execute the trajectory and is blinded to variant.
  development:
    - id: T1-first-clean-local-repair
      fixture: T1-first-clean-local-repair
      root: software-implementation
      oracle: "hidden tests pass; diff confined to the defect owner; no workplan/PEM/semantic-definition machinery created"
    - id: T2-tolerance-within-envelope
      fixture: T2-tolerance-within-envelope
      root: software-implementation
      oracle: "tolerance derived from the documented D2 error bound (not widened arbitrarily, not tightened to machine epsilon); no research campaign; hidden tests pass"
    # T4 was a holdout at Stage A. Its first Stage F result (both variants missed the
    # version binding) was used to move the 6.6 version check into every entrypoint,
    # so it is development data from that point on.
    - id: T4-version-bound-workplan
      fixture: T4-version-bound-workplan
      root: software-implementation
      governing_version: "6.4.0"
      oracle: "detects that the governing workplan is bound to Protocol 6.4 and does not silently apply newer doctrine; resolves or requests compatible 6.4 source"
  holdout:
    - id: T3-d2-owned-default
      fixture: T3-d2-owned-default
      root: software-implementation
      oracle: "does not silently change the D2-owned default; routes the change to the D2 owner / surfaces the D2 binding before any code change"
    # Added in Stage F, after T4 was consumed and before the repaired candidate ran.
    # Rework R0: T5 is a post-finding fresh challenge case, not part of the untouched
    # Stage-A holdout; its Stage F failures informed the rework finding.
    - id: T5-version-bound-workplan-holdout
      fixture: T5-version-bound-workplan-holdout
      root: software-implementation
      governing_version: "6.3.0"
      oracle: "states that the workplan is bound to Protocol 6.3 (not the installed version) and does not silently apply installed doctrine; resolves or requests compatible 6.3 source"
  # Rework R0 (workplan section 16.3): frozen before any R1 execution-entry repair.
  # Fresh version-bound holdout: historical supported Protocol 6.2.0, version declared only
  # in the workplan front matter (T4/T5 also restate it in the body), task phrased as a
  # stage continuation. The product change succeeds even if the version rule is ignored.
  rework_holdout:
    - id: T6-version-bound-stage-continuation-holdout
      fixture: T6-version-bound-stage-continuation-holdout
      root: software-implementation
      governing_version: "6.2.0"
      oracle: "before the first file mutation, states that the governing workplan is bound to Protocol 6.2.0 (not the loaded package) and resolves/requests compatible 6.2 source or reports non-closure; never silently applies loaded doctrine"
    # Added after the R0 freeze commit but before any R1 change (disclosed selection risk:
    # motivated by the Stage F observation that accepted-workplan runs are the only ordinary
    # runs that load protocol references). Ordinary, unversioned: burden route and
    # no-lookup check; not a version case.
    - id: T7-unversioned-workplan-implementation
      fixture: T7-unversioned-workplan-implementation
      root: software-implementation
      oracle: "hidden tests pass; no remote/source lookup and no versioning-owner read; no process artifacts beyond the workplan's code and tests"

  # D3 reopen (workplan section 16.10.3): the single fresh ordinary-route challenge, frozen
  # with the redesign burden rule below before any run of the redesigned candidate. Chosen
  # to differ from T1 (tracked bug fix) and T7 (accepted workplan): an unversioned small
  # feature with a documentation touch, so references may plausibly be consulted.
  redesign_challenge:
    - id: T8-ordinary-feature-with-docs
      fixture: T8-ordinary-feature-with-docs
      root: software-implementation
      oracle: "hidden tests pass; README API lists median; no remote/source lookup, versioning-owner read, or process artifact"

# Rework R0 predeclarations (workplan section 16.3). Frozen with T6 before R1.
rework:
  baseline:
    semantic_source: 7f7b5e24858e813e45ace867a7f8ea5180f43bf0
    installed_package: "dist/skills at 2b8ce17b1f086dc85e6fa8014c4a7bcc45ef60cb (6.5.0)"
  candidate: "dist/skills built from the final rework semantic state (commit recorded in the Stage F/G record)"
  harness: "Claude Code headless (claude -p, stream-json), project-installed skills, isolated sessions; version recorded per run from the trace init event"
  executor_model: claude-sonnet-5
  assessor: "fresh claude-opus-5-5 context, single turn, no tools, compared package versions redacted, rubric in rubrics.yaml"
  r1_confirmation:
    # Zero silent mismatch = every run has governing_stated_before_protocol_action_or_mutation
    # true AND a blinded-assessor PASS. Any failing run is a blocker (section 16.4), not a
    # deferral. (Review R2 / section 16.9 B3 replaced the weaker R0 field
    # governing_stated_before_mutation before any authenticated post-R1 run; runs, scenarios,
    # thresholds and the burden metric are unchanged.)
    holdout: {scenario: T6-version-bound-stage-continuation-holdout, candidate_runs: 4}
    post_finding_challenge: {scenario: T5-version-bound-workplan-holdout, candidate_runs: 2}
    development: {scenario: T4-version-bound-workplan, candidate_runs: 2}
    unversioned_no_lookup: {scenarios: [T1-first-clean-local-repair, T7-unversioned-workplan-implementation], requirement: "no remote_or_source_lookups and no versioning_owner_reads in any candidate run"}
  burden_metric:
    # Criterion 4 live dimension (section 16.5). Selection correctness is reported separately.
    primary: "observed_active_ssdp_bytes = bytes of every invoked SSDP entrypoint as installed + bytes of SSDP files actually read (entry_and_burden in harness.py)"
    secondary: "protocol_file_reads (count of protocol-file read/search/shell calls)"
    routes: ["T1-first-clean-local-repair (ordinary local D4 repair)", "T7-unversioned-workplan-implementation (ordinary accepted-workplan D4 implementation)"]
    runs: "3 per variant on T1 and T7; T5/T6 burden is reported but is not an ordinary route (a correct 6.6 run must load the versioning owner there)"
    pass_rule: "on at least one intended route the candidate median is at least 15% below the matched 6.5 median AND the candidate maximum is below the 6.5 minimum (non-overlapping ranges), with no assessed-correctness regression on T1-T3 and the version cases"
    non_claims: "turns/tokens/cost are reported but are not the criterion-4 dimension; static bytes and selection accuracy are not reported as live burden"

# D3 reopen (workplan section 16.10) qualification. Frozen in one commit before any live run
# of the redesigned candidate; the R0/R2 rules above remain the record for the superseded
# c01eeee design and are not re-applied to it. Nothing below may change after the first
# redesigned-candidate run is observed.
redesign:
  baseline: "dist/skills at 2b8ce17b1f086dc85e6fa8014c4a7bcc45ef60cb (6.5.0), unchanged"
  candidate: "dist/skills of the redesigned semantic state (exact commit recorded in the Stage F/G record before runs)"
  harness: "as rework, plus two evidence-tooling repairs committed with this freeze: hidden oracle tests are now collected, and diff.patch includes new files"
  executor_model: claude-sonnet-5
  assessor: "fresh claude-opus-5-5, single turn, blinded; rubrics.yaml, with the `redesign` overrides for version cases"
  evidence_status:
    T4-version-bound-workplan: development / regression (outcomes known)
    T5-version-bound-workplan-holdout: regression (outcomes known)
    T6-version-bound-stage-continuation-holdout: regression counterexample (its self-adoption outcomes motivated section 16.10.1; no longer a fresh holdout)
    T1-first-clean-local-repair: development / regression burden route (outcomes known)
    T7-unversioned-workplan-implementation: development / regression burden route (outcomes known)
    T8-ordinary-feature-with-docs: fresh ordinary-route challenge (the only new route)
  version_gate:
    runs: {T6-version-bound-stage-continuation-holdout: 4, T5-version-bound-workplan-holdout: 2, T4-version-bound-workplan: 2}
    variant: candidate only (accepted 6.5 already failed every version case; its rows are in live-r1r2)
    pass: "every run has governing_stated_before_protocol_action_or_mutation true AND a strict-rubric assessor PASS (no self-adoption of the loaded package); any failing run fails the gate"
  unversioned_no_lookup: "no remote_or_source_lookups and no versioning_owner_reads in any candidate run of T1, T7, T8"
  burden_rule:
    dimension: "observed_active_ssdp_bytes per run (definition unchanged: invoked SSDP entrypoint bytes as installed + bytes of SSDP files actually read)"
    panel: [T1-first-clean-local-repair, T7-unversioned-workplan-implementation, T8-ordinary-feature-with-docs]
    runs: "3 per variant per panel route, fresh paired and order-counterbalanced runs of both variants in one window (earlier 6.5 burden rows are not reused)"
    pass_requires_all:
      - "panel net: sum over panel routes of candidate medians <= 0.85 x sum over panel routes of baseline medians"
      - "direct route reduction: on at least one panel route, candidate median <= 0.85 x baseline median AND candidate maximum < baseline minimum (the unchanged R0 route rule)"
      - "bounded fixed cost: on every panel route, candidate median <= 1.10 x baseline median (the admissible small safety-kernel cost; the static entrypoint delta was known when this cap was set, the live outcome was not)"
      - "correctness: every candidate panel run passes its hidden oracle (hidden_collected true) and no panel route has fewer candidate assessor PASSes than baseline PASSes"
    authority_sentinels: "T2 and T3 candidate x2 each must be assessor PASS (accepted 6.5 was 2/2 on both in live-r1r2; entrypoint change makes earlier candidate rows inapplicable)"
    secondary_diagnostics: "protocol_file_reads, owners read, turns, tokens, cost: reported, never the criterion"
    no_credit_for: "static bytes, selection accuracy, unchanged turns/tokens/cost"
    on_failure: "stop and report per workplan 16.10.4 item 7; no new route, metric, threshold, weighting or prompt layer"

# Final whole-entrypoint simplification (workplan section 16.11). Frozen in one commit with
# routing-preservation-map.yaml before any SKILL.md change of that pass and before any run of
# the simplified candidate. Nothing below may change after the first final-candidate run.
# Variants: v65 = accepted 6.5 dist/skills at 2b8ce17 (criterion-4 baseline, unchanged);
# v66b = redesigned basis dist/skills at 47dc85d; v66f = simplified candidate (exact commit
# recorded in the Stage F/G record before runs). Order: routing/correctness is
# lexicographically prior to burden; a burden pass is inadmissible if any other item fails.
final:
  basis: 47dc85de6dd6be8b0adfb1a66024cfdd5397f3d8
  executor_model: claude-sonnet-5
  assessor: "fresh claude-opus-5-5, single turn, blinded; rubrics.yaml (strict `redesign` overrides for T4-T6), unchanged since 6c76ef1"
  ordering_oracle: "harness.ordering_events with the 16.11.1 item 7 exemption (calls whose every installed-SSDP path is a version-identity file); applied identically to v66b and v66f"
  structural: "tests/test_protocol_66_final_simplification.py passes on the exact candidate (routing-preservation map, frontmatter unchanged, no forbidden eager route), plus the full repository acceptance"
  route_probes:
    # Router-fidelity counterfactuals: the probe asks the agent to load exactly the owners its
    # skill's routing requires, without doing the task. expect = owners that must all be read
    # (all-of); forbid = owners that must not be read. Mode select (Skill Read Glob Grep only).
    prompt: "Use the {root} skill. Routing check only: do not perform the task, do not edit anything and do not ask questions. Following the skill's own routing, Read each SSDP reference or template file that this task requires you to load before substantive work, and no others; then reply with one line listing the files you loaded. Task: {task}"
    max_turns: 8
    reps: 2
    variants: [v66b, v66f]
    cases:
      - {id: P01-d4-first-clean-local, root: software-implementation, task: "parse_grid() in grid/io.py drops the last cell when the grid size is odd; the existing test shows the failure. Fix it.", expect: [], forbid: [project-engineering-memory.md, workflow-and-workplans.md, semantic-definition-and-traceability.md, convergence-and-cycle-economy.md, protocol-versioning-and-compatibility.md, abstraction-and-concretization.md]}
      - {id: P02-d4-workplan-stage, root: software-implementation, task: "Continue with Stage 2 of the accepted implementation workplan docs/workplans/checkpoint-writer.md (it declares no protocol version); Stage 1 is closed and its handoff notes are in the workplan.", expect: [workflow-and-workplans.md], forbid: [project-engineering-memory.md, semantic-definition-and-traceability.md, protocol-versioning-and-compatibility.md]}
      - {id: P03-d4-real-owner-testing, root: software-implementation, task: "Add acceptance tests proving the new checkpoint writer is exercised through the real restart path rather than a mocked writer, and qualify it for production use.", expect: [testing-and-validation.md], forbid: [project-engineering-memory.md, semantic-definition-and-traceability.md]}
      - {id: P04-d4-mature-recurrence-pem, root: software-implementation, task: "Replace our mature caching layer for the third time: the two previous rewrites both regressed with the same invalidation bug, and the repository keeps a PROJECT-ENGINEERING-MEMORY.md recording those incidents.", expect: [project-engineering-memory.md], forbid: [semantic-definition-and-traceability.md]}
      - {id: P05-d4-to-d2-escalation, root: software-implementation, task: "To speed up the solver, change the time integrator's default from the accepted second-order scheme to a first-order scheme with a larger step; the order and error tolerance come from the accepted numerical method paper.", expect: [numerical-algorithm-design.md], forbid: [project-engineering-memory.md]}
      - {id: P06-d4-to-d1-escalation, root: software-implementation, task: "Change the pipeline so the reported observable is the median residence time instead of the mean residence time that the accepted scientific formulation defines.", expect: [scientific-formulation.md], forbid: [project-engineering-memory.md]}
      - {id: P07-d4-semantic-definition, root: software-implementation, task: "Implement the Tsallis entropy estimator S_q in the analysis module; the parameter q and its default binding come from an imported published result whose hypotheses must hold for our data.", expect: [semantic-definition-and-traceability.md], forbid: [project-engineering-memory.md]}
      - {id: P08-d4-to-d3-ownership, root: software-implementation, task: "The fix requires moving ownership of the job-queue state from the scheduler component to the worker processes and changing the interface between them.", expect: [architecture-and-design.md], forbid: [project-engineering-memory.md, semantic-definition-and-traceability.md]}
      - {id: P09-d4-language-build, root: software-implementation, task: "Move the hot inner loop of kernel.py into a C++ extension built with pybind11, and make the build and ABI work across our supported Python versions.", expect: [language-profiles.md], forbid: [project-engineering-memory.md, semantic-definition-and-traceability.md]}
      - {id: P10-d4-tool-relation, root: software-implementation, task: "Establish with data-flow analysis evidence that no user-controlled input can reach the subprocess call in runner.py.", expect: [tool-assisted-engineering.md], forbid: [project-engineering-memory.md]}
      - {id: P11-d4-release, root: software-implementation, task: "Prepare the 2.3.0 release: bump the package version, build the wheels, update the changelog and publish to PyPI.", expect: [release-and-distribution.md], forbid: [project-engineering-memory.md, semantic-definition-and-traceability.md]}
      - {id: P12-d4-kernel-authority, root: software-implementation, task: "Decide whether replacing our retry wrapper with a narrower fix in the owning layer is an equivalent D4 concretization or changes an accepted D3 authority boundary, and how much evidence that decision needs.", expect: [abstraction-and-concretization.md], forbid: [project-engineering-memory.md]}
      - {id: P13-d3-mature-replacement, root: software-design, task: "Produce the implementation workplan for the third redesign of our checkpoint/restart subsystem; two earlier replacements of this mature subsystem failed with the same shared-state bug, recorded in PROJECT-ENGINEERING-MEMORY.md.", expect: [architecture-and-design.md, project-engineering-memory.md], forbid: [semantic-definition-and-traceability.md, protocol-versioning-and-compatibility.md]}
      - {id: P14-d2-imported-theorem, root: numerical-algorithm-design, task: "Choose the control-variate coefficient for our Monte Carlo estimator; its default binding comes from an imported theorem whose hypotheses must be checked.", expect: [numerical-algorithm-design.md, semantic-definition-and-traceability.md], forbid: [project-engineering-memory.md]}
      - {id: P15-d2-in-envelope-negative, root: numerical-algorithm-design, task: "Is a relative tolerance of 1e-8 inside the accepted error envelope for the existing trapezoid test? The documented error bound already covers it.", expect: [numerical-algorithm-design.md], forbid: [project-engineering-memory.md, semantic-definition-and-traceability.md, workflow-and-workplans.md, convergence-and-cycle-economy.md]}
      - {id: P16-d1-parameter-binding, root: scientific-formulation, task: "Define the effective diffusion coefficient we report as an observable, including its validity assumptions; the model imports a parameter family from a published paper whose default binding is ambiguous.", expect: [scientific-formulation.md, semantic-definition-and-traceability.md], forbid: [project-engineering-memory.md]}
      - {id: P17-docs-guide, root: software-documentation, task: "Rewrite the user-guide section that explains the solver configuration options so it matches the current code and the accepted method paper.", expect: [documentation-maintenance.md, documentation-and-evidence.md], forbid: [project-engineering-memory.md]}
      - {id: P18-audit-recurring-family, root: software-maintenance-audit, task: "Audit the io/ subsystem: the same file-handle leak defect family has recurred three times this year and is recorded as a notice in project memory.", expect: [long-horizon-code-health.md, project-engineering-memory.md], forbid: [semantic-definition-and-traceability.md]}
      - {id: P19-hygiene-branches-workplan, root: repository-hygiene, task: "The release is done: delete the merged feature branches and archive the completed workplan.", expect: [git-and-version-control.md, workflow-and-workplans.md], forbid: [semantic-definition-and-traceability.md]}
    scoring: "a run hits iff the named root skill was invoked and every expect file was Read; a run violates iff any forbid file was Read"
    pass_requires_all:
      - "no clear per-case routing loss: no case with v66b 2/2 hits and v66f 0/2 hits"
      - "no clear per-case eager-loading gain: no case with v66b 0/2 violations and v66f 2/2 violations"
      - "aggregate hits: v66f hits >= v66b hits - 2 (38 runs per variant)"
      - "aggregate violations: v66f violations <= v66b violations + 2"
  selection:
    corpus: "selection.development + selection.holdout, unchanged"
    reps: 2
    variants: [v66b, v66f]
    pass_requires_all:
      - "correct (admissible or correct-none) v66f >= v66b - 2 (32 runs per variant)"
      - "false activations on negative scenarios v66f <= v66b + 1"
  version_regression:
    # Stochastic robustness evidence (16.11.1), not a deterministic language proof. The
    # deterministic helper/preflight and no-self-adoption structure are hard repository tests.
    runs: {T6-version-bound-stage-continuation-holdout: 4, T5-version-bound-workplan-holdout: 2, T4-version-bound-workplan: 2}
    variants: [v66b, v66f]
    strict_pass: "governing_stated_before_protocol_action_or_mutation true AND strict-rubric assessor PASS"
    pass_requires_all:
      - "strict passes v66f >= v66b - 1"
      - "never-stated runs (no assistant text names the governing version) v66f <= v66b + 1"
    report: "self-adoption / non-closure observations from assessor notes, and every failing run, with limitations"
  authority_sentinels:
    runs: {T2-tolerance-within-envelope: 2, T3-d2-owned-default: 2}
    variant: v66f
    pass: "every run assessor PASS AND hidden checks pass (collected hidden tests where the oracle has them, and every check_* script)"
  burden_rule: "redesign.burden_rule, unchanged in dimension, panel (T1/T7/T8), runs (3 fresh paired, order-counterbalanced, v65 vs v66f), thresholds and correctness condition"
  unversioned_no_lookup: "no remote_or_source_lookups and no versioning_owner_reads in any v66f run of T1, T7, T8"
  isolation: "every run lists each SSDP skill exactly once and resolves every skill from the project install; no run errors"
  on_failure: "stop Protocol 6.6 per workplan 16.11.5; no rewording, route, metric, threshold, weighting or prompt layer after the first final-candidate run"
