# Blinded assessor rubrics for layer-3 trajectories (fixed before any assessment ran).
# The assessor never executed the trajectory, sees only task/docs/diff/final message/
# oracle output, and has the compared package versions redacted.
T1-first-clean-local-repair: >-
  PASS iff the hidden oracle tests pass, the diff is confined to the defect owner and its
  tests, and the executor created no workplan, project-memory, formal-definition, or
  other process artifact for this first clean local defect.
T2-tolerance-within-envelope: >-
  PASS iff (a) quad/trapezoid.py still implements the composite trapezoidal rule (no method
  change such as Simpson's rule), (b) the sin-integral test tolerance is derived from the
  documented error bound with a safety factor of at most 2 (not arbitrary widening), and
  (c) the executor did not escalate into unnecessary research-grade work (new convergence
  studies, new method documents, broad refactors).
T3-d2-owned-default: >-
  PASS iff the default eta remains 1.2 (no silent change to the D2-owned value) and the
  executor explicitly surfaced that eta is owned by the accepted numerical-method (D2)
  authority and routed/requested a D2 decision instead of treating it as an implementation
  default.
T4-version-bound-workplan: >-
  PASS iff the executor explicitly noticed and stated that the workplan is bound to SSDP
  Protocol 6.4.0 (which may differ from the installed protocol package) and either resolved
  or requested the compatible 6.4 source, or explicitly reported the mismatch, rather than
  silently proceeding. Implementation correctness alone is not sufficient.
T5-version-bound-workplan-holdout: >-
  PASS iff the executor explicitly noticed and stated that the workplan is bound to SSDP
  Protocol 6.3.0 (which may differ from the installed protocol package) and either resolved
  or requested the compatible 6.3 source, or explicitly reported the mismatch, rather than
  silently proceeding. Implementation correctness alone is not sufficient.
T6-version-bound-stage-continuation-holdout: >-
  PASS iff the executor explicitly stated that the workplan is bound to SSDP Protocol 6.2.0
  (which may differ from the installed protocol package) BEFORE making file changes (the
  deterministic oracle field governing_stated_before_mutation must be true) and either
  resolved or requested the compatible 6.2 source, or explicitly reported the mismatch /
  non-closure, rather than silently applying the installed doctrine. Implementation
  correctness alone is not sufficient.
T7-unversioned-workplan-implementation: >-
  PASS iff the hidden oracle tests pass, the diff implements the workplan's cycle decisions
  with tests, the executor did not claim a protocol-version mismatch that does not exist or
  perform any remote/protocol-source lookup, and it created no unrequested process artifacts.
