# Protocol 6.6 final simplification: routing-preservation map (workplan section 16.11.3).
#
# Non-normative evidence coordination. Frozen from the redesigned semantic state
# 47dc85de6dd6be8b0adfb1a66024cfdd5397f3d8 before any SKILL.md change of the final
# simplification pass. The canonical route owners are the SKILL.md entrypoints and the
# references they name; this file only records what the simplified entrypoints must keep.
#
# Structure (Lossless Representation: one detailed owner per concern, local deltas per skill):
#   concerns: canonical target owner + positive/negative routing counterfactuals, shared by
#             every skill that routes the concern.
#   skills:   every direct reference/template route reachable from each consumed entrypoint
#             at the basis (the generated entry contract included), with the basis trigger
#             quoted, the discriminating predicate terms, the concern it realizes, any
#             skill-local counterfactual delta, and its preservation disposition.
#
# Mechanical check (tests/test_protocol_66_final_simplification.py):
#   * every basis route has a row; the consumed dist SKILL.md still links the same target;
#   * some clause of the consumed entrypoint that links the target contains every `terms`
#     entry after link markup is removed, so a route label can never stand in for its
#     predicate (clause = one line, split at ";"; matching is case-insensitive and ignores
#     `**` and backticks);
#   * skill-level `gates`, `exclusions` and `authority` terms remain in the entrypoint;
#   * no direct route is added or removed and the catalog frontmatter is byte-identical.
# Structural equality of terms is necessary, not sufficient: materially equivalent trigger
# semantics are reviewed against `basis_trigger`, and live route probes (scenarios.yaml
# `final.route_probes`) exercise the major families.
schema: ssdp66-routing-preservation/1
basis: 47dc85de6dd6be8b0adfb1a66024cfdd5397f3d8
dispositions:
  PRESERVE: same canonical target; trigger/exclusion materially equivalent; terms kept
  CONSOLIDATE: several basis clauses realized by one remaining clause whose predicate still discriminates every activation case and names the same owner chain (reason required)

concerns:
  kernel:
    target: references/abstraction-and-concretization.md
    positive: ["whether a proposed simplification delegates or changes an authority boundary", "how much evidence depth a low-consequence but irreversible change needs", "how to represent a lossy handoff without dropping a blocker", "SSDP self-development: editing the protocol's own sources"]
    negative: ["first clean local defect under sufficient authority", "ordinary renaming inside one module"]
  versioning:
    target: references/protocol-versioning-and-compatibility.md
    positive: ["workplan declares protocol_version 6.3.0 while 6.6.0 is loaded", "recover work from a historical recovery ref", "hygiene: retire artifacts whose protocol/candidate compatibility is supported"]
    negative: ["unversioned task", "task bound to the loaded version (governing == loaded)"]
  workflow:
    target: references/workflow-and-workplans.md
    positive: ["continue stage 2 of an accepted workplan", "write the D3->D4 handoff", "rework after a Review NO-PASS", "archive a completed workplan"]
    negative: ["one-line local bug fix with no plan", "unrelated poem/email"]
  evidence:
    target: references/evidence-evolution-and-dependencies.md
    positive: ["is a stale benchmark still applicable after the backend changed", "which evidence is invalidated by a changed definition"]
    negative: ["run the existing unit test after a local fix"]
  testing:
    target: references/testing-and-validation.md
    positive: ["prove a real restart path, not a mock, carries the acceptance claim", "choose a tolerance/metamorphic/differential oracle", "qualification of a production path"]
    negative: ["run the fixture's existing test once"]
  semantic_definition:
    target: references/semantic-definition-and-traceability.md
    positive: ["parameter family/instance/default binding from an imported paper", "imported theorem whose hypotheses must hold", "ambiguous specialized symbol used by the change"]
    negative: ["ordinary engineering meaning (list, file, retry)", "first clean local defect"]
  pem:
    target: references/project-engineering-memory.md
    positive: ["third replacement of a mature subsystem after recurring failures", "migration/revert/recovery", "memory-bound workplan", "audit: recurring failure family or notice"]
    negative: ["first clean local defect", "unrelated task", "history exists but cannot change the decision"]
  convergence:
    target: references/convergence-and-cycle-economy.md
    positive: ["same defect family recurring after wrappers/fallbacks", "review saturation", "escalate rigor or cognitive resources"]
    negative: ["first occurrence of a local defect"]
  long_horizon:
    target: references/long-horizon-code-health.md
    positive: ["Stabilization pass", "longitudinal structural/test risk", "maintenance audit (mandatory for the audit specialist)"]
    negative: ["single local fix"]
  architecture:
    target: references/architecture-and-design.md
    positive: ["fix requires moving state ownership between components", "D3 design work (mandatory for software-design)", "documenting D3", "audit ownership/complexity finding"]
    negative: ["equivalent local D4 concretization"]
  specification:
    target: references/specification-and-implementation.md
    positive: ["substantive D4 implementation (mandatory for software-implementation)", "D3 writing the D4 specification", "documenting D4"]
    negative: ["D1/D2 reasoning with no D4 content"]
  scientific_formulation:
    target: references/scientific-formulation.md
    positive: ["change alters which observable/estimand is reported", "D1 reasoning (mandatory for scientific-formulation)"]
    negative: ["refactor preserving scientific meaning"]
  numerical:
    target: references/numerical-algorithm-design.md
    positive: ["change alters discretization order, estimator, tolerance semantics, precision or RNG stream semantics", "D2 reasoning (mandatory for numerical-algorithm-design)"]
    negative: ["tolerance question inside the accepted error envelope"]
  scientific_software:
