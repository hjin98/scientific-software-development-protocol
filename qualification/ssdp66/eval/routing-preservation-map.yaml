# Routes realized by the generated entry contract (every skill). Terms must hold in every
# consumed entrypoint because the build inlines the same block into each.
entry_contract:
  routes:
  - target: references/protocol-versioning-and-compatibility.md
    concern: versioning
    basis_trigger: "Any other version governs until the task/workplan authority rebinds it; this package is not its source even if newer or compatible, so do not apply it: use an installed/local source of that version or its mapped immutable source ([versioning]), else report protocol non-closure."
    terms: ["installed/local source", "immutable source", "non-closure"]
    disposition: PRESERVE
  - target: references/abstraction-and-concretization.md
    concern: kernel
    basis_trigger: "Pre-routing safety kernel ([universal kernel] owns it and the rest of the universal doctrine)"
    terms: ["safety kernel"]
    disposition: PRESERVE
  # version-step semantics (16.10.1) that must survive any editorial compaction
  version_semantics: ["protocol_version", "governs until", "rebinds", "newer or compatible", "non-closure", "recommend", "never adopt"]

